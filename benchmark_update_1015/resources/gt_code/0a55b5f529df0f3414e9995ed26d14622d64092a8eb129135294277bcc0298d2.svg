<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   version="1.0"
   width="400"
   height="360"
   id="atom-model-rewrite">
  <defs>
    <!-- Orbit gradient -->
    <linearGradient id="orbitGradient1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
    <linearGradient id="orbitGradient2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cc0033" />
      <stop offset="100%" stop-color="#660000" />
    </linearGradient>
    <linearGradient id="orbitGradient3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#009966" />
      <stop offset="100%" stop-color="#004422" />
    </linearGradient>
    <radialGradient id="nucleusGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#993300" />
    </radialGradient>
  </defs>
  <!-- Outer elliptical orbits -->
  <ellipse cx="200" cy="180" rx="150" ry="60"
    style="fill:none;stroke:url(#orbitGradient1);stroke-width:3;stroke-dasharray:8 6;" />
  <ellipse cx="200" cy="180" rx="110" ry="45"
    style="fill:none;stroke:url(#orbitGradient2);stroke-width:2.2;stroke-dasharray:6 5;" />
  <ellipse cx="200" cy="180" rx="70" ry="22"
    style="fill:none;stroke:url(#orbitGradient3);stroke-width:2;stroke-dasharray:4 3;" />
  <!-- Nucleus -->
  <circle cx="200" cy="180" r="28"
    style="fill:url(#nucleusGradient);stroke:#222222;stroke-width:3;" />
  <!-- Nucleus label -->
  <text x="200" y="185" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
    font-size="16" fill="#222222" font-weight="bold" pointer-events="none">Nucleus</text>
  <!-- Protons -->
  <circle cx="212" cy="175" r="5" style="fill:#006600;stroke:#003300;stroke-width:2;" />
  <circle cx="195" cy="188" r="5" style="fill:#009900;stroke:#004400;stroke-width:2;" />
  <!-- Neutrons -->
  <circle cx="190" cy="172" r="5" style="fill:#4444ff;stroke:#222288;stroke-width:2;" />
  <circle cx="206" cy="190" r="5" style="fill:#3366ff;stroke:#223366;stroke-width:2;" />
  <text x="172" y="156" font-family="Arial Black, Arial, sans-serif" font-size="13" fill="#222288">Neutron</text>
  <text x="220" y="168" font-family="Arial Black, Arial, sans-serif" font-size="13" fill="#004400">Proton</text>
  <!-- Electrons (first orbit) -->
  <circle cx="270" cy="180" r="7" style="fill:#ff3300;stroke:#880000;stroke-width:2;" />
  <text x="278" y="175" font-family="Arial Black, Arial, sans-serif" font-size="12" fill="#880000">Electron</text>
  <!-- Electrons (second orbit) -->
  <circle cx="124" cy="180" r="7" style="fill:#ff3300;stroke:#880000;stroke-width:2;" />
  <circle cx="200" cy="125" r="7" style="fill:#ff3300;stroke:#880000;stroke-width:2;" />
  <circle cx="200" cy="235" r="7" style="fill:#ff3300;stroke:#880000;stroke-width:2;" />
  <!-- Electrons (third orbit) -->
  <circle cx="310" cy="116" r="7" style="fill:#ff3300;stroke:#880000;stroke-width:2;" />
  <circle cx="310" cy="244" r="7" style="fill:#ff3300;stroke:#880000;stroke-width:2;" />
  <circle cx="90" cy="116" r="7" style="fill:#ff3300;stroke:#880000;stroke-width:2;" />
  <circle cx="90" cy="244" r="7" style="fill:#ff3300;stroke:#880000;stroke-width:2;" />
  <!-- Atom label -->
  <text x="200" y="40" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
    font-size="20" fill="#222222" font-weight="bold">Atom Model</text>
  <!-- Physics annotation -->
  <text x="200" y="350" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
    font-size="15" fill="#003366">Physics: Atomic Structure</text>
</svg>