<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Math Scores Box Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>

  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    option = {
      title: [
        {
          text: 'Distribution of Math Exam Scores',
          left: 'center',
          textStyle: {
            color: '#212121',
            fontWeight: 'bold',
            fontFamily: 'Arial, sans-serif',
            fontSize: 22
          }
        },
        {
          text: 'Boxplot: Q3 + 1.5×IQR (upper), Q1 - 1.5×IQR (lower)',
          borderColor: '#333',
          borderWidth: 2,
          textStyle: {
            color: '#212121',
            fontWeight: 'normal',
            fontSize: 15,
            lineHeight: 20,
            fontFamily: 'Arial, sans-serif'
          },
          left: '10%',
          top: '90%'
        }
      ],
      dataset: [
        {
          source: [
            [88, 76, 95, 92, 85, 79, 90, 85, 96, 83, 98, 91, 82, 74, 88, 93, 89, 90, 94, 87],
            [78, 82, 80, 85, 90, 72, 75, 78, 83, 81, 86, 88, 78, 80, 82, 79, 84, 86, 77, 82],
            [92, 96, 94, 90, 93, 97, 99, 95, 92, 94, 97, 98, 91, 90, 93, 96, 95, 97, 98, 94],
            [70, 74, 68, 72, 76, 75, 73, 77, 78, 72, 70, 73, 75, 76, 74, 77, 76, 79, 71, 74],
            [84, 88, 86, 82, 87, 89, 91, 88, 86, 85, 87, 90, 86, 89, 88, 87, 86, 91, 90, 89]
          ]
        },
        {
          transform: {
            type: 'boxplot',
            config: { itemNameFormatter: 'Class {value}' }
          }
        },
        {
          fromDatasetIndex: 1,
          fromTransformResult: 1
        }
      ],
      tooltip: {
        trigger: 'item',
        axisPointer: {
          type: 'shadow'
        }
      },
      grid: {
        left: '10%',
        right: '10%',
        bottom: '15%'
      },
      xAxis: {
        type: 'category',
        boundaryGap: true,
        nameGap: 30,
        splitArea: {
          show: false
        },
        splitLine: {
          show: false
        },
        axisLabel: {
          color: '#212121',
          fontWeight: 'bold',
          fontFamily: 'Arial, sans-serif',
          fontSize: 15
        },
        axisLine: {
          lineStyle: {
            color: '#1565c0',
            width: 3
          }
        }
      },
      yAxis: {
        type: 'value',
        name: 'Score (out of 100)',
        splitArea: {
          show: true
        },
        axisLabel: {
          color: '#212121',
          fontWeight: 'bold',
          fontFamily: 'Arial, sans-serif',
          fontSize: 15
        },
        axisLine: {
          lineStyle: {
            color: '#1565c0',
            width: 3
          }
        },
        nameTextStyle: {
          color: '#212121',
          fontWeight: 'bold',
          fontFamily: 'Arial, sans-serif',
          fontSize: 15
        }
      },
      series: [
        {
          name: 'Math Scores',
          type: 'boxplot',
          datasetIndex: 1,
          itemStyle: {
            color: '#039be5',
            borderColor: '#1a237e',
            borderWidth: 2
          },
          boxWidth: [20, 40]
        },
        {
          name: 'Outlier',
          type: 'scatter',
          datasetIndex: 2,
          itemStyle: {
            color: '#c62828'
          },
          symbolSize: 13
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
