<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Scatter Plot: Unemployment Rate vs GDP Growth</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #222;
    }
    #container {
      height: 100%;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>
  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var app = {};
    var option;

    // Economics: Dummy data for Unemployment Rate vs GDP Growth
    // Format: [GDP Growth %, Unemployment Rate %, Population (for bubble size), 'Country', Year]
    const data = [
      [
        [2.3, 5.2, 331000000, 'United States', 2018],
        [1.5, 7.1, 67000000, 'United Kingdom', 2018],
        [1.8, 8.5, 83000000, 'Germany', 2018],
        [3.0, 4.7, 210000000, 'Brazil', 2018],
        [6.6, 3.8, 1380000000, 'India', 2018],
        [2.2, 5.7, 37000000, 'Canada', 2018],
        [2.0, 4.0, 126000000, 'Japan', 2018],
        [2.5, 6.2, 46000000, 'South Korea', 2018],
        [2.7, 10.1, 47000000, 'South Africa', 2018],
        [5.9, 4.6, 144000000, 'Russia', 2018]
      ],
      [
        [1.8, 8.1, 332000000, 'United States', 2020],
        [-9.8, 6.5, 67000000, 'United Kingdom', 2020],
        [-5.0, 4.2, 83000000, 'Germany', 2020],
        [-4.1, 13.5, 212000000, 'Brazil', 2020],
        [-7.3, 7.9, 1390000000, 'India', 2020],
        [-5.3, 9.5, 38000000, 'Canada', 2020],
        [-4.6, 2.6, 126500000, 'Japan', 2020],
        [-1.0, 4.2, 51700000, 'South Korea', 2020],
        [-6.4, 14.8, 47800000, 'South Africa', 2020],
        [-3.1, 5.8, 145000000, 'Russia', 2020]
      ]
    ];

    option = {
      backgroundColor: new echarts.graphic.RadialGradient(0.2, 0.4, 0.8, [
        {
          offset: 0,
          color: '#f5f6fa'
        },
        {
          offset: 1,
          color: '#e0e2eb'
        }
      ]),
      title: {
        text: 'Unemployment Rate vs GDP Growth (Economics)',
        left: '5%',
        top: '3%',
        textStyle: {
          color: '#1a1a1a',
          fontWeight: 'bold',
          fontSize: 22,
          fontFamily: 'Segoe UI'
        }
      },
      legend: {
        right: '7%',
        top: '3%',
        data: ['2018', '2020'],
        textStyle: {
          color: '#222',
          fontWeight: 'bold',
          fontSize: 16
        }
      },
      grid: {
        left: '10%',
        top: '13%',
        right: '10%',
        bottom: '10%'
      },
      xAxis: {
        name: 'GDP Growth (%)',
        nameTextStyle: {
          color: '#333',
          fontWeight: 'bold',
          fontSize: 16
        },
        axisLine: {
          lineStyle: {
            color: '#222',
            width: 2
          }
        },
        axisLabel: {
          color: '#111',
          fontWeight: 'bold',
          fontSize: 14
        },
        splitLine: {
          lineStyle: {
            type: 'dashed',
            color: '#888'
          }
        }
      },
      yAxis: {
        name: 'Unemployment Rate (%)',
        nameTextStyle: {
          color: '#333',
          fontWeight: 'bold',
          fontSize: 16
        },
        axisLine: {
          lineStyle: {
            color: '#222',
            width: 2
          }
        },
        axisLabel: {
          color: '#111',
          fontWeight: 'bold',
          fontSize: 14
        },
        splitLine: {
          lineStyle: {
            type: 'dashed',
            color: '#888'
          }
        },
        scale: true
      },
      series: [
        {
          name: '2018',
          data: data[0],
          type: 'scatter',
          symbolSize: function (data) {
            return Math.sqrt(data[2]) / 600;
          },
          emphasis: {
            focus: 'series',
            label: {
              show: true,
              formatter: function (param) {
                return param.data[3];
              },
              position: 'top',
              color: '#003366',
              fontWeight: 'bold',
              fontSize: 14
            }
          },
          itemStyle: {
            shadowBlur: 8,
            shadowColor: 'rgba(40, 80, 180, 0.35)',
            shadowOffsetY: 4,
            color: new echarts.graphic.RadialGradient(0.5, 0.3, 1, [
              {
                offset: 0,
                color: '#3b8cff'
              },
              {
                offset: 1,
                color: '#0c3589'
              }
            ])
          }
        },
        {
          name: '2020',
          data: data[1],
          type: 'scatter',
          symbolSize: function (data) {
            return Math.sqrt(data[2]) / 600;
          },
          emphasis: {
            focus: 'series',
            label: {
              show: true,
              formatter: function (param) {
                return param.data[3];
              },
              position: 'top',
              color: '#880022',
              fontWeight: 'bold',
              fontSize: 14
            }
          },
          itemStyle: {
            shadowBlur: 8,
            shadowColor: 'rgba(160, 40, 80, 0.35)',
            shadowOffsetY: 4,
            color: new echarts.graphic.RadialGradient(0.3, 0.5, 1, [
              {
                offset: 0,
                color: '#fc6161'
              },
              {
                offset: 1,
                color: '#c21234'
              }
            ])
          }
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
