<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Economics Bar Chart - Sector Growth</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #222;
      margin: 0;
    }
    #container {
      height: 100%;
    }
    .echarts-legend-item {
      font-weight: 600;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>

  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    option = {
      title: {
        text: 'Economic Sector Growth by Quarter',
        left: 'center',
        top: 20,
        textStyle: {
          color: '#1a1a1a',
          fontWeight: 'bold',
          fontSize: 22,
          fontFamily: 'Segoe UI, Arial, sans-serif'
        }
      },
      tooltip: {
        trigger: 'axis',
        axisPointer: {
          type: 'shadow'
        }
      },
      legend: {
        data: ['Services', 'Manufacturing', 'Agriculture'],
        top: 55,
        itemWidth: 32,
        itemHeight: 18,
        textStyle: {
          color: '#222',
          fontWeight: '600',
          fontSize: 16,
          fontFamily: 'Arial, Helvetica, sans-serif'
        }
      },
      grid: {
        left: '3%',
        right: '4%',
        bottom: '5%',
        containLabel: true
      },
      xAxis: [
        {
          type: 'value',
          axisLabel: {
            color: '#212121',
            fontWeight: '600',
            fontSize: 14
          },
          axisLine: {
            lineStyle: {
              color: '#2e2e2e',
              width: 2
            }
          }
        }
      ],
      yAxis: [
        {
          type: 'category',
          axisTick: {
            show: false
          },
          axisLabel: {
            color: '#212121',
            fontWeight: '600',
            fontSize: 14
          },
          axisLine: {
            lineStyle: {
              color: '#2e2e2e',
              width: 2
            }
          },
          data: ['Q1', 'Q2', 'Q3', 'Q4']
        }
      ],
      series: [
        {
          name: 'Services',
          type: 'bar',
          barWidth: 22,
          label: {
            show: true,
            position: 'inside',
            color: '#fff',
            fontWeight: 'bold',
            fontSize: 13
          },
          emphasis: {
            focus: 'series'
          },
          itemStyle: {
            color: '#1976d2'
          },
          data: [180, 210, 195, 230]
        },
        {
          name: 'Manufacturing',
          type: 'bar',
          stack: 'Total',
          label: {
            show: true,
            color: '#fff',
            fontWeight: 'bold',
            fontSize: 13
          },
          emphasis: {
            focus: 'series'
          },
          itemStyle: {
            color: '#43a047'
          },
          data: [120, 135, 145, 155]
        },
        {
          name: 'Agriculture',
          type: 'bar',
          stack: 'Total',
          label: {
            show: true,
            position: 'left',
            color: '#fff',
            fontWeight: 'bold',
            fontSize: 13
          },
          emphasis: {
            focus: 'series'
          },
          itemStyle: {
            color: '#f44336'
          },
          data: [60, 50, 65, 70]
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
