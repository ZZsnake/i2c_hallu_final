<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="400"
   height="300"
   viewBox="0 0 400 300">
  <g>
    <!-- Outer Electron Orbit -->
    <ellipse
       cx="200"
       cy="150"
       rx="115"
       ry="85"
       style="fill:none;stroke:#172c7d;stroke-width:2.2;stroke-dasharray:9,6;stroke-opacity:1" />
    <!-- Middle Orbit -->
    <ellipse
       cx="200"
       cy="150"
       rx="70"
       ry="52"
       style="fill:none;stroke:#d400d4;stroke-width:2.2;stroke-dasharray:6,6;stroke-opacity:1" />
    <!-- Inner Orbit -->
    <ellipse
       cx="200"
       cy="150"
       rx="38"
       ry="28"
       style="fill:none;stroke:#00823d;stroke-width:2.2;stroke-dasharray:3,3;stroke-opacity:1" />
    <!-- Nucleus -->
    <circle
       cx="200"
       cy="150"
       r="16"
       style="fill:#f25022;stroke:#1d1d1d;stroke-width:2.5;stroke-opacity:1" />
    <!-- Protons and Neutrons -->
    <circle
       cx="192"
       cy="142"
       r="3.7"
       style="fill:#f7b500;stroke:#1d1d1d;stroke-width:1.2" />
    <circle
       cx="208"
       cy="148"
       r="3.7"
       style="fill:#f7b500;stroke:#1d1d1d;stroke-width:1.2" />
    <circle
       cx="200"
       cy="156"
       r="3.7"
       style="fill:#2eb6ff;stroke:#232323;stroke-width:1.2" />
    <circle
       cx="205"
       cy="143"
       r="3.7"
       style="fill:#2eb6ff;stroke:#232323;stroke-width:1.2" />
    <circle
       cx="195"
       cy="157"
       r="3.7"
       style="fill:#2eb6ff;stroke:#232323;stroke-width:1.2" />
    <!-- Electrons (on each orbit) -->
    <circle
       cx="200"
       cy="65"
       r="6"
       style="fill:#008bff;stroke:#1d1d1d;stroke-width:2.5" />
    <circle
       cx="285"
       cy="150"
       r="6"
       style="fill:#008bff;stroke:#1d1d1d;stroke-width:2.5" />
    <circle
       cx="200"
       cy="235"
       r="6"
       style="fill:#008bff;stroke:#1d1d1d;stroke-width:2.5" />
    <circle
       cx="115"
       cy="150"
       r="6"
       style="fill:#008bff;stroke:#1d1d1d;stroke-width:2.5" />
    <!-- Inner orbit electrons -->
    <circle
       cx="228"
       cy="122"
       r="5"
       style="fill:#008bff;stroke:#1d1d1d;stroke-width:1.7" />
    <circle
       cx="172"
       cy="178"
       r="5"
       style="fill:#008bff;stroke:#1d1d1d;stroke-width:1.7" />
    <!-- Middle orbit electrons -->
    <circle
       cx="250"
       cy="150"
       r="6"
       style="fill:#008bff;stroke:#1d1d1d;stroke-width:2.2" />
    <circle
       cx="150"
       cy="150"
       r="6"
       style="fill:#008bff;stroke:#1d1d1d;stroke-width:2.2" />
    <!-- Orbit arrows (showing electron movement) -->
    <path
       d="M 200 65 Q 235 80 285 150"
       style="fill:none;stroke:#d40000;stroke-width:2.2;marker-end:url(#arrowhead)" />
    <path
       d="M 285 150 Q 235 220 200 235"
       style="fill:none;stroke:#d40000;stroke-width:2.2;marker-end:url(#arrowhead)" />
    <path
       d="M 200 235 Q 165 220 115 150"
       style="fill:none;stroke:#d40000;stroke-width:2.2;marker-end:url(#arrowhead)" />
    <path
       d="M 115 150 Q 165 80 200 65"
       style="fill:none;stroke:#d40000;stroke-width:2.2;marker-end:url(#arrowhead)" />
    <!-- Legend -->
    <rect x="300" y="30" width="80" height="56" rx="11" style="fill:#fff;stroke:#232323;stroke-width:1.7" />
    <circle cx="312" cy="50" r="5" style="fill:#f7b500;stroke:#1d1d1d;stroke-width:1.2" />
    <text x="325" y="54" font-family="Arial Black" font-size="13" fill="#1d1d1d">Proton</text>
    <circle cx="312" cy="70" r="5" style="fill:#2eb6ff;stroke:#232323;stroke-width:1.2" />
    <text x="325" y="74" font-family="Arial Black" font-size="13" fill="#232323">Neutron</text>
    <circle cx="312" cy="90" r="5" style="fill:#008bff;stroke:#1d1d1d;stroke-width:1.7" />
    <text x="325" y="94" font-family="Arial Black" font-size="13" fill="#172c7d">Electron</text>
    <!-- Atom label -->
    <text x="160" y="35" font-family="Trebuchet MS" font-size="23" fill="#1d1d1d" font-weight="bold">Atom Model</text>
    <text x="170" y="60" font-family="Trebuchet MS" font-size="15" fill="#3d3d3d">Physics: Atom Structure</text>
    <!-- Arrowhead marker definition -->
    <defs>
      <marker id="arrowhead" markerWidth="11" markerHeight="7"
        refX="7" refY="3.5" orient="auto"
        markerUnits="strokeWidth">
        <polygon points="0 0, 11 3.5, 0 7" fill="#d40000"/>
      </marker>
    </defs>
  </g>
</svg>