<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Math Bar Chart Example</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Montserrat', Arial, sans-serif;
    }
    #container {
      height: 100%;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>

  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);

    var option = {
      title: {
        text: 'Math Test Scores by Topic',
        subtext: 'Sample Dataset',
        left: 'center',
        top: 20,
        textStyle: {
          color: '#222833',
          fontWeight: 'bold',
          fontSize: 22,
          fontFamily: 'Montserrat, Arial, sans-serif'
        },
        subtextStyle: {
          color: '#1a1a1a',
          fontSize: 14
        }
      },
      tooltip: {
        trigger: 'axis',
        axisPointer: {
          type: 'shadow'
        },
        backgroundColor: '#fff',
        borderColor: '#222',
        borderWidth: 1,
        textStyle: {
          color: '#222'
        }
      },
      toolbox: {
        show: true,
        orient: 'vertical',
        top: 'center',
        feature: {
          dataView: { readOnly: false },
          restore: {},
          saveAsImage: {}
        },
        iconStyle: {
          borderColor: '#222'
        }
      },
      legend: {
        data: ['Average Score'],
        left: 'right',
        top: 30,
        textStyle: {
          color: '#222833',
          fontWeight: 'bold',
          fontSize: 15
        }
      },
      grid: {
        left: '7%',
        right: '7%',
        bottom: '10%',
        containLabel: true
      },
      xAxis: {
        type: 'category',
        data: ['Algebra', 'Geometry', 'Calculus', 'Statistics', 'Trigonometry'],
        axisLine: {
          lineStyle: {
            color: '#222',
            width: 2
          }
        },
        axisLabel: {
          color: '#222',
          fontSize: 15,
          fontWeight: 'bold'
        },
        axisTick: {
          lineStyle: {
            color: '#222',
            width: 2
          }
        }
      },
      yAxis: {
        type: 'value',
        name: 'Score (%)',
        nameTextStyle: {
          color: '#1a1a1a',
          fontWeight: 'bold',
          fontSize: 15
        },
        axisLine: {
          lineStyle: {
            color: '#222',
            width: 2
          }
        },
        axisLabel: {
          color: '#222',
          fontSize: 14,
          fontWeight: 'bold'
        },
        splitLine: {
          lineStyle: {
            color: '#ccc',
            width: 1
          }
        }
      },
      series: [{
        name: 'Average Score',
        type: 'bar',
        data: [88, 75, 61, 92, 70],
        itemStyle: {
          color: '#2062AD',
          borderColor: '#133A6F',
          borderWidth: 2,
          shadowColor: 'rgba(32,98,173,0.25)',
          shadowBlur: 5
        },
        barWidth: '40%'
      }]
    };

    myChart.setOption(option);

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
