<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Math Bar Chart Example</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    #container {
      height: 100%;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>
  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    option = {
      title: {
        text: 'Number of Math Problems Solved by Grade',
        left: 'center',
        textStyle: {
          color: '#222a45',
          fontWeight: 'bold',
          fontFamily: 'Segoe UI',
          fontSize: 22
        }
      },
      tooltip: {
        trigger: 'axis',
        axisPointer: {
          type: 'shadow'
        }
      },
      legend: {
        data: ['Algebra', 'Geometry'],
        top: 40,
        textStyle: {
          color: '#1a2129',
          fontWeight: 'bold',
          fontSize: 16,
          fontFamily: 'Segoe UI'
        }
      },
      xAxis: {
        type: 'value',
        boundaryGap: [0, 0.05],
        axisLine: {
          lineStyle: {
            color: '#313a54',
            width: 2
          }
        },
        axisLabel: {
          color: '#222a45',
          fontWeight: 'bold',
          fontFamily: 'Segoe UI',
          fontSize: 14
        }
      },
      yAxis: {
        type: 'category',
        data: ['Grade 6', 'Grade 7', 'Grade 8', 'Grade 9', 'Grade 10'],
        axisLine: {
          lineStyle: {
            color: '#313a54',
            width: 2
          }
        },
        axisLabel: {
          color: '#222a45',
          fontWeight: 'bold',
          fontFamily: 'Segoe UI',
          fontSize: 14
        }
      },
      series: [
        {
          name: 'Algebra',
          type: 'bar',
          data: [120, 200, 250, 300, 400],
          itemStyle: {
            color: '#0057b7'
          },
          barWidth: 24
        },
        {
          name: 'Geometry',
          type: 'bar',
          data: [80, 160, 220, 280, 350],
          itemStyle: {
            color: '#e53935'
          },
          barWidth: 24
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
