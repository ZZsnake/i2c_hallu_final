  </text>
  <text xml:space="preserve" x="1606" y="1748"
    stroke="#212121" fill="#212121" font-family="Arial" font-weight="bold" font-size="152" text-anchor="start">
    Price Ceiling
  </text>
  <text xml:space="preserve" x="2881" y="4015"
    stroke="#212121" fill="#212121" font-family="Arial" font-weight="bold" font-size="152" text-anchor="start">
    Q Floor
  </text>
  <text xml:space="preserve" x="3543" y="4015"
    stroke="#212121" fill="#212121" font-family="Arial" font-weight="bold" font-size="152" text-anchor="start">
