  <text x="300" y="435" style="font-size:16px;fill:#222266;font-family:Arial;font-weight:bold">2</text>
  <text x="420" y="435" style="font-size:16px;fill:#222266;font-family:Arial;font-weight:bold">3</text>
  <text x="540" y="435" style="font-size:16px;fill:#222266;font-family:Arial;font-weight:bold">4</text>
  <text x="660" y="435" style="font-size:16px;fill:#222266;font-family:Arial;font-weight:bold">5</text>
  <text x="380" y="455" style="font-size:20px;fill:#222266;font-family:Arial;font-style:italic">x</text>
