  <path d="M660,410 L660,10" style="stroke:#444444;stroke-width:1;stroke-dasharray:4,8"/>
  <!-- Function plot: f(x) = sin(x) + 0.5x -->
  <path d="M60,370 Q100,310 180,250 Q260,190 300,170 Q340,150 420,130 Q500,110 540,130 Q580,150 660,250 Q700,370 700,370"
