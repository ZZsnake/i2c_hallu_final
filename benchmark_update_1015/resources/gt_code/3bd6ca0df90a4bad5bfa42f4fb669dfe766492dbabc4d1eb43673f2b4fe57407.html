<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Math Gauge Example</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>

  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    option = {
      tooltip: {
        formatter: '{a} <br/>{b} : {c}'
      },
      series: [
        {
          name: 'π Value Indicator',
          type: 'gauge',
          axisLine: {
            lineStyle: {
              width: 18,
              color: [
                [0.3, '#1769aa'],
                [0.7, '#29c76e'],
                [1, '#b13e53']
              ]
            }
          },
          pointer: {
            width: 8,
            itemStyle: {
              color: '#2f2e41'
            }
          },
          detail: {
            formatter: '{value}',
            fontSize: 30,
            color: '#22223b',
            fontWeight: 'bold',
            fontFamily: 'Georgia, serif'
          },
          title: {
            show: true,
            offsetCenter: [0, '60%'],
            color: '#1c1c1c',
            fontSize: 18,
            fontWeight: 'bold',
            fontFamily: 'Georgia, serif'
          },
          splitLine: {
            length: 16,
            lineStyle: {
              color: '#333',
              width: 3
            }
          },
          axisTick: {
            length: 8,
            lineStyle: {
              color: '#444',
              width: 2
            }
          },
          axisLabel: {
            color: '#363636',
            fontSize: 14,
            fontWeight: 'bold',
            fontFamily: 'Georgia, serif'
          },
          data: [
            {
              value: 3.14,
              name: 'π Approx.'
            }
          ],
          min: 0,
          max: 4,
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
