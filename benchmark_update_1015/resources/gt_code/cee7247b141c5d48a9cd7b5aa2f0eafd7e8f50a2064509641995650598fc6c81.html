<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Math Line Graph Example</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    #container {
      height: 100%;
      font-family: 'Segoe UI', Verdana, Arial, sans-serif;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container"></div>

  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var app = {};
    var option;

    // --- NEW Math Line Graph JS CODE ---
    option = {
      title: {
        text: 'Quadratic Function: y = x² - 2x + 3',
        left: 'center',
        top: 20,
        textStyle: {
          color: '#222222',
          fontWeight: 'bold',
          fontSize: 22,
          fontFamily: 'Segoe UI'
        }
      },
      xAxis: {
        type: 'category',
        name: 'x',
        nameLocation: 'middle',
        nameTextStyle: {
          color: '#222222',
          fontWeight: 'bold',
          fontSize: 16
        },
        data: ['-2', '-1', '0', '1', '2', '3', '4'],
        axisLabel: {
          color: '#202020',
          fontSize: 16
        },
        axisLine: {
          lineStyle: {
            color: '#1A237E',
            width: 3
          }
        },
        axisTick: {
          lineStyle: {
            color: '#1A237E'
          }
        }
      },
      yAxis: {
        type: 'value',
        name: 'y',
        nameLocation: 'middle',
        nameGap: 32,
        nameTextStyle: {
          color: '#222222',
          fontWeight: 'bold',
          fontSize: 16
        },
        axisLabel: {
          color: '#202020',
          fontSize: 16
        },
        axisLine: {
          lineStyle: {
            color: '#1A237E',
            width: 3
          }
        },
        axisTick: {
          lineStyle: {
            color: '#1A237E'
          }
        },
        splitLine: {
          lineStyle: {
            color: '#B0BEC5',
            type: 'dashed'
          }
        }
      },
      series: [
        {
          data: [11, 6, 3, 2, 3, 6, 11],
          type: 'line',
          symbol: 'circle',
          symbolSize: 18,
          lineStyle: {
            color: '#009688',
            width: 5,
            type: 'solid'
          },
          itemStyle: {
            borderWidth: 4,
            borderColor: '#3949AB',
            color: '#FF5722'
          },
          label: {
            show: true,
            position: 'top',
            color: '#212121',
            fontSize: 14,
            fontWeight: 'bold'
          }
        }
      ],
      grid: {
        left: 60,
        right: 40,
        top: 70,
        bottom: 60
      }
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
