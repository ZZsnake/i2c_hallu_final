<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   version="1.1"
   width="480"
   height="480"
   id="svg-plane-geometry">
  <g>
    <!-- Draw a triangle -->
    <polygon
      points="140,380 340,380 240,120"
      style="fill:#ffffff;stroke:#1a1a7e;stroke-width:3;stroke-dasharray:8,5;stroke-opacity:1" />
    <!-- Draw the altitude from top vertex -->
    <line
      x1="240"
      y1="120"
      x2="240"
      y2="380"
      style="stroke:#b30000;stroke-width:2.5;stroke-dasharray:6,3;" />
    <!-- Draw the base label -->
    <text
      x="190"
      y="395"
      font-family="Roboto, Arial, sans-serif"
      font-size="20"
      fill="#222222"
      >Base (b)</text>
    <!-- Draw the height label -->
    <text
      x="250"
      y="250"
      font-family="Roboto, Arial, sans-serif"
      font-size="18"
      fill="#b30000"
      >Height (h)</text>
    <!-- Draw the area formula -->
    <text
      x="160"
      y="60"
      font-family="Roboto, Arial, sans-serif"
      font-size="22"
      fill="#1a1a7e"
      >Area = ½ × b × h</text>
    <!-- Mark vertices -->
    <circle cx="140" cy="380" r="6" fill="#1a1a7e" />
    <text x="120" y="410" font-family="Roboto, Arial, sans-serif" font-size="16" fill="#1a1a7e">A</text>
    <circle cx="340" cy="380" r="6" fill="#1a1a7e" />
    <text x="345" y="410" font-family="Roboto, Arial, sans-serif" font-size="16" fill="#1a1a7e">B</text>
    <circle cx="240" cy="120" r="6" fill="#1a1a7e" />
    <text x="220" y="110" font-family="Roboto, Arial, sans-serif" font-size="16" fill="#1a1a7e">C</text>
  </g>
</svg>