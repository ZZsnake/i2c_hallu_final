<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Math Bar Chart Sample Dataset</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Verdana, Arial, sans-serif;
      color: #212121;
    }
    #container {
      height: 100%;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container"></div>
  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    option = {
      legend: {
        textStyle: {
          color: '#232323',
          fontWeight: 'bold',
          fontSize: 14,
          fontFamily: 'Segoe UI, Verdana, Arial, sans-serif'
        }
      },
      tooltip: {},
      dataset: {
        source: [
          ['Topic', 'Algebra', 'Geometry', 'Statistics'],
          ['Grade 6', 78, 64, 85],
          ['Grade 7', 82, 70, 88],
          ['Grade 8', 90, 75, 92],
          ['Grade 9', 94, 80, 96]
        ]
      },
      xAxis: {
        type: 'category',
        axisLine: {
          lineStyle: {
            color: '#1a1a1a',
            width: 2
          }
        },
        axisLabel: {
          color: '#1a1a1a',
          fontWeight: 'bold',
          fontSize: 13
        }
      },
      yAxis: {
        axisLine: {
          lineStyle: {
            color: '#1a1a1a',
            width: 2
          }
        },
        axisLabel: {
          color: '#1a1a1a',
          fontWeight: 'bold',
          fontSize: 13
        },
        splitLine: {
          lineStyle: {
            color: '#ededed',
            width: 1
          }
        }
      },
      title: {
        text: 'Math Performance by Grade and Topic',
        left: 'center',
        textStyle: {
          color: '#222d5a',
          fontWeight: 'bold',
          fontSize: 20,
          fontFamily: 'Segoe UI, Verdana, Arial, sans-serif'
        }
      },
      series: [
        { 
          type: 'bar',
          itemStyle: {
            color: '#1e88e5'
          },
          barWidth: 20
        },
        { 
          type: 'bar',
          itemStyle: {
            color: '#43a047'
          },
          barWidth: 20
        },
        { 
          type: 'bar',
          itemStyle: {
            color: '#d81b60'
          },
          barWidth: 20
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
