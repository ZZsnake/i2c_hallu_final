<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Math Function Line Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Verdana, Arial, sans-serif;
      color: #222222;
    }
    #container {
      height: 100%;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>

  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var app = {};
    var option;

    // Math domain: Example functions and their values
    option = {
      title: {
        text: 'Math Functions Over X',
        left: 'center',
        textStyle: {
          color: '#1a1a1a',
          fontWeight: 'bold',
          fontFamily: 'Segoe UI, Verdana, Arial, sans-serif',
          fontSize: 20
        }
      },
      tooltip: {
        trigger: 'axis',
        axisPointer: {
          type: 'cross',
          label: {
            backgroundColor: '#2d5be3',
            color: '#fff'
          }
        }
      },
      legend: {
        data: ['f(x) = x²', 'g(x) = 2x+1', 'h(x) = x³'],
        top: 40,
        textStyle: {
          color: '#222',
          fontWeight: 'bold',
          fontSize: 13
        }
      },
      toolbox: {
        feature: {
          saveAsImage: {}
        }
      },
      xAxis: [
        {
          type: 'category',
          boundaryGap: false,
          axisLabel: {
            color: '#222',
            fontWeight: 'bold',
            fontSize: 13
          },
          axisLine: {
            lineStyle: {
              color: '#2d5be3',
              width: 2
            }
          },
          data: ['-3', '-2', '-1', '0', '1', '2', '3']
        }
      ],
      yAxis: [
        {
          type: 'value',
          axisLabel: {
            color: '#222',
            fontWeight: 'bold',
            fontSize: 13
          },
          axisLine: {
            lineStyle: {
              color: '#2d5be3',
              width: 2
            }
          },
          splitLine: {
            lineStyle: {
              color: '#e1e1e1'
            }
          }
        }
      ],
      series: [
        {
          name: 'f(x) = x²',
          type: 'line',
          symbol: 'circle',
          symbolSize: 10,
          lineStyle: {
            color: '#e91e63',
            width: 4
          },
          itemStyle: {
            color: '#e91e63'
          },
          emphasis: {
            focus: 'series'
          },
          data: [9, 4, 1, 0, 1, 4, 9]
        },
        {
          name: 'g(x) = 2x+1',
          type: 'line',
          symbol: 'rect',
          symbolSize: 10,
          lineStyle: {
            color: '#009688',
            width: 4
          },
          itemStyle: {
            color: '#009688'
          },
          emphasis: {
            focus: 'series'
          },
          data: [-5, -3, -1, 1, 3, 5, 7]
        },
        {
          name: 'h(x) = x³',
          type: 'line',
          symbol: 'triangle',
          symbolSize: 10,
          lineStyle: {
            color: '#2d5be3',
            width: 4
          },
          itemStyle: {
            color: '#2d5be3'
          },
          label: {
            show: true,
            position: 'top',
            color: '#222',
            fontWeight: 'bold',
            fontSize: 12
          },
          emphasis: {
            focus: 'series'
          },
          data: [-27, -8, -1, 0, 1, 8, 27]
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
