<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>dataset-sample-other-bar-chart</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #1a1a1a;
    }
    #container {
      height: 100%;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>

  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    // New dataset sample (Other domain)
    option = {
      title: {
        text: 'Survey Responses by Category',
        left: 'center',
        top: 18,
        textStyle: {
          color: '#222b45',
          fontWeight: 'bold',
          fontSize: 22,
          fontFamily: 'Segoe UI'
        }
      },
      dataset: {
        source: [
          ['score', 'responses', 'category'],
          [92.0, 230, 'Feedback'],
          [60.5, 185, 'Suggestion'],
          [77.8, 120, 'Inquiry'],
          [45.2, 95, 'Complaint'],
          [83.4, 162, 'Appreciation'],
          [55.1, 75, 'Request'],
          [38.9, 46, 'Other']
        ]
      },
      grid: { containLabel: true, left: 50, right: 40, top: 70, bottom: 40 },
      xAxis: {
        name: 'Responses',
        nameTextStyle: {
          color: '#212121',
          fontWeight: 'bold',
          fontSize: 14
        },
        axisLine: {
          lineStyle: { color: '#222b45', width: 3 }
        },
        axisLabel: {
          color: '#212121',
          fontSize: 14,
          fontFamily: 'Segoe UI'
        },
        splitLine: {
          show: false
        }
      },
      yAxis: {
        type: 'category',
        name: 'Category',
        nameTextStyle: {
          color: '#222b45',
          fontWeight: 'bold',
          fontSize: 14
        },
        axisLine: {
          lineStyle: { color: '#222b45', width: 3 }
        },
        axisLabel: {
          color: '#212121',
          fontSize: 15,
          fontFamily: 'Segoe UI'
        }
      },
      visualMap: {
        orient: 'horizontal',
        left: 'center',
        top: 36,
        min: 35,
        max: 95,
        text: ['High Score', 'Low Score'],
        dimension: 0,
        inRange: {
          color: ['#2652D0', '#EA3B3B', '#219F73']
        }
      },
      series: [
        {
          type: 'bar',
          encode: {
            x: 'responses',
            y: 'category'
          },
          barWidth: '48%',
          itemStyle: {
            borderRadius: [5, 5, 0, 0],
            borderColor: '#222b45',
            borderWidth: 2
          },
          label: {
            show: true,
            position: 'right',
            color: '#222b45',
            fontWeight: 'bold',
            fontSize: 14
          }
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
