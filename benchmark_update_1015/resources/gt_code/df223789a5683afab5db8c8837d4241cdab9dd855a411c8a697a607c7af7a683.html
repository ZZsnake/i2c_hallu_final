<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Population Growth in Major Cities</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Verdana, Arial, sans-serif;
      color: #222;
    }
    #container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container"></div>

  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    option = {
      legend: {
        data: ['Population (Millions)'],
        textStyle: {
          color: '#212A3E',
          fontWeight: 'bold',
          fontSize: 15
        }
      },
      tooltip: {
        trigger: 'axis',
        formatter: 'Population<br/>{b}: {c}M'
      },
      grid: {
        left: '5%',
        right: '5%',
        bottom: '7%',
        containLabel: true
      },
      xAxis: {
        type: 'value',
        axisLabel: {
          formatter: '{value} M',
          color: '#1A253C',
          fontWeight: 'bold',
          fontSize: 14
        },
        axisLine: {
          lineStyle: {
            color: '#1F4E79',
            width: 3
          }
        },
        splitLine: {
          lineStyle: {
            color: '#D6DBE9'
          }
        }
      },
      yAxis: {
        type: 'category',
        axisLine: { 
          lineStyle: {
            color: '#1F4E79',
            width: 3
          }
        },
        axisLabel: {
          formatter: '{value}',
          color: '#2A3A4F',
          fontWeight: 'bold',
          fontSize: 14
        },
        boundaryGap: false,
        data: ['New York', 'London', 'Tokyo', 'Delhi', 'Paris', 'Sydney', 'Cairo', 'Rio', 'Toronto']
      },
      series: [
        {
          name: 'Population (Millions)',
          type: 'line',
          symbolSize: 12,
          symbol: 'rect',
          smooth: true,
          lineStyle: {
            color: '#E63946',
            width: 5,
            shadowColor: 'rgba(44,44,44,0.25)',
            shadowBlur: 7,
            shadowOffsetY: 4
          },
          itemStyle: {
            color: '#457B9D',
            borderColor: '#222',
            borderWidth: 2
          },
          data: [8.6, 9.0, 13.9, 18.6, 2.1, 5.3, 9.5, 6.7, 2.8]
        }
      ],
      title: {
        text: 'Population Growth in Major Cities (2020)',
        left: 'center',
        top: 10,
        textStyle: {
          color: '#1F4E79',
          fontWeight: 'bold',
          fontSize: 20
        }
      }
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
