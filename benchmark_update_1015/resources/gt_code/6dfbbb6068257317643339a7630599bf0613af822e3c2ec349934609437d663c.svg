<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" version="1.1">

<style type="text/css">
    text {
        font-family: 'Montserrat', sans-serif;
        font-size: 16px;
        fill: #1a1a1a;
        stroke: none;
        text-anchor:middle;
        }
        
    path, line {stroke:#25408f;stroke-width:2.5;stroke-dasharray:4,2;}
    
    .axis {marker-end:url(#arrow);}
</style>

<defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="7" refY="4" orient="auto">
        <polygon points="0,8 10,4 0,0 3,4" style="fill:#25408f;stroke:none;"/>
    </marker>
</defs>

<polygon id="Market" points="70,430 430,70 430,430" style="fill:#43b97f;"/>

<path id="Distribution" d="M70 430 L 430 70 A360 360 0 0 1 70 430 Z" style="fill:#8ad2c6;"/>

<line class="axis" x1="70" y1="430" x2="426" y2="430"/>
<line class="axis" x1="430" y1="430" x2="430" y2="74"/>

<!-- Axis labels --> 
<text x="250" y="490">Cumulative % of population (by wealth)</text>
<text x="430" y="450">100%</text>
<text x="250" y="475" dominant-baseline="central" transform="rotate(-90,250,250)">Cumulative % of total wealth</text>    
<text x="430" y="445" dominant-baseline="central" transform="rotate(-90,250,250)">100%</text>

<!-- Other Labels --> 
<text x="250" y="220" dominant-baseline="central" transform="rotate(-45,250,250)">Perfect equity line</text>
<text style="font-size:22px;font-weight:bold;" x="380" y="150" id="text2397">Distribution</text>
<text x="250" y="330" dominant-baseline="central" transform="rotate(-45,250,250)">Actual wealth curve</text>
<text style="font-size:22px;font-weight:bold;" x="380" y="360">Market</text>
</svg>