<svg xmlns="http://www.w3.org/2000/svg" version="1.1" style="font-family:Roboto, 'Segoe UI', Arial, sans-serif;font-size:18px;background-color:white;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased" width="850" height="600">
  <g class="HeaderView">
    <text font-size="22" x="15" y="32" fill="#222">
      <tspan x="15" y="32">Supply vs. Price per Unit (USD), 2023</tspan>
    </text>
    <text font-size="15" x="15" y="50" fill="#444">
      <tspan x="15" y="50">Vertical axis: Market Supply (thousands of units).</tspan>
      <tspan x="15" y="66">Horizontal axis: Price per unit, inflation adjusted (USD).</tspan>
    </text>
  </g>
  <g>
    <g class="AxisBoxView">
      <g class="HorizontalAxis">
        <text font-size="13" x="272" y="554" fill="#222">
          <tspan x="272" y="554">Price per Unit (USD)</tspan>
        </text>
        <text x="75" y="535" fill="#222" text-anchor="middle" font-size="17">$2</text>
        <text x="200" y="535" fill="#222" text-anchor="middle" font-size="17">$5</text>
        <text x="425" y="535" fill="#222" text-anchor="middle" font-size="17">$20</text>
        <text x="715" y="535" fill="#222" text-anchor="middle" font-size="17">$100</text>
      </g>
      <g class="VerticalAxis">
        <text font-size="13" x="-370" y="25" transform="rotate(-90)" fill="#222">
          <tspan x="-370" y="25">Market Supply (thousands)</tspan>
        </text>
        <text x="65" y="512" fill="#222" dominant-baseline="middle" text-anchor="end" font-size="17">0</text>
        <text x="65" y="462" fill="#222" dominant-baseline="middle" text-anchor="end" font-size="17">10</text>
        <text x="65" y="412" fill="#222" dominant-baseline="middle" text-anchor="end" font-size="17">20</text>
        <text x="65" y="362" fill="#222" dominant-baseline="middle" text-anchor="end" font-size="17">30</text>
        <text x="65" y="312" fill="#222" dominant-baseline="middle" text-anchor="end" font-size="17">40</text>
        <text x="65" y="262" fill="#222" dominant-baseline="middle" text-anchor="end" font-size="17">50</text>
        <text x="65" y="212" fill="#222" dominant-baseline="middle" text-anchor="end" font-size="17">60</text>
        <text x="65" y="162" fill="#222" dominant-baseline="middle" text-anchor="end" font-size="17">70</text>
        <text x="65" y="112" fill="#222" dominant-baseline="middle" text-anchor="end" font-size="17">80</text>
      </g>
      <g class="AxisGridLines">
        <line x1="75" y1="512" x2="715" y2="512" stroke="#444" stroke-width="1"/>
        <line x1="75" y1="462" x2="715" y2="462" stroke="#999" stroke-dasharray="4,3" stroke-width="1"/>
        <line x1="75" y1="412" x2="715" y2="412" stroke="#999" stroke-dasharray="4,3" stroke-width="1"/>
        <line x1="75" y1="362" x2="715" y2="362" stroke="#999" stroke-dasharray="4,3" stroke-width="1"/>
        <line x1="75" y1="312" x2="715" y2="312" stroke="#999" stroke-dasharray="4,3" stroke-width="1"/>
        <line x1="75" y1="262" x2="715" y2="262" stroke="#999" stroke-dasharray="4,3" stroke-width="1"/>
        <line x1="75" y1="212" x2="715" y2="212" stroke="#999" stroke-dasharray="4,3" stroke-width="1"/>
        <line x1="75" y1="162" x2="715" y2="162" stroke="#999" stroke-dasharray="4,3" stroke-width="1"/>
        <line x1="75" y1="112" x2="715" y2="112" stroke="#999" stroke-dasharray="4,3" stroke-width="1"/>
      </g>
      <g class="AxisGridLines">
        <line x1="200" y1="512" x2="200" y2="112" stroke="#999" stroke-dasharray="4,3" stroke-width="1"/>
        <line x1="425" y1="512" x2="425" y2="112" stroke="#999" stroke-dasharray="4,3" stroke-width="1"/>
        <line x1="715" y1="512" x2="715" y2="112" stroke="#999" stroke-dasharray="4,3" stroke-width="1"/>
      </g>
    </g>

    <g class="PointsWithLabels clickable" font-family="Roboto, Arial, sans-serif">
      <rect x="75" y="112" width="640" height="400" fill="rgba(255,255,255,0)"/>
      <defs>
        <clipPath id="scatterBounds-econ2023">
          <rect x="65" y="102" width="660" height="420"/>
        </clipPath>
      </defs>
      <g clip-path="url(#scatterBounds-econ2023)">
        <!-- Points: Company Market Supply vs Price -->
        <g class="key-AgroFoods">
          <circle cx="160" cy="330" r="18" fill="#1977c7" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-EnerGen">
          <circle cx="315" cy="400" r="16" fill="#e63946" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-TechNova">
          <circle cx="580" cy="180" r="12" fill="#f77f00" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-HealthPlus">
          <circle cx="425" cy="275" r="11" fill="#43aa8b" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-AutoMax">
          <circle cx="710" cy="140" r="10" fill="#3a86ff" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-UrbanBuild">
          <circle cx="260" cy="240" r="9" fill="#ff006e" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-FinanceTrust">
          <circle cx="340" cy="180" r="8" fill="#8338ec" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-RetailX">
          <circle cx="200" cy="360" r="7" fill="#ffbe0b" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-AgriCo">
          <circle cx="140" cy="220" r="7" fill="#2d6a4f" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-Ecotex">
          <circle cx="365" cy="160" r="7" fill="#ff5722" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-Logistix">
          <circle cx="470" cy="360" r="6" fill="#007f5f" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-PharmaOne">
          <circle cx="520" cy="260" r="6" fill="#dc2f02" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-GlobalMedia">
          <circle cx="610" cy="210" r="6" fill="#03045e" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-TravelNet">
          <circle cx="460" cy="135" r="6" fill="#06d6a0" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
        <g class="key-SmartFoods">
          <circle cx="120" cy="450" r="5" fill="#720026" opacity="0.85" stroke="#121212" stroke-width="1.2"/>
        </g>
      </g>
      <!-- Labels -->
      <g class="backgroundLabels" fill="#232323" font-size="13" font-family="Roboto, Arial, sans-serif">
        <text x="160" y="315">AgroFoods</text>
        <text x="315" y="385">EnerGen</text>
        <text x="580" y="165">TechNova</text>
        <text x="425" y="260">HealthPlus</text>
        <text x="710" y="125">AutoMax</text>
        <text x="260" y="225">UrbanBuild</text>
        <text x="340" y="165">FinanceTrust</text>
        <text x="200" y="345">RetailX</text>
        <text x="140" y="205">AgriCo</text>
        <text x="365" y="145">Ecotex</text>
        <text x="470" y="345">Logistix</text>
        <text x="520" y="245">PharmaOne</text>
        <text x="610" y="195">GlobalMedia</text>
        <text x="460" y="120">TravelNet</text>
        <text x="120" y="435">SmartFoods</text>
      </g>
    </g>
    <!-- Color Legend -->
    <g class="ScatterColorLegend clickable" style="cursor:pointer">
      <g class="legendMark">
        <rect x="735" y="84" width="43" height="18" fill="#fff" opacity="0"/>
        <rect x="735" y="89" width="10" height="10" fill="#1977c7"/>
        <text font-size="13" x="750" y="98" fill="#222"><tspan x="750" y="98">Agriculture</tspan></text>
      </g>
      <g class="legendMark">
        <rect x="735" y="105" width="43" height="18" fill="#fff" opacity="0"/>
        <rect x="735" y="110" width="10" height="10" fill="#e63946"/>
        <text font-size="13" x="750" y="119" fill="#222"><tspan x="750" y="119">Energy</tspan></text>
      </g>
      <g class="legendMark">
        <rect x="735" y="126" width="43" height="18" fill="#fff" opacity="0"/>
        <rect x="735" y="131" width="10" height="10" fill="#f77f00"/>
        <text font-size="13" x="750" y="140" fill="#222"><tspan x="750" y="140">Technology</tspan></text>
      </g>
      <g class="legendMark">
        <rect x="735" y="147" width="43" height="18" fill="#fff" opacity="0"/>
        <rect x="735" y="152" width="10" height="10" fill="#43aa8b"/>
        <text font-size="13" x="750" y="161" fill="#222"><tspan x="750" y="161">Healthcare</tspan></text>
      </g>
      <g class="legendMark">
        <rect x="735" y="168" width="43" height="18" fill="#fff" opacity="0"/>
        <rect x="735" y="173" width="10" height="10" fill="#3a86ff"/>
        <text font-size="13" x="750" y="182" fill="#222"><tspan x="750" y="182">Automotive</tspan></text>
      </g>
    </g>
  </g>
  <g class="SourcesFooter" style="fill:#555">
    <text font-size="13" x="15" y="581">
      <tspan x="15" y="581">Source: National Statistics Bureau, Market Research 2023</tspan>
    </text>
    <text font-size="13" x="796" y="581">
      <tspan x="796" y="581">
        <a style="fill: #555;" class="cclogo" href="http://creativecommons.org/licenses/by/4.0/deed.en_US" target="_blank">CC BY</a>
      </tspan>
    </text>
  </g>
</svg>