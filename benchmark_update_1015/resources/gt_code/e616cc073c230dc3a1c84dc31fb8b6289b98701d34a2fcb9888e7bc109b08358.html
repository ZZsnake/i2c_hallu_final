<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Math Line Graph Example</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      font-weight: 600;
      color: #24292f;
      margin: 0;
      height: 100%;
    }
    #container {
      height: 100%;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>
  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    // Math: Sample Line Graph - "Prime Numbers Less Than 20"
    option = {
      title: {
        text: 'Prime Numbers Less Than 20',
        left: 'center',
        top: 15,
        textStyle: {
          color: '#1b1f23',
          fontWeight: 'bold',
          fontSize: 20,
          fontFamily: 'Segoe UI, Arial, sans-serif'
        }
      },
      tooltip: {
        trigger: 'axis'
      },
      xAxis: {
        type: 'category',
        name: 'Index',
        nameLocation: 'middle',
        nameGap: 28,
        data: ['1','2','3','4','5','6','7','8'],
        axisLine: {
          lineStyle: {
            color: '#2d3a4a',
            width: 3
          }
        },
        axisLabel: {
          color: '#2d3a4a',
          fontWeight: 'bold',
          fontSize: 14
        },
        nameTextStyle: {
          color: '#2d3a4a',
          fontWeight: 'bold',
          fontSize: 16
        }
      },
      yAxis: {
        type: 'value',
        name: 'Prime Number',
        nameLocation: 'middle',
        nameGap: 45,
        axisLine: {
          lineStyle: {
            color: '#2d3a4a',
            width: 3
          }
        },
        axisLabel: {
          color: '#2d3a4a',
          fontWeight: 'bold',
          fontSize: 14
        },
        nameTextStyle: {
          color: '#2d3a4a',
          fontWeight: 'bold',
          fontSize: 16
        },
        splitLine: {
          lineStyle: {
            color: '#e0e4ea',
            type: 'dashed'
          }
        }
      },
      series: [
        {
          name: 'Prime Number',
          data: [2, 3, 5, 7, 11, 13, 17, 19],
          type: 'line',
          smooth: false,
          lineStyle: {
            color: '#d13b3b',
            width: 5
          },
          symbol: 'circle',
          symbolSize: 14,
          itemStyle: {
            color: '#2972e8',
            borderColor: '#1b1f23',
            borderWidth: 2
          },
          label: {
            show: true,
            position: 'top',
            color: '#1b1f23',
            fontWeight: 'bold',
            fontSize: 13
          }
        }
      ],
      grid: {
        left: 60,
        right: 30,
        top: 60,
        bottom: 60
      }
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
