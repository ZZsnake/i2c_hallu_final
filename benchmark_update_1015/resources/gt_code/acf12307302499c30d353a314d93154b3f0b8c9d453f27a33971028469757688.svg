<?xml version="1.0" encoding="UTF-8"?>
<svg width="179.82mm" height="280.51mm" version="1.1" viewBox="0 0 179.82 280.51" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow1" overflow="visible" orient="auto">
      <path transform="matrix(-.5 0 0 -.5 -4 0)" d="m0 0 5-5-15 5 15 5z" fill-rule="evenodd" stroke="#1a1a1a" stroke-width="1pt"/>
    </marker>
    <marker id="arrow2" overflow="visible" orient="auto">
      <path transform="matrix(.5 0 0 .5 4 0)" d="m0 0 5-5-15 5 15 5z" fill-rule="evenodd" stroke="#1a1a1a" stroke-width="1pt"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="179.82" height="280.51" fill="#f2f2f2" style="paint-order:markers fill stroke"/>
  <!-- Central CPU Rectangle -->
  <rect x="80" y="40" width="40" height="20" fill="#d1eaff" stroke="#142952" stroke-width="1.2"/>
  <text x="100" y="53" fill="#142952" font-family="Consolas, monospace" font-size="6px" text-anchor="middle">CPU</text>
  <!-- Memory rectangles -->
  <rect x="20" y="100" width="45" height="18" fill="#ffe8df" stroke="#d8232a" stroke-width="1"/>
  <text x="42.5" y="112" fill="#3b1f0b" font-family="Consolas, monospace" font-size="5px" text-anchor="middle">RAM</text>
  <rect x="115" y="100" width="45" height="18" fill="#eaffea" stroke="#1d8a4e" stroke-width="1"/>
  <text x="137.5" y="112" fill="#135032" font-family="Consolas, monospace" font-size="5px" text-anchor="middle">ROM</text>
  <!-- Data Bus Arrow -->
  <path d="M100 60 L100 100" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow1)" stroke-dasharray="4,2"/>
  <text x="104" y="85" fill="#1a1a1a" font-family="Consolas, monospace" font-size="4.8px">Data Bus</text>
  <!-- Address Bus Arrow -->
  <path d="M100 60 L137 100" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow1)" stroke-dasharray="2,2"/>
  <text x="122" y="78" fill="#1a1a1a" font-family="Consolas, monospace" font-size="4.8px">Address Bus</text>
  <!-- I/O Controller -->
  <rect x="80" y="180" width="40" height="17" fill="#ffeaff" stroke="#901d8a" stroke-width="1"/>
  <text x="100" y="192" fill="#330042" font-family="Consolas, monospace" font-size="5px" text-anchor="middle">I/O Controller</text>
  <!-- I/O Devices -->
  <rect x="14" y="220" width="30" height="14" fill="#eaffff" stroke="#0989ab" stroke-width="1"/>
  <text x="29" y="229" fill="#024063" font-family="Consolas, monospace" font-size="4.5px" text-anchor="middle">Keyboard</text>
  <rect x="135" y="220" width="30" height="14" fill="#fefdce" stroke="#b8a900" stroke-width="1"/>
  <text x="150" y="229" fill="#767200" font-family="Consolas, monospace" font-size="4.5px" text-anchor="middle">Display</text>
  <!-- Buses to I/O Controller -->
  <path d="M100 197 L44 227" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow1)" stroke-dasharray="3,2"/>
  <text x="70" y="210" fill="#1a1a1a" font-family="Consolas, monospace" font-size="4px">Input Bus</text>
  <path d="M100 197 L150 227" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow1)" stroke-dasharray="3,2"/>
  <text x="124" y="210" fill="#1a1a1a" font-family="Consolas, monospace" font-size="4px">Output Bus</text>
  <!-- Control Bus -->
  <path d="M80 50 L37 108" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#arrow1)" stroke-dasharray="2,1"/>
  <text x="56" y="82" fill="#1a1a1a" font-family="Consolas, monospace" font-size="4px" text-anchor="middle">Control Bus</text>
  <!-- CPU to I/O Controller control -->
  <path d="M100 60 L100 180" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow1)" stroke-dasharray="5,2"/>
  <text x="104" y="120" fill="#1a1a1a" font-family="Consolas, monospace" font-size="4px">Interrupt</text>
  <!-- ROM to I/O Controller (firmware) -->
  <path d="M137.5 118 L120 180" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#arrow1)" stroke-dasharray="3,1"/>
  <text x="132" y="148" fill="#1a1a1a" font-family="Consolas, monospace" font-size="4px">Firmware</text>
  <!-- RAM to I/O Controller (buffer) -->
  <path d="M42.5 118 L80 180" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#arrow1)" stroke-dasharray="3,1"/>
  <text x="62" y="148" fill="#1a1a1a" font-family="Consolas, monospace" font-size="4px">Buffer</text>
  <!-- External Storage -->
  <rect x="60" y="245" width="60" height="13" fill="#e5eaff" stroke="#2a52b8" stroke-width="1"/>
  <text x="90" y="254" fill="#142952" font-family="Consolas, monospace" font-size="4.5px" text-anchor="middle">External Storage</text>
  <path d="M100 197 L90 245" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#arrow1)" stroke-dasharray="2,2"/>
  <text x="98" y="225" fill="#1a1a1a" font-family="Consolas, monospace" font-size="4px" text-anchor="middle">Data Transfer</text>
  <!-- Title -->
  <text x="90" y="18" fill="#142952" font-family="Consolas, monospace" font-size="9px" text-anchor="middle">Computer System - Block Relationship Diagram</text>
</svg>