<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   version="1.0"
   width="300"
   height="300"
   id="svg2">
  <defs
     id="defs4" />
  <g
     id="layer1">
    <rect
       width="299.76929"
       height="299.76929"
       x="0.11535937"
       y="0.11535937"
       id="rect3159"
       style="opacity:1;fill:none;fill-opacity:1;stroke:#222a93;stroke-width:2.5;stroke-miterlimit:4;stroke-dasharray:8,3;stroke-opacity:1" />
    <!-- Axes -->
    <path
       d="M 150,0 L 150,300"
       id="y_axis"
       style="fill:none;stroke:#222a93;stroke-width:2.2;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1" />
    <path
       d="M 0,150 L 300,150"
       id="x_axis"
       style="fill:none;stroke:#222a93;stroke-width:2.2;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1" />
    <!-- Plot of y = sin(x) scaled/shifted -->
    <path
       d="M40,150
          Q 65,90 90,150
          Q 115,210 140,150
          Q 165,90 190,150
          Q 215,210 240,150
          Q 265,90 290,150"
       id="sin_curve"
       style="opacity:1;fill:none;stroke:#d30b28;stroke-width:3.2;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1" />
    <!-- Dashed reference circle (unit circle metaphor) -->
    <path
       d="M 150,150 A 60,60 0 1 1 90,150 A 60,60 0 1 1 150,150 z"
       id="circle_ref"
       style="opacity:1;fill:none;stroke:#0b3a66;stroke-width:1.8;stroke-dasharray:7,5;stroke-opacity:1" />
    <!-- Plot of y = x^2 (parabola) -->
    <path
       d="M 60,210 Q 150,60 240,210"
       id="quad_curve"
       style="opacity:1;fill:none;stroke:#f58000;stroke-width:2.5;stroke-dasharray:4,2;stroke-opacity:1" />
    <!-- Text labels: Axes -->
    <text x="155" y="25" font-family="Verdana" font-size="18" fill="#222a93">y</text>
    <text x="275" y="145" font-family="Verdana" font-size="18" fill="#222a93">x</text>
    <!-- Text labels: Functions -->
    <text x="70" y="75" font-family="Verdana" font-size="16" fill="#d30b28">y = sin(x)</text>
    <text x="170" y="90" font-family="Verdana" font-size="16" fill="#f58000">y = x²</text>
    <!-- Origin -->
    <circle cx="150" cy="150" r="5" fill="#222a93" />
    <text x="160" y="165" font-family="Verdana" font-size="14" fill="#222a93">O</text>
    <!-- Gridlines for reference -->
    <path d="M 50,0 L 50,300" style="stroke:#999;stroke-width:0.5;stroke-dasharray:2,2;"/>
    <path d="M 250,0 L 250,300" style="stroke:#999;stroke-width:0.5;stroke-dasharray:2,2;"/>
    <path d="M 0,50 L 300,50" style="stroke:#999;stroke-width:0.5;stroke-dasharray:2,2;"/>
    <path d="M 0,250 L 300,250" style="stroke:#999;stroke-width:0.5;stroke-dasharray:2,2;"/>
    <!-- Tick labels -->
    <text x="40" y="145" font-family="Verdana" font-size="12" fill="#0b3a66">-π</text>
    <text x="250" y="145" font-family="Verdana" font-size="12" fill="#0b3a66">π</text>
    <text x="145" y="60" font-family="Verdana" font-size="12" fill="#0b3a66">1</text>
    <text x="145" y="255" font-family="Verdana" font-size="12" fill="#0b3a66">-1</text>
  </g>
</svg>