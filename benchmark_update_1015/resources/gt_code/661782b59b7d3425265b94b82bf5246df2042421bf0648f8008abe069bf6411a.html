<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Math Bar Chart - Prime Numbers Distribution</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #151515;
    }
    #container {
      height: 100%;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container"></div>

  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    // Math domain: Bar chart showing count of prime numbers in intervals
    option = {
      title: {
        text: 'Prime Numbers in Intervals (1-50)',
        left: 'center',
        textStyle: {
          color: '#1E2D55',
          fontWeight: 'bold',
          fontSize: 22,
          fontFamily: 'Segoe UI, Arial, sans-serif'
        }
      },
      grid: {
        left: '8%',
        right: '8%',
        top: 70,
        bottom: 50
      },
      xAxis: {
        type: 'category',
        data: ['1-10', '11-20', '21-30', '31-40', '41-50'],
        axisLabel: {
          color: '#331D1D',
          fontWeight: 'bold',
          fontSize: 16
        },
        axisLine: {
          lineStyle: {
            color: '#2D4A6A',
            width: 2
          }
        }
      },
      yAxis: {
        type: 'value',
        name: 'Prime Count',
        nameTextStyle: {
          color: '#2D4A6A',
          fontWeight: 'bold',
          fontSize: 16
        },
        axisLabel: {
          color: '#331D1D',
          fontSize: 15
        },
        axisLine: {
          lineStyle: {
            color: '#2D4A6A',
            width: 2
          }
        },
        splitLine: {
          lineStyle: {
            color: '#D8E3F2',
            width: 1
          }
        }
      },
      series: [
        {
          name: 'Primes',
          data: [
            {value: 4, itemStyle: {color: '#177D57'}},    // 2,3,5,7
            {value: 4, itemStyle: {color: '#275AAF'}},    // 11,13,17,19
            {value: 2, itemStyle: {color: '#E43320'}},    // 23,29
            {value: 2, itemStyle: {color: '#B87F1B'}},    // 31,37
            {value: 3, itemStyle: {color: '#682D5C'}}     // 41,43,47
          ],
          type: 'bar',
          barWidth: '45%',
          label: {
            show: true,
            position: 'top',
            color: '#252525',
            fontWeight: 'bold',
            fontSize: 15
          }
        }
      ],
      tooltip: {
        trigger: 'axis',
        axisPointer: {
          type: 'shadow'
        },
        textStyle: {
          color: '#272727',
          fontSize: 15
        }
      }
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
