<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="600"
   height="300"
   viewBox="0 0 600 300"
   id="svg2"
   version="1.1">
  <rect
     style="opacity:1;fill:#ffffff;fill-opacity:1;stroke:none;stroke-width:1"
     id="rect_bg"
     width="600"
     height="300"
     x="0"
     y="0"
     ry="11" />
  <!-- Flow horizontal connector -->
  <path
     style="fill:none;stroke:#1a237e;stroke-width:3;stroke-dasharray:10,4;stroke-linecap:round;stroke-opacity:1"
     d="M 30,220 H 570"
     id="main_connector" />
  <!-- Left box: Force -->
  <rect
     style="opacity:0.85;fill:#e0f7fa;fill-opacity:1;stroke:#006064;stroke-width:2.5;stroke-dasharray:6,2;stroke-opacity:1"
     id="rect_force"
     width="140"
     height="95"
     x="60"
     y="80"
     ry="12" />
  <!-- Left equation graphic (stylized arrow for Force) -->
  <path
     style="fill:#e0f7fa;stroke:#006064;stroke-width:2;stroke-linecap:round;stroke-opacity:1"
     d="M 100,120 l 35,0 l -10,-10 m 10,10 l -10,10"
     id="arrow_force" />
  <!-- Left box label -->
  <text
     x="130"
     y="110"
     text-anchor="middle"
     style="font-family:'Roboto Slab', serif;font-size:26px;font-weight:bold;fill:#1a237e;"
     id="text_force">Force (F)</text>
  <text
     x="130"
     y="138"
     text-anchor="middle"
     style="font-family:'Roboto Mono', monospace;font-size:20px;fill:#263238;"
     id="eq_force">F = m · a</text>
  <!-- Arrow from Force to Energy -->
  <path
     style="fill:none;stroke:#1b5e20;stroke-width:2.5;stroke-dasharray:5,3;stroke-linecap:round;stroke-opacity:1"
     d="M 200,127 H 265"
     id="arrow_f_to_e" />
  <polygon
     points="265,127 259,123 259,131"
     style="fill:#1b5e20"
     id="arrowhead_f_to_e" />
  <!-- Middle box: Energy -->
  <rect
     style="opacity:0.85;fill:#ffe082;fill-opacity:1;stroke:#f57c00;stroke-width:2.5;stroke-dasharray:6,2;stroke-opacity:1"
     id="rect_energy"
     width="140"
     height="95"
     x="265"
     y="80"
     ry="12" />
  <!-- Middle equation graphic (stylized E) -->
  <text
     x="335"
     y="110"
     text-anchor="middle"
     style="font-family:'Roboto Slab', serif;font-size:26px;font-weight:bold;fill:#bf360c;"
     id="text_energy">Energy (E)</text>
  <text
     x="335"
     y="138"
     text-anchor="middle"
     style="font-family:'Roboto Mono', monospace;font-size:20px;fill:#6d4c41;"
     id="eq_energy">E = F · d</text>
  <!-- Arrow from Energy to Power -->
  <path
     style="fill:none;stroke:#3949ab;stroke-width:2.5;stroke-dasharray:5,3;stroke-linecap:round;stroke-opacity:1"
     d="M 405,127 H 470"
     id="arrow_e_to_p" />
  <polygon
     points="470,127 464,123 464,131"
     style="fill:#3949ab"
     id="arrowhead_e_to_p" />
  <!-- Right box: Power -->
  <rect
     style="opacity:0.85;fill:#c8e6c9;fill-opacity:1;stroke:#388e3c;stroke-width:2.5;stroke-dasharray:6,2;stroke-opacity:1"
     id="rect_power"
     width="140"
     height="95"
     x="470"
     y="80"
     ry="12" />
  <!-- Right equation graphic (stylized lightning bolt for Power) -->
  <polyline
     points="510,120 535,105 525,130 550,115"
     style="fill:none;stroke:#388e3c;stroke-width:2.5;stroke-linecap:round;stroke-opacity:1"
     id="bolt_power" />
  <text
     x="540"
     y="110"
     text-anchor="middle"
     style="font-family:'Roboto Slab', serif;font-size:26px;font-weight:bold;fill:#2e7d32;"
     id="text_power">Power (P)</text>
  <text
     x="540"
     y="138"
     text-anchor="middle"
     style="font-family:'Roboto Mono', monospace;font-size:20px;fill:#263238;"
     id="eq_power">P = E / t</text>
  <!-- Output box at the bottom -->
  <rect
     style="opacity:1;fill:#fffde7;fill-opacity:1;stroke:#d84315;stroke-width:2;stroke-dasharray:8,3;stroke-opacity:1"
     id="rect_out"
     width="540"
     height="32"
     x="30"
     y="220"
     ry="6" />
  <text
     x="300"
     y="242"
     text-anchor="middle"
     style="font-family:'Roboto Slab', serif;font-size:22px;font-weight:bold;fill:#d84315;"
     id="text_out">Physics Flow: Force → Energy → Power</text>
</svg>