<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Stacked Bar Chart - Math Topic Scores</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Verdana, Arial, sans-serif;
    }
    #container {
      height: 100%;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container"></div>

  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    option = {
      tooltip: {
        trigger: 'axis',
        axisPointer: {
          type: 'shadow'
        }
      },
      legend: {
        textStyle: {
          color: '#212121',
          fontWeight: 'bold',
          fontSize: 14,
        }
      },
      title: {
        text: 'Student Performance by Math Topic',
        left: 'center',
        top: 10,
        textStyle: {
          color: '#222',
          fontWeight: 'bold',
          fontSize: 20,
          fontFamily: 'Segoe UI, Verdana, Arial, sans-serif'
        }
      },
      xAxis: {
        type: 'value',
        axisLabel: {
          color: '#222',
          fontSize: 13,
          fontWeight: 'bold'
        },
        axisLine: {
          lineStyle: {
            color: '#222',
            width: 3
          }
        },
        splitLine: {
          lineStyle: {
            color: '#eee'
          }
        }
      },
      yAxis: {
        type: 'category',
        data: ['Algebra', 'Geometry', 'Calculus', 'Statistics', 'Trigonometry'],
        axisLabel: {
          color: '#222',
          fontSize: 13,
          fontWeight: 'bold'
        },
        axisLine: {
          lineStyle: {
            color: '#222',
            width: 3
          }
        }
      },
      series: [
        {
          name: 'Homework',
          type: 'bar',
          stack: 'total',
          label: {
            show: true,
            color: '#222',
            fontWeight: 'bold',
            fontSize: 12
          },
          emphasis: {
            focus: 'series'
          },
          itemStyle: {
            color: '#1565c0'
          },
          data: [80, 75, 65, 90, 70]
        },
        {
          name: 'Quiz',
          type: 'bar',
          stack: 'total',
          label: {
            show: true,
            color: '#222',
            fontWeight: 'bold',
            fontSize: 12
          },
          emphasis: {
            focus: 'series'
          },
          itemStyle: {
            color: '#43a047'
          },
          data: [60, 55, 70, 60, 50]
        },
        {
          name: 'Exam',
          type: 'bar',
          stack: 'total',
          label: {
            show: true,
            color: '#222',
            fontWeight: 'bold',
            fontSize: 12
          },
          emphasis: {
            focus: 'series'
          },
          itemStyle: {
            color: '#e53935'
          },
          data: [90, 85, 80, 75, 95]
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
