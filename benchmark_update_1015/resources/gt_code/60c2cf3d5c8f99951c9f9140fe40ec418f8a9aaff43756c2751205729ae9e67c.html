<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Population Growth in Major Cities</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    #container {
      font-family: 'Segoe UI', Arial, sans-serif;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>
  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    option = {
      title: {
        text: 'Population Growth in Major Cities (2015-2023)',
        left: 'center',
        top: 20,
        textStyle: {
          color: '#222',
          fontWeight: 'bold',
          fontSize: 22,
          fontFamily: 'Segoe UI, Arial, sans-serif'
        }
      },
      tooltip: {
        trigger: 'axis',
        backgroundColor: '#fff',
        borderColor: '#222',
        borderWidth: 1,
        textStyle: {
          color: '#222',
          fontFamily: 'Segoe UI, Arial, sans-serif'
        }
      },
      xAxis: {
        type: 'category',
        boundaryGap: false,
        data: [
          '2015','2016','2017','2018','2019','2020','2021','2022','2023'
        ],
        axisLine: {
          lineStyle: {
            color: '#333',
            width: 2
          }
        },
        axisLabel: {
          color: '#222',
          fontWeight: 'bold',
          fontSize: 14
        }
      },
      yAxis: {
        type: 'value',
        boundaryGap: [0, '20%'],
        name: 'Population (thousands)',
        nameTextStyle: {
          color: '#222',
          fontWeight: 'bold',
          fontSize: 15
        },
        axisLine: {
          lineStyle: {
            color: '#333',
            width: 2
          }
        },
        axisLabel: {
          color: '#222',
          fontWeight: 'bold',
          fontSize: 14
        },
        splitLine: {
          lineStyle: {
            color: '#bbb'
          }
        }
      },
      visualMap: {
        type: 'piecewise',
        show: false,
        dimension: 0,
        seriesIndex: 0,
        pieces: [
          {
            gt: 2,
            lt: 5,
            color: 'rgba(220, 30, 30, 0.35)'
          },
          {
            gt: 6,
            lt: 8,
            color: 'rgba(0, 160, 60, 0.35)'
          }
        ]
      },
      series: [
        {
          name: 'Metro City',
          type: 'line',
          smooth: 0.7,
          symbol: 'circle',
          symbolSize: 8,
          lineStyle: {
            color: '#D32F2F',
            width: 4
          },
          itemStyle: {
            color: '#1976D2',
            borderColor: '#222',
            borderWidth: 2
          },
          markLine: {
            symbol: ['none', 'none'],
            label: { show: false },
            lineStyle: {
              color: '#388E3C',
              width: 2,
              type: 'dashed'
            },
            data: [
              { xAxis: '2017' },
              { xAxis: '2019' },
              { xAxis: '2021' }
            ]
          },
          areaStyle: {
            color: 'rgba(30, 136, 229, 0.12)'
          },
          data: [
            850, 870, 900, 950, 1100, 1200, 1350, 1500, 1650
          ]
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }
    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
