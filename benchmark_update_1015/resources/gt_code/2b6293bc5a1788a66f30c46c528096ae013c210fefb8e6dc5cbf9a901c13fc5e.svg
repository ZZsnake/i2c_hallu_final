<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="382pt" height="1204pt" viewBox="0 0 382 1204" version="1.1">
<defs>
<style type="text/css">
    .flow-rect { fill:rgb(98%,98%,100%); stroke:rgb(14%,29%,71%); stroke-width:2.2; }
    .flow-diamond { fill:rgb(90%,98%,100%); stroke:rgb(86%,2%,10%); stroke-width:2.2; }
    .flow-ellipse { fill:rgb(93%,100%,92%); stroke:rgb(40%,60%,20%); stroke-width:2.2; }
    .flow-arrow { stroke:rgb(14%,29%,71%); stroke-width:2.8; stroke-dasharray:7,5; fill:none; marker-end:url(#arrowhead);}
    .flow-arrow2 { stroke:rgb(86%,2%,10%); stroke-width:2.8; fill:none; marker-end:url(#arrowhead);}
    .flow-label { font-family: 'Fira Mono', 'Consolas', monospace; font-size:19px; fill:rgb(15%,15%,15%);}
    .flow-label2 { font-family: 'Fira Mono', 'Consolas', monospace; font-size:19px; fill:rgb(86%,2%,10%);}
    .flow-label3 { font-family: 'Fira Mono', 'Consolas', monospace; font-size:19px; fill:rgb(30%,60%,11%);}
</style>
<marker id="arrowhead" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
  <polygon points="0,0 8,4 0,8" fill="rgb(14%,29%,71%)"/>
</marker>
</defs>
<g>
<rect x="0" y="0" width="382" height="1204" style="fill:rgb(100%,100%,100%);stroke:none;"/>
<!-- Start/End -->
<ellipse class="flow-ellipse" cx="191" cy="70" rx="90" ry="40"/>
<text class="flow-label3" x="191" y="80" dominant-baseline="middle" text-anchor="middle">Start: User Input</text>

<!-- Process 1 -->
<rect class="flow-rect" x="66" y="160" width="250" height="60" rx="12" ry="12"/>
<text class="flow-label" x="191" y="192" dominant-baseline="middle" text-anchor="middle">Tokenize Source Code</text>

<!-- Arrow: Start to Process 1 -->
<line class="flow-arrow" x1="191" y1="110" x2="191" y2="160"/>

<!-- Decision 1 -->
<polygon class="flow-diamond" points="191,260 261,290 191,320 121,290"/>
<text class="flow-label2" x="191" y="292" dominant-baseline="middle" text-anchor="middle">Valid Tokens?</text>

<!-- Arrow: Process 1 to Decision 1 -->
<line class="flow-arrow" x1="191" y1="220" x2="191" y2="260"/>

<!-- Process 2 -->
<rect class="flow-rect" x="66" y="350" width="250" height="60" rx="12" ry="12"/>
<text class="flow-label" x="191" y="382" dominant-baseline="middle" text-anchor="middle">Parse Syntax Tree</text>

<!-- Arrow: Decision 1 YES -->
<line class="flow-arrow2" x1="191" y1="320" x2="191" y2="350"/>
<text class="flow-label2" x="205" y="340" dominant-baseline="middle" text-anchor="start">Yes</text>

<!-- Arrow: Decision 1 NO (to Error) -->
<line class="flow-arrow2" x1="261" y1="290" x2="320" y2="290"/>
<rect class="flow-rect" x="320" y="265" width="55" height="50" rx="10" ry="10"/>
<text class="flow-label2" x="347" y="292" dominant-baseline="middle" text-anchor="middle">Error</text>
<text class="flow-label2" x="275" y="282" dominant-baseline="middle" text-anchor="start">No</text>

<!-- Decision 2 -->
<polygon class="flow-diamond" points="191,440 261,470 191,500 121,470"/>
<text class="flow-label2" x="191" y="472" dominant-baseline="middle" text-anchor="middle">Syntax OK?</text>

<!-- Arrow: Process 2 to Decision 2 -->
<line class="flow-arrow" x1="191" y1="410" x2="191" y2="440"/>

<!-- Process 3 -->
<rect class="flow-rect" x="66" y="530" width="250" height="60" rx="12" ry="12"/>
<text class="flow-label" x="191" y="562" dominant-baseline="middle" text-anchor="middle">Semantic Analysis</text>

<!-- Arrow: Decision 2 YES -->
<line class="flow-arrow2" x1="191" y1="500" x2="191" y2="530"/>
<text class="flow-label2" x="205" y="520" dominant-baseline="middle" text-anchor="start">Yes</text>

<!-- Arrow: Decision 2 NO (to Error2) -->
<line class="flow-arrow2" x1="261" y1="470" x2="320" y2="470"/>
<rect class="flow-rect" x="320" y="445" width="55" height="50" rx="10" ry="10"/>
<text class="flow-label2" x="347" y="472" dominant-baseline="middle" text-anchor="middle">Error</text>
<text class="flow-label2" x="275" y="462" dominant-baseline="middle" text-anchor="start">No</text>

<!-- Decision 3 -->
<polygon class="flow-diamond" points="191,620 261,650 191,680 121,650"/>
<text class="flow-label2" x="191" y="652" dominant-baseline="middle" text-anchor="middle">Semantic OK?</text>

<!-- Arrow: Process 3 to Decision 3 -->
<line class="flow-arrow" x1="191" y1="590" x2="191" y2="620"/>

<!-- Process 4 -->
<rect class="flow-rect" x="66" y="710" width="250" height="60" rx="12" ry="12"/>
<text class="flow-label" x="191" y="742" dominant-baseline="middle" text-anchor="middle">Generate Bytecode</text>

<!-- Arrow: Decision 3 YES -->
<line class="flow-arrow2" x1="191" y1="680" x2="191" y2="710"/>
<text class="flow-label2" x="205" y="700" dominant-baseline="middle" text-anchor="start">Yes</text>

<!-- Arrow: Decision 3 NO (to Error3) -->
<line class="flow-arrow2" x1="261" y1="650" x2="320" y2="650"/>
<rect class="flow-rect" x="320" y="625" width="55" height="50" rx="10" ry="10"/>
<text class="flow-label2" x="347" y="652" dominant-baseline="middle" text-anchor="middle">Error</text>
<text class="flow-label2" x="275" y="642" dominant-baseline="middle" text-anchor="start">No</text>

<!-- End -->
<ellipse class="flow-ellipse" cx="191" cy="840" rx="90" ry="40"/>
<text class="flow-label3" x="191" y="850" dominant-baseline="middle" text-anchor="middle">End: Executable Output</text>

<!-- Arrow: Process 4 to End -->
<line class="flow-arrow" x1="191" y1="770" x2="191" y2="800"/>

<!-- Optional: Loopback arrow for errors (faint, dashed) -->
<line class="flow-arrow" x1="347" y1="292" x2="280" y2="100" style="stroke-dasharray:3,7;stroke:rgb(86%,2%,10%);stroke-width:1.5;marker-end:url(#arrowhead);"/>
<line class="flow-arrow" x1="347" y1="472" x2="280" y2="100" style="stroke-dasharray:3,7;stroke:rgb(86%,2%,10%);stroke-width:1.5;marker-end:url(#arrowhead);"/>
<line class="flow-arrow" x1="347" y1="652" x2="280" y2="100" style="stroke-dasharray:3,7;stroke:rgb(86%,2%,10%);stroke-width:1.5;marker-end:url(#arrowhead);"/>

</g>
</svg>