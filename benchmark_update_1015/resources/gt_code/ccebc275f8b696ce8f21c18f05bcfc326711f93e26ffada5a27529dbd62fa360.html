<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Math Functions Pie Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    #container {
      height: 100%;
    }
    .echarts-title {
      font-family: 'Trebuchet MS', Verdana, Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;
      color: #222233;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div class="echarts-title">Distribution of Math Topics</div>
  <div id="container"></div>
  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    // Math domain pie chart sample data
    option = {
      tooltip: {
        trigger: 'item',
        backgroundColor: '#252525',
        textStyle: { color: '#f5f5f5', fontSize: 14 }
      },
      legend: {
        orient: 'vertical',
        left: 'left',
        textStyle: {
          color: '#1a1a1a',
          fontWeight: 'bold',
          fontFamily: 'Arial'
        }
      },
      series: [
        {
          name: 'Math Topics',
          type: 'pie',
          radius: ['40%', '70%'],
          avoidLabelOverlap: false,
          itemStyle: {
            borderColor: '#ffffff',
            borderWidth: 2
          },
          label: {
            show: true,
            position: 'outside',
            color: '#191970',
            fontFamily: 'Verdana',
            fontWeight: 'bold',
            fontSize: 15,
            formatter: '{b}: {d}%'
          },
          labelLine: {
            show: true,
            lineStyle: {
              color: '#191970',
              width: 3
            }
          },
          data: [
            { value: 34, name: 'Algebra', itemStyle: { color: '#3a78e8' } },
            { value: 22, name: 'Geometry', itemStyle: { color: '#ec3b3b' } },
            { value: 18, name: 'Calculus', itemStyle: { color: '#32bf5e' } },
            { value: 14, name: 'Statistics', itemStyle: { color: '#e88e2e' } },
            { value: 12, name: 'Number Theory', itemStyle: { color: '#a73ae8' } }
          ]
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
