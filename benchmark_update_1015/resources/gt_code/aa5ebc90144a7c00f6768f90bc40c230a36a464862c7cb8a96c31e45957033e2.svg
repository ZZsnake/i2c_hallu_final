   preserveAspectRatio="none"
   viewBox="0 0 410.13245 574.60181"
   id="svg_econ_sample"
   xmlns="http://www.w3.org/2000/svg">
  <defs/>
  <title id="title_econ">Supply and Demand Over Years</title>
  <desc id="desc_econ">Line graph showing the trends of Supply and Demand in an economic market over time.</desc>
  <!-- Axes -->
  <path
