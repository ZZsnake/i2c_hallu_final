    <path d="M 50,120 H 370" style="stroke:#cfd8dc;stroke-width:1;stroke-dasharray:4,3"/>
    <path d="M 50,70 H 370" style="stroke:#cfd8dc;stroke-width:1;stroke-dasharray:4,3"/>
