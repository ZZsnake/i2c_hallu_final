     id="x_axis"
     style="stroke:#1a237e;stroke-width:2"/>
  <path
     d="M 40,520 V 60"
     id="y_axis"
     style="stroke:#1a237e;stroke-width:2"/>
  <!-- Tick marks on Y axis -->
  <g id="y_ticks">
    <path d="M 40,520 H 50" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 40,470 H 50" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 40,420 H 50" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 40,370 H 50" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 40,320 H 50" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 40,270 H 50" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 40,220 H 50" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 40,170 H 50" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 40,120 H 50" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 40,70 H 50" style="stroke:#1a237e;stroke-width:2"/>
  </g>
  <!-- Tick marks on X axis -->
  <g id="x_ticks">
    <path d="M 70,520 V 510" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 120,520 V 510" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 170,520 V 510" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 220,520 V 510" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 270,520 V 510" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 320,520 V 510" style="stroke:#1a237e;stroke-width:2"/>
    <path d="M 370,520 V 510" style="stroke:#1a237e;stroke-width:2"/>
  </g>
  <!-- Grid lines -->
  <g id="grid">
    <path d="M 50,470 H 370" style="stroke:#cfd8dc;stroke-width:1;stroke-dasharray:4,3"/>
    <path d="M 50,420 H 370" style="stroke:#cfd8dc;stroke-width:1;stroke-dasharray:4,3"/>
    <path d="M 50,370 H 370" style="stroke:#cfd8dc;stroke-width:1;stroke-dasharray:4,3"/>
    <path d="M 50,320 H 370" style="stroke:#cfd8dc;stroke-width:1;stroke-dasharray:4,3"/>
    <path d="M 50,270 H 370" style="stroke:#cfd8dc;stroke-width:1;stroke-dasharray:4,3"/>
    <path d="M 50,220 H 370" style="stroke:#cfd8dc;stroke-width:1;stroke-dasharray:4,3"/>
