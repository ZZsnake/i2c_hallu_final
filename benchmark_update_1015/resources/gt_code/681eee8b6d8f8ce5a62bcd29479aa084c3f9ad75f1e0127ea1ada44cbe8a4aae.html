<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Economic Indicators Radar Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    #container {
      height: 100%;
    }
    .echarts-title {
      font-family: 'Segoe UI', Arial, sans-serif !important;
      font-weight: bold !important;
      color: #1a2542 !important;
      font-size: 22px !important;
    }
    .echarts-legend {
      font-family: 'Segoe UI', Arial, sans-serif !important;
      font-size: 15px !important;
      color: #233554 !important;
      font-weight: 600 !important;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div id="container"></div>

  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);
    var option;

    option = {
      title: {
        text: 'Economic Sector Performance (2024)',
        left: 'center',
        top: 15,
        textStyle: {
          fontFamily: 'Segoe UI, Arial, sans-serif',
          fontWeight: 'bold',
          color: '#1a2542',
          fontSize: 22
        }
      },
      legend: {
        data: ['Projected Growth', 'Actual Growth'],
        top: 50,
        left: 'center',
        textStyle: {
          fontFamily: 'Segoe UI, Arial, sans-serif',
          color: '#233554',
          fontWeight: 600,
          fontSize: 15
        }
      },
      radar: {
        center: ['50%', '55%'],
        radius: '67%',
        name: {
          textStyle: {
            color: '#182060',
            fontWeight: 700,
            fontFamily: 'Segoe UI, Arial, sans-serif',
            fontSize: 16,
            textBorderColor: '#fff',
            textBorderWidth: 2
          }
        },
        axisLine: {
          lineStyle: {
            color: '#223366',
            width: 2
          }
        },
        splitLine: {
          lineStyle: {
            color: '#195e83',
            width: 1.4
          }
        },
        splitArea: {
          areaStyle: {
            color: ['rgba(60,120,216,0.04)', 'rgba(255,255,255,0)']
          }
        },
        indicator: [
          { name: 'GDP Growth', max: 10 },
          { name: 'Unemployment Rate', max: 10 },
          { name: 'Inflation Rate', max: 10 },
          { name: 'Foreign Investment', max: 10 },
          { name: 'Exports', max: 10 },
          { name: 'Consumer Confidence', max: 10 }
        ]
      },
      series: [
        {
          name: 'Economic Indicators',
          type: 'radar',
          symbol: 'circle',
          symbolSize: 8,
          lineStyle: {
            width: 3
          },
          data: [
            {
              value: [7.5, 4.2, 3.1, 6.8, 8.2, 7.0],
              name: 'Projected Growth',
              lineStyle: {
                color: '#1862b1',
                width: 3
              },
              itemStyle: {
                color: '#1862b1',
                borderColor: '#154275',
                borderWidth: 2
              },
              areaStyle: {
                color: 'rgba(24,98,177,0.22)'
              }
            },
            {
              value: [6.1, 5.0, 4.0, 5.5, 7.4, 6.2],
              name: 'Actual Growth',
              lineStyle: {
                color: '#d7263d',
                width: 3
              },
              itemStyle: {
                color: '#d7263d',
                borderColor: '#9b1b2b',
                borderWidth: 2
              },
              areaStyle: {
                color: 'rgba(215,38,61,0.18)'
              }
            }
          ]
        }
      ]
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
