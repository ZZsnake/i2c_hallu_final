<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   width="640"
   height="275"
   version="1.1"
   style="display:inline">
  <defs />
  <!-- Main landmass -->
  <g id="layer2" style="display:inline">
    <path
       style="fill:#b5e3c8;stroke:none;stroke-width:1.2"
       d="M 60,110 L 60,230 L 610,230 L 610,110 Q 600,95 590,110 Q 580,120 570,110 Q 560,105 550,110 Q 530,120 510,110 Q 490,105 470,110 Q 450,120 430,110 Q 410,105 390,110 Q 370,120 350,110 Q 330,105 310,110 Q 290,120 270,110 Q 250,105 230,110 Q 210,120 190,110 Q 170,105 150,110 Q 130,120 110,110 Q 90,105 70,110 Z"
       id="new_landmass"/>
  </g>
  <!-- Water bodies / Ice -->
  <g id="layer6" style="display:inline">
    <ellipse
      cx="150"
      cy="130"
      rx="40"
      ry="18"
      style="fill:#1b6be6;stroke:none;opacity:0.7"/>
    <ellipse
      cx="420"
      cy="125"
      rx="30"
      ry="12"
      style="fill:#1b6be6;stroke:none;opacity:0.7"/>
    <ellipse
      cx="580"
      cy="135"
      rx="25"
      ry="10"
      style="fill:#1b6be6;stroke:none;opacity:0.7"/>
  </g>
  <!-- Magma chamber -->
  <g id="layer3" style="display:inline">
    <ellipse
      cx="340"
      cy="180"
      rx="25"
      ry="12"
      style="fill:#d60000;stroke:none;opacity:0.8"/>
    <ellipse
      cx="500"
      cy="200"
      rx="18"
      ry="8"
      style="fill:#d60000;stroke:none;opacity:0.8"/>
  </g>
  <!-- Magma intrusion -->
  <g id="layer4" style="display:inline">
    <rect
      x="330"
      y="155"
      width="8"
      height="30"
      style="fill:#ffae00;stroke:none;opacity:0.8"/>
    <rect
      x="490"
      y="185"
      width="6"
      height="15"
      style="fill:#ffae00;stroke:none;opacity:0.8"/>
  </g>
  <!-- Fault lines -->
  <g id="layer7" style="display:inline">
    <path
      d="M 120,120 Q 180,160 250,130"
      style="fill:none;stroke:#1a2227;stroke-width:2.5;stroke-dasharray:6,4"/>
    <path
      d="M 400,130 Q 470,175 540,140"
      style="fill:none;stroke:#1a2227;stroke-width:2.5;stroke-dasharray:6,4"/>
    <circle
      cx="250"
      cy="130"
      r="3"
      style="fill:#1a2227"/>
    <circle
      cx="540"
      cy="140"
      r="3"
      style="fill:#1a2227"/>
  </g>
  <!-- Volcano names -->
  <g id="layer8" style="display:inline">
    <text x="140" y="120" style="font-size:18px;fill:#191919;font-family:'Roboto',sans-serif;font-weight:bold;">Hekla</text>
    <text x="410" y="120" style="font-size:18px;fill:#191919;font-family:'Roboto',sans-serif;font-weight:bold;">Askja</text>
    <text x="570" y="140" style="font-size:18px;fill:#191919;font-family:'Roboto',sans-serif;font-weight:bold;">Grímsvötn</text>
  </g>
  <!-- Landscape names -->
  <g id="layer10" style="display:inline">
