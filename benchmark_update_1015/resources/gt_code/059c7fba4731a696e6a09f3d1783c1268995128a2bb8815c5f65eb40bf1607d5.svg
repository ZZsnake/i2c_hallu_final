    <text x="60" y="100" style="font-size:14px;font-style:italic;fill:#191919;font-family:'Roboto',sans-serif;">West</text>
  </g>
  <!-- Scale bar -->
  <g id="layer9" style="display:inline">
    <line x1="60" y1="250" x2="610" y2="250" style="stroke:#191919;stroke-width:2"/>
    <line x1="60" y1="250" x2="60" y2="260" style="stroke:#191919;stroke-width:2"/>
    <line x1="200" y1="250" x2="200" y2="260" style="stroke:#191919;stroke-width:2"/>
    <line x1="340" y1="250" x2="340" y2="260" style="stroke:#191919;stroke-width:2"/>
    <line x1="480" y1="250" x2="480" y2="260" style="stroke:#191919;stroke-width:2"/>
    <line x1="610" y1="250" x2="610" y2="260" style="stroke:#191919;stroke-width:2"/>
  </g>
  <!-- Scale labels -->
  <g id="layer11" style="display:inline">
    <text x="55" y="270" style="font-size:12px;fill:#191919;font-family:'Roboto',sans-serif;">0</text>
    <text x="195" y="270" style="font-size:12px;fill:#191919;font-family:'Roboto',sans-serif;">20</text>
    <text x="335" y="270" style="font-size:12px;fill:#191919;font-family:'Roboto',sans-serif;">40</text>
    <text x="475" y="270" style="font-size:12px;fill:#191919;font-family:'Roboto',sans-serif;">60</text>
    <text x="620" y="270" style="font-size:12px;fill:#191919;font-family:'Roboto',sans-serif;">km</text>
  </g>
