    <text x="470" y="170" style="font-size:12px;fill:#222;font-family:'Roboto',sans-serif;">Mývatn</text>
    <text x="330" y="200" style="font-size:12px;fill:#222;font-family:'Roboto',sans-serif;">Magma Reservoir</text>
    <text x="510" y="210" style="font-size:12px;fill:#222;font-family:'Roboto',sans-serif;">Intrusive Body</text>
    <text x="75" y="210" style="font-size:12px;fill:#222;font-family:'Roboto',sans-serif;">Vatnajökull</text>
