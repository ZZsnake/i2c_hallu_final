<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="445pt"
   height="420pt"
   id="svg2"
   version="1.0">
  <g id="layer1">
    <!-- Presentation Layer -->
    <rect
       style="opacity:1;fill:#38bdf8;fill-opacity:1;stroke:#23272f;stroke-width:4.5;stroke-dasharray:12,6;stroke-linecap:round;stroke-linejoin:round;"
       id="rect1"
       width="535"
       height="55"
       x="11"
       y="15"
       rx="18"
       ry="18" />
    <text
       x="278"
       y="45"
       style="font-size:16px;font-weight:bold;text-anchor:middle;fill:#23272f;font-family:'Montserrat', Arial, sans-serif;">
      User Interface
    </text>
    <!-- Application Layer -->
    <rect
       style="opacity:1;fill:#38a169;fill-opacity:1;stroke:#23272f;stroke-width:4;stroke-dasharray:8,4;stroke-linecap:round;stroke-linejoin:round;"
       id="rect2"
       width="535"
       height="65"
       x="11"
       y="75"
       rx="18"
       ry="18" />
    <text
       x="278"
       y="110"
       style="font-size:15px;font-weight:bold;text-anchor:middle;fill:#23272f;font-family:'Montserrat', Arial, sans-serif;">
      Web Application
    </text>
    <!-- Service Layer -->
    <rect
       style="opacity:1;fill:#eab308;fill-opacity:1;stroke:#23272f;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;"
       id="rect3"
       width="535"
       height="70"
       x="11"
       y="145"
       rx="18"
       ry="18" />
    <text
       x="278"
       y="185"
       style="font-size:15px;font-weight:bold;text-anchor:middle;fill:#23272f;font-family:'Montserrat', Arial, sans-serif;">
      REST API
    </text>
    <!-- Logic Layer -->
    <rect
       style="opacity:1;fill:#f43f5e;fill-opacity:1;stroke:#23272f;stroke-width:3.5;stroke-dasharray:6,3;stroke-linecap:round;stroke-linejoin:round;"
       id="rect4"
       width="535"
       height="65"
       x="11"
       y="220"
       rx="18"
       ry="18" />
    <text
       x="278"
       y="255"
       style="font-size:15px;font-weight:bold;text-anchor:middle;fill:#23272f;font-family:'Montserrat', Arial, sans-serif;">
