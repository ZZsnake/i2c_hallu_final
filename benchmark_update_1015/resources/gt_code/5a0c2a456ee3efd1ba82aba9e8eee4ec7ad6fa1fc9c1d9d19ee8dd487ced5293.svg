    <rect
       style="opacity:1;fill:#34d399;fill-opacity:1;stroke:#23272f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;"
       id="rect6"
       width="535"
       height="40"
       x="11"
       y="355"
       rx="18"
       ry="18" />
    <text
       x="278"
       y="380"
       style="font-size:15px;font-weight:bold;text-anchor:middle;fill:#23272f;font-family:'Montserrat', Arial, sans-serif;">
