    </text>
    <!-- Data Layer -->
    <rect
       style="opacity:1;fill:#0ea5e9;fill-opacity:1;stroke:#23272f;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;"
       id="rect5"
       width="535"
       height="55"
       x="11"
       y="290"
       rx="18"
       ry="18" />
    <text
       x="278"
       y="320"
       style="font-size:15px;font-weight:bold;text-anchor:middle;fill:#23272f;font-family:'Montserrat', Arial, sans-serif;">
