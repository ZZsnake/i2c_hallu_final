    </text>
    <!-- Relations (arrows) -->
    <path
       id="arrow1"
       d="M278,60 L278,75"
       style="fill:none;stroke:#23272f;stroke-width:3;marker-end:url(#arrowhead)" />
    <path
       id="arrow2"
       d="M278,140 L278,145"
       style="fill:none;stroke:#23272f;stroke-width:3;marker-end:url(#arrowhead)" />
    <path
       id="arrow3"
       d="M278,215 L278,220"
       style="fill:none;stroke:#23272f;stroke-width:3;marker-end:url(#arrowhead)" />
    <path
       id="arrow4"
       d="M278,285 L278,290"
       style="fill:none;stroke:#23272f;stroke-width:3;marker-end:url(#arrowhead)" />
    <path
       id="arrow5"
       d="M278,350 L278,355"
       style="fill:none;stroke:#23272f;stroke-width:3;marker-end:url(#arrowhead)" />
    <!-- Extra relationships -->
    <path
       id="arrow6"
       d="M90,110 C90,200 466,200 466,320"
       style="fill:none;stroke:#be123c;stroke-width:2.5;stroke-dasharray:5,2;marker-end:url(#arrowhead)" />
    <path
       id="arrow7"
       d="M466,110 C466,200 90,200 90,320"
       style="fill:none;stroke:#166534;stroke-width:2.5;stroke-dasharray:5,2;marker-end:url(#arrowhead)" />
    <!-- Layer labels (examples of submodules) -->
    <text
       x="60"
       y="45"
       style="font-size:11px;font-weight:bold;fill:#23272f;font-family:'Montserrat', Arial, sans-serif;">ReactJS</text>
    <text
       x="500"
       y="110"
       style="font-size:11px;font-weight:bold;fill:#23272f;font-family:'Montserrat', Arial, sans-serif;">Node.js</text>
    <text
       x="60"
       y="185"
       style="font-size:11px;font-weight:bold;fill:#23272f;font-family:'Montserrat', Arial, sans-serif;">Express</text>
    <text
       x="500"
       y="255"
       style="font-size:11px;font-weight:bold;fill:#23272f;font-family:'Montserrat', Arial, sans-serif;">Authentication</text>
    <text
       x="60"
       y="320"
       style="font-size:11px;font-weight:bold;fill:#23272f;font-family:'Montserrat', Arial, sans-serif;">PostgreSQL</text>
    <text
       x="500"
       y="380"
       style="font-size:11px;font-weight:bold;fill:#23272f;font-family:'Montserrat', Arial, sans-serif;">SSD</text>
    <!-- Arrowhead marker -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 10 3.5, 0 7" style="fill:#23272f;" />
      </marker>
    </defs>
  </g>
</svg>