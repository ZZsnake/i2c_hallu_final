<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>Math Line Graph: Function Growth</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    #container {
      height: 100%;
    }
    .echarts-title {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      color: #222;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body style="height: 100%; margin: 0">
  <div class="echarts-title">Quadratic Function: y = x² for x = 1 to 7</div>
  <div id="container"></div>

  <script type="text/javascript">
    var dom = document.getElementById("container");
    var myChart = echarts.init(dom);

    var option = {
      grid: {
        top: 60,
        left: 60,
        right: 30,
        bottom: 60
      },
      xAxis: {
        type: 'category',
        data: ['1', '2', '3', '4', '5', '6', '7'],
        name: 'x',
        nameTextStyle: {
          fontWeight: 'bold',
          fontSize: 16,
          color: '#1a1a1a'
        },
        axisLine: {
          lineStyle: {
            color: '#222',
            width: 3
          }
        },
        axisLabel: {
          color: '#222',
          fontSize: 15,
          fontFamily: 'Segoe UI, Arial, sans-serif'
        }
      },
      yAxis: {
        type: 'value',
        name: 'y',
        nameTextStyle: {
          fontWeight: 'bold',
          fontSize: 16,
          color: '#1a1a1a'
        },
        axisLine: {
          lineStyle: {
            color: '#222',
            width: 3
          }
        },
        axisLabel: {
          color: '#222',
          fontSize: 15,
          fontFamily: 'Segoe UI, Arial, sans-serif'
        },
        splitLine: {
          lineStyle: {
            color: '#ddd',
            width: 1
          }
        }
      },
      series: [
        {
          data: [1, 4, 9, 16, 25, 36, 49],
          type: 'line',
          smooth: true,
          lineStyle: {
            color: '#0077cc',
            width: 4
          },
          itemStyle: {
            color: '#f44336',
            borderColor: '#222',
            borderWidth: 2
          },
          symbol: 'circle',
          symbolSize: 12
        }
      ],
      tooltip: {
        trigger: 'axis',
        backgroundColor: '#fff',
        borderColor: '#222',
        borderWidth: 2,
        textStyle: {
          color: '#222',
          fontSize: 15,
          fontFamily: 'Segoe UI, Arial, sans-serif'
        }
      }
    };

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
