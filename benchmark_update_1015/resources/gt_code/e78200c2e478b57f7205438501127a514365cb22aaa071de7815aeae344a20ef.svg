<?xml version="1.0" encoding="ISO-8859-1" standalone="no"?>
<svg 
     version="1.1"
     baseProfile="full"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:ev="http://www.w3.org/2001/xml-events"
     width="21.1cm"
     height="15.06cm"
     viewBox="0 0 639 456"
     >
<title>
Function Plot Example: Quadratic and Asymptote
</title>
<g stroke-linejoin="miter" stroke-dashoffset="0.0000" stroke-dasharray="none" stroke-width="1.2000" stroke-miterlimit="10.000" stroke-linecap="square">
<clipPath id="clipA">
  <path d="M 0.0000 0.0000 L 0.0000 457.00 L 640.00 457.00 L 640.00 0.0000 z"/>
</clipPath>
<g clip-path="url(#clipA)">
<!-- Major vertical grid lines -->
<g stroke-linejoin="round" stroke-linecap="round" fill="none" stroke-opacity="1.0000" stroke="#444444">
  <path d="M 60 0 L 60 456"/>
  <path d="M 130 0 L 130 456"/>
  <path d="M 200 0 L 200 456"/>
  <path d="M 270 0 L 270 456"/>
  <path d="M 340 0 L 340 456"/>
  <path d="M 410 0 L 410 456"/>
  <path d="M 480 0 L 480 456"/>
  <path d="M 550 0 L 550 456"/>
  <path d="M 620 0 L 620 456"/>
</g>
<!-- Minor vertical grid lines -->
<g stroke-linejoin="round" stroke-linecap="round" fill="none" stroke-opacity="0.25" stroke="#888888">
  <path d="M 90 0 L 90 456"/>
  <path d="M 160 0 L 160 456"/>
  <path d="M 230 0 L 230 456"/>
  <path d="M 300 0 L 300 456"/>
  <path d="M 370 0 L 370 456"/>
  <path d="M 440 0 L 440 456"/>
  <path d="M 510 0 L 510 456"/>
  <path d="M 580 0 L 580 456"/>
</g>
<!-- Major horizontal grid lines -->
<g stroke-linejoin="round" stroke-linecap="round" fill="none" stroke-opacity="1.0000" stroke="#444444">
  <path d="M 0 60 L 639 60"/>
  <path d="M 0 130 L 639 130"/>
  <path d="M 0 200 L 639 200"/>
  <path d="M 0 270 L 639 270"/>
  <path d="M 0 340 L 639 340"/>
  <path d="M 0 410 L 639 410"/>
</g>
<!-- Minor horizontal grid lines -->
<g stroke-linejoin="round" stroke-linecap="round" fill="none" stroke-opacity="0.25" stroke="#888888">
  <path d="M 0 90 L 639 90"/>
  <path d="M 0 160 L 639 160"/>
  <path d="M 0 230 L 639 230"/>
  <path d="M 0 300 L 639 300"/>
  <path d="M 0 370 L 639 370"/>
  <path d="M 0 440 L 639 440"/>
</g>
<!-- Axes -->
<g stroke-linecap="butt" fill="none" stroke-opacity="1.0000" stroke="#222222" stroke-width="2.5">
  <!-- y-axis -->
  <path d="M 90 25 L 90 456"/>
  <path d="M 90 25 L 85 35"/>
  <path d="M 90 25 L 95 35"/>
  <!-- x-axis -->
  <path d="M 60 410 L 639 410"/>
  <path d="M 639 410 L 629 405"/>
  <path d="M 639 410 L 629 415"/>
</g>
<!-- Axis labels -->
<g font-family="Arial" font-size="20" fill="#222222">
  <text x="20" y="50">y</text>
  <text x="610" y="445">x</text>
</g>
<!-- Tick labels -->
<g font-family="Arial" font-size="15" fill="#222222">
  <text x="125" y="440">2</text>
  <text x="195" y="440">4</text>
  <text x="265" y="440">6</text>
  <text x="335" y="440">8</text>
  <text x="405" y="440">10</text>
  <text x="475" y="440">12</text>
  <text x="545" y="440">14</text>
  <text x="615" y="440">16</text>
  <text x="80" y="135">8</text>
  <text x="80" y="205">6</text>
  <text x="80" y="275">4</text>
  <text x="80" y="345">2</text>
  <text x="80" y="415">0</text>
</g>
<!-- Function plot: y = 0.03*(x-90)^2 + 60 (Quadratic, Parabola opening upwards) -->
<g stroke-linejoin="round" stroke-width="4.5" stroke-linecap="round" fill="none" stroke-opacity="0.80" stroke="#dd2222" stroke-dasharray="10,6">
  <path d="
    M 90 410
    L 110 398
    L 130 388
    L 150 378
    L 170 370
    L 190 362
    L 210 357
    L 230 352
    L 250 348
    L 270 345
    L 290 343
    L 310 342
    L 330 342
    L 350 343
    L 370 345
    L 390 348
    L 410 352
    L 430 357
    L 450 362
    L 470 370
    L 490 378
    L 510 388
    L 530 398
    L 550 410
  "/>
<title>Function: Quadratic</title>
<desc>f(x) = 0.03*(x-90)^2 + 60</desc>
</g>
<!-- Asymptote: x = 270 (Vertical dashed line) -->
<g stroke-linejoin="round" stroke-dasharray="6,5" stroke-width="3.5" stroke-linecap="butt" fill="none" stroke-opacity="1.0" stroke="#007799">
  <path d="M 270 30 L 270 456"/>
<title>Asymptote</title>
<desc>g: x = 6</desc>
</g>
<!-- Function label at parabola vertex -->
<g font-family="Courier New" font-size="18" fill="#dd2222">
  <text x="160" y="360">f(x) = 0.03(x-2)<tspan font-size="14">2</tspan> + 8</text>
</g>
<!-- Asymptote label -->
<g font-family="Courier New" font-size="16" fill="#007799">
  <text x="275" y="50">x = 6</text>
</g>
<!-- Point marker: vertex of parabola -->
<g>
  <circle cx="210" cy="357" r="7" fill="#007799" stroke="#222222" stroke-width="2"/>
  <text x="225" y="352" font-family="Arial" font-size="13" fill="#222222">Vertex</text>
</g>
</g> <!-- clipA -->
</g> <!-- default stroke -->
</svg>