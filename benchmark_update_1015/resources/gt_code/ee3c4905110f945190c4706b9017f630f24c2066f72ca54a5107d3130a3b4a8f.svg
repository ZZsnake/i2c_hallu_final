<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1100" height="675" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif" font-size="45" text-anchor="middle" fill="black" stroke-linejoin="round">

<rect width="1100" height="675" fill="#f8f8ff"/>

<g fill="#e2f0fb" stroke="#254c6d" stroke-width="2">
  <rect x="40" y="120" width="260" height="400" rx="20"/>
  <rect x="340" y="120" width="260" height="400" rx="20"/>
  <rect x="640" y="120" width="260" height="400" rx="20"/>
</g>

<g>
  <!-- Bar 1: Supply -->
  <rect x="80" y="320" width="180" height="200" fill="#3b7ddd" stroke="#1b2a49" stroke-width="5"/>
  <rect x="80" y="180" width="180" height="140" fill="#e84545" stroke="#1b2a49" stroke-width="5"/>
  <text x="170" y="165" font-size="32" fill="#11203a" font-family="Roboto,Arial,sans-serif">Supply</text>
  <text x="170" y="350" font-size="28" fill="#11203a">4,500</text>
  <text x="170" y="490" font-size="28" fill="#11203a">8,200</text>
</g>

<g>
  <!-- Bar 2: Demand -->
  <rect x="380" y="400" width="180" height="120" fill="#3b7ddd" stroke="#1b2a49" stroke-width="5"/>
  <rect x="380" y="210" width="180" height="190" fill="#e84545" stroke="#1b2a49" stroke-width="5"/>
  <text x="470" y="165" font-size="32" fill="#11203a" font-family="Roboto,Arial,sans-serif">Demand</text>
  <text x="470" y="390" font-size="28" fill="#11203a">6,800</text>
  <text x="470" y="510" font-size="28" fill="#11203a">3,200</text>
</g>

<g>
  <!-- Bar 3: Price Index -->
  <rect x="680" y="260" width="180" height="260" fill="#3b7ddd" stroke="#1b2a49" stroke-width="5"/>
  <rect x="680" y="180" width="180" height="80" fill="#e84545" stroke="#1b2a49" stroke-width="5"/>
  <text x="770" y="165" font-size="32" fill="#11203a" font-family="Roboto,Arial,sans-serif">Price Index</text>
  <text x="770" y="240" font-size="28" fill="#11203a">1,200</text>
  <text x="770" y="510" font-size="28" fill="#11203a">4,900</text>
</g>

<!-- Axis lines and ticks -->
<g stroke="#1b2a49" stroke-width="3">
  <line x1="60" y1="540" x2="1020" y2="540"/>
  <line x1="60" y1="120" x2="60" y2="540"/>
</g>
<g stroke="#1b2a49" stroke-width="1.5" stroke-dasharray="6,4">
  <line x1="60" y1="320" x2="1020" y2="320"/>
  <line x1="60" y1="180" x2="1020" y2="180"/>
  <line x1="60" y1="400" x2="1020" y2="400"/>
  <line x1="60" y1="260" x2="1020" y2="260"/>
</g>

<!-- Y-axis labels -->
<g font-size="22" fill="#1b2a49" font-family="Roboto,Arial,sans-serif" text-anchor="end">
  <text x="55" y="185">10,000</text>
  <text x="55" y="265">8,000</text>
  <text x="55" y="325">6,000</text>
  <text x="55" y="405">4,000</text>
  <text x="55" y="545">0</text>
</g>

<!-- Title and description -->
<text x="550" y="80" font-size="46" fill="#1b2a49" font-family="Roboto,Arial,sans-serif" text-anchor="middle">Economic Indicators Comparison (2023)</text>
<text x="550" y="115" font-size="26" fill="#1b2a49" font-family="Roboto,Arial,sans-serif" text-anchor="middle">Supply, Demand, and Price Index for Key Commodities</text>

<text x="550" y="660" font-size="13" fill="#1b2a49" font-family="Roboto,Arial,sans-serif" text-anchor="middle">
  Data is illustrative. Bar chart displays comparative levels for supply, demand, and price index in the economics domain.
</text>
</svg>