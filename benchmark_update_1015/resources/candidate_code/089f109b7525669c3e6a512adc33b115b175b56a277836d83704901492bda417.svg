<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Define the vertices of the pentagon -->
  <circle cx="50" cy="150" r="5" fill="purple" />
  <circle cx="150" cy="150" r="5" fill="purple" />
  <circle cx="180" cy="50" r="5" fill="purple" />
  <circle cx="100" cy="10" r="5" fill="purple" />
  <circle cx="20" cy="50" r="5" fill="purple" />

  <!-- Label the vertices -->
  <text x="45" y="160" font-family="Arial" font-size="10" text-anchor="middle">A</text>
  <text x="155" y="160" font-family="Arial" font-size="10" text-anchor="middle">B</text>
  <text x="185" y="60" font-family="Arial" font-size="10" text-anchor="middle">C</text>
  <text x="100" y="20" font-family="Arial" font-size="10" text-anchor="middle">D</text>
  <text x="15" y="60" font-family="Arial" font-size="10" text-anchor="middle">E</text>

  <!-- Draw the pentagon with dashed lines -->
  <line x1="50" y1="150" x2="150" y2="150" stroke="black" stroke-dasharray="5,5" />
  <line x1="150" y1="150" x2="180" y2="50" stroke="black" stroke-dasharray="5,5" />
  <line x1="180" y1="50" x2="100" y2="10" stroke="black" stroke-dasharray="5,5" />
  <line x1="100" y1="10" x2="20" y2="50" stroke="black" stroke-dasharray="5,5" />
  <line x1="20" y1="50" x2="50" y2="150" stroke="black" stroke-dasharray="5,5" />

  <!-- Draw the diagonal line segment -->
  <line x1="100" y1="10" x2="180" y2="50" stroke="blue" />

  <!-- Shade the interior of the pentagon -->
  <polygon points="50,150 150,150 180,50 100,10 20,50" fill="lightblue" />
</svg>