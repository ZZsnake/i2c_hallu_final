<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prime Numbers Less Than 20</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #chart-container {
      width: 100%;
      max-width: none;
      height: 100vh;

    }

    .title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .axis-label {
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="chart-container"></div>

  <script>
    // Initialize ECharts instance
    const chart = echarts.init(document.getElementById('chart-container'));

    // Define data for prime numbers less than 20
    const primeNumbers = [2, 3, 5, 7, 11, 13, 17, 19];
    const indices = Array.from({length: primeNumbers.length}, (_, i) => i + 1);

    // Chart options
    const option = {
      title: {
        text: 'Prime Numbers Less Than 20',
        left: 'center',
        top: 20,
        textStyle: {
          fontSize: 20,
          fontWeight: 'bold',
          color: '#333'
        }
      },
      tooltip: {
        trigger: 'item',
        formatter: function(params) {
          return `Index: ${params.dataIndex + 1}<br/>Prime Number: ${params.value}`;
        }
      },
      xAxis: {
        type: 'category',
        boundaryGap: true,
        data: indices,
        axisLabel: {
          color: '#333',
          fontSize: 14
        },
        axisLine: {
          show: true,
          lineStyle: {
            color: '#2c3e50',
            width: 3
          }
        },
        axisTick: {
          show: true
        },
        splitLine: {
          show: false
        },
        name: 'Index',
        nameTextStyle: {
          fontSize: 14,
          color: '#333'
        },
        nameLocation: 'center',
        nameGap: 30
      },
      yAxis: {
        type: 'value',
        min: 0,
        max: 21,
        interval: 3,
        axisLabel: {
          color: '#333',
          fontSize: 14
        },
        axisLine: {
          show: false
        },
        axisTick: {
          show: false
        },
        splitLine: {
          show: true,
          lineStyle: {
            type: 'dashed',
            color: '#D3D3D3'
          }
        },
        name: 'Prime Number',
        nameTextStyle: {
          fontSize: 14,
          color: '#333'
        },
        nameLocation: 'center',
        nameGap: 30
      },
      series: [{
        name: 'Prime Numbers',
        type: 'line',
        smooth: false,
        symbol: 'circle',
        symbolSize: 14,
        itemStyle: {
          color: '#1E90FF',
          borderColor: '#000',
          borderWidth: 2
        },
        lineStyle: {
          color: '#d13b3b',
          width: 5
        },
        data: primeNumbers,
        label: {
          show: true,
          position: 'top',
          offset: [0, 5],
          color: '#000',
          fontSize: 14,
          formatter: function(params) {
            return params.value;
          }
        }
      }],
      grid: {
        left: 60,
        right: 30,
        top: 60,
        bottom: 60
      }
    };

    // Set chart option
    chart.setOption(option);

    // Resize chart on window resize
    window.addEventListener('resize', () => {
      chart.resize();
    });
  </script>
</body>
</html>
