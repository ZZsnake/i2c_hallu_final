<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700">
  <!-- Background -->
  <rect width="1100" height="700" fill="#F5F5F5"/>
  
  <!-- Title -->
  <text x="550" y="65" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#1A2B4A" text-anchor="middle">
    Economic Indicators Comparison (2023)
  </text>
  
  <!-- Subtitle -->
  <text x="550" y="105" font-family="Arial, sans-serif" font-size="20" fill="#1A2B4A" text-anchor="middle">
    Supply, Demand, and Price Index for Key Commodities
  </text>
  
  <!-- Y-axis gridlines and labels -->
  <line x1="40" y1="535" x2="1060" y2="535" stroke="#1A2B4A" stroke-width="2"/>
  
  <!-- Gridlines -->
  <line x1="40" y1="475" x2="1060" y2="475" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="415" x2="1060" y2="415" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="355" x2="1060" y2="355" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="295" x2="1060" y2="295" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="235" x2="1060" y2="235" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="175" x2="1060" y2="175" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Y-axis labels -->
  <text x="25" y="540" font-family="Arial, sans-serif" font-size="16" fill="#1A2B4A" text-anchor="end">0</text>
  <text x="25" y="420" font-family="Arial, sans-serif" font-size="16" fill="#1A2B4A" text-anchor="end">4,000</text>
  <text x="25" y="300" font-family="Arial, sans-serif" font-size="16" fill="#1A2B4A" text-anchor="end">8,000</text>
  <text x="25" y="180" font-family="Arial, sans-serif" font-size="16" fill="#1A2B4A" text-anchor="end">10,000</text>
  
  <!-- Supply Column Container -->
  <rect x="50" y="130" width="260" height="395" rx="15" fill="#D6E8F5" stroke="#1A2B4A" stroke-width="3"/>
  
  <!-- Supply Column Label -->
  <text x="180" y="160" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1A2B4A" text-anchor="middle">
    Supply
  </text>
  
  <!-- Supply Blue Bar (8,200) - height proportional to value -->
  <rect x="70" y="289" width="180" height="236" fill="#5B9BD5" stroke="#1A2B4A" stroke-width="2"/>
  <text x="160" y="420" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1A2B4A" text-anchor="middle">
    8,200
  </text>
  
  <!-- Supply Red Bar (4,500) -->
  <rect x="70" y="175" width="180" height="114" fill="#E57373" stroke="#1A2B4A" stroke-width="2"/>
  <text x="160" y="240" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1A2B4A" text-anchor="middle">
    4,500
  </text>
  
  <!-- Demand Column Container -->
  <rect x="350" y="130" width="260" height="395" rx="15" fill="#D6E8F5" stroke="#1A2B4A" stroke-width="3"/>
  
  <!-- Demand Column Label -->
  <text x="480" y="160" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1A2B4A" text-anchor="middle">
    Demand
  </text>
  
  <!-- Demand Blue Bar (3,200) -->
  <rect x="370" y="429" width="180" height="96" fill="#5B9BD5" stroke="#1A2B4A" stroke-width="2"/>
  <text x="460" y="490" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1A2B4A" text-anchor="middle">
    3,200
  </text>
  
  <!-- Demand Red Bar (6,800) -->
  <rect x="370" y="225" width="180" height="204" fill="#E57373" stroke="#1A2B4A" stroke-width="2"/>
  <text x="460" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1A2B4A" text-anchor="middle">
    6,800
  </text>
  
  <!-- Price Index Column Container -->
  <rect x="650" y="130" width="260" height="395" rx="15" fill="#D6E8F5" stroke="#1A2B4A" stroke-width="3"/>
  
  <!-- Price Index Column Label -->
  <text x="780" y="160" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1A2B4A" text-anchor="middle">
    Price Index
  </text>
  
  <!-- Price Index Blue Bar (4,900) -->
  <rect x="670" y="379" width="180" height="146" fill="#5B9BD5" stroke="#1A2B4A" stroke-width="2"/>
  <text x="760" y="465" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1A2B4A" text-anchor="middle">
    4,900
  </text>
  
  <!-- Price Index Red Bar (1,200) -->
  <rect x="670" y="307" width="180" height="72" fill="#E57373" stroke="#1A2B4A" stroke-width="2"/>
  <text x="760" y="350" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1A2B4A" text-anchor="middle">
    1,200
  </text>
  
  <!-- Footnote -->
  <text x="550" y="660" font-family="Arial, sans-serif" font-size="14" fill="#1A2B4A" text-anchor="middle">
    Data is illustrative. Bar chart displays comparative levels for supply, demand, and price index in the economics domain.
  </text>
</svg>