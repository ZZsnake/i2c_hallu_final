<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Problem Distribution</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white;
            margin: 23px 0 0;
        }
        h1 {
            font-size: 22px;
            margin: 0;
            font-weight: 700;
            color: #263238;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            column-gap: 20px;
            row-gap: 54px;
            width: 100vw;
        }
        .chart {
            width: 100%;
            height: 453px;
        }
        .legend {
            position: absolute;
            left: 15px;
            top: 75px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: 0;
            z-index: 10;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            color: #0b1d68;
            font-size: 15px;
            font-weight: 700;
            line-height: 18px;
        }
        .legend-item span {
            width: 23px;
            height: 13px;
            margin-right: 5px;
            border: 2px solid #111;
            border-radius: 3px;
            display: inline-block;
            box-sizing: border-box;
        }
        .legend-item span.algebra { background-color: #2f64f5; }
        .legend-item span.geometry { background-color: #10bcae; }
        .legend-item span.calculus { background-color: #ffc42e; }
        .legend-item span.probability { background-color: #9323aa; }
        .legend-item span.number-theory { background-color: #df3b12; }
        .toolbox {
            position: fixed;
            right: 18px;
            top: 46%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: #233ba7;
            z-index: 20;
            align-items: center;
        }
        .toolbox svg {
            width: 22px;
            height: 22px;
            stroke: #233ba7;
            fill: none;
            stroke-width: 1.3;
        }
    </style>
</head>
<body>
    <h1>Distribution of Math Problem Types</h1>
    <div class="legend">
        <div class="legend-item"><span class="algebra"></span>Algebra</div>
        <div class="legend-item"><span class="geometry"></span>Geometry</div>
        <div class="legend-item"><span class="calculus"></span>Calculus</div>
        <div class="legend-item"><span class="probability"></span>Probability</div>
        <div class="legend-item"><span class="number-theory"></span>Number Theory</div>
    </div>
    <div class="container">
        <div id="chart1" class="chart"></div>
        <div id="chart2" class="chart"></div>
        <div id="chart3" class="chart"></div>
        <div id="chart4" class="chart"></div>
    </div>
    <div class="toolbox" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M6 2.5h8l4 4V21H6z"></path><path d="M14 2.5v4h4"></path><path d="M8.5 10h7"></path><path d="M8.5 13.5h7"></path><path d="M8.5 17h5"></path></svg>
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-13.7 5.6"></path><path d="M4 12A8 8 0 0 1 17.7 6.4"></path><path d="M6.2 21v-3.7H2.5"></path><path d="M17.8 3v3.7h3.7"></path></svg>
        <svg viewBox="0 0 24 24"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 19h14"></path></svg>
    </div>
    <script>
        const colors = {
            'Algebra': '#2f64f5',
            'Geometry': '#10bcae',
            'Calculus': '#ffc42e',
            'Probability': '#9323aa',
            'Number Theory': '#df3b12'
        };

        const funnelData = [
            { name: 'Algebra', value: 95 },
            { name: 'Geometry', value: 72 },
            { name: 'Calculus', value: 56 },
            { name: 'Probability', value: 38 },
            { name: 'Number Theory', value: 22 }
        ];

        function initChart(id, sortOrder, labelPosition) {
            const chart = echarts.init(document.getElementById(id));
            const labelsOnLeft = labelPosition === 'left';
            chart.setOption({
                animation: false,
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c}'
                },
                series: [
                    {
                        name: 'Distribution',
                        type: 'funnel',
                        orient: 'vertical',
                        sort: sortOrder,
                        min: 0,
                        max: 95,
                        minSize: '18%',
                        maxSize: '92%',
                        left: labelsOnLeft ? '3.5%' : '6.5%',
                        top: 0,
                        width: '88%',
                        height: '100%',
                        gap: 0,
                        data: funnelData,
                        label: {
                            show: true,
                            position: labelPosition,
                            formatter: '{b}',
                            color: '#263238',
                            fontFamily: 'Times New Roman',
                            fontSize: 12,
                            fontWeight: '700'
                        },
                        labelLine: {
                            show: true,
                            length: 18,
                            length2: 17,
                            lineStyle: {
                                width: 1
                            }
                        },
                        itemStyle: {
                            borderColor: '#111',
                            borderWidth: 2,
                            color: function(params) {
                                return colors[params.name];
                            }
                        },
                        emphasis: {
                            disabled: true
                        }
                    }
                ]
            });
        }

        initChart('chart1', 'ascending', 'right');
        initChart('chart2', 'descending', 'left');
        initChart('chart3', 'descending', 'right');
        initChart('chart4', 'ascending', 'left');

        window.addEventListener('resize', function() {
            ['chart1', 'chart2', 'chart3', 'chart4'].forEach(function(id) {
                const instance = echarts.getInstanceByDom(document.getElementById(id));
                if (instance) instance.resize();
            });
        });
    </script>
</body>
</html>
