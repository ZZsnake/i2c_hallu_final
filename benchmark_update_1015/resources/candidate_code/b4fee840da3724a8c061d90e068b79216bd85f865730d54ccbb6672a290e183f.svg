<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="white" />

  <!-- Title and Subtitles -->
  <text x="15" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">Supply vs. Price per Unit (USD), 2023</text>
  <text x="15" y="55" font-family="Arial, sans-serif" font-size="14" fill="#666">Vertical axis: Market Supply (thousands of units).</text>
  <text x="15" y="72" font-family="Arial, sans-serif" font-size="14" fill="#666">Horizontal axis: Price per unit, inflation adjusted (USD).</text>

  <!-- Grid Lines -->
  <g stroke="#ccc" stroke-dasharray="4,4" stroke-width="1">
    <line x1="70" y1="510" x2="750" y2="510" /> <!-- 0 -->
    <line x1="70" y1="450" x2="750" y2="450" /> <!-- 10 -->
    <line x1="70" y1="390" x2="750" y2="390" /> <!-- 20 -->
    <line x1="70" y1="330" x2="750" y2="330" /> <!-- 30 -->
    <line x1="70" y1="270" x2="750" y2="270" /> <!-- 40 -->
    <line x1="70" y1="210" x2="750" y2="210" /> <!-- 50 -->
    <line x1="70" y1="150" x2="750" y2="150" /> <!-- 60 -->
    <line x1="70" y1="90" x2="750" y2="90" />  <!-- 70 -->
    <line x1="70" y1="30" x2="750" y2="30" />  <!-- 80 -->
    
    <!-- Vertical Grid Lines (Log Scale approx) -->
    <line x1="70" y1="30" x2="70" y2="510" />   <!-- $2 -->
    <line x1="188" y1="30" x2="188" y2="510" />  <!-- $5 -->
    <line x1="400" y1="30" x2="400" y2="510" />  <!-- $20 -->
    <line x1="660" y1="30" x2="660" y2="510" />  <!-- $100 -->
  </g>

  <!-- Axes -->
  <line x1="70" y1="510" x2="750" y2="510" stroke="black" stroke-width="1" />
  <line x1="70" y1="30" x2="70" y2="510" stroke="black" stroke-width="0.5" />

  <!-- Axis Labels -->
  <text x="350" y="555" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Price per Unit (USD)</text>
  <text x="25" y="270" font-family="Arial, sans-serif" font-size="14" transform="rotate(-90, 25, 270)" text-anchor="middle">Market Supply (thousands)</text>

  <!-- Axis Ticks -->
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="70" y="530">$2</text>
    <text x="188" y="530">$5</text>
    <text x="400" y="530">$20</text>
    <text x="660" y="530">$100</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="end">
    <text x="65" y="515">0</text>
    <text x="65" y="455">10</text>
    <text x="65" y="395">20</text>
    <text x="65" y="335">30</text>
    <text x="65" y="275">40</text>
    <text x="65" y="215">50</text>
    <text x="65" y="155">60</text>
    <text x="65" y="95">70</text>
    <text x="65" y="35">80</text>
  </g>

  <!-- Data Points (Bubbles) -->
  <!-- Agriculture -->
  <circle cx="110" cy="470" r="6" fill="#703040" stroke="black" /> <!-- SmartFoods -->
  <text x="110" y="460" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">SmartFoods</text>
  
  <circle cx="150" cy="390" r="18" fill="#4a90e2" stroke="black" /> <!-- AgroFoods -->
  <text x="150" y="368" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">AgroFoods</text>
  
  <circle cx="140" cy="160" r="8" fill="#556b55" stroke="black" /> <!-- AgriCo -->
  <text x="140" y="148" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">AgriCo</text>

  <!-- Energy -->
  <circle cx="205" cy="430" r="15" fill="#f06060" stroke="black" /> <!-- EnerGen -->
  <text x="205" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">EnerGen</text>

  <!-- Technology -->
  <circle cx="188" cy="360" r="7" fill="#f5c542" stroke="black" /> <!-- RetailX -->
  <text x="210" y="355" font-family="Arial, sans-serif" font-size="11">RetailX</text>
  
  <circle cx="540" cy="120" r="14" fill="#f5a623" stroke="black" /> <!-- TechNova -->
  <text x="540" y="102" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">TechNova</text>

  <!-- Healthcare -->
  <circle cx="390" cy="230" r="12" fill="#66bb9a" stroke="black" /> <!-- HealthPlus -->
  <text x="420" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">HealthPlus</text>
  
  <circle cx="480" cy="215" r="6" fill="#d05030" stroke="black" /> <!-- PharmaOne -->
  <text x="510" y="205" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">PharmaOne</text>
  
  <circle cx="350" cy="100" r="10" fill="#9060d0" stroke="black" /> <!-- FinanceTrust/Ecotex -->
  <text x="350" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Ecotex</text>
  <text x="350" y="95" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">FinanceTrust</text>

  <!-- Automotive -->
  <circle cx="660" cy="85" r="12" fill="#5080e0" stroke="black" /> <!-- AutoMax -->
  <text x="660" y="68" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">AutoMax</text>

  <!-- Others -->
  <circle cx="240" cy="180" r="9" fill="#f040a0" stroke="black" /> <!-- UrbanBuild -->
  <text x="270" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">UrbanBuild</text>
  
  <circle cx="420" cy="65" r="7" fill="#40c0a0" stroke="black" /> <!-- TravelNet -->
  <text x="460" y="60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">TravelNet</text>
  
  <circle cx="570" cy="180" r="6" fill="#202080" stroke="black" /> <!-- GlobalMedia -->
  <text x="610" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">GlobalMedia</text>
  
  <circle cx="440" cy="360" r="6" fill="#206060" stroke="black" /> <!-- Logistix -->
  <text x="470" y="350" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Logistix</text>

  <!-- Legend -->
  <g transform="translate(680, 90)">
    <rect x="0" y="0" width="10" height="10" fill="#4a90e2" />
    <text x="15" y="10" font-family="Arial, sans-serif" font-size="12">Agriculture</text>
    <rect x="0" y="20" width="10" height="10" fill="#f06060" />
    <text x="15" y="30" font-family="Arial, sans-serif" font-size="12">Energy</text>
    <rect x="0" y="40" width="10" height="10" fill="#f5a623" />
    <text x="15" y="50" font-family="Arial, sans-serif" font-size="12">Technology</text>
    <rect x="0" y="60" width="10" height="10" fill="#66bb9a" />
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="12">Healthcare</text>
    <rect x="0" y="80" width="10" height="10" fill="#5080e0" />
    <text x="15" y="90" font-family="Arial, sans-serif" font-size="12">Automotive</text>
  </g>

  <!-- Footer -->
  <text x="15" y="585" font-family="Arial, sans-serif" font-size="12" fill="#666">Source: National Statistics Bureau, Market Research 2023</text>
  <text x="745" y="585" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">CC BY</text>
</svg>