<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <!-- Definitions -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
    <style type="text/css"><![CDATA[
      .box { fill:#f7e7c8; stroke:#7b5a3d; stroke-width:2; }
      .round { rx:20; ry:20; }
      .diamond { fill:#cce8ff; stroke:#3377aa; stroke-width:2; }
      .assign { fill:#f7e7c8; stroke:#b58b6a; stroke-width:2; }
      .loopbg { fill:#dde7f3; }
      .flow { stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .label { font-family:Arial, sans-serif; font-size:16px; fill:#333; }
      .sm { font-size:13px; }
      .cond { fill:#666; font-size:13px; font-family:Arial, sans-serif; }
      .em { fill:#993377; font-weight:bold; }
      .blue { fill:#235c96; font-weight:bold; }
    ]]></style>
  </defs>

  <!-- Loop background -->
  <rect x="260" y="120" width="310" height="520" rx="30" ry="30" class="loopbg"/>

  <!-- Top input box -->
  <rect x="140" y="20" width="320" height="60" class="box round"/>
  <text x="160" y="58" class="label">
    <tspan class="em">input:</tspan>
    <tspan dx="8">r</tspan>
    <tspan dx="12">and</tspan>
    <tspan dx="12">s</tspan>
  </text>

  <!-- s zero? diamond -->
  <polygon points="250,110 310,170 250,230 190,170" class="diamond"/>
  <text x="250" y="162" class="label" text-anchor="middle">
    <tspan>s</tspan><tspan dx="4">zero?</tspan>
  </text>

  <!-- r zero? diamond inside loop -->
  <polygon points="330,210 390,270 330,330 270,270" class="diamond"/>
  <text x="330" y="262" class="label" text-anchor="middle">
    <tspan>r</tspan><tspan dx="4">zero?</tspan>
  </text>

  <!-- r < s ? diamond -->
  <polygon points="440,260 500,320 440,380 380,320" class="diamond"/>
  <text x="440" y="312" class="label" text-anchor="middle">
    <tspan>r &lt; s ?</tspan>
  </text>

  <!-- loop label -->
  <text x="415" y="170" class="label blue" text-anchor="middle">loop</text>

  <!-- Assignment blocks -->
  <!-- d <- r (top left) -->
  <rect x="160" y="260" width="120" height="40" class="assign"/>
  <text x="220" y="286" class="label" text-anchor="middle">d &larr; r</text>

  <!-- d <- s (from r zero?) -->
  <rect x="200" y="340" width="120" height="40" class="assign"/>
  <text x="260" y="366" class="label" text-anchor="middle">d &larr; s</text>

  <!-- triple assignment block -->
  <rect x="390" y="360" width="150" height="80" class="assign"/>
  <text x="465" y="386" class="label" text-anchor="middle">
    <tspan x="465" dy="0">d &larr; s</tspan>
    <tspan x="465" dy="18">s &larr; r</tspan>
    <tspan x="465" dy="18">r &larr; d</tspan>
  </text>

  <!-- r <- r - s block -->
  <rect x="380" y="470" width="180" height="40" class="assign"/>
  <text x="470" y="496" class="label" text-anchor="middle">r &larr; r - s</text>

  <!-- Bottom output box -->
  <rect x="80" y="560" width="280" height="120" class="box round"/>
  <text x="100" y="596" class="label">
    <tspan class="em">output:</tspan>
    <tspan dx="6" class="em">d</tspan>
  </text>
  <text x="100" y="616" class="label sm">
    <tspan>is the GCD of the input values</tspan>
  </text>
  <text x="100" y="634" class="label sm">
    <tspan>given to r and s</tspan>
  </text>

  <!-- True/False labels -->
  <text x="310" y="150" class="cond">false</text>
  <text x="250" y="238" class="cond" text-anchor="middle">true</text>
  <text x="390" y="254" class="cond">false</text>
  <text x="330" y="338" class="cond" text-anchor="middle">true</text>

  <!-- Flow lines and arrows -->
  <!-- From input to s zero? -->
  <path d="M300,80 L300,100" class="flow"/>

  <!-- s zero? true down to d<-r -->
  <path d="M250,230 L250,260" class="flow"/>

  <!-- from d<-r down to output -->
  <path d="M220,300 L220,560" class="flow"/>

  <!-- s zero? false into loop (to top of loop region) -->
  <path d="M310,170 L360,170 L360,210" class="flow"/>

  <!-- r zero? true to d<-s -->
  <path d="M330,330 L330,360 L260,360" class="flow"/>

  <!-- from d<-s block to join vertical spine (to output) -->
  <path d="M260,380 L260,520 L220,520" class="flow"/>

  <!-- r zero? false to r < s ? -->
  <path d="M390,270 L410,270 L410,260" class="flow"/>

  <!-- r < s ? true to triple assignment -->
  <path d="M440,380 L440,360" class="flow"/>

  <!-- triple assignment to r <- r - s -->
  <path d="M465,440 L465,470" class="flow"/>

  <!-- r <- r - s down and loop back up right side -->
  <path d="M470,510 L470,560 L520,560 L520,140 L320,140" class="flow"/>

  <!-- r < s ? false loop path (side loop) -->
  <path d="M500,320 L540,320 L540,200 L360,200" class="flow"/>

  <!-- join from loop output (d<-s path) back to spine already drawn -->

</svg>