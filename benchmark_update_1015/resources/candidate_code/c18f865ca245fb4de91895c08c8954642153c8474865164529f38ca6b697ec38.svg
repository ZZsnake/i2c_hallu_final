<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Define styles for reusability -->
  <defs>
    <style>
      .fill-body {
        fill: #CCEFFF; /* Light blue */
        stroke: none;
      }
      .solid-edge {
        stroke: #008000; /* Dark green */
        stroke-width: 4;
        fill: none;
      }
      .dashed-edge {
        stroke: #008000; /* Dark green */
        stroke-width: 8;
        stroke-dasharray: 28 22;
        fill: none;
      }
      .point {
        fill: #202020;
        stroke: #008000; /* Dark green */
        stroke-width: 4;
      }
      .label {
        font-family: sans-serif;
        font-size: 85px;
        font-weight: normal;
        fill: #202020;
      }
    </style>
  </defs>

  <!-- Main body fill (visible outline) -->
  <path class="fill-body" d="M 75 910 L 255 265 L 480 140 L 645 120 L 780 190 L 875 735 L 735 910 Z"/>

  <!-- Dashed edges (hidden lines or internal structure) -->
  <path class="dashed-edge" d="M 505 655 L 135 785"/> <!-- P-r -->
  <path class="dashed-edge" d="M 505 655 L 875 735"/> <!-- P-S -->
  <path class="dashed-edge" d="M 645 120 L 505 655"/> <!-- M-P -->
  <path class="dashed-edge" d="M 480 140 L 135 785"/> <!-- Q-r -->
  <path class="dashed-edge" d="M 75 910 L 135 785"/> <!-- V-r -->

  <!-- Solid edges (visible lines) -->
  <path class="solid-edge" d="M 75 910 L 255 265"/> <!-- V-O -->
  <path class="solid-edge" d="M 75 910 L 735 910"/> <!-- V-h -->
  <path class="solid-edge" d="M 735 910 L 875 735"/> <!-- h-S -->
  <path class="solid-edge" d="M 735 910 L 755 265"/> <!-- h-T -->
  <path class="solid-edge" d="M 875 735 L 780 190"/> <!-- S-N -->
  <path class="solid-edge" d="M 255 265 L 480 140"/> <!-- O-Q (upper base) -->
  <path class="solid-edge" d="M 480 140 L 645 120"/> <!-- Q-M (upper base) -->
  <path class="solid-edge" d="M 645 120 L 780 190"/> <!-- M-N (upper base) -->
  <path class="solid-edge" d="M 780 190 L 755 265"/> <!-- N-T (upper base) -->
  <path class="solid-edge" d="M 755 265 L 255 265"/> <!-- T-O (upper base) -->

  <!-- Points (circles) -->
  <circle class="point" cx="75" cy="910" r="11"/> <!-- V -->
  <circle class="point" cx="735" cy="910" r="11"/> <!-- h -->
  <circle class="point" cx="875" cy="735" r="11"/> <!-- S -->
  <circle class="point" cx="135" cy="785" r="11"/> <!-- r -->
  <circle class="point" cx="505" cy="655" r="11"/> <!-- P -->
  <circle class="point" cx="255" cy="265" r="11"/> <!-- O -->
  <circle class="point" cx="480" cy="140" r="11"/> <!-- Q -->
  <circle class="point" cx="645" cy="120" r="11"/> <!-- M -->
  <circle class="point" cx="780" cy="190" r="11"/> <!-- N -->
  <circle class="point" cx="755" cy="265" r="11"/> <!-- T -->

  <!-- Labels -->
  <text class="label" x="25" y="985">V</text>
  <text class="label" x="690" y="965">h</text>
  <text class="label" x="890" y="770">S</text>
  <text class="label" x="130" y="850">r</text>
  <text class="label" x="450" y="660">P</text>
  <text class="label" x="175" y="270">O</text>
  <text class="label" x="430" y="145">Q</text>
  <text class="label" x="615" y="105">M</text>
  <text class="label" x="800" y="210">N</text>
  <text class="label" x="765" y="335">T</text>
</svg>