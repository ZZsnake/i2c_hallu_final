<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gauge Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: white;
            font-family: Arial, sans-serif;
        }
        #gaugeChart {
            width: 600px;
            height: 600px;
        }
        .text-container {
            text-align: center;
            margin-top: 20px;
        }
        .text-container h1 {
            margin: 0;
            font-size: 24px;
        }
        .text-container p {
            margin: 0;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="gaugeChart"></div>
    <div class="text-container">
        <h1>3.14</h1>
        <p>π Approx.</p>
    </div>
    <script>
        var chartDom = document.getElementById('gaugeChart');
        var myChart = echarts.init(chartDom);
        var option;

        option = {
            series: [
                {
                    type: 'gauge',
                    startAngle: 225,
                    endAngle: -45,
                    min: 0,
                    max: 3.6,
                    splitNumber: 9,
                    axisLine: {
                        lineStyle: {
                            width: 30,
                            color: [
                                [1/3, '#006699'],
                                [2/3, '#33CC33'],
                                [1, '#CC3333']
                            ]
                        }
                    },
                    axisTick: {
                        distance: -30,
                        length: 8,
                        lineStyle: {
                            color: 'auto'
                        }
                    },
                    splitLine: {
                        distance: -30,
                        length: 30,
                        lineStyle: {
                            color: 'auto'
                        }
                    },
                    axisLabel: {
                        distance: -20,
                        color: 'auto',
                        fontSize: 14
                    },
                    pointer: {
                        icon: 'path://M12.8,0.7l12,40.1H0.7L12.8,0.7z',
                        length: '80%',
                        width: 12,
                        offsetCenter: [0, '-60%'],
                        itemStyle: {
                            color: 'auto'
                        }
                    },
                    detail: {
                        valueAnimation: true,
                        formatter: '{value}',
                        fontSize: 20,
                        color: 'auto'
                    },
                    data: [
                        {
                            value: 3.14,
                            name: 'π Approx.'
                        }
                    ]
                }
            ]
        };

        option && myChart.setOption(option);
    </script>
</body>
</html>
