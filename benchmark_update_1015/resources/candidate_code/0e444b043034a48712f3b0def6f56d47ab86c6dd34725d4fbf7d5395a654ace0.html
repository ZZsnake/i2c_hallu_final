<!DOCTYPE html>
<html>
<head>
  <title>Quadratic Function Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff;
      margin: 0;
    }

    .chart-container {
      width: 100%;
      height: 923px;
      margin: 62px 0 0 0;
      position: relative;
    }

    #mainChart {
      width: 100%;
      height: 100%;
    }

    .title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #102a63;
      margin-top: 12px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="title">Quadratic Function: y = x<sup>2</sup> - 5x + 6</div>
  <div class="chart-container">
    <div id="mainChart"></div>
  </div>

  <script>
    $(function() {
      var chartDom = document.getElementById('mainChart');
      var myChart = echarts.init(chartDom);
      var option = {
        title: {
          text: ''
        },
        tooltip: {
          trigger: 'axis',
          axisPointer: {
            type: 'cross'
          }
        },
        grid: {
          left: '9.2%',
          right: '8%',
          top: 65,
          bottom: 70,
          containLabel: false
        },
        xAxis: {
          type: 'value',
          min: -3,
          max: 7,

          name: 'x',
          nameLocation: 'end',
          nameTextStyle: {
            color: '#102a63',
            fontWeight: 'bold',
            fontSize: 14,
            padding: [25, 0, 0, 6]
          },
          axisLine: {
            onZero: true,
            lineStyle: {
              color: '#102a63',
              width: 2
            }
          },
          axisTick: {
            lineStyle: {
              color: '#102a63'
            }
          },
          axisLabel: {
            color: '#102a63',
            fontWeight: 'bold',
            showMinLabel: true,
            showMaxLabel: true
          },
          splitLine: {
            show: true,
            lineStyle: {
              color: '#c8c8c8',
              type: 'dashed',
              width: 1
            }
          }
        },
        yAxis: {
          type: 'value',
          min: -5,
          max: 25,
          interval: 5,
          name: 'y',
          nameLocation: 'end',
          nameTextStyle: {
            color: '#102a63',
            fontWeight: 'bold',
            fontSize: 14,
            padding: [0, 0, 12, 0]
          },
          axisLine: {
            onZero: true,
            lineStyle: {
              color: '#102a63',
              width: 2
            }
          },
          axisTick: {
            lineStyle: {
              color: '#102a63'
            }
          },
          axisLabel: {
            color: '#102a63',
            fontWeight: 'bold'
          },
          splitLine: {
            show: true,
            lineStyle: {
              color: '#c8c8c8',
              type: 'dashed',
              width: 1
            }
          }
        },
        series: [{
          type: 'line',
          data: [
            [-2, 20],
            [0, 6],
            [2, 0],
            [4, 2],
            [6, 12]
          ],
          itemStyle: {
            color: '#ff2a2a',
            borderColor: '#102a63',
            borderWidth: 2
          },
          symbol: 'circle',
          symbolSize: 14,
          lineStyle: {
            width: 4,
            color: '#ff2a2a'
          }
        }]
      };

      myChart.setOption(option);
    });
  </script>
</body>
</html>
