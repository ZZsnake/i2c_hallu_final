<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribution of Math Problem Types</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #F5F5F5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }
        
        h1 {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .legend {
            position: absolute;
            top: 50px;
            left: 10px;
            background: white;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            z-index: 10;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .legend-item:last-child {
            margin-bottom: 0;
        }
        
        .legend-color {
            width: 30px;
            height: 18px;
            border: 1px solid #000;
            border-radius: 3px;
            margin-right: 8px;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 40px;
            margin-top: 60px;
        }
        
        .chart-container {
            width: 100%;
            height: 400px;
        }
        
        .icons {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Distribution of Math Problem Types</h1>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: #1E90FF;"></div>
                <span>Algebra</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #00CED1;"></div>
                <span>Geometry</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #FFA500;"></div>
                <span>Calculus</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #9932CC;"></div>
                <span>Probability</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #D2691E;"></div>
                <span>Number Theory</span>
            </div>
        </div>
        
        <div class="charts-grid">
            <div id="chart1" class="chart-container"></div>
            <div id="chart2" class="chart-container"></div>
            <div id="chart3" class="chart-container"></div>
            <div id="chart4" class="chart-container"></div>
        </div>
        
        <div class="icons">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        </div>
    </div>
    
    <script>
        // Chart 1: Traditional Pyramid (bottom to top)
        var chart1 = echarts.init(document.getElementById('chart1'));
        var option1 = {
            series: [{
                type: 'funnel',
                sort: 'none',
                gap: 0,
                label: {
                    show: true,
                    position: 'right',
                    formatter: '{b}',
                    fontSize: 13,
                    color: '#000'
                },
                labelLine: {
                    show: false
                },
                itemStyle: {
                    borderColor: '#000',
                    borderWidth: 2
                },
                data: [
                    {value: 50, name: 'Number Theory', itemStyle: {color: '#D2691E'}},
                    {value: 60, name: 'Probability', itemStyle: {color: '#9932CC'}},
                    {value: 70, name: 'Calculus', itemStyle: {color: '#FFA500'}},
                    {value: 80, name: 'Geometry', itemStyle: {color: '#00CED1'}},
                    {value: 100, name: 'Algebra', itemStyle: {color: '#1E90FF'}}
                ]
            }]
        };
        chart1.setOption(option1);
        
        // Chart 2: Inverted Funnel (top to bottom)
        var chart2 = echarts.init(document.getElementById('chart2'));
        var option2 = {
            series: [{
                type: 'funnel',
                sort: 'none',
                gap: 0,
                funnelAlign: 'center',
                label: {
                    show: true,
                    position: 'right',
                    formatter: '{b}',
                    fontSize: 13,
                    color: '#000'
                },
                labelLine: {
                    show: false
                },
                itemStyle: {
                    borderColor: '#000',
                    borderWidth: 2
                },
                data: [
                    {value: 100, name: 'Algebra', itemStyle: {color: '#1E90FF'}},
                    {value: 80, name: 'Geometry', itemStyle: {color: '#00CED1'}},
                    {value: 70, name: 'Calculus', itemStyle: {color: '#FFA500'}},
                    {value: 60, name: 'Probability', itemStyle: {color: '#9932CC'}},
                    {value: 50, name: 'Number Theory', itemStyle: {color: '#D2691E'}}
                ]
            }]
        };
        chart2.setOption(option2);
        
        // Chart 3: Inverted Funnel (top to bottom)
        var chart3 = echarts.init(document.getElementById('chart3'));
        var option3 = {
            series: [{
                type: 'funnel',
                sort: 'none',
                gap: 0,
                funnelAlign: 'center',
                label: {
                    show: true,
                    position: 'right',
                    formatter: '{b}',
                    fontSize: 13,
                    color: '#000'
                },
                labelLine: {
                    show: false
                },
                itemStyle: {
                    borderColor: '#000',
                    borderWidth: 2
                },
                data: [
                    {value: 100, name: 'Algebra', itemStyle: {color: '#1E90FF'}},
                    {value: 80, name: 'Geometry', itemStyle: {color: '#00CED1'}},
                    {value: 70, name: 'Calculus', itemStyle: {color: '#FFA500'}},
                    {value: 60, name: 'Probability', itemStyle: {color: '#9932CC'}},
                    {value: 50, name: 'Number Theory', itemStyle: {color: '#D2691E'}}
                ]
            }]
        };
        chart3.setOption(option3);
        
        // Chart 4: Traditional Pyramid (bottom to top)
        var chart4 = echarts.init(document.getElementById('chart4'));
        var option4 = {
            series: [{
                type: 'funnel',
                sort: 'none',
                gap: 0,
                label: {
                    show: true,
                    position: 'right',
                    formatter: '{b}',
                    fontSize: 13,
                    color: '#000'
                },
                labelLine: {
                    show: false
                },
                itemStyle: {
                    borderColor: '#000',
                    borderWidth: 2
                },
                data: [
                    {value: 50, name: 'Number Theory', itemStyle: {color: '#D2691E'}},
                    {value: 60, name: 'Probability', itemStyle: {color: '#9932CC'}},
                    {value: 70, name: 'Calculus', itemStyle: {color: '#FFA500'}},
                    {value: 80, name: 'Geometry', itemStyle: {color: '#00CED1'}},
                    {value: 100, name: 'Algebra', itemStyle: {color: '#1E90FF'}}
                ]
            }]
        };
        chart4.setOption(option4);
        
        // Responsive resize
        window.addEventListener('resize', function() {
            chart1.resize();
            chart2.resize();
            chart3.resize();
            chart4.resize();
        });
    </script>
</body>
</html>
