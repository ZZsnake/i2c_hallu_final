<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Title and Subtitle -->
  <text x="400" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#00008B">UK Inflation Rate (Consumer Price Index)</text>
  <text x="400" y="60" font-size="14" text-anchor="middle" fill="#00008B">Jan 2015 – Dec 2021</text>
  
  <!-- Axes -->
  <line x1="50" y1="50" x2="50" y2="550" stroke="#000"/>
  <line x1="50" y1="550" x2="750" y2="550" stroke="#000"/>
  
  <!-- Vertical Axis Labels -->
  <text x="45" y="550" text-anchor="end" dy="0.3em" fill="#000">0%</text>
  <text x="45" y="466.67" text-anchor="end" dy="0.3em" fill="#000">2%</text>
  <text x="45" y="383.33" text-anchor="end" dy="0.3em" fill="#000">4%</text>
  <text x="45" y="300" text-anchor="end" dy="0.3em" fill="#000">6%</text>
  <text x="45" y="216.67" text-anchor="end" dy="0.3em" fill="#000">8%</text>
  <text x="45" y="133.33" text-anchor="end" dy="0.3em" fill="#000">10%</text>
  
  <!-- Horizontal Axis Labels -->
  <text x="50" y="570" text-anchor="middle" fill="#000">2015</text>
  <text x="166.67" y="570" text-anchor="middle" fill="#000">2016</text>
  <text x="283.33" y="570" text-anchor="middle" fill="#000">2017</text>
  <text x="400" y="570" text-anchor="middle" fill="#000">2018</text>
  <text x="516.67" y="570" text-anchor="middle" fill="#000">2019</text>
  <text x="633.33" y="570" text-anchor="middle" fill="#000">2020</text>
  <text x="750" y="570" text-anchor="middle" fill="#000">2021</text>
  
  <!-- Data Line -->
  <path fill="none" stroke="red" stroke-dasharray="5,5" d="M50,462.5 L166.67,412.5 L283.33,350 L400,270.83 L516.67,300 L633.33,179.17 L750,83.33"/>
  
  <!-- Data Points -->
  <circle cx="50" cy="462.5" r="4" fill="red" stroke="#00008B" stroke-width="1"/>
  <circle cx="166.67" cy="412.5" r="4" fill="red" stroke="#00008B" stroke-width="1"/>
  <circle cx="283.33" cy="350" r="4" fill="red" stroke="#00008B" stroke-width="1"/>
  <circle cx="400" cy="270.83" r="4" fill="red" stroke="#00008B" stroke-width="1"/>
  <circle cx="516.67" cy="300" r="4" fill="red" stroke="#00008B" stroke-width="1"/>
  <circle cx="633.33" cy="179.17" r="4" fill="red" stroke="#00008B" stroke-width="1"/>
  <circle cx="750" cy="83.33" r="4" fill="red" stroke="#00008B" stroke-width="1"/>
  
  <!-- Data Labels -->
  <text x="55" y="462.5" dy="-0.5em" dx="5" fill="#00008B">2.1%</text>
  <text x="166.67" y="412.5" dy="-1.2em" dx="5" fill="#00008B">3.3%</text>
  <text x="283.33" y="350" dy="-1.2em" dx="5" fill="#00008B">4.8%</text>
  <text x="400" y="270.83" dy="-1.2em" dx="5" fill="#00008B">6.7%</text>
  <text x="516.67" y="300" dy="-1.2em" dx="5" fill="#00008B">6.0%</text>
  <text x="628.33" y="179.17" dy="1.2em" dx="-5" text-anchor="end" fill="#00008B">8.9%</text>
  <text x="745" y="83.33" dy="1.2em" dx="-5" text-anchor="end" fill="#00008B">11.2%</text>
  
  <!-- Source -->
  <text x="400" y="580" font-size="12" text-anchor="middle" fill="#000">Source: Office for National Statistics (ONS)</text>
</svg>