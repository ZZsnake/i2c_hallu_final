    stroke="#2f73c9"
    stroke-width="3"
    stroke-dasharray="7 5"
    stroke-linejoin="round"
    stroke-linecap="round"/>

  <!-- Westvale -->
  <path
    d="M70 118
       C 96 131, 126 150, 154 168
       C 176 184, 190 206, 190 225
       C 172 240, 139 250, 105 235
       C 78 222, 64 190, 64 158
       C 64 140, 65 127, 70 118 Z"
