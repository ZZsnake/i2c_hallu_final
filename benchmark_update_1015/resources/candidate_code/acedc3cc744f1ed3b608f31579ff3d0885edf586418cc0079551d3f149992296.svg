    stroke="#1f7f47"
    stroke-width="3"
    stroke-dasharray="7 5"
    stroke-linejoin="round"
    stroke-linecap="round"/>

  <!-- East Bay -->
  <path
    d="M288 151
       C 306 127, 336 117, 365 128
       C 391 138, 405 163, 401 192
       C 397 218, 370 228, 342 221
       C 318 215, 303 196, 294 176
       C 291 167, 289 158, 288 151 Z"
