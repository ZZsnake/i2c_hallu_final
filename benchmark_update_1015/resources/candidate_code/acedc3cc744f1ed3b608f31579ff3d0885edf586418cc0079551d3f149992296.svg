    stroke="#b0382d"
    stroke-width="3"
    stroke-dasharray="7 5"
    stroke-linejoin="round"
    stroke-linecap="round"/>

  <!-- South Plains -->
  <path
    d="M151 233
       C 176 226, 198 232, 219 247
       C 247 264, 291 264, 314 248
       C 329 238, 333 220, 342 221
       C 354 240, 358 266, 352 298
       C 314 313, 260 319, 207 310
       C 175 305, 151 291, 142 263
       C 138 250, 140 239, 151 233 Z"
