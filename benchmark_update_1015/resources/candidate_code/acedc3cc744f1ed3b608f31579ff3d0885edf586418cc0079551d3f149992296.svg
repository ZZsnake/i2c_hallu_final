    stroke-width="3"
    stroke-dasharray="7 5"
    stroke-linejoin="round"
    stroke-linecap="round"/>

  <!-- River Azure -->
  <path
    d="M112 82
       C 128 122, 156 158, 196 178
       C 225 193, 263 202, 304 200"
    fill="none"
    stroke="#1f78d1"
    stroke-width="3"
    stroke-dasharray="1 8"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Capital City marker -->
  <circle cx="260" cy="190" r="9" fill="#1b1b1b" stroke="#f1c40f" stroke-width="4"/>

  <!-- Region labels -->
  <text x="220" y="115" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">
    Northland
  </text>

  <text x="130" y="185" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">
    Westvale
  </text>

  <text x="360" y="135" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">
    East Bay
  </text>

  <text x="260" y="265" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">
    South Plains
  </text>

  <!-- River label -->
  <text x="205" y="145" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f78d1">
