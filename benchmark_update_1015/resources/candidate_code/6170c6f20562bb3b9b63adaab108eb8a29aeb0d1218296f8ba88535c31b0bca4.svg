<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Grid lines -->
  <g stroke="#ddd" stroke-dasharray="2,2" stroke-width="1">
    <!-- Horizontal grid lines -->
    <line x1="50" x2="550" y1="350" y2="350"/>
    <line x1="50" x2="550" y1="300" y2="300"/>
    <line x1="50" x2="550" y1="250" y2="250"/>
    <line x1="50" x2="550" y1="200" y2="200"/>
    <line x1="50" x2="550" y1="150" y2="150"/>
    <line x1="50" x2="550" y1="100" y2="100"/>
    <line x1="50" x2="550" y1="50" y2="50"/>
    <!-- Vertical grid lines -->
    <line x1="50" x2="50" y1="30" y2="350"/>
    <line x1="120" x2="120" y1="30" y2="350"/>
    <line x1="190" x2="190" y1="30" y2="350"/>
    <line x1="260" x2="260" y1="30" y2="350"/>
    <line x1="330" x2="330" y1="30" y2="350"/>
    <line x1="400" x2="400" y1="30" y2="350"/>
    <line x1="470" x2="470" y1="30" y2="350"/>
    <line x1="540" x2="540" y1="30" y2="350"/>
  </g>
  
  <!-- Axes -->
  <g stroke="black" stroke-width="1">
    <line x1="50" x2="550" y1="350" y2="350"/> <!-- X-axis -->
    <line x1="50" x2="50" y1="30" y2="350"/>  <!-- Y-axis -->
  </g>
  
  <!-- Axis labels -->
  <text x="300" y="380" text-anchor="middle" font-size="12">Year</text>
  <text x="20" y="190" text-anchor="middle" font-size="12" transform="rotate(-90 20,190)">Quantity</text>
  
  <!-- Y-axis ticks and labels -->
  <g font-size="10" text-anchor="end">
    <text x="45" y="355">0</text>
    <text x="45" y="305">50</text>
    <text x="45" y="255">100</text>
    <text x="45" y="205">150</text>
    <text x="45" y="155">200</text>
    <text x="45" y="105">250</text>
    <text x="45" y="55">300</text>
    <text x="45" y="5">350</text>
  </g>
  
  <!-- X-axis ticks and labels -->
  <g font-size="10" text-anchor="middle">
    <text x="50" y="365">2016</text>
    <text x="120" y="365">2017</text>
    <text x="190" y="365">2018</text>
    <text x="260" y="365">2019</text>
    <text x="330" y="365">2020</text>
    <text x="400" y="365">2021</text>
    <text x="470" y="365">2022</text>
  </g>
  
  <!-- Data lines -->
  <!-- Supply (red dashed line with circles) -->
  <path d="M50 325 Q120 275 190 225 Q260 175 330 125 Q400 75 470 25" 
        fill="none" stroke="red" stroke-dasharray="5,5" stroke-width="2"/>
  <circle cx="50" cy="325" r="4" fill="red"/>
  <circle cx="120" cy="275" r="4" fill="red"/>
  <circle cx="190" cy="225" r="4" fill="red"/>
  <circle cx="260" cy="175" r="4" fill="red"/>
  <circle cx="330" cy="125" r="4" fill="red"/>
  <circle cx="400" cy="75" r="4" fill="red"/>
  <circle cx="470" cy="25" r="4" fill="red"/>
  
  <!-- Demand (blue solid line with squares) -->
  <path d="M50 50 Q120 100 190 150 Q260 200 330 250 Q400 300 470 350" 
        fill="none" stroke="blue" stroke-width="2"/>
  <rect x="46" y="46" width="8" height="8" fill="blue"/>
  <rect x="116" y="96" width="8" height="8" fill="blue"/>
  <rect x="186" y="146" width="8" height="8" fill="blue"/>
  <rect x="256" y="196" width="8" height="8" fill="blue"/>
  <rect x="326" y="246" width="8" height="8" fill="blue"/>
  <rect x="396" y="296" width="8" height="8" fill="blue"/>
  <rect x="466" y="346" width="8" height="8" fill="blue"/>
  
  <!-- Legend -->
  <rect x="510" y="30" width="10" height="10" fill="red"/>
  <text x="525" y="38" font-size="12">Supply</text>
  <rect x="510" y="50" width="10" height="10" fill="blue"/>
  <text x="525" y="58" font-size="12">Demand</text>
</svg>