<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180">
  <!-- Title -->
  <text x="70" y="175" font-family="Arial, sans-serif" font-size="12">(n+1) switch and diode configuration</text>
  
  <!-- Left vertical line -->
  <line x1="20" y1="20" x2="20" y2="140" stroke="black" stroke-width="1.5"/>
  
  <!-- Top connection point and label -->
  <circle cx="20" cy="20" r="3" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="13" y="15" font-family="Arial, sans-serif" font-size="11">1</text>
  
  <!-- Bottom connection point and label -->
  <circle cx="20" cy="140" r="3" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="13" y="155" font-family="Arial, sans-serif" font-size="11">0</text>
  
  <!-- Top horizontal line -->
  <line x1="20" y1="20" x2="230" y2="20" stroke="black" stroke-width="1.5"/>
  
  <!-- Bottom horizontal line -->
  <line x1="20" y1="140" x2="230" y2="140" stroke="black" stroke-width="1.5"/>
  
  <!-- Branch 1 (x=70) -->
  <line x1="70" y1="20" x2="70" y2="45" stroke="black" stroke-width="1.5"/>
  <!-- Top diode 1 -->
  <polygon points="70,45 65,55 75,55" fill="black"/>
  <line x1="65" y1="55" x2="75" y2="55" stroke="black" stroke-width="1.5"/>
  <line x1="70" y1="55" x2="70" y2="65" stroke="black" stroke-width="1.5"/>
  <!-- Switch S1 -->
  <line x1="70" y1="65" x2="78" y2="75" stroke="black" stroke-width="1.5"/>
  <circle cx="70" cy="65" r="2" fill="black"/>
  <circle cx="70" cy="85" r="2" fill="black"/>
  <text x="82" y="72" font-family="Arial, sans-serif" font-size="10">S</text>
  <text x="88" y="75" font-family="Arial, sans-serif" font-size="8">1</text>
  <line x1="70" y1="85" x2="70" y2="95" stroke="black" stroke-width="1.5"/>
  <!-- Middle diode 1 -->
  <polygon points="70,95 65,105 75,105" fill="black"/>
  <line x1="65" y1="105" x2="75" y2="105" stroke="black" stroke-width="1.5"/>
  <!-- v1 label -->
  <text x="82" y="102" font-family="Arial, sans-serif" font-size="10">v</text>
  <text x="88" y="105" font-family="Arial, sans-serif" font-size="8">1</text>
  <line x1="70" y1="105" x2="70" y2="115" stroke="black" stroke-width="1.5"/>
  <!-- Bottom diode 1 -->
  <line x1="65" y1="115" x2="75" y2="115" stroke="black" stroke-width="1.5"/>
  <polygon points="70,125 65,115 75,115" fill="black"/>
  <line x1="70" y1="125" x2="70" y2="140" stroke="black" stroke-width="1.5"/>
  
  <!-- Branch 2 (x=140) -->
  <line x1="140" y1="20" x2="140" y2="45" stroke="black" stroke-width="1.5"/>
  <!-- Top diode 2 -->
  <polygon points="140,45 135,55 145,55" fill="black"/>
  <line x1="135" y1="55" x2="145" y2="55" stroke="black" stroke-width="1.5"/>
  <line x1="140" y1="55" x2="140" y2="65" stroke="black" stroke-width="1.5"/>
  <!-- Switch S2 -->
  <line x1="140" y1="65" x2="148" y2="75" stroke="black" stroke-width="1.5"/>
  <circle cx="140" cy="65" r="2" fill="black"/>
  <circle cx="140" cy="85" r="2" fill="black"/>
  <text x="152" y="72" font-family="Arial, sans-serif" font-size="10">S</text>
  <text x="158" y="75" font-family="Arial, sans-serif" font-size="8">2</text>
  <line x1="140" y1="85" x2="140" y2="95" stroke="black" stroke-width="1.5"/>
  <!-- Middle diode 2 -->
  <polygon points="140,95 135,105 145,105" fill="black"/>
  <line x1="135" y1="105" x2="145" y2="105" stroke="black" stroke-width="1.5"/>
  <!-- v2 label -->
  <text x="152" y="102" font-family="Arial, sans-serif" font-size="10">v</text>
  <text x="158" y="105" font-family="Arial, sans-serif" font-size="8">2</text>
  <line x1="140" y1="105" x2="140" y2="115" stroke="black" stroke-width="1.5"/>
  <!-- Bottom diode 2 -->
  <line x1="135" y1="115" x2="145" y2="115" stroke="black" stroke-width="1.5"/>
  <polygon points="140,125 135,115 145,115" fill="black"/>
  <line x1="140" y1="125" x2="140" y2="140" stroke="black" stroke-width="1.5"/>
  
  <!-- Branch 3 (x=210) -->
  <line x1="210" y1="20" x2="210" y2="45" stroke="black" stroke-width="1.5"/>
  <!-- Top diode 3 -->
  <polygon points="210,45 205,55 215,55" fill="black"/>
  <line x1="205" y1="55" x2="215" y2="55" stroke="black" stroke-width="1.5"/>
  <line x1="210" y1="55" x2="210" y2="65" stroke="black" stroke-width="1.5"/>
  <!-- Switch S3 -->
  <line x1="210" y1="65" x2="218" y2="75" stroke="black" stroke-width="1.5"/>
  <circle cx="210" cy="65" r="2" fill="black"/>
  <circle cx="210" cy="85" r="2" fill="black"/>
  <text x="222" y="72" font-family="Arial, sans-serif" font-size="10">S</text>
  <text x="228" y="75" font-family="Arial, sans-serif" font-size="8">3</text>
  <line x1="210" y1="85" x2="210" y2="95" stroke="black" stroke-width="1.5"/>
  <!-- Middle diode 3 -->
  <polygon points="210,95 205,105 215,105" fill="black"/>
  <line x1="205" y1="105" x2="215" y2="105" stroke="black" stroke-width="1.5"/>
  <!-- v3 label -->
  <text x="222" y="102" font-family="Arial, sans-serif" font-size="10">v</text>
  <text x="228" y="105" font-family="Arial, sans-serif" font-size="8">3</text>
  <line x1="210" y1="105" x2="210" y2="115" stroke="black" stroke-width="1.5"/>
  <!-- Bottom diode 3 -->
  <line x1="205" y1="115" x2="215" y2="115" stroke="black" stroke-width="1.5"/>
  <polygon points="210,125 205,115 215,115" fill="black"/>
  <line x1="210" y1="125" x2="210" y2="140" stroke="black" stroke-width="1.5"/>
  
  <!-- Right vertical line -->
  <line x1="230" y1="20" x2="230" y2="140" stroke="black" stroke-width="1.5"/>
  
  <!-- Right side diode -->
  <polygon points="240,125 235,115 245,115" fill="black"/>
  <line x1="235" y1="115" x2="245" y2="115" stroke="black" stroke-width="1.5"/>
  <line x1="240" y1="20" x2="240" y2="115" stroke="black" stroke-width="1.5"/>
  <line x1="240" y1="125" x2="240" y2="140" stroke="black" stroke-width="1.5"/>
  <line x1="230" y1="20" x2="240" y2="20" stroke="black" stroke-width="1.5"/>
  <line x1="230" y1="140" x2="240" y2="140" stroke="black" stroke-width="1.5"/>
</svg>