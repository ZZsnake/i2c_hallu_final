<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Population Growth in Major Cities</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        #chart-container {
            width: 1000px; /* Adjusted width to match aspect ratio */
            height: 600px; /* Adjusted height */
            background-color: #fff;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>

    <script type="text/javascript">
        $(document).ready(function() {
            var myChart = echarts.init(document.getElementById('chart-container'));

            var option = {
                title: {
                    text: 'Population Growth in Major Cities (2015-2023)',
                    left: 'center',
                    top: '10px',
                    textStyle: {
                        fontSize: 16,
                        fontWeight: 'normal',
                        color: '#333'
                    }
                },
                grid: {
                    left: '8%', /* Adjusted to make space for y-axis label */
                    right: '3%',
                    bottom: '8%',
                    top: '18%', /* Adjusted to make space for title */
                    containLabel: false /* Set to false to allow custom positioning of axis labels */
                },
                xAxis: {
                    type: 'category',
                    data: ['2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022', '2023'],
                    axisTick: {
                        alignWithLabel: true
                    },
                    axisLine: {
                        lineStyle: {
                            color: '#ccc'
                        }
                    },
                    axisLabel: {
                        color: '#555'
                    },
                    splitLine: {
                        show: true,
                        lineStyle: {
                            color: '#eee',
                            type: 'solid'
                        }
                    }
                },
                yAxis: {
                    type: 'value',
                    name: 'Population (thousands)',
                    nameLocation: 'start', /* Position name at the top-left */
                    nameTextStyle: {
                        align: 'left',
                        verticalAlign: 'top',
                        lineHeight: 10, /* Adjust line height to move it closer to the top */
                        padding: [0, 0, 0, -50], /* Adjust padding to move it left */
                        color: '#333'
                    },
                    min: 0,
                    max: 2100,
                    interval: 300,
                    axisLine: {
                        lineStyle: {
                            color: '#ccc'
                        }
                    },
                    axisLabel: {
                        color: '#555'
                    },
                    splitLine: {
                        show: true,
                        lineStyle: {
                            color: '#eee'
                        }
                    }
                },
                series: [{
                    name: 'Population',
                    type: 'line',
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: 8,
                    itemStyle: {
                        color: '#d62728', /* Red line color */
                        borderColor: '#333', /* Darker border for markers */
                        borderWidth: 1
                    },
                    lineStyle: {
                        width: 2
                    },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                            offset: 0,
                            color: 'rgba(224, 242, 247, 0.8)' /* Light blue, slightly transparent */
                        }, {
                            offset: 1,
                            color: 'rgba(224, 242, 247, 0.1)' /* Lighter blue, more transparent */
                        }])
                    },
                    data: [850, 880, 910, 950, 1100, 1200, 1380, 1520, 1650], /* Estimated data points */
                    markLine: {
                        silent: true,
                        symbol: 'none',
                        lineStyle: {
                            type: 'dashed',
                            color: '#2ca02c', /* Green dashed line */
                            width: 1
                        },
                        data: [
                            { xAxis: '2017' },
                            { xAxis: '2019' },
                            { xAxis: '2021' }
                        ]
                    }
                }],
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                }
            };

            myChart.setOption(option);

            // Make chart responsive
            $(window).on('resize', function() {
                myChart.resize();
            });
        });
    </script>
</body>
</html>
