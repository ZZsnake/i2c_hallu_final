<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="600" height="500" fill="white" />

  <!-- Center Nucleus -->
  <g transform="translate(100, 240)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#4682B4" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#D22B2B" />
    
    <!-- Orbits (Arcs) -->
    <!-- Radii are proportional to n^2 in Bohr model, but here they are spaced for clarity -->
    <path d="M 70,-100 A 120 120 0 0 1 70,100" fill="none" stroke="#4682B4" stroke-width="1.5" /> <!-- n=1 -->
    <path d="M 130,-160 A 200 200 0 0 1 130,160" fill="none" stroke="#4682B4" stroke-width="1.5" /> <!-- n=2 -->
    <path d="M 190,-210 A 280 280 0 0 1 190,210" fill="none" stroke="#4682B4" stroke-width="1.5" /> <!-- n=3 -->
    <path d="M 250,-250 A 360 360 0 0 1 250,250" fill="none" stroke="#4682B4" stroke-width="1.5" /> <!-- n=4 -->
    <path d="M 310,-280 A 440 440 0 0 1 310,280" fill="none" stroke="#4682B4" stroke-width="1.5" /> <!-- n=5 -->
    <path d="M 370,-300 A 520 520 0 0 1 370,300" fill="none" stroke="#4682B4" stroke-width="1.5" /> <!-- n=6 -->

    <!-- Orbit Labels -->
    <text x="-85" y="230" font-size="14" font-style="italic">n = 4</text>
    <text x="-85" y="130" font-size="14" font-style="italic">n = 1</text>
    <text x="-85" y="60" font-size="14" font-style="italic">n = 2</text>
    <text x="-85" y="0" font-size="14" font-style="italic">n = 5</text>
    <text x="210" y="240" font-size="14" font-style="italic">n = 6</text>
    <text x="300" y="240" font-size="14" font-style="italic">n = 94 нм</text>
    <text x="300" y="-185" font-size="14" font-style="italic" transform="rotate(-35)">= 3</text>

    <!-- Lyman Series (Olive) - Transitions to n=1 -->
    <g stroke="#8B8B4B" stroke-width="1.5">
      <line x1="115" y1="-38" x2="68" y2="-22" /> <!-- n=2 to n=1 -->
      <line x1="170" y1="-55" x2="65" y2="-25" /> <!-- n=3 to n=1 -->
      <line x1="225" y1="-75" x2="62" y2="-28" /> <!-- n=4 to n=1 -->
      <line x1="280" y1="-95" x2="60" y2="-31" /> <!-- n=5 to n=1 -->
    </g>
    <g font-size="12" fill="#000">
      <text x="90" y="-45" transform="rotate(-25, 90, -45)">122 нм</text>
      <text x="130" y="-75" transform="rotate(-25, 130, -75)">103 нм</text>
      <text x="185" y="-105" transform="rotate(-25, 185, -105)">97 нм</text>
      <text x="250" y="-145" transform="rotate(-25, 250, -145)" fill="#8B8B4B" font-size="16">Серия</text>
      <text x="430" y="-190" fill="#A5A570" font-size="16">Серия</text>
      <text x="430" y="-170" fill="#A5A570" font-size="16">Бальмера</text>
    </g>

    <!-- Balmer Series (Black) - Transitions to n=2 -->
    <g stroke="black" stroke-width="1.5">
      <line x1="188" y1="5" x2="128" y2="5" /> <!-- n=3 to n=2 -->
      <line x1="248" y1="15" x2="128" y2="10" /> <!-- n=4 to n=2 -->
      <line x1="308" y1="30" x2="128" y2="15" /> <!-- n=5 to n=2 -->
      <line x1="368" y1="50" x2="128" y2="20" /> <!-- n=6 to n=2 -->
    </g>
    <g font-size="12" fill="#000">
      <text x="140" y="0">95 нм</text>
      <text x="200" y="10">486 нм</text>
      <text x="280" y="25">1282 нм</text>
      <text x="380" y="45">410 нм</text>
      <text x="460" y="30" font-size="14">434 нм</text>
      <text x="460" y="50" font-size="14">Лаймана</text>
    </g>

    <!-- Paschen Series (Maroon) - Transitions to n=3 -->
    <g stroke="#800020" stroke-width="1.5">
      <line x1="245" y1="85" x2="188" y2="70" /> <!-- n=4 to n=3 -->
      <line x1="305" y1="125" x2="185" y2="85" /> <!-- n=5 to n=3 -->
      <line x1="365" y1="190" x2="182" y2="100" /> <!-- n=6 to n=3 -->
    </g>
    <g font-size="12" fill="#000">
      <text x="200" y="80" transform="rotate(20, 200, 80)">1875 нм</text>
      <text x="260" y="125" transform="rotate(25, 260, 125)">656 нм</text>
      <text x="330" y="190" transform="rotate(30, 330, 190)">1094 нм</text>
      <text x="435" y="220" fill="#601020" font-size="16">Серия</text>
      <text x="435" y="240" fill="#601020" font-size="16">Пашена</text>
    </g>
  </g>
</svg>