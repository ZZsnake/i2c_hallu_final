<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relationships Between Math Concepts</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
        
        #chart-container {
            width: 100%;
            height: 750px;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <h1>Relationships Between Math Concepts</h1>
    <div id="chart-container"></div>
    
    <script>
        var chartDom = document.getElementById('chart-container');
        var myChart = echarts.init(chartDom);
        
        var option = {
            series: [
                {
                    type: 'graph',
                    layout: 'none',
                    symbolSize: 60,
                    roam: false,
                    label: {
                        show: true,
                        fontSize: 14,
                        color: '#000',
                        fontWeight: 500
                    },
                    edgeLabel: {
                        show: true,
                        fontSize: 12,
                        color: '#333',
                        formatter: '{c}'
                    },
                    data: [
                        {
                            name: 'Calculus',
                            x: 500,
                            y: 80,
                            itemStyle: {
                                color: '#5cb3a3',
                                borderColor: '#000',
                                borderWidth: 2
                            }
                        },
                        {
                            name: 'Algebra',
                            x: 200,
                            y: 350,
                            itemStyle: {
                                color: '#4a90e2',
                                borderColor: '#000',
                                borderWidth: 2
                            }
                        },
                        {
                            name: 'Functions',
                            x: 800,
                            y: 350,
                            itemStyle: {
                                color: '#e57373',
                                borderColor: '#000',
                                borderWidth: 2
                            }
                        },
                        {
                            name: 'Geometry',
                            x: 500,
                            y: 650,
                            itemStyle: {
                                color: '#f4a460',
                                borderColor: '#000',
                                borderWidth: 2
                            }
                        }
                    ],
                    links: [
                        {
                            source: 'Calculus',
                            target: 'Functions',
                            value: 'used in',
                            lineStyle: {
                                color: '#5cb3a3',
                                width: 2,
                                curveness: 0
                            }
                        },
                        {
                            source: 'Calculus',
                            target: 'Geometry',
                            value: 'applies to',
                            lineStyle: {
                                color: '#f4a460',
                                width: 2,
                                curveness: 0
                            }
                        },
                        {
                            source: 'Algebra',
                            target: 'Functions',
                            value: 'defines',
                            lineStyle: {
                                color: '#4a90e2',
                                width: 2,
                                curveness: 0.3
                            }
                        },
                        {
                            source: 'Algebra',
                            target: 'Geometry',
                            value: 'supports',
                            lineStyle: {
                                color: '#e57373',
                                width: 2,
                                curveness: 0
                            }
                        },
                        {
                            source: 'Functions',
                            target: 'Geometry',
                            value: 'models',
                            lineStyle: {
                                color: '#000',
                                width: 2,
                                curveness: 0
                            }
                        }
                    ],
                    lineStyle: {
                        opacity: 0.9,
                        curveness: 0
                    }
                }
            ]
        };
        
        myChart.setOption(option);
        
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
