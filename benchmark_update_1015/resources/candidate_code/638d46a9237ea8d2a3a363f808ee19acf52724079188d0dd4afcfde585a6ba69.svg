<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <!-- Background -->
  <rect width="1000" height="500" fill="white" />

  <!-- Style for text -->
  <style>
    .label { font-family: Arial, sans-serif; font-weight: bold; font-size: 42px; fill: #222; text-anchor: middle; }
    .edge { stroke: black; stroke-width: 5; stroke-linecap: round; fill: none; }
  </style>

  <!-- Shape 1: Octahedron (Labeled "Triangular prism") -->
  <g transform="translate(180, 200)">
    <!-- Faces -->
    <path d="M0,-150 L-150,0 L40,40 Z" fill="#56B4E9" stroke="black" stroke-width="5" />
    <path d="M0,-150 L150,-50 L40,40 Z" fill="#3498DB" stroke="black" stroke-width="5" />
    <path d="M-150,0 L0,130 L40,40 Z" fill="#2980B9" stroke="black" stroke-width="5" />
    <path d="M150,-50 L0,130 L40,40 Z" fill="#1F618D" stroke="black" stroke-width="5" />
    
    <!-- Sketchy overlapping lines -->
    <line x1="-10" y1="-160" x2="10" y2="-140" class="edge" />
    <line x1="-160" y1="10" x2="-140" y2="-10" class="edge" />
    <line x1="140" y1="-60" x2="160" y2="-40" class="edge" />
    <line x1="-10" y1="140" x2="10" y2="120" class="edge" />
    <line x1="30" y1="30" x2="50" y2="50" class="edge" />
    
    <text x="0" y="200" class="label">Triangular</text>
    <text x="0" y="245" class="label">prism</text>
  </g>

  <!-- Shape 2: Truncated Octahedron (Labeled "Rectangular cuboid") -->
  <g transform="translate(500, 200)">
    <!-- Faces (simplified representation) -->
    <path d="M-40,-130 L40,-130 L100,-60 L100,20 L40,90 L-40,90 L-100,20 L-100,-60 Z" fill="#3E8E41" stroke="black" stroke-width="5" />
    <path d="M-40,-130 L-80,-150 L-130,-80 L-100,-60 Z" fill="#2E6B31" stroke="black" stroke-width="5" />
    <path d="M40,-130 L80,-150 L130,-80 L100,-60 Z" fill="#2E6B31" stroke="black" stroke-width="5" />
    <path d="M-100,20 L-130,50 L-80,120 L-40,90 Z" fill="#2E6B31" stroke="black" stroke-width="5" />
    <path d="M100,20 L130,50 L80,120 L40,90 Z" fill="#2E6B31" stroke="black" stroke-width="5" />
    
    <!-- Top blue face -->
    <path d="M-80,-150 L80,-150 L40,-130 L-40,-130 Z" fill="#56B4E9" stroke="black" stroke-width="5" />
    
    <!-- Sketchy lines -->
    <line x1="-90" y1="-155" x2="-70" y2="-145" class="edge" />
    <line x1="70" y1="-155" x2="90" y2="-145" class="edge" />
    <line x1="-140" y1="-85" x2="-120" y2="-75" class="edge" />
    <line x1="120" y1="-85" x2="140" y2="-75" class="edge" />
    <line x1="-50" y1="100" x2="-30" y2="80" class="edge" />
    <line x1="30" y1="100" x2="50" y2="80" class="edge" />

    <text x="0" y="200" class="label">Rectangular</text>
    <text x="0" y="245" class="label">cuboid</text>
  </g>

  <!-- Shape 3: Icosahedron (Labeled "Pentagonal pyramid") -->
  <g transform="translate(820, 200)">
    <!-- Faces -->
    <path d="M0,-140 L-120,-40 L0,0 Z" fill="#56B4E9" stroke="black" stroke-width="5" />
    <path d="M0,-140 L120,-40 L0,0 Z" fill="#56B4E9" stroke="black" stroke-width="5" />
    <path d="M-120,-40 L-120,80 L0,0 Z" fill="#E41A1C" stroke="black" stroke-width="5" />
    <path d="M120,-40 L120,80 L0,0 Z" fill="#E41A1C" stroke="black" stroke-width="5" />
    <path d="M-120,80 L0,140 L0,0 Z" fill="#56B4E9" stroke="black" stroke-width="5" />
    <path d="M120,80 L0,140 L0,0 Z" fill="#56B4E9" stroke="black" stroke-width="5" />
    
    <!-- Inner triangles for icosahedron look -->
    <path d="M0,-140 L-60,-90 L60,-90 Z" fill="#E41A1C" stroke="black" stroke-width="4" />
    <path d="M0,140 L-60,90 L60,90 Z" fill="#E41A1C" stroke="black" stroke-width="4" />
    
    <!-- Sketchy lines -->
    <line x1="-10" y1="-150" x2="10" y2="-130" class="edge" />
    <line x1="-130" y1="-45" x2="-110" y2="-35" class="edge" />
    <line x1="110" y1="-45" x2="130" y2="-35" class="edge" />
    <line x1="-130" y1="85" x2="-110" y2="75" class="edge" />
    <line x1="110" y1="85" x2="130" y2="75" class="edge" />
    <line x1="-10" y1="150" x2="10" y2="130" class="edge" />
    <line x1="-10" y1="10" x2="10" y2="-10" class="edge" />

    <text x="0" y="200" class="label">Pentagonal</text>
    <text x="0" y="245" class="label">pyramid</text>
  </g>
</svg>