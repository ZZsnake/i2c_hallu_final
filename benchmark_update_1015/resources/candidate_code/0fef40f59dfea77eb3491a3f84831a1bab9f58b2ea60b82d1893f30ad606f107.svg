<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Main dashed boundary -->
  <path d="M50 50 L450 50 L470 350 L50 350 Z" fill="none" stroke="black" stroke-dasharray="5,5"/>
  
  <!-- Coastal Plains region -->
  <path d="M80 80 L200 80 L180 200 L80 200 Z" fill="#add8e6"/>
  <text x="130" y="100" font-family="Arial" font-size="12">Coastal Plains</text>
  
  <!-- Central Highlands region -->
  <path d="M200 80 L400 80 L380 220 L200 220 Z" fill="#ffa500"/>
  <text x="300" y="100" font-family="Arial" font-size="12">Central Highlands</text>
  
  <!-- Green Valley region -->
  <path d="M80 220 L400 220 L350 350 L80 350 Z" fill="#90ee90"/>
  <text x="220" y="250" font-family="Arial" font-size="12">Green Valley</text>
  
  <!-- Blue River dashed line -->
  <path d="M200 50 L250 350" fill="none" stroke="#0000ff" stroke-dasharray="5,5"/>
  <text x="255" y="200" font-family="Arial" font-size="12" transform="rotate(90 255,200)">Blue River</text>
  
  <!-- Red dots and labels -->
  <circle cx="180" cy="80" r="5" fill="red" stroke="black"/>
  <text x="185" y="75" font-family="Arial" font-size="10">Riverton</text>
  
  <circle cx="230" cy="100" r="5" fill="red" stroke="black"/>
  <text x="235" y="95" font-family="Arial" font-size="10">Hillport</text>
  
  <circle cx="250" cy="250" r="5" fill="red" stroke="black"/>
  <text x="255" y="245" font-family="Arial" font-size="10">Southgate</text>
</svg>