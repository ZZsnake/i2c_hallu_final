<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <title>Sector GDP Growth (US, 2000-2020)</title>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Axes -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="#000000" stroke-width="2" />
  <line x1="50" y1="350" x2="50" y2="50" stroke="#000000" stroke-width="2" />

  <!-- X-axis labels -->
  <text x="100" y="370" font-size="12">0</text>
  <text x="150" y="370" font-size="12">5</text>
  <text x="200" y="370" font-size="12">10</text>
  <text x="250" y="370" font-size="12">15</text>
  <text x="300" y="370" font-size="12">20</text>
  <text x="320" y="330" font-size="10">Cumulative GDP by sector</text>

  <!-- Y-axis labels -->
  <text x="20" y="300" font-size="12">8%</text>
  <text x="20" y="250" font-size="12">6%</text>
  <text x="20" y="200" font-size="12">4%</text>
  <text x="20" y="150" font-size="12">2%</text>
  <text x="20" y="100" font-size="12">0%</text>
  <text x="20" y="50" font-size="12">-2%</text>
  <text x="40" y="20" font-size="10">Average annual growth rate (%)</text>

  <!-- Grid lines -->
  <line x1="50" y1="300" x2="550" y2="300" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="50" y1="250" x2="550" y2="250" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="50" y1="200" x2="550" y2="200" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="50" y1="150" x2="550" y2="150" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="50" y1="100" x2="550" y2="100" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="5,5" />

  <!-- Bars -->
  <rect x="75" y="270" width="50" height="80" fill="#ADD8E6" /> <!-- Agriculture -->
  <text x="85" y="340" font-size="10">-1.1%</text>
  <text x="65" y="250" font-size="10">Agriculture</text>

  <rect x="175" y="290" width="50" height="60" fill="#ADD8E6" /> <!-- Manufacturing -->
  <text x="185" y="340" font-size="10">-0.8%</text>
  <text x="165" y="250" font-size="10">Manufacturing</text>

  <rect x="275" y="150" width="50" height="200" fill="#90EE90" /> <!-- Services -->
  <text x="285" y="340" font-size="10">+2.5%</text>
  <text x="265" y="250" font-size="10">Services</text>

  <rect x="375" y="50" width="50" height="300" fill="#4682B4" /> <!-- Technology -->
  <text x="385" y="340" font-size="10">+12.2%</text>
  <text x="365" y="250" font-size="10">Technology</text>

  <!-- Title -->
  <text x="250" y="30" font-size="16" font-weight="bold">Sector GDP Growth (US, 2000-2020)</text>

  <!-- Note -->
  <text x="200" y="80" font-size="12">Bar area shows sector GDP growth (inflation adjusted)</text>
</svg>