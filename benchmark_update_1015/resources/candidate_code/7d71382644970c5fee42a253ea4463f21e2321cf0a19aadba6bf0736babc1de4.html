<!DOCTYPE html>
<html>
<head>
  <title>Quadratic Function Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff;
    }

    .chart-container {
      width: 600px;
      height: 400px;
      margin: 20px auto;
      border: 1px solid #ccc;
      position: relative;
    }

    #mainChart {
      width: 100%;
      height: 100%;
    }

    .title {
      text-align: center;
      font-size: 16px;
      color: #007bff;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="title">Quadratic Function: y = x<sup>2</sup> - 5x + 6</div>
  <div class="chart-container">
    <div id="mainChart"></div>
  </div>

  <script>
    $(function() {
      var chartDom = document.getElementById('mainChart');
      var myChart = echarts.init(chartDom);
      var option = {
        title: {
          text: ''
        },
        tooltip: {
          trigger: 'axis',
          axisPointer: {
            type: 'cross'
          }
        },
        grid: {
          left: '10%',
          right: '10%',
          bottom: '10%',
          containLabel: true
        },
        xAxis: {
          type: 'value',
          min: -5,
          max: 7,
          axisLine: {
            lineStyle: {
              color: '#000'
            }
          },
          axisLabel: {
            color: '#000'
          }
        },
        yAxis: {
          type: 'value',
          min: 0,
          max: 25,
          axisLine: {
            lineStyle: {
              color: '#000'
            }
          },
          axisLabel: {
            color: '#000'
          }
        },
        series: [{
          type: 'line',
          data: [
            [-2, 20],
            [0, 6],
            [1, 2],
            [2, 0],
            [3, 0],
            [4, 2],
            [5, 6],
            [6, 12]
          ],
          itemStyle: {
            color: '#A52A2A'
          },
          symbol: 'circle',
          symbolSize: 5,
          lineStyle: {
            width: 2,
            color: '#A52A2A'
          }
        }]
      };

      myChart.setOption(option);
    });
  </script>
</body>
</html>
