<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600">
  <rect x="100" y="100" width="300" height="200" fill="lightblue" stroke="darkblue" stroke-dasharray="5" stroke-width="2" />
  <text x="150" y="150" font-size="30" fill="black">Force (F)</text>
  <text x="150" y="200" font-size="20" fill="black">F = m · a</text>
  <rect x="500" y="100" width="300" height="200" fill="yellow" stroke="darkorange" stroke-dasharray="5" stroke-width="2" />
  <text x="550" y="150" font-size="30" fill="black">Energy (E)</text>
  <text x="550" y="200" font-size="20" fill="black">E = F · d</text>
  <rect x="900" y="100" width="300" height="200" fill="lightgreen" stroke="darkgreen" stroke-dasharray="5" stroke-width="2" />
  <text x="950" y="150" font-size="30" fill="black">Power (P)</text>
  <text x="950" y="200" font-size="20" fill="black">P = E / t</text>
  <path d="M400,150 L500,150" stroke="green" stroke-width="3" />
  <path d="M800,150 L900,150" stroke="blue" stroke-width="3" />
  <rect x="50" y="450" width="1300" height="50" fill="beige" stroke="darkred" stroke-dasharray="5" stroke-width="2" />
  <text x="200" y="480" font-size="30" fill="darkred">Physics Flow: Force → Energy → Power</text>
</svg>