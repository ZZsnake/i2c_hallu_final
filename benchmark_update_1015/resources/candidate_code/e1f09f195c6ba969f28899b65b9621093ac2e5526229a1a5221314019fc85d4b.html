<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Function Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }
        .chart-container {
            width: 90%;
            max-width: 800px;
            height: 500px;
            position: relative;
        }
        .chart-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #000000;
        }
        .chart-container div {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <div id="quadraticChart"></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize the chart
            const chartDom = document.getElementById('quadraticChart');
            const myChart = echarts.init(chartDom);
            
            // Define the data points for the quadratic function y = x² - 2x + 3
            const data = [
                [-2, 11],
                [-1, 6],
                [0, 3],
                [1, 2],
                [2, 3],
                [3, 6],
                [4, 11]
            ];
            
            // Configure the chart
            const option = {
                title: {
                    text: 'Quadratic Function: y = x² - 2x + 3',
                    left: 'center',
                    textStyle: {
                        color: '#000000',
                        fontFamily: 'serif',
                        fontSize: 16
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                grid: {
                    left: '3%',
                    right: '2%',
                    bottom: '6%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: data.map(item => item[0]),
                    axisLine: {
                        lineStyle: {
                            color: '#000080'
                        }
                    },
                    axisLabel: {
                        color: '#202020',
                        fontSize: 12
                    }
                },
                yAxis: {
                    type: 'value',
                    name: 'y',
                    nameLocation: 'middle',
                    nameGap: 35,
                    nameRotate: 90,
                    nameTextStyle: {
                        color: '#000000',
                        fontWeight: 'bold',
                        fontSize: 14
                    },
                    axisLine: {
                        lineStyle: {
                            color: '#000080'
                        }
                    },
                    axisLabel: {
                        color: '#202020',
                        fontSize: 12
                    },
                    splitLine: {
                        lineStyle: {
                            type: 'dashed',
                            color: '#b0c4de'
                        }
                    }
                },
                series: [{
                    name: 'Quadratic Function',
                    type: 'line',
                    data: data.map(item => item[1]),
                    smooth: false,
                    itemStyle: {
                        color: '#ff5733',
                        borderColor: '#2f55d4',
                        borderWidth: 4
                    },
                    lineStyle: {
                        color: '#008080'
                    },
                    symbol: 'circle',
                    symbolSize: 16,
                    showSymbol: true,
                    label: {
                        show: true,
                        position: 'top',
                        formatter: '{c}',
                        color: '#000000',
                        fontWeight: 'bold',
                        fontSize: 12
                    }
                }]
            };
            
            // Set the chart options
            myChart.setOption(option);
            
            // Resize chart when window is resized
            window.addEventListener('resize', function() {
                myChart.resize();
            });
        });
    </script>
</body>
</html>
