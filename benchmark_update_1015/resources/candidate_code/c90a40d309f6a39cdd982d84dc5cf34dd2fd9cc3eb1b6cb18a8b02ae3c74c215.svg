<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" xmlns:xlink="http://www.w3.org/1999/xlink">
  <rect width="800" height="600" fill="#f0f8ff"/>
  <text x="400" y="30" font-size="20" text-anchor="middle" font-weight="bold">Motivating action on climate change</text>
  
  <text x="50" y="100" font-size="14" font-weight="bold">Setting goals</text>
  <rect x="100" y="90" width="50" height="20" fill="#006400"/>
  <text x="130" y="105" font-size="12" text-anchor="middle">Facts</text>
  
  <text x="50" y="150" font-size="14" font-weight="bold">Rewards:</text>
  <rect x="100" y="140" width="80" height="20" fill="#006400"/>
  <text x="140" y="155" font-size="12" text-anchor="middle">Re past acts</text>
  
  <text x="50" y="200" font-size="14" font-weight="bold">Feedback:</text>
  <rect x="100" y="190" width="150" height="20" fill="#006400"/>
  <text x="175" y="205" font-size="12" text-anchor="middle">Urging to action</text>
  
  <text x="50" y="250" font-size="14" font-weight="bold">Appeals:</text>
  <rect x="100" y="240" width="180" height="20" fill="#006400"/>
  <text x="190" y="255" font-size="12" text-anchor="middle">Education</text>
  
  <text x="50" y="300" font-size="14" font-weight="bold">0.5</text>
  <rect x="100" y="290" width="200" height="20" fill="#006400"/>
  <text x="200" y="305" font-size="12" text-anchor="middle">Money, savings incentives</text>
  
  <text x="50" y="350" font-size="14" font-weight="bold">Comparisons:</text>
  <rect x="100" y="340" width="250" height="20" fill="#006400"/>
  <text x="225" y="355" font-size="12" text-anchor="middle">Highlighting others' actions</text>
  
  <line x1="100" y1="50" x2="100" y2="400" stroke="#000"/>
  <line x1="150" y1="50" x2="150" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  <line x1="200" y1="50" x2="200" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  <line x1="250" y1="50" x2="250" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  <line x1="300" y1="50" x2="300" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  <line x1="350" y1="50" x2="350" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  <line x1="400" y1="50" x2="400" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  <line x1="450" y1="50" x2="450" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  <line x1="500" y1="50" x2="500" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  <line x1="550" y1="50" x2="550" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  <line x1="600" y1="50" x2="600" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  <line x1="650" y1="50" x2="650" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  <line x1="700" y1="50" x2="700" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  <line x1="750" y1="50" x2="750" y2="400" stroke="#000" stroke-dasharray="5,5"/>
  
  <text x="400" y="450" font-size="12" text-anchor="middle">Commitment</text>
  <text x="400" y="470" font-size="10" text-anchor="middle">More effective motivation</text>
  
  <text x="100" y="500" font-size="10" text-anchor="middle">0.4</text>
  <text x="150" y="500" font-size="10" text-anchor="middle">0.1</text>
  <text x="200" y="500" font-size="10" text-anchor="middle">0.2</text>
  <text x="250" y="500" font-size="10" text-anchor="middle">0.3</text>
  <text x="300" y="500" font-size="10" text-anchor="middle">0.4</text>
  <text x="350" y="500" font-size="10" text-anchor="middle">0.5</text>
  <text x="400" y="500" font-size="10" text-anchor="middle">0.6</text>
  <text x="450" y="500" font-size="10" text-anchor="middle">0.7</text>
  <text x="500" y="500" font-size="10" text-anchor="middle">0.8</text>
  <text x="550" y="500" font-size="10" text-anchor="middle">0.9</text>
  <text x="600" y="500" font-size="10" text-anchor="middle">1.0</text>
  <text x="650" y="500" font-size="10" text-anchor="middle">1.1</text>
  <text x="700" y="500" font-size="10" text-anchor="middle">1.2</text>
  <text x="750" y="500" font-size="10" text-anchor="middle">1.3</text>
  
  <text x="400" y="520" font-size="10" text-anchor="middle">Scale: "0.087" means 54% scored higher than average in control group; ... "0.370" means 64% scored higher than average in control group</text>
</svg>