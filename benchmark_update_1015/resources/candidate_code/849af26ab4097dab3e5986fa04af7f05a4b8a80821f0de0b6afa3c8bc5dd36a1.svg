<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Circle S0 -->
  <circle cx="200" cy="200" r="80" fill="white" stroke="#d4af37" stroke-width="2"/>
  <text x="200" y="180" font-family="Arial" font-size="16" text-anchor="middle">PREDICATE</text>
  <text x="200" y="220" font-family="Arial" font-size="16" text-anchor="middle">PROCESS</text>
  <text x="180" y="260" font-family="Arial" font-size="14" fill="#00d1ff">FALSE</text>
  
  <!-- Circle S1 -->
  <circle cx="600" cy="200" r="80" fill="white" stroke="#d4af37" stroke-width="2"/>
  <text x="600" y="180" font-family="Arial" font-size="16" text-anchor="middle">PROCESS</text>
  <text x="600" y="220" font-family="Arial" font-size="16" text-anchor="middle">PREDICATE</text>
  <text x="620" y="260" font-family="Arial" font-size="14" fill="#00d1ff">FALSE</text>
  
  <!-- Main arrows between S0 and S1 -->
  <path d="M280 200 Q400 100 520 200" fill="none" stroke="#a62cfa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="120" font-family="Arial" font-size="14" text-anchor="middle" fill="#a62cfa">TRUE</text>
  <text x="520" y="180" font-family="Arial" font-size="14" fill="#a62cfa">ENTRY</text>
  
  <path d="M520 200 Q400 300 280 200" fill="none" stroke="#a62cfa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#a62cfa">TRUE</text>
  <text x="280" y="220" font-family="Arial" font-size="14" fill="#a62cfa">EXIT</text>
  
  <!-- Self-loop arrows -->
  <path d="M120 200 Q80 160 120 120 Q160 160 120 200" fill="none" stroke="#00d1ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 200 Q720 160 680 120 Q640 160 680 200" fill="none" stroke="#00d1ff" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Labels T0 and T1 -->
  <text x="280" y="160" font-family="Arial" font-size="14" fill="#a62cfa">T0</text>
  <text x="520" y="240" font-family="Arial" font-size="14" fill="#a62cfa">T1</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L0 6 L9 3 z" fill="#a62cfa"/>
    </marker>
  </defs>
</svg>