<!DOCTYPE html>
<html style="height: 100%">
<head>
  <title>Monthly Event Attendance</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      height: 100%;
      margin: 0;
    }
    .chart-container {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    h1 {
      display: none;
      text-align: center;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <h1>Monthly Event Attendance</h1>
  <div id="mainChart" class="chart-container"></div>

  <script>
    $(function() {
      var chartDom = document.getElementById('mainChart');
      var myChart = echarts.init(chartDom);
      var option = {
        title: {
          text: 'Monthly Event Attendance',
          left: 'center',
          textStyle: {
            color: '#222',
            fontFamily: 'Segoe UI, Arial, sans-serif',
            fontWeight: 'bold',
            fontSize: 22
          }
        },
        xAxis: {
          type: 'category',
          data: ['Conference', 'Expo', 'Webinar', 'Hackathon', 'Meetup', 'Panel', 'Workshop', 'Networking', 'Seminar'],
          axisLabel: {
            interval: 0,
            rotate: 25,
            fontWeight: 'bold'
          },
          axisLine: {
            lineStyle: {
              color: '#444',
              width: 2
            }
          }
        },
        yAxis: {
      axisLabel: {
        fontWeight: 'bold'
      },
          type: 'value',
          axisLine: {
            lineStyle: {
              color: '#444',
              width: 2
            }
          }
        },
        series: [{
          data: [230, 210, 195, 175, 150, 140, 120, 110, 85],
          type: 'bar',
          barWidth: '55%',
          itemStyle: {
            color: '#3366cc',
            borderColor: '#333333',
            borderWidth: 1
          }
        }],
        grid: {
          top: 60,
          left: 50,
          right: 30,
          bottom: 60
        }
      };
      myChart.setOption(option);
      window.addEventListener('resize', myChart.resize);
    });
  </script>
</body>
</html>
