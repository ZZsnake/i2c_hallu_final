  <line x1="120" y1="495" x2="1150" y2="495" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="120" y1="390" x2="1150" y2="390" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="120" y1="285" x2="1150" y2="285" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="120" y1="180" x2="1150" y2="180" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Y-axis labels -->
