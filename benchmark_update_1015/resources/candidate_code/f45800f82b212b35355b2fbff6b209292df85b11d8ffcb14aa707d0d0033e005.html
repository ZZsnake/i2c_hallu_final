<!DOCTYPE html>
<html>
<head>
    <title>Office Supplies Distribution</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        #chart-container {
            width: 600px;
            height: 600px;
            margin: 0 auto;
        }
        
        .legend {
            position: absolute;
            left: 40px;
            top: 45%;
            transform: translateY(-50%);
            font-size: 14px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background-color: #1f77b4;"></div>
            <span>Notebooks</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #2ca02c;"></div>
            <span>Pens</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #ff7f0e;"></div>
            <span>Folders</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #9467bd;"></div>
            <span>Staplers</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #eeca3b;"></div>
            <span>Markers</span>
        </div>
    </div>

    <script>
        $(function() {
            var chart = echarts.init(document.getElementById('chart-container'));
            
            var option = {
                title: {
                    text: 'Distribution of Office Supplies Usage',
                    subtext: 'Sample Data',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'item'
                },
                series: [
                    {
                        type: 'pie',
                        radius: ['40%', '70%'],
                        avoidLabelOverlap: false,
                        label: {
                            show: true,
                            position: 'inside',
                            formatter: '{d}%'
                        },
                        data: [
                            {value: 35, name: 'Notebooks', itemStyle: {color: '#1f77b4'}},
                            {value: 25, name: 'Pens', itemStyle: {color: '#2ca02c'}},
                            {value: 20, name: 'Folders', itemStyle: {color: '#ff7f0e'}},
                            {value: 15, name: 'Staplers', itemStyle: {color: '#9467bd'}},
                            {value: 5, name: 'Markers', itemStyle: {color: '#eeca3b'}}
                        ],
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                            }
                        }
                    }
                ]
            };
            
            chart.setOption(option);
        });
    </script>
</body>
</html>
