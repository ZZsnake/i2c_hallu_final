<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarterly GDP Growth Rate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #chart {
            width: 80%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            var chart = echarts.init(document.getElementById('chart'));
            var option = {
                title: {
                    text: 'Quarterly GDP Growth Rate',
                    textStyle: {
                        fontFamily: 'serif',
                        fontWeight: 'bold'
                    },
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis'
                },
                xAxis: {
                    type: 'category',
                    data: ['Q1', 'Q2', 'Q3', 'Q4'],
                    name: 'Quarter',
                    nameLocation: 'end',
                    nameGap: 15,
                    nameTextStyle: {
                        color: '#1f2937',
                        fontWeight: 'bold'
                    },
                    axisLine: {
                        show: true,
                        lineStyle: {
                            color: '#1f2937',
                            width: 3
                        }
                    }
                },
                yAxis: {
                    type: 'value',
                    name: 'GDP Growth (%)',
                    nameTextStyle: {
                        color: '#1E2336',
                        fontWeight: 'bold'
                    },
                    min: 0,
                    max: 3.5,
                    interval: 0.5
                },
                series: [{
                    name: 'GDP Growth',
                    type: 'line',
                    data: [2.6, 3.1, 2.4, 2.9],
                    symbol: 'circle',
                    symbolSize: 12,
                    itemStyle: {
                        color: '#dc3545',
                        borderColor: '#1f2937',
                        borderWidth: 2
                    },
                    label: {
                        show: true,
                        position: 'top',
                        formatter: '{c}%',
                        color: '#1f2937',
                        fontWeight: 'bold'
                    },
                grid: {
                    left: '10%',
                    right: '8%',
                    top: 70,
                    bottom: 60
                },                    lineStyle: {
                        color: '#1565c0',
                        width: 5
                    }
                }]
            };
            chart.setOption(option);
        });
    </script>
</body>
</html>
