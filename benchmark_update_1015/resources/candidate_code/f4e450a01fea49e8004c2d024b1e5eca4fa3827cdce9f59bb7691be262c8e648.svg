<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 2000" width="3000" height="2000">
  <rect x="0" y="0" width="3000" height="2000" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="1500" y="220" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#212161" text-anchor="middle" letter-spacing="3px">UK Inflation Rate (Consumer Price Index)</text>
  <text x="1500" y="320" font-family="Arial, sans-serif" font-size="20" fill="#1A1A1A" text-anchor="middle">Jan 2015 – Dec 2021</text>

  <!-- Chart Area Dimensions -->
  <g transform="translate(300, 300)">
    <rect x="0" y="0" width="2400" height="1500" fill="none"/>

    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="1500" stroke="#212161" stroke-width="8"/>
    <text x="-80" y="1500" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="end" alignment-baseline="middle">0%</text>
    <text x="-80" y="1260" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="end" alignment-baseline="middle">2%</text>
    <text x="-80" y="1020" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="end" alignment-baseline="middle">4%</text>
    <text x="-80" y="780" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="end" alignment-baseline="middle">6%</text>
    <text x="-80" y="540" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="end" alignment-baseline="middle">8%</text>
    <text x="-80" y="300" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="end" alignment-baseline="middle">10%</text>

    <!-- X-axis -->
    <line x1="0" y1="1500" x2="2400" y2="1500" stroke="#212161" stroke-width="8"/>
    <text x="200" y="1570" font-family="Arial, sans-serif" font-size="16" fill="#1A1A1A" text-anchor="middle" letter-spacing="4px">2015</text>
    <text x="550" y="1570" font-family="Arial, sans-serif" font-size="16" fill="#1A1A1A" text-anchor="middle" letter-spacing="4px">2016</text>
    <text x="900" y="1570" font-family="Arial, sans-serif" font-size="16" fill="#1A1A1A" text-anchor="middle" letter-spacing="4px">2017</text>
    <text x="1250" y="1570" font-family="Arial, sans-serif" font-size="16" fill="#1A1A1A" text-anchor="middle" letter-spacing="4px">2018</text>
    <text x="1600" y="1570" font-family="Arial, sans-serif" font-size="16" fill="#1A1A1A" text-anchor="middle" letter-spacing="4px">2019</text>
    <text x="1950" y="1570" font-family="Arial, sans-serif" font-size="16" fill="#1A1A1A" text-anchor="middle" letter-spacing="4px">2020</text>
    <text x="2300" y="1570" font-family="Arial, sans-serif" font-size="16" fill="#1A1A1A" text-anchor="middle" letter-spacing="4px">2021</text>

    <!-- Grid Lines (Y-axis) -->
    <line x1="0" y1="1260" x2="2400" y2="1260" stroke="#CCCCCC" stroke-dasharray="5,5"/>
    <line x1="0" y1="1020" x2="2400" y2="1020" stroke="#CCCCCC" stroke-dasharray="5,5"/>
    <line x1="0" y1="780" x2="2400" y2="780" stroke="#CCCCCC" stroke-dasharray="5,5"/>
    <line x1="0" y1="540" x2="2400" y2="540" stroke="#CCCCCC" stroke-dasharray="5,5"/>
    <line x1="0" y1="300" x2="2400" y2="300" stroke="#CCCCCC" stroke-dasharray="5,5"/>

    <!-- Data Points (Y-scale matched to reference axis positions) -->
    <path d="M200 1330 L550 1220 L900 1060 L1250 880 L1600 950 L1950 680 L2300 440"
          fill="none" stroke="#D92121" stroke-width="3" stroke-dasharray="8 4"/>

    <!-- Markers and Labels -->
    <circle cx="200" cy="1330" r="6" fill="#D92121" stroke="#212161" stroke-width="2"/>
    <text x="200" y="1330" dy="-45" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="middle">2.1%</text>

    <circle cx="550" cy="1220" r="6" fill="#D92121" stroke="#212161" stroke-width="2"/>
    <text x="550" y="1220" dy="-45" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="middle">3.3%</text>

    <circle cx="900" cy="1060" r="6" fill="#D92121" stroke="#212161" stroke-width="2"/>
    <text x="900" y="1060" dy="-45" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="middle">4.8%</text>

    <circle cx="1250" cy="880" r="6" fill="#D92121" stroke="#212161" stroke-width="2"/>
    <text x="1250" y="880" dy="-45" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="middle">6.7%</text>

    <circle cx="1600" cy="950" r="6" fill="#D92121" stroke="#212161" stroke-width="2"/>
    <text x="1600" y="950" dy="-45" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="middle">6.0%</text>

    <circle cx="1950" cy="680" r="6" fill="#D92121" stroke="#212161" stroke-width="2"/>
    <text x="1950" y="680" dy="-45" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="middle">8.9%</text>

    <circle cx="2300" cy="440" r="6" fill="#D92121" stroke="#212161" stroke-width="2"/>
    <text x="2300" y="440" dy="-45" font-family="Arial, sans-serif" font-size="16" fill="#212161" text-anchor="middle">11.2%</text>
  </g>

  <!-- Source -->
  <text x="1500" y="1960" font-family="Arial, sans-serif" font-size="16" fill="#1A1A1A" text-anchor="middle">Source: Office for National Statistics (ONS)</text>
</svg>