<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarterly GDP Growth Rate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #chart {
            width: 80%;
            height: 600px;
        }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            var chart = echarts.init(document.getElementById('chart'));
            var option = {
                title: {
                    text: 'Quarterly GDP Growth Rate',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis'
                },
                xAxis: {
                    type: 'category',
                    data: ['Q1', 'Q2', 'Q3', 'Q4']
                },
                yAxis: {
                    type: 'value',
                    name: 'GDP Growth (%)',
                    min: 0,
                    max: 3.5,
                    interval: 0.5
                },
                series: [{
                    name: 'GDP Growth',
                    type: 'line',
                    data: [2.6, 3.1, 2.4, 2.9],
                    lineStyle: {
                        color: '#007bff'
                    },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            {offset: 0, color: 'rgba(0, 123, 255, 0.1)'},
                            {offset: 1, color: 'rgba(0, 123, 255, 0)'}
                        ])
                    }
                }]
            };
            chart.setOption(option);
        });
    </script>
</body>
</html>
