<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 751 756">
  <!-- Background -->
  <rect width="751" height="756" fill="#C5F5F5"/>
  
  <!-- Top face of cube -->
  <polygon points="100,110 375,175 650,110 375,60" fill="none" stroke="none"/>
  
  <!-- Top face triangles (pinwheel pattern) -->
  <polygon points="375,60 100,110 375,175" fill="#FFFF00"/>
  <polygon points="375,60 375,175 650,110" fill="#FF0000"/>
  <polygon points="375,175 650,110 525,60" fill="#FFFF00"/>
  <polygon points="375,175 525,60 375,60" fill="#FF0000"/>
  <polygon points="375,60 312,85 375,175" fill="#FFFF00"/>
  <polygon points="375,60 375,175 437,85" fill="#FF0000"/>
  
  <!-- Redraw top face with correct pinwheel -->
  <polygon points="375,175 100,110 237,60 375,60" fill="#FFFF00"/>
  <polygon points="375,175 237,60 375,60" fill="#FF0000"/>
  <polygon points="375,175 375,60 512,60 650,110" fill="#FFFF00"/>
  <polygon points="375,175 512,60 375,60" fill="#FF0000"/>
  
  <!-- Left face of cube -->
  <polygon points="100,110 100,510 237,585 237,185" fill="none"/>
  
  <!-- Left face triangles (pinwheel pattern) -->
  <polygon points="100,110 237,185 168,297" fill="#B8B800"/>
  <polygon points="100,110 168,297 100,510" fill="#8B0000"/>
  <polygon points="100,510 168,297 237,585" fill="#B8B800"/>
  <polygon points="237,585 168,297 237,185" fill="#8B0000"/>
  
  <!-- Right face of cube -->
  <polygon points="237,185 650,110 650,510 237,585" fill="none"/>
  
  <!-- Right face triangles (pinwheel pattern) -->
  <polygon points="443,347 237,185 650,110" fill="#B8B800"/>
  <polygon points="443,347 650,110 650,510" fill="#8B0000"/>
  <polygon points="443,347 650,510 237,585" fill="#B8B800"/>
  <polygon points="443,347 237,585 237,185" fill="#8B0000"/>
  
  <!-- Bottom face edges -->
  <polygon points="100,510 237,585 650,510 237,690" fill="none"/>
  <line x1="100" y1="510" x2="237" y2="690" stroke="#000" stroke-width="1"/>
  <line x1="237" y1="690" x2="650" y2="510" stroke="#000" stroke-width="1"/>
  
  <!-- Signature -->
  <text x="707" y="738" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#00008B">RK</text>
</svg>