<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   version="1.0"
   width="658.23999"
   height="516.38599"
   id="svg1354">
  <defs id="defs1357" />
  <!-- Triangle connecting three points -->
  <path
     d="M 577.44443,257.29047 L 420.46263,462.81566 L 83.006798,257.40682 Z"
     style="fill:none;stroke:#b8001c;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:miter;stroke-dasharray:12,6;stroke-opacity:1"
     id="triangle_main" />
  <!-- X-axis -->
  <path
     d="M 22.354539,257.41912 L 642.33377,257.41912"
     style="fill:none;stroke:#222222;stroke-width:2.5;stroke-linecap:square;stroke-opacity:1;stroke-dasharray:6,4"
     id="x_axis" />
  <!-- Y-axis -->
  <path
     d="M 332.11657,473.25267 L 332.11657,39.985569"
     style="fill:none;stroke:#222222;stroke-width:2.5;stroke-linecap:square;stroke-opacity:1;stroke-dasharray:6,4"
     id="y_axis" />
  <!-- Parabola opening upwards -->
  <path
     d="M 83.006798,257.40682 Q 332,80 577.44443,257.29047"
     style="fill:none;stroke:#105800;stroke-width:2.3;stroke-linecap:round;stroke-dasharray:8,3;stroke-opacity:1"
     id="parabola" />
  <!-- Circle at A (left vertex) -->
  <ellipse
     cx="83"
     cy="257"
     rx="13"
     ry="13"
     style="fill:#004aad;stroke:#222222;stroke-width:2"
     id="point_A" />
  <!-- Circle at B (right vertex) -->
  <ellipse
     cx="577"
     cy="257"
     rx="13"
     ry="13"
     style="fill:#004aad;stroke:#222222;stroke-width:2"
     id="point_B" />
  <!-- Circle at C (top vertex) -->
  <ellipse
     cx="420"
     cy="462"
     rx="13"
     ry="13"
     style="fill:#004aad;stroke:#222222;stroke-width:2"
     id="point_C" />
  <!-- Arc (ellipse) representing a conic section -->
  <ellipse
     cx="332"
     cy="258.44312"
     rx="310"
     ry="216"
     style="fill:none;stroke:#005e28;stroke-width:4;stroke-dasharray:14,6;stroke-opacity:1"
     id="ellipse_conic" />
  <!-- Labels for vertices -->
  <text x="65" y="245" font-family="Roboto,Arial" font-size="24" fill="#1a1a1a" font-weight="bold">A</text>
  <text x="588" y="245" font-family="Roboto,Arial" font-size="24" fill="#1a1a1a" font-weight="bold">B</text>
  <text x="426" y="480" font-family="Roboto,Arial" font-size="24" fill="#1a1a1a" font-weight="bold">C</text>
  <!-- Axes labels -->
  <text x="640" y="272" font-family="Roboto,Arial" font-size="20" fill="#1a1a1a">x</text>
  <text x="344" y="54" font-family="Roboto,Arial" font-size="20" fill="#1a1a1a">y</text>
  <!-- Equation annotation (e.g., parabola equation) -->
  <text x="350" y="140" font-family="Roboto,Arial" font-size="22" fill="#b8001c" font-weight="bold">y = ax² + bx + c</text>
  <!-- Distance marker between A and B -->
  <path
     d="M 96,257 L 564,257"
     style="fill:none;stroke:#b8001c;stroke-width:2;stroke-dasharray:5,3;stroke-opacity:1"
     id="distance_AB" />
  <text x="320" y="240" font-family="Roboto,Arial" font-size="18" fill="#b8001c">|AB|</text>
  <!-- Example midpoint marker -->
  <circle cx="332" cy="257" r="7" style="fill:#ffa500;stroke:#222222;stroke-width:1.5" id="midpoint_AB" />
  <text x="340" y="250" font-family="Roboto,Arial" font-size="17" fill="#ffa500">M</text>
</svg>