<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650">
  <!-- Background -->
  <rect width="800" height="650" fill="white"/>
  
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
    </pattern>
  </defs>
  
  <!-- Vertical grid lines -->
  <line x1="140" y1="80" x2="140" y2="500" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="240" y1="80" x2="240" y2="500" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="340" y1="80" x2="340" y2="500" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="440" y1="80" x2="440" y2="500" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="540" y1="80" x2="540" y2="500" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="640" y1="80" x2="640" y2="500" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Horizontal grid lines -->
  <line x1="40" y1="500" x2="720" y2="500" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="416" x2="720" y2="416" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="332" x2="720" y2="332" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="248" x2="720" y2="248" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="164" x2="720" y2="164" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="80" x2="720" y2="80" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Axes -->
  <line x1="40" y1="500" x2="720" y2="500" stroke="#000080" stroke-width="2"/>
  <line x1="40" y1="500" x2="40" y2="80" stroke="#000080" stroke-width="2"/>
  
  <!-- Trend line -->
  <line x1="60" y1="485" x2="680" y2="85" stroke="#E07060" stroke-width="2"/>
  
  <!-- Data points -->
  <!-- Retail -->
  <circle cx="90" cy="458" r="12" fill="#6B2C91"/>
  <text x="95" y="475" font-family="monospace" font-size="11" fill="#333">Retail</text>
  
  <!-- Manufacturing -->
  <circle cx="140" cy="416" r="14" fill="#2E75B6"/>
  <text x="160" y="425" font-family="monospace" font-size="11" fill="#333">Manufacturing</text>
  
  <!-- Agriculture -->
  <circle cx="190" cy="374" r="16" fill="#70AD47"/>
  <text x="145" y="360" font-family="monospace" font-size="11" fill="#333">Agriculture</text>
  
  <!-- Transport -->
  <circle cx="240" cy="332" r="14" fill="#ED7D31"/>
  <text x="190" y="320" font-family="monospace" font-size="11" fill="#333">Transport</text>
  
  <!-- Healthcare -->
  <circle cx="290" cy="290" r="15" fill="#C55A5A"/>
  <text x="310" y="275" font-family="monospace" font-size="11" fill="#333">Healthcare</text>
  
  <!-- Technology -->
  <circle cx="340" cy="248" r="14" fill="#7F7F7F"/>
  <text x="360" y="265" font-family="monospace" font-size="11" fill="#333">Technology</text>
  
  <!-- Finance -->
  <circle cx="390" cy="206" r="16" fill="#4BACC6"/>
  <text x="410" y="195" font-family="monospace" font-size="11" fill="#333">Finance</text>
  
  <!-- Energy -->
  <circle cx="440" cy="122" r="17" fill="#F4A460"/>
  <text x="460" y="115" font-family="monospace" font-size="11" fill="#333">Energy</text>
  
  <!-- Services -->
  <circle cx="640" cy="90" r="24" fill="#8B1A7A"/>
  <text x="670" y="95" font-family="monospace" font-size="11" fill="#333">Services</text>
  
  <!-- X-axis labels -->
  <text x="40" y="520" font-family="monospace" font-size="12" fill="#333">0</text>
  <text x="130" y="520" font-family="monospace" font-size="12" fill="#333">100</text>
  <text x="230" y="520" font-family="monospace" font-size="12" fill="#333">200</text>
  <text x="330" y="520" font-family="monospace" font-size="12" fill="#333">300</text>
  <text x="430" y="520" font-family="monospace" font-size="12" fill="#333">400</text>
  <text x="530" y="520" font-family="monospace" font-size="12" fill="#333">500</text>
  
  <!-- Y-axis labels -->
  <text x="25" y="505" font-family="monospace" font-size="12" fill="#333" text-anchor="end">0</text>
  <text x="25" y="420" font-family="monospace" font-size="12" fill="#333" text-anchor="end">100</text>
  <text x="25" y="336" font-family="monospace" font-size="12" fill="#333" text-anchor="end">200</text>
  <text x="25" y="252" font-family="monospace" font-size="12" fill="#333" text-anchor="end">300</text>
  <text x="25" y="168" font-family="monospace" font-size="12" fill="#333" text-anchor="end">400</text>
  <text x="25" y="84" font-family="monospace" font-size="12" fill="#333" text-anchor="end">500</text>
  
  <!-- Axis titles -->
  <text x="380" y="550" font-family="monospace" font-size="14" fill="#333" text-anchor="middle">Market Supply (units)</text>
  <text x="20" y="290" font-family="monospace" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 20 290)">Market Demand (units)</text>
  
  <!-- Legend -->
  <rect x="735" y="90" width="10" height="10" fill="#8B1A7A"/>
  <text x="750" y="99" font-family="monospace" font-size="10" fill="#333">Services</text>
  
  <rect x="735" y="105" width="10" height="10" fill="#2E75B6"/>
  <text x="750" y="114" font-family="monospace" font-size="10" fill="#333">Industry</text>
  
  <rect x="735" y="120" width="10" height="10" fill="#70AD47"/>
  <text x="750" y="129" font-family="monospace" font-size="10" fill="#333">Agriculture</text>
  
  <rect x="735" y="135" width="10" height="10" fill="#ED7D31"/>
  <text x="750" y="144" font-family="monospace" font-size="10" fill="#333">Transport</text>
  
  <rect x="735" y="150" width="10" height="10" fill="#C55A5A"/>
  <text x="750" y="159" font-family="monospace" font-size="10" fill="#333">Healthcare</text>
  
  <rect x="735" y="165" width="10" height="10" fill="#7F7F7F"/>
  <text x="750" y="174" font-family="monospace" font-size="10" fill="#333">Technology</text>
  
  <rect x="735" y="180" width="10" height="10" fill="#4BACC6"/>
  <text x="750" y="189" font-family="monospace" font-size="10" fill="#333">Finance</text>
  
  <rect x="735" y="195" width="10" height="10" fill="#F4A460"/>
  <text x="750" y="204" font-family="monospace" font-size="10" fill="#333">Energy</text>
  
  <rect x="735" y="210" width="10" height="10" fill="#6B2C91"/>
  <text x="750" y="219" font-family="monospace" font-size="10" fill="#333">Real Estate</text>
  
  <!-- Source text -->
  <text x="25" y="590" font-family="monospace" font-size="11" fill="#999">Source: Hypothetical Economics Dataset, Market Sectors</text>
  <text x="760" y="590" font-family="monospace" font-size="11" fill="#999" text-anchor="end">CC BY</text>
</svg>