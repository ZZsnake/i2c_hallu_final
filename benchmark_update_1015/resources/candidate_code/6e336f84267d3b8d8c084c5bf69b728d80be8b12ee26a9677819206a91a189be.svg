<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Backgrounds -->
  <rect x="0" y="0" width="600" height="150" fill="white" />
  <rect x="0" y="150" width="600" height="250" fill="#fce4c4" />

  <!-- Interface Line -->
  <line x1="0" y1="150" x2="600" y2="150" stroke="#d2b48c" stroke-width="1" />

  <!-- Labels for media -->
  <text x="30" y="135" font-family="Arial, sans-serif" font-size="18" fill="black">n<tspan baseline-shift="sub" font-size="12">2</tspan></text>
  <text x="30" y="185" font-family="Arial, sans-serif" font-size="18" fill="black">n<tspan baseline-shift="sub" font-size="12">1</tspan></text>

  <!-- Normals -->
  <g stroke="#87ceeb" stroke-width="1.5" stroke-dasharray="5,3">
    <line x1="90" y1="35" x2="90" y2="280" />
    <line x1="180" y1="50" x2="180" y2="280" />
    <line x1="300" y1="50" x2="300" y2="280" />
    <line x1="480" y1="50" x2="480" y2="280" />
  </g>

  <!-- Light Source -->
  <circle cx="90" cy="340" r="4" fill="#555" />

  <!-- Ray 1: Normal Incidence -->
  <g stroke="#ffff00" stroke-width="2">
    <line x1="90" y1="340" x2="90" y2="35" />
    <!-- Arrowheads -->
    <path d="M 85 240 L 90 230 L 95 240" fill="none" />
    <path d="M 85 100 L 90 90 L 95 100" fill="none" />
  </g>

  <!-- Ray 2: Refraction -->
  <g stroke="#ffff00" stroke-width="2">
    <line x1="90" y1="340" x2="180" y2="150" />
    <line x1="180" y1="150" x2="290" y2="40" />
    <!-- Reflected part (faint) -->
    <line x1="180" y1="150" x2="270" y2="340" stroke-opacity="0.3" />
    <!-- Arrowheads -->
    <path d="M 130 265 L 140 255 L 145 265" fill="none" transform="rotate(-25, 135, 260)" />
    <path d="M 230 110 L 240 100 L 245 110" fill="none" transform="rotate(-5, 235, 105)" />
  </g>

  <!-- Ray 3: Critical Angle -->
  <g stroke="#ffff00" stroke-width="2">
    <line x1="90" y1="340" x2="300" y2="150" />
    <line x1="300" y1="150" x2="450" y2="150" />
    <!-- Reflected part (faint) -->
    <line x1="300" y1="150" x2="510" y2="340" stroke-opacity="0.3" />
    <!-- Arrowheads -->
    <path d="M 190 260 L 200 250 L 205 260" fill="none" transform="rotate(-45, 195, 255)" />
    <path d="M 370 145 L 380 150 L 370 155" fill="none" />
  </g>

  <!-- Ray 4: Total Internal Reflection -->
  <g stroke="#ffff00" stroke-width="2">
    <line x1="90" y1="340" x2="480" y2="150" />
    <line x1="480" y1="150" x2="560" y2="190" />
    <!-- Arrowheads -->
    <path d="M 280 255 L 290 245 L 295 255" fill="none" transform="rotate(-65, 285, 250)" />
    <path d="M 515 165 L 525 172 L 518 180" fill="none" />
  </g>

  <!-- Angle Arcs and Labels -->
  <g fill="none" stroke="#555" stroke-width="1">
    <!-- theta 1 -->
    <path d="M 180 210 A 60 60 0 0 1 152 218" />
    <text x="152" y="235" font-family="Arial, sans-serif" font-size="16" fill="black" stroke="none">θ<tspan baseline-shift="sub" font-size="10">1</tspan></text>
    
    <!-- theta 2 -->
    <path d="M 180 100 A 50 50 0 0 1 215 115" />
    <text x="190" y="90" font-family="Arial, sans-serif" font-size="16" fill="black" stroke="none">θ<tspan baseline-shift="sub" font-size="10">2</tspan></text>

    <!-- theta c -->
    <path d="M 300 210 A 60 60 0 0 1 255 230" />
    <text x="265" y="215" font-family="Arial, sans-serif" font-size="16" fill="black" stroke="none">θ<tspan baseline-shift="sub" font-size="10">c</tspan></text>

    <!-- 90 degrees -->
    <path d="M 300 110 A 40 40 0 0 1 340 150" />
    <text x="320" y="115" font-family="Arial, sans-serif" font-size="16" fill="black" stroke="none">90 °</text>
  </g>

  <!-- Text Label -->
  <text x="430" y="140" font-family="Arial, sans-serif" font-size="14" fill="black">total reflection</text>
</svg>