<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytical Geometry: Circle and Tangent Line</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #chart-container {
            width: 90vw;
            height: 90vh;
            max-width: 1000px;
            max-height: 1000px;
        }
        .title-container {
            position: absolute;
            top: 20px;
            text-align: center;
            width: 100%;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="title-container">
    <div class="title">Analytical Geometry: Circle and Tangent Line</div>
</div>

<div id="chart-container"></div>

<script>
    $(document).ready(function() {
        var chartDom = document.getElementById('chart-container');
        var myChart = echarts.init(chartDom);

        // Generate data for the circle r = 4
        var circleData = [];
        for (var i = 0; i <= 360; i += 5) {
            circleData.push([4, i]);
        }

        // Generate data for the tangent line x = 2
        // In polar: r = 2 / cos(theta)
        // We plot from -60 to 60 degrees to match the visual extent
        var tangentData = [];
        for (var i = -60; i <= 60; i += 2) {
            var rad = i * Math.PI / 180;
            var r = 2 / Math.cos(rad);
            // ECharts polar uses [radius, angle_in_degrees]
            // We adjust the angle to be in the 0-360 range for consistency
            var displayAngle = (i + 360) % 360;
            tangentData.push([r, displayAngle]);
        }

        var option = {
            legend: {
                data: [
                    { name: 'Circle: r = 4', icon: 'circle' },
                    { name: 'Tangent Line', icon: 'path://M0,5 L10,5 M7,2 L10,5 L7,8' }
                ],
                top: 50,
                itemGap: 20,
                textStyle: {
                    fontSize: 12
                }
            },
            polar: {
                center: ['50%', '55%'],
                radius: '80%'
            },
            angleAxis: {
                type: 'value',
                startAngle: 0,
                min: 0,
                max: 360,
                interval: 30,
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: '#ddd',
                        type: 'solid'
                    }
                },
                axisLabel: {
                    formatter: '{value}',
                    fontSize: 10,
                    color: '#333'
                },
                axisLine: { show: false },
                axisTick: { show: true }
            },
            radiusAxis: {
                type: 'value',
                min: 0,
                max: 4,
                interval: 1,
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: '#ddd'
                    }
                },
                axisLabel: {
                    fontSize: 10,
                    color: '#333',
                    margin: 2
                },
                axisLine: { show: true, lineStyle: { color: '#333' } },
                z: 10
            },
            series: [
                {
                    name: 'Circle: r = 4',
                    type: 'line',
                    coordinateSystem: 'polar',
                    data: circleData,
                    symbol: 'circle',
                    symbolSize: 4,
                    showSymbol: true,
                    lineStyle: {
                        color: '#337ab7',
                        width: 2
                    },
                    itemStyle: {
                        color: '#337ab7'
                    },
                    z: 5
                },
                {
                    name: 'Tangent Line',
                    type: 'line',
                    coordinateSystem: 'polar',
                    data: tangentData,
                    symbol: 'arrow',
                    symbolSize: 8,
                    symbolRotate: function(val) {
                        // Calculate rotation to point along the line
                        // For a vertical line x=2, the direction is always up (90 deg) or down (270 deg)
                        // In ECharts polar, 0 is right.
                        return 0; 
                    },
                    showSymbol: true,
                    symbolRepeat: true,
                    symbolMargin: 15,
                    lineStyle: {
                        color: '#d9534f',
                        width: 2,
                        type: 'dashed'
                    },
                    itemStyle: {
                        color: '#d9534f'
                    },
                    z: 6
                }
            ],
            animation: false
        };

        myChart.setOption(option);

        window.addEventListener('resize', function() {
            myChart.resize();
        });
    });
</script>

</body>
</html>
