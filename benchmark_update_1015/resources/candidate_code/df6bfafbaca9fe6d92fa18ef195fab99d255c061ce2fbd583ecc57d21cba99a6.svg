<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <stroke width="2" color="black"/>
  </defs>

  <!-- OR Gate -->
  <path d="M20,20 C20,10 40,10 40,20 L40,80 C40,90 20,90 20,80 Z" fill="blue" stroke="black"/>
  <text x="30" y="50" font-size="16" fill="white">OR</text>

  <!-- Input I -->
  <text x="5" y="30" font-size="16">I</text>
  <line x1="10" y1="30" x2="20" y2="30" stroke="black"/>

  <!-- Input V -->
  <text x="5" y="70" font-size="16">V</text>
  <line x1="10" y1="70" x2="20" y2="70" stroke="black"/>

  <!-- Output of OR gate -->
  <circle cx="40" cy="50" r="3" fill="black"/>
  <line x1="45" y1="50" x2="60" y2="50" stroke="black"/>

  <!-- AND Gate -->
  <rect x="60" y="20" width="80" height="60" rx="10" ry="10" fill="blue" stroke="black"/>
  <text x="80" y="50" font-size="16" fill="white">AND</text>

  <!-- Input to AND gate (from OR gate) -->
  <!-- Already drawn above -->

  <!-- Output R -->
  <text x="150" y="50" font-size="16">R</text>
  <line x1="140" y1="50" x2="140" y2="50" stroke="black"/>
</svg>