<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 280">
  <!-- Hatched horizontal surface -->
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="black" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Horizontal hatched rectangle -->
  <rect x="0" y="0" width="100" height="15" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  
  <!-- Inclined plane block -->
  <g transform="translate(30, 50) rotate(25)">
    <rect x="0" y="0" width="50" height="150" fill="#6B8DB8" stroke="#4A6B8A" stroke-width="1.5"/>
    
    <!-- Text labels on block -->
    <text x="10" y="25" font-family="Arial, sans-serif" font-size="14" fill="black">np</text>
    <text x="25" y="55" font-family="Arial, sans-serif" font-size="14" fill="black">a</text>
    <text x="25" y="80" font-family="Arial, sans-serif" font-size="14" fill="black">g</text>
    <text x="18" y="105" font-family="Arial, sans-serif" font-size="14" fill="black">Fs</text>
    <text x="18" y="130" font-family="Arial, sans-serif" font-size="14" fill="black">FC</text>
  </g>
  
  <!-- mg sin θ label in cyan -->
  <text x="18" y="195" font-family="Arial, sans-serif" font-size="12" fill="#00CED1">mg sin θ</text>
</svg>