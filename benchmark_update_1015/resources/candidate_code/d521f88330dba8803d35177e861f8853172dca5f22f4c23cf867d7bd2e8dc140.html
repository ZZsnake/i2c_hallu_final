<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Distribution of Math Test Scores</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }
        .chart-container {
            width: 90%;
            max-width: 1200px;
            height: 600px;
            position: relative;
        }
        .chart-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
            color: #333;
        }
        .chart-subtitle {
            text-align: center;
            font-size: 14px;
            color: #b30000;
            margin-bottom: 20px;
        }
        .legend {
            text-align: center;
            margin-bottom: 20px;
        }
        .legend-item {
            display: inline-block;
            margin: 0 10px;
        }
        .legend-item span {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-right: 5px;
            vertical-align: middle;
        }
        .legend-item .blue { background-color: #1f77b4; }
        .legend-item .green { background-color: #2ca02c; }
        .legend-item .orange { background-color: #d62728; }
        .legend-item .purple { background-color: #9467bd; }
    </style>
</head>
<body>
    <div class="chart-container">
        <div class="chart-title">Distribution of Math Test Scores</div>
        <div class="chart-subtitle">Axis breaks help visualize score outliers</div>
        <div class="legend">
            <div class="legend-item"><span class="blue"></span>Mean Score</div>
            <div class="legend-item"><span class="green"></span>Top Score</div>
            <div class="legend-item"><span class="orange"></span>Lowest Score</div>
            <div class="legend-item"><span class="purple"></span>Outlier Score</div>
        </div>
        <div id="chart" style="width: 100%; height: 400px;"></div>
    </div>

    <script>
        var chartDom = document.getElementById('chart');
        var myChart = echarts.init(chartDom);
        var option = {
            title: {
                text: 'Distribution of Math Test Scores',
                left: 'center'
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'cross'
                }
            },
            legend: {
                data: ['Mean Score', 'Top Score', 'Lowest Score', 'Outlier Score'],
                top: 10,
                textStyle: {
                    color: '#333'
                }
            },
            grid: {
                left: '10%',
                right: '10%',
                bottom: '15%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: ['Algebra', 'Geometry', 'Calculus', 'Statistics', 'Trigonometry', 'Discrete Math', 'Number Theory'],
                axisLabel: {
                    fontSize: 12
                }
            },
            yAxis: {
                type: 'value',
                name: 'Score',
                min: 0,
                max: 1800,
                interval: 300,
                axisLabel: {
                    fontSize: 12
                },
                splitLine: {
                    lineStyle: {
                        type: 'dashed',
                        color: '#e0e0e0'
                    }
                }
            },
            series: [
                {
                    name: 'Mean Score',
                    type: 'bar',
                    data: [70, 100, 80, 60, 90, 50, 65],
                    itemStyle: {
                        color: '#1f77b4'
                    }
                },
                {
                    name: 'Top Score',
                    type: 'bar',
                    data: [100, 120, 110, 90, 130, 80, 105],
                    itemStyle: {
                        color: '#2ca02c'
                    }
                },
                {
                    name: 'Lowest Score',
                    type: 'bar',
                    data: [10, 20, 15, 10, 25, 10, 20],
                    itemStyle: {
                        color: '#d62728'
                    }
                },
                {
                    name: 'Outlier Score',
                    type: 'bar',
                    data: [1200, 1500, 1700, 900, 1350, 1600, 1250],
                    itemStyle: {
                        color: '#9467bd'
                    }
                }
            ]
        };

        myChart.setOption(option);
    </script>
</body>
</html>
