<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="white"/>

  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#000000">
    Atom Model
  </text>
  <text x="200" y="48" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666666">
    Physics: Atom Structure
  </text>

  <!-- Outer dashed orbit -->
  <ellipse cx="200" cy="160" rx="140" ry="90"
           fill="none" stroke="#003366" stroke-width="2"
           stroke-dasharray="7 5"/>

  <!-- Diamond orbit path (magenta) -->
  <path d="M200 60 L310 160 L200 260 L90 160 Z"
        fill="none" stroke="#cc00cc" stroke-width="2"/>

  <!-- Arrowheads on diamond corners -->
  <!-- Top arrow -->
  <polygon points="200,60 193,72 207,72"
           fill="#ff0000"/>
  <!-- Right arrow -->
  <polygon points="310,160 298,153 298,167"
           fill="#ff0000"/>
  <!-- Bottom arrow -->
  <polygon points="200,260 193,248 207,248"
           fill="#ff0000"/>
  <!-- Left arrow -->
  <polygon points="90,160 102,153 102,167"
           fill="#ff0000"/>

  <!-- Inner dashed orbit around nucleus -->
  <circle cx="200" cy="160" r="55"
          fill="none" stroke="#66aa55" stroke-width="2"
          stroke-dasharray="5 4"/>

  <!-- Nucleus main circle -->
  <circle cx="200" cy="160" r="30"
          fill="#f29c2b" stroke="#cc7722" stroke-width="2"/>

  <!-- Nucleus inner dashed ring -->
  <circle cx="200" cy="160" r="18"
          fill="none" stroke="#cce6aa" stroke-width="2"
          stroke-dasharray="4 3"/>

  <!-- Protons (orange small circles) -->
  <circle cx="192" cy="148" r="6" fill="#ff9933" stroke="#cc7722" stroke-width="1"/>
  <circle cx="210" cy="155" r="6" fill="#ff9933" stroke="#cc7722" stroke-width="1"/>

  <!-- Neutrons (light blue small circles in nucleus) -->
  <circle cx="188" cy="168" r="6" fill="#66bbee" stroke="#2277aa" stroke-width="1"/>
  <circle cx="205" cy="175" r="6" fill="#66bbee" stroke="#2277aa" stroke-width="1"/>

  <!-- Electrons on orbits (dark blue circles) -->
  <!-- On inner dashed orbit -->
  <circle cx="230" cy="130" r="6" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>
  <circle cx="170" cy="190" r="6" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>

  <!-- On diamond orbit -->
  <circle cx="248" cy="112" r="6" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>
  <circle cx="152" cy="208" r="6" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>

  <!-- On outer dashed orbit -->
  <circle cx="320" cy="160" r="6" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>
  <circle cx="80" cy="160" r="6" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>

  <!-- Legend box -->
  <rect x="255" y="60" width="120" height="80"
        rx="10" ry="10"
        fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <!-- Legend entries -->
  <!-- Proton -->
  <circle cx="270" cy="80" r="6" fill="#ff9933" stroke="#cc7722" stroke-width="1"/>
  <text x="285" y="84" font-family="sans-serif" font-size="11" fill="#000000">
    Proton
  </text>

  <!-- Neutron -->
  <circle cx="270" cy="100" r="6" fill="#66bbee" stroke="#2277aa" stroke-width="1"/>
  <text x="285" y="104" font-family="sans-serif" font-size="11" fill="#000000">
    Neutron
  </text>

  <!-- Electron -->
  <circle cx="270" cy="120" r="6" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>
  <text x="285" y="124" font-family="sans-serif" font-size="11" fill="#000000">
    Electron
  </text>
</svg>