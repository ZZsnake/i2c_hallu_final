<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="400" height="600">
  <text x="100" y="20" font-size="14" font-weight="bold" text-anchor="middle">Computer Science: Algorithm Execution</text>
  
  <rect x="50" y="40" width="100" height="30" fill="none" stroke="blue" stroke-dasharray="5,5" rx="5" ry="5">
    <text x="100" y="55" font-size="12" text-anchor="middle">User inputs data</text>
  </rect>
  
  <rect x="50" y="80" width="100" height="30" fill="none" stroke="green" stroke-dasharray="5,5" rx="5" ry="5">
    <text x="100" y="95" font-size="12" text-anchor="middle">System receives input</text>
  </rect>
  
  <rect x="50" y="120" width="100" height="30" fill="none" stroke="red" stroke-dasharray="5,5" rx="5" ry="5">
    <text x="100" y="135" font-size="12" text-anchor="middle">Input validation</text>
  </rect>
  
  <rect x="50" y="160" width="100" height="30" fill="none" stroke="orange" stroke-dasharray="5,5" rx="5" ry="5">
    <text x="100" y="175" font-size="12" text-anchor="middle">Run core algorithm</text>
  </rect>
  
  <rect x="50" y="200" width="100" height="30" fill="none" stroke="purple" stroke-dasharray="5,5" rx="5" ry="5">
    <text x="100" y="215" font-size="12" text-anchor="middle">Process results</text>
  </rect>
  
  <rect x="50" y="240" width="100" height="30" fill="none" stroke="teal" stroke-dasharray="5,5" rx="5" ry="5">
    <text x="100" y="255" font-size="12" text-anchor="middle">Result valid?</text>
  </rect>
  
  <rect x="50" y="280" width="100" height="30" fill="none" stroke="magenta" stroke-dasharray="5,5" rx="5" ry="5">
    <text x="100" y="295" font-size="12" text-anchor="middle">Display results</text>
  </rect>
  
  <rect x="150" y="240" width="100" height="30" fill="none" stroke="red" stroke-dasharray="5,5" rx="5" ry="5">
    <text x="200" y="255" font-size="12" text-anchor="middle">Error detected</text>
    <text x="200" y="270" font-size="12" text-anchor="middle">Halt execution</text>
  </rect>
  
  <line x1="100" y1="70" x2="100" y2="80" stroke="black" stroke-width="2"/>
  <line x1="100" y1="110" x2="100" y2="120" stroke="black" stroke-width="2"/>
  <line x1="100" y1="150" x2="100" y2="160" stroke="black" stroke-width="2"/>
  <line x1="100" y1="190" x2="100" y2="200" stroke="black" stroke-width="2"/>
  <line x1="100" y1="230" x2="100" y2="240" stroke="black" stroke-width="2"/>
  <line x1="100" y1="270" x2="100" y2="280" stroke="black" stroke-width="2"/>
  <line x1="100" y1="270" x2="150" y2="270" stroke="magenta" stroke-width="2"/>
</svg>