<!DOCTYPE html>
<html>
<head>
  <title>Distribution of Mathematical Topics</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #chartContainer {
      width: 600px;
      height: 400px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      background-color: white;
    }

    .legend {
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      width: 150px;
      text-align: left;
    }

    .legend-item {
      margin-bottom: 5px;
      display: flex;
      align-items: center;
    }

    .legend-color {
      width: 15px;
      height: 15px;
      margin-right: 5px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="chartContainer"></div>
    <div class="legend">
      <div class="legend-item"><span class="legend-color" style="background-color: #3498db;"></span>Algebra</div>
      <div class="legend-item"><span class="legend-color" style="background-color: #e74c3c;"></span>Geometry</div>
      <div class="legend-item"><span class="legend-color" style="background-color: #2ecc71;"></span>Calculus</div>
      <div class="legend-item"><span class="legend-color" style="background-color: #f39c12;"></span>Probability</div>
      <div class="legend-item"><span class="legend-color" style="background-color: #9b59b6;"></span>Statistics</div>
      <div class="legend-item"><span class="legend-color" style="background-color: #34495e;"></span>Number Theory</div>
      <div class="legend-item"><span class="legend-color" style="background-color: #85c1e9;"></span>Logic</div>
    </div>
  </div>

  <script>
    $(function() {
      var chartDom = document.getElementById('chartContainer');
      var myChart = echarts.init(chartDom);
      var option = {
        title: {
          text: 'Distribution of Mathematical Topics Studied',
          left: 'center',
          top: '10px'
        },
        tooltip: {
          trigger: 'item'
        },
        series: [
          {
            name: 'Mathematical Topics',
            type: 'pie',
            radius: ['40%', '70%'],
            label: {
              show: false
            },
            data: [
              { value: 35, name: 'Algebra', itemStyle: { color: '#3498db' } },
              { value: 25, name: 'Geometry', itemStyle: { color: '#e74c3c' } },
              { value: 15, name: 'Calculus', itemStyle: { color: '#2ecc71' } },
              { value: 8, name: 'Probability', itemStyle: { color: '#f39c12' } },
              { value: 7, name: 'Statistics', itemStyle: { color: '#9b59b6' } },
              { value: 5, name: 'Number Theory', itemStyle: { color: '#34495e' } },
              { value: 5, name: 'Logic', itemStyle: { color: '#85c1e9' } }
            ],
            emphasis: {
              label: {
                show: true
              }
            }
          }
        ]
      };
      myChart.setOption(option);
    });
  </script>
</body>
</html>
