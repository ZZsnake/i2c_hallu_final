<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Population Growth in Major Cities (2020)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }
        .chart-container {
            width: 90%;
            max-width: 1200px;
            height: 600px;
        }
        .chart-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <div id="populationChart" style="width: 100%; height: 100%;"></div>
    </div>

    <script>
        // Initialize the chart
        var myChart = echarts.init(document.getElementById('populationChart'));
        
        // Define the data
        var cities = ['New York', 'London', 'Tokyo', 'Delhi', 'Paris', 'Sydney', 'Cairo', 'Rio', 'Toronto'];
        var populations = [8.8, 9.3, 13.5, 18.7, 2.1, 4.9, 9.9, 11.5, 27.0]; // Population in millions
        
        // Define the option
        var option = {
            title: {
                text: 'Population Growth in Major Cities (2020)',
                left: 'center',
                textStyle: {
                    fontSize: 18,
                    color: '#2c3e50'
                }
            },
            tooltip: {
                trigger: 'axis'
            },
            legend: {
                data: ['Population (Millions)'],
                textStyle: {
                    color: '#2c3e50'
                }
            },
            xAxis: {
                type: 'value',
                name: 'Population (Millions)',
                nameLocation: 'middle',
                nameGap: 40,
                min: 0,
                max: 21,
                axisLabel: {
                    formatter: '{value} M'
                },
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: '#eaeaea'
                    }
                },
                axisLine: {
                    lineStyle: {
                        color: '#2c3e50'
                    }
                }
            },
            yAxis: {
                type: 'category',
                data: cities,
                inverse: true,
                axisLine: {
                    lineStyle: {
                        color: '#2c3e50'
                    }
                },
                axisLabel: {
                    textStyle: {
                        color: '#2c3e50'
                    }
                }
            },
            series: [{
                name: 'Population (Millions)',
                type: 'line',
                smooth: true,
                data: populations,
                itemStyle: {
                    color: '#e74c3c'
                },
                lineStyle: {
                    color: '#e74c3c',
                    width: 3
                },
                symbol: 'square',
                symbolSize: 15,
                areaStyle: {
                    color: 'rgba(231, 76, 60, 0.1)'
                }
            }]
        };
        
        // Set the option
        myChart.setOption(option);
    </script>
</body>
</html>
