<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <!-- Markers for arrows -->
  <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <path d="M0,0 L10,3.5 L0,7 Z" fill="orange"/>
  </marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <path d="M0,0 L10,3.5 L0,7 Z" fill="purple"/>
  </marker>
  <marker id="arrow-left-purple" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
    <path d="M10,0 L0,3.5 L10,7 Z" fill="purple"/>
  </marker>
  
  <!-- User Input Arrow -->
  <path d="M10,75 L90,75 L100,90 L90,105 L10,105 Z" fill="gold" stroke="darkgoldenrod" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="55" y="95" font-size="16" text-anchor="middle" alignment-baseline="middle" fill="black">USER INPUT</text>
  
  <!-- Data In Rectangle -->
  <rect x="110" y="50" width="100" height="100" fill="mediumseagreen" stroke="darkgreen" stroke-width="1"/>
  <text x="160" y="100" font-size="16" text-anchor="middle" alignment-baseline="middle" fill="black">DATA IN</text>
  
  <!-- Algorithm and Memory Rectangles -->
  <rect x="220" y="50" width="200" height="50" fill="orange" stroke="darkorange" stroke-width="1"/>
  <text x="320" y="75" font-size="16" text-anchor="middle" alignment-baseline="middle" fill="black">ALGORITHM</text>
  <rect x="220" y="100" width="200" height="50" fill="lightskyblue" stroke="steelblue" stroke-width="1"/>
  <text x="320" y="125" font-size="16" text-anchor="middle" alignment-baseline="middle" fill="black">MEMORY</text>
  
  <!-- Result Rectangle -->
  <rect x="430" y="50" width="100" height="100" fill="royalblue" stroke="darkblue" stroke-width="1"/>
  <text x="480" y="100" font-size="16" text-anchor="middle" alignment-baseline="middle" fill="black">RESULT</text>
  
  <!-- System Out Arrow -->
  <path d="M610,75 L690,75 L700,90 L690,105 L610,105 Z" fill="plum" stroke="purple" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="655" y="95" font-size="16" text-anchor="middle" alignment-baseline="middle" fill="black">SYSTEM OUT</text>
  
  <!-- Arrows between blocks -->
  <!-- Data In to Algorithm and Memory -->
  <path d="M210,75 H220" stroke="orange" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M210,125 H220" stroke="orange" fill="none" marker-end="url(#arrow-orange)"/>
  
  <!-- Algorithm and Memory to Result -->
  <path d="M420,75 H430" stroke="purple" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M420,125 H430" stroke="purple" fill="none" marker-end="url(#arrow-purple)"/>
  
  <!-- Bidirectional purple dashed arrow between Algorithm and Memory -->
  <path d="M230,100 H390" stroke="purple" stroke-dasharray="5,5" fill="none" 
        marker-start="url(#arrow-left-purple)" marker-end="url(#arrow-purple)"/>
</svg>