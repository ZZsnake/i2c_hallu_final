<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <title>Global GDP Growth by Region</title>
  <rect x="0" y="0" width="800" height="400" fill="#f0f0f0" />
  <text x="400" y="20" text-anchor="middle" font-size="16" font-weight="bold">Global GDP Growth by Region</text>
  <text x="400" y="40" text-anchor="middle" font-size="14">Annual Average (2010-2020)</text>
  <text x="400" y="55" text-anchor="middle" font-size="12">(selected economies)</text>
  
  <!-- Grid Lines -->
  <line x1="50" y1="70" x2="50" y2="350" stroke="#ddd" />
  <line x1="250" y1="70" x2="250" y2="350" stroke="#ddd" />
  <line x1="450" y1="70" x2="450" y2="350" stroke="#ddd" />
  <line x1="650" y1="70" x2="650" y2="350" stroke="#ddd" />
  
  <!-- Bars and Labels -->
  <rect x="50" y="80" width="600" height="20" fill="#3498db" />
  <text x="20" y="90" font-size="12">East Asia</text>
  <rect x="50" y="110" width="500" height="20" fill="#3498db" />
  <text x="20" y="120" font-size="12">South Asia</text>
  <rect x="50" y="140" width="400" height="20" fill="#3498db" />
  <text x="20" y="150" font-size="12">North America</text>
  <rect x="50" y="170" width="350" height="20" fill="#3498db" />
  <text x="20" y="180" font-size="12">EU</text>
  <rect x="50" y="200" width="300" height="20" fill="#3498db" />
  <text x="20" y="210" font-size="12">Latin America</text>
  <rect x="50" y="230" width="250" height="20" fill="#3498db" />
  <text x="20" y="240" font-size="12">Africa</text>
  <rect x="50" y="260" width="200" height="20" fill="#3498db" />
  <text x="20" y="270" font-size="12">Middle East</text>
  <rect x="50" y="290" width="150" height="20" fill="#3498db" />
  <text x="20" y="300" font-size="12">Oceania</text>
  <rect x="50" y="320" width="100" height="20" fill="#3498db" />
  <text x="20" y="330" font-size="12">Eastern Europe</text>
  <rect x="50" y="350" width="50" height="20" fill="#3498db" />
  <text x="20" y="360" font-size="12">Central Asia</text>
  
  <!-- X-axis Labels -->
  <text x="50" y="380" text-anchor="middle" font-size="12">0%</text>
  <text x="250" y="380" text-anchor="middle" font-size="12">2%</text>
  <text x="450" y="380" text-anchor="middle" font-size="12">4%</text>
  <text x="650" y="380" text-anchor="middle" font-size="12">6%</text>
  <text x="750" y="380" text-anchor="middle" font-size="12">8%</text>
  
  <!-- X-axis Title -->
  <text x="400" y="390" text-anchor="middle" font-size="14">Percent (%)</text>
</svg>