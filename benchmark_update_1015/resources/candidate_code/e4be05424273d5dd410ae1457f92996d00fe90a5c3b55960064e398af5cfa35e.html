<!DOCTYPE html>
<html lang="en" style="height: 100%">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Functions Over X</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            height: 100%;
            margin: 0;
        }
        #chart-container {
            width: 100%;
            height: 100%;
        }
        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="chart-container">
        <div id="chart"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            var chart = echarts.init(document.getElementById('chart'));
            var option = {
                color: ['#e91e63', '#009688', '#3158e6'],
                grid: {
                    left: '12%',
                    right: '12%',
                    bottom: '6%'
                },                title: {
                    text: 'Math Functions Over X',
                    left: 'center',
                    top: 0
                },
                tooltip: {
                    trigger: 'axis'
                },
                toolbox: {
                    feature: {
                        saveAsImage: {}
                    },
                    right: 10,
                    top: 0
                },
                legend: {
                    data: ['f(x) = x²', 'g(x) = 2x+1', 'h(x) = x³'],
                    top: 40,
                    textStyle: {
                        fontWeight: 'bold'
                    }
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    axisLabel: {
                        color: '#222',
                        fontWeight: 'bold'
                    },                    axisLine: {
                        lineStyle: {
                            color: '#2d5be3',
                            width: 2
                        }
                    },
                    data: ['-3', '-2', '-1', '0', '1', '2', '3']
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        color: '#222',
                        fontWeight: 'bold'
                    },                    axisLine: {
                        lineStyle: {
                            color: '#2d5be3',
                            width: 2
                        }
                    }
                },
                series: [
                    {
                        name: 'f(x) = x²',
                        type: 'line',
                        symbol: 'circle',
                        symbolSize: 10,
                        itemStyle: {
                            color: '#e91e63'
                        },
                        lineStyle: {
                            color: '#e91e63',
                            width: 4
                        },
                        data: [9, 4, 1, 0, 1, 4, 9]
                    },
                    {
                        name: 'g(x) = 2x+1',
                        type: 'line',
                        symbol: 'rect',
                        symbolSize: 10,
                        itemStyle: {
                            color: '#009688'
                        },
                        lineStyle: {
                            color: '#009688',
                            width: 4
                        },
                        data: [-5, -3, -1, 1, 3, 5, 7]
                    },
                    {
                        name: 'h(x) = x³',
                        type: 'line',
                        symbol: 'triangle',
                        symbolSize: 10,
                        itemStyle: {
                            color: '#3158e6'
                        },
                        lineStyle: {
                            color: '#3158e6',
                            width: 4
                        },
                        label: {
                            show: true,
                            position: 'top',
                            formatter: '{c}',
                            fontWeight: 'bold',
                            color: '#222'
                        },
                        data: [-27, -8, -1, 0, 1, 8, 27]
                    }
                ]
            };
            chart.setOption(option);
        });
    </script>
</body>
</html>
