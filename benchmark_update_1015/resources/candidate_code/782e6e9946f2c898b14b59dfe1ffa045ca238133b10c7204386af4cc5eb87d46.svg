<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Fixed point at origin -->
  <circle cx="100" cy="10" r="3" fill="black"/>
  <text x="95" y="5" font-size="10" text-anchor="middle"> (0,0) </text>
  
  <!-- First pendulum -->
  <line x1="100" y1="10" x2="100" y2="50" stroke="red" stroke-width="2"/>
  <circle cx="100" cy="50" r="5" fill="black"/>
  <text x="95" y="45" font-size="10" text-anchor="middle"> (x1,y1) </text>
  <text x="110" y="30" font-size="10" text-anchor="middle"> θ1 </text>
  <line x1="100" y1="10" x2="100" y2="50" stroke="red" stroke-width="2"/>
  
  <!-- Second pendulum -->
  <line x1="100" y1="50" x2="130" y2="100" stroke="red" stroke-width="2"/>
  <circle cx="130" cy="100" r="5" fill="black"/>
  <text x="125" y="95" font-size="10" text-anchor="middle"> (x2,y2) </text>
  <text x="135" y="80" font-size="10" text-anchor="middle"> θ2 </text>
  <line x1="100" y1="50" x2="130" y2="100" stroke="red" stroke-width="2"/>
  
  <!-- Gravitational force -->
  <line x1="100" y1="50" x2="100" y2="60" stroke="black" stroke-width="2"/>
  <text x="100" y="65" font-size="10" text-anchor="middle"> mg </text>
  <line x1="130" y1="100" x2="130" y2="110" stroke="black" stroke-width="2"/>
  <text x="130" y="115" font-size="10" text-anchor="middle"> mg </text>
</svg>