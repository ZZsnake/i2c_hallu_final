<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <!-- Left starburst -->
  <g id="left-star">
    <circle cx="15" cy="60" r="3" fill="#d946ef"/>
    <line x1="15" y1="60" x2="5" y2="50" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="15" y1="60" x2="5" y2="55" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="15" y1="60" x2="5" y2="60" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="15" y1="60" x2="5" y2="65" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="15" y1="60" x2="5" y2="70" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="15" y1="60" x2="10" y2="47" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="15" y1="60" x2="10" y2="73" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="15" y1="60" x2="8" y2="52" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="15" y1="60" x2="8" y2="68" stroke="#d946ef" stroke-width="1.5"/>
  </g>
  
  <!-- Right starburst -->
