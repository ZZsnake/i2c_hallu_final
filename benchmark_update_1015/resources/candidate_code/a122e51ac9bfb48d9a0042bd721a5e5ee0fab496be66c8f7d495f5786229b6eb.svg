    <line x1="185" y1="60" x2="195" y2="50" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="185" y1="60" x2="195" y2="55" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="185" y1="60" x2="195" y2="60" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="185" y1="60" x2="195" y2="65" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="185" y1="60" x2="195" y2="70" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="185" y1="60" x2="190" y2="47" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="185" y1="60" x2="190" y2="73" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="185" y1="60" x2="192" y2="52" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="185" y1="60" x2="192" y2="68" stroke="#d946ef" stroke-width="1.5"/>
  </g>
  
  <!-- Radiating lines from left to right -->
