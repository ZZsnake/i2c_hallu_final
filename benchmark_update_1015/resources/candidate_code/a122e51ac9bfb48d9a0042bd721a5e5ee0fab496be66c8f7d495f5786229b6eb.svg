  <line x1="15" y1="60" x2="185" y2="50" stroke="#a0826d" stroke-width="0.8"/>
  <line x1="15" y1="60" x2="185" y2="70" stroke="#a0826d" stroke-width="0.8"/>
  <line x1="15" y1="60" x2="185" y2="45" stroke="#a0826d" stroke-width="0.8"/>
  <line x1="15" y1="60" x2="185" y2="75" stroke="#a0826d" stroke-width="0.8"/>
  <line x1="15" y1="60" x2="185" y2="40" stroke="#a0826d" stroke-width="0.8"/>
  <line x1="15" y1="60" x2="185" y2="80" stroke="#a0826d" stroke-width="0.8"/>
  <line x1="15" y1="60" x2="185" y2="35" stroke="#a0826d" stroke-width="0.8"/>
  <line x1="15" y1="60" x2="185" y2="85" stroke="#a0826d" stroke-width="0.8"/>
