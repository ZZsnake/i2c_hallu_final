  <circle cx="100" cy="65" r="3.5" fill="#4a7ba7"/>
  <circle cx="110" cy="70" r="3.5" fill="#4a7ba7"/>
  
  <!-- Top curved arrows (left to right) -->
  <path d="M 20 15 Q 35 12 50 15" stroke="#6b7c93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 70 12 Q 85 10 100 12" stroke="#6b7c93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 115 12 Q 130 10 145 12" stroke="#6b7c93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 150 15 Q 165 12 180 15" stroke="#6b7c93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Bottom curved arrows (right to left) -->
  <path d="M 180 105 Q 165 108 150 105" stroke="#6b7c93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 145 108 Q 130 110 115 108" stroke="#6b7c93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 100 108 Q 85 110 70 108" stroke="#6b7c93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 50 105 Q 35 108 20 105" stroke="#6b7c93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Left curved arrow -->
  <path d="M 10 25 Q 5 35 10 45" stroke="#6b7c93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 10 75 Q 5 85 10 95" stroke="#6b7c93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Right curved arrow -->
  <path d="M 190 45 Q 195 35 190 25" stroke="#6b7c93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 190 95 Q 195 85 190 75" stroke="#6b7c93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
