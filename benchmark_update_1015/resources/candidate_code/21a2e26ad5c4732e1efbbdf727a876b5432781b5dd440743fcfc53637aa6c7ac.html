<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box Chart of Math Test Scores</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: white;
    }
    #chart {
      width: 100%;
      height: 500px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div id="chart"></div>

  <script>
    const chartDom = document.getElementById('chart');
    const myChart = echarts.init(chartDom);

    // Approximate data from visual inspection
    const data = [
      [65, 78, 80, 90, 95], // Class A
      [70, 75, 80, 88, 92], // Class B
      [60, 70, 75, 85, 90], // Class C
      [68, 72, 78, 85, 90]  // Class D
    ];

    const option = {
      title: {
        text: 'Box Chart of Math Test Scores',
        left: 'center',
        top: '10px',
        textStyle: {
          fontSize: 14,
          fontWeight: 'normal'
        }
      },
      tooltip: {
        trigger: 'axis',
        axisPointer: {
          type: 'shadow'
        }
      },
      grid: {
        left: '10%',
        right: '10%',
        top: '15%',
        bottom: '15%'
      },
      xAxis: {
        type: 'category',
        data: ['Class A', 'Class B', 'Class C', 'Class D'],
        axisLine: {
          lineStyle: {
            color: '#333'
          }
        },
        axisLabel: {
          fontSize: 12
        }
      },
      yAxis: {
        type: 'value',
        name: 'Score',
        nameGap: 20,
        nameTextStyle: {
          fontSize: 12
        },
        min: 0,
        max: 100,
        interval: 20,
        axisLine: {
          lineStyle: {
            color: '#333'
          }
        },
        splitLine: {
          lineStyle: {
            color: '#ddd'
          }
        },
        axisLabel: {
          fontSize: 12
        }
      },
      series: [{
        name: 'Math Test Scores',
        type: 'boxplot',
        data: data,
        itemStyle: {
          color: '#1f77b4',
          borderColor: '#003366'
        },
        whiskerWidth: 20,
        medianLine: {
          lineStyle: {
            color: '#003366',
            width: 2
          }
        },
        boxWidth: ['30%', '70%']
      }]
    };

    myChart.setOption(option);

    window.addEventListener('resize', function() {
      myChart.resize();
    });
  </script>
</body>
</html>
