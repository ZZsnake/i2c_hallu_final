<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Algorithm -->
  <circle cx="50" cy="10" r="8" fill="#fff" stroke="#000"/>
  <text x="50" y="14" text-anchor="middle" font-size="6">Algorithm</text>

  <!-- Web -->
  <circle cx="30" cy="30" r="8" fill="#d0eaff" stroke="#000"/>
  <text x="30" y="34" text-anchor="middle" font-size="6">Web</text>
  <path d="M50 10 L30 30" stroke="#000" stroke-dasharray="5,5"/>

  <!-- Security -->
  <circle cx="10" cy="30" r="8" fill="#ffcccc" stroke="#000"/>
  <text x="10" y="34" text-anchor="middle" font-size="6">Security</text>
  <path d="M50 10 L10 30" stroke="#000" stroke-dasharray="5,5"/>

  <!-- Database -->
  <circle cx="10" cy="70" r="8" fill="#ccffcc" stroke="#000"/>
  <text x="10" y="74" text-anchor="middle" font-size="6">Database</text>
  <path d="M10 30 L10 70" stroke="#000" stroke-dasharray="5,5"/>

  <!-- Programming -->
  <circle cx="30" cy="50" r="8" fill="#ffffff" stroke="#000"/>
  <text x="30" y="54" text-anchor="middle" font-size="6">Programming</text>
  <path d="M30 30 L30 50" stroke="#000" stroke-dasharray="5,5"/>
  <path d="M50 10 L30 50" stroke="#000" stroke-dasharray="5,5"/>

  <!-- Operating System -->
  <circle cx="50" cy="70" r="8" fill="#ffffff" stroke="#000"/>
  <text x="50" y="74" text-anchor="middle" font-size="6">Operating System</text>
  <path d="M30 50 L50 70" stroke="#000" stroke-dasharray="5,5"/>
  <path d="M50 10 L50 70" stroke="#000" stroke-dasharray="5,5"/>

  <!-- AI -->
  <circle cx="70" cy="70" r="8" fill="#ffffff" stroke="#000"/>
  <text x="70" y="74" text-anchor="middle" font-size="6">AI</text>
  <path d="M50 70 L70 70" stroke="#000" stroke-dasharray="5,5"/>

  <!-- Machine Learning -->
  <circle cx="70" cy="50" r="8" fill="#ffffff" stroke="#000"/>
  <text x="70" y="54" text-anchor="middle" font-size="6">Machine Learning</text>
  <path d="M70 70 L70 50" stroke="#000" stroke-dasharray="5,5"/>

  <!-- Data Structure -->
  <circle cx="70" cy="30" r="8" fill="#ffffff" stroke="#000"/>
  <text x="70" y="34" text-anchor="middle" font-size="6">Data Structure</text>
  <path d="M50 50 L70 30" stroke="#000" stroke-dasharray="5,5"/>
  <path d="M50 10 L70 30" stroke="#000" stroke-dasharray="5,5"/>

  <!-- Networking -->
  <circle cx="90" cy="30" r="8" fill="#ffffff" stroke="#000"/>
  <text x="90" y="34" text-anchor="middle" font-size="6">Networking</text>
  <path d="M70 30 L90 30" stroke="#000" stroke-dasharray="5,5"/>

  <!-- Cloud -->
  <circle cx="90" cy="50" r="8" fill="#ffffff" stroke="#000"/>
  <text x="90" y="54" text-anchor="middle" font-size="6">Cloud</text>
  <path d="M70 30 L90 50" stroke="#000" stroke-dasharray="5,5"/>
</svg>