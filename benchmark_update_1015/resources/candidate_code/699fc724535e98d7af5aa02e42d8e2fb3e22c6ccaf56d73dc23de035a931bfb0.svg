<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .axis-line {
        stroke: black;
        stroke-width: 7;
        fill: none;
      }
      .grid-line {
        stroke: black;
        stroke-width: 7;
        fill: none;
      }
      .node-orange {
        fill: #FF6600;
        stroke: black;
        stroke-width: 10;
      }
      .node-green {
        fill: #66CC00;
        stroke: black;
        stroke-width: 10;
      }
      .label-text {
        font-family: sans-serif;
        font-size: 64px;
        font-weight: bold;
        fill: black;
      }
      .node-label {
        font-family: sans-serif;
        font-size: 64px;
        font-weight: normal;
        fill: black;
      }
      .boundary-line {
        stroke: #0057B8;
        stroke-width: 7;
        stroke-dasharray: 16 8;
        fill: none;
      }
      .light-gray-bg {
        fill: #CCCCCC;
      }
      .dark-gray-bg {
        fill: #555555;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="800" fill="#ffffff"/>

  <!-- Define plot origin and unit size -->
  <!-- Plot origin at (344, 353) in SVG coordinates -->
  <!-- Unit size for grid is about 159px -->
  <!-- X1 goes from negative values to beyond 1, X2 goes from negative values to beyond 1 -->

  <!-- Shaded background regions -->
  <!-- Light gray region -->
  <rect x="94" y="103" width="501" height="501" class="light-gray-bg"/>
  <!-- Dark gray decision region -->
  <polygon points="315,103 595,103 595,383" class="dark-gray-bg"/>

  <!-- Axes -->
  <line x1="94" y1="353" x2="595" y2="353" class="axis-line" marker-end="url(#arrowhead)" /> <!-- X1 axis -->
  <line x1="344" y1="604" x2="344" y2="103" class="axis-line" marker-end="url(#arrowhead)" /> <!-- X2 axis -->

  <!-- Grid lines -->
  <line x1="344" y1="200" x2="503" y2="200" class="grid-line"/>
  <line x1="503" y1="200" x2="503" y2="353" class="grid-line"/>

  <!-- Decision Boundary -->
  <line x1="315" y1="103" x2="595" y2="383" class="boundary-line"/>

  <!-- Nodes -->
  <!-- (0,0) -->
  <circle cx="344" cy="353" r="27" class="node-orange" />
  <text x="266" y="453" text-anchor="middle" class="node-label">1</text>

  <!-- (1,0) -->
  <circle cx="503" cy="353" r="27" class="node-orange" />
  <text x="496" y="453" text-anchor="middle" class="node-label">1</text>

  <!-- (0,1) -->
  <circle cx="344" cy="200" r="27" class="node-orange" />
  <text x="266" y="222" text-anchor="middle" class="node-label">0</text>

  <!-- (1,1) -->
  <circle cx="503" cy="200" r="27" class="node-green" />

  <!-- Axis Labels -->
  <text x="620" y="340" class="label-text">X₁</text>
  <text x="354" y="90" class="label-text">X₂</text>

  <!-- Overall Function Label -->
  <text x="400" y="745" text-anchor="middle" class="label-text">AND (X₁∩X₂)</text>

</svg>