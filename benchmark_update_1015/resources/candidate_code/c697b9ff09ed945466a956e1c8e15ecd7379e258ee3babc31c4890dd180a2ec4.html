<!DOCTYPE html>
<html>
<head>
  <title>Distribution of Number Types</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    #chartContainer {
      width: 600px;
      height: 600px;
      border-radius: 50%;
      overflow: hidden;
    }

    #chart {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="chartContainer">
    <div id="chart"></div>
  </div>

  <script>
    $(function() {
      var chartDom = document.getElementById('chart');
      var myChart = echarts.init(chartDom);
      var option = {
        title: {
          text: 'Distribution of Number Types in Mathematics',
          left: 'center',
          top: '5%'
        },
        series: [{
          type: 'pie',
          radius: ['60%', '90%'],
          data: [
            { value: 10, name: 'Positive', itemStyle: { color: '#3CB371' } },
            { value: 10, name: 'Integers', itemStyle: { color: '#FFD700' } },
            { value: 10, name: 'Negative', itemStyle: { color: '#BA55D3' } },
            { value: 10, name: 'Natural', itemStyle: { color: '#4682B4' } },
            { value: 10, name: 'Numbers', itemStyle: { color: '#008B8B' } },
            { value: 10, name: 'Rational', itemStyle: { color: '#4682B4' } },
            { value: 10, name: 'Whole', itemStyle: { color: '#DC143C' } },
            { value: 10, name: 'Real', itemStyle: { color: '#3CB371' } },
            { value: 10, name: 'Irrational', itemStyle: { color: '#BA55D3' } }
          ],
          label: {
            formatter: '{b}',
            position: 'inside',
            color: '#fff'
          },
          emphasis: {
            label: {
              show: false
            }
          }
        }]
      };

      myChart.setOption(option);
    });
  </script>

</body>
</html>
