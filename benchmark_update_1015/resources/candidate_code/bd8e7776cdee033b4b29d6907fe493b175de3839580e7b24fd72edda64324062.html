<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Chart of Math Test Scores</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            padding: 20px;
        }
        #chartContainer {
            width: 100%;
            height: 600px;
        }
    </style>
</head>
<body>
    <div id="chartContainer"></div>
    
    <script>
        var chartDom = document.getElementById('chartContainer');
        var myChart = echarts.init(chartDom);
        
        var option = {
            title: {
                text: 'Box Chart of Math Test Scores',
                left: 'center',
                top: 0,
                textStyle: {
                    fontSize: 16,
                    fontWeight: 'bold',
                    color: '#000'
                }
            },
            grid: {
                left: '10%',
                right: '5%',
                bottom: '10%',
                top: '10%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: ['Class A', 'Class B', 'Class C', 'Class D'],
                boundaryGap: true,
                axisLine: {
                    lineStyle: {
                        color: '#000'
                    }
                },
                axisLabel: {
                    color: '#000'
                },
                splitLine: {
                    show: false
                }
            },
            yAxis: {
                type: 'value',
                name: 'Score',
                nameLocation: 'middle',
                nameGap: 50,
                nameTextStyle: {
                    color: '#000',
                    fontSize: 12
                },
                min: 0,
                max: 100,
                interval: 20,
                axisLine: {
                    lineStyle: {
                        color: '#000'
                    }
                },
                axisLabel: {
                    color: '#000'
                },
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: '#e0e0e0',
                        type: 'solid'
                    }
                }
            },
            series: [
                {
                    name: 'boxplot',
                    type: 'boxplot',
                    data: [
                        [65, 78, 82, 93, 95],  // Class A: [min, Q1, median, Q3, max]
                        [70, 74, 83, 90, 95],  // Class B
                        [60, 68, 75, 87, 92],  // Class C
                        [68, 72, 77, 85, 90]   // Class D
                    ],
                    itemStyle: {
                        color: '#1E90FF',
                        borderColor: '#000',
                        borderWidth: 1
                    },
                    boxWidth: [20, 50]
                }
            ]
        };
        
        myChart.setOption(option);
        
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
