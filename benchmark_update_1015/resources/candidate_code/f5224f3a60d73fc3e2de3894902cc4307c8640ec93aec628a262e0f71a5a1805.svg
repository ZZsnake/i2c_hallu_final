<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Axes -->
  <line x1="50" y1="300" x2="750" y2="300" stroke="black" stroke-width="2"/>
  <line x1="50" y1="50" x2="50" y2="550" stroke="black" stroke-width="2"/>
  
  <!-- Grid -->
  <line x1="50" y1="50" x2="750" y2="50" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  <line x1="50" y1="150" x2="750" y2="150" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  <line x1="50" y1="250" x2="750" y2="250" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  <line x1="50" y1="350" x2="750" y2="350" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  <line x1="50" y1="450" x2="750" y2="450" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  <line x1="50" y1="550" x2="750" y2="550" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  
  <line x1="50" y1="50" x2="50" y2="550" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  <line x1="150" y1="50" x2="150" y2="550" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  <line x1="250" y1="50" x2="250" y2="550" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  <line x1="350" y1="50" x2="350" y2="550" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  <line x1="450" y1="50" x2="450" y2="550" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  <line x1="550" y1="50" x2="550" y2="550" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  <line x1="650" y1="50" x2="650" y2="550" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  <line x1="750" y1="50" x2="750" y2="550" stroke="#B0E0E6" stroke-dasharray="5,5"/>
  
  <!-- Sine Curve -->
  <path d="M50,300 Q150,250 250,300 Q350,350 450,300 Q550,250 650,300 Q750,350 750,300" stroke="blue" fill="none" stroke-width="2"/>
  
  <!-- Points -->
  <circle cx="50" cy="300" r="5" fill="red"/>
  <circle cx="150" cy="300" r="5" fill="red"/>
  <circle cx="250" cy="250" r="5" fill="red"/>
  <circle cx="350" cy="350" r="5" fill="red"/>
  <circle cx="450" cy="300" r="5" fill="red"/>
  <circle cx="550" cy="250" r="5" fill="red"/>
  <circle cx="650" cy="350" r="5" fill="red"/>
  <circle cx="750" cy="300" r="5" fill="red"/>
  
  <!-- Labels -->
  <text x="375" y="40" font-size="16" text-anchor="middle">y = sin(x)</text>
  <text x="760" y="310" font-size="12" text-anchor="middle">x</text>
  <text x="25" y="565" font-size="12" text-anchor="middle" transform="rotate(-90 25,565)">y</text>
</svg>