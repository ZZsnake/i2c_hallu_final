<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarterly GDP Growth Rate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #chart {
            width: 80%;
            height: 600px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="chart"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            var chart = echarts.init(document.getElementById('chart'));
            var option = {
                title: {
                    text: 'Quarterly GDP Growth Rate',
                    subtext: 'Sample Economics Data',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis'
                },
                xAxis: {
                    type: 'category',
                    data: ['Q1 2022', 'Q2 2022', 'Q3 2022', 'Q4 2022', 'Q1 2023', 'Q2 2023', 'Q3 2023', 'Q4 2023']
                },
                yAxis: {
                    type: 'value',
                    name: 'Growth Rate (%)',
                    min: 0,
                    max: 3.5,
                    interval: 0.5
                },
                series: [{
                    name: 'Growth Rate',
                    type: 'line',
                    data: [2.1, 2.4, 2.0, 2.7, 3.2, 2.9, 3.5, 3.1],
                    lineStyle: {
                        color: '#FF6347'
                    },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            {offset: 0, color: '#FF6347'},
                            {offset: 1, color: 'rgba(255, 99, 71, 0)'}
                        ])
                    }
                }]
            };
            chart.setOption(option);
        });
    </script>
</body>
</html>
