<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <!-- Background -->
  <rect width="400" height="250" fill="white" />

  <!-- Main Circuit Wires -->
  <polyline points="80,120 80,50 150,50" fill="none" stroke="black" stroke-width="2" />
  <polyline points="190,50 250,50 250,90" fill="none" stroke="black" stroke-width="2" />
  <polyline points="250,150 250,200 80,200 80,135" fill="none" stroke="black" stroke-width="2" />

  <!-- Battery Symbol -->
  <line x1="50" y1="120" x2="110" y2="120" stroke="black" stroke-width="2" />
  <line x1="70" y1="135" x2="90" y2="135" stroke="black" stroke-width="4" />
  <text x="50" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="bold">+</text>
  <text x="50" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="bold">-</text>

  <!-- Switch Symbol (Open) -->
  <circle cx="150" cy="50" r="4" fill="white" stroke="black" stroke-width="2" />
  <circle cx="190" cy="50" r="4" fill="white" stroke="black" stroke-width="2" />
  <line x1="154" y1="50" x2="200" y2="40" stroke="black" stroke-width="2" />

  <!-- Light Bulb Symbol -->
  <circle cx="250" cy="120" r="30" fill="#0000FF" stroke="black" stroke-width="2" />
  <line x1="228" y1="98" x2="272" y2="142" stroke="black" stroke-width="2" />
  <line x1="228" y1="142" x2="272" y2="98" stroke="black" stroke-width="2" />
  
  <!-- Light Rays -->
  <g stroke="black" stroke-width="2">
    <line x1="250" y1="80" x2="250" y2="70" />
    <line x1="250" y1="160" x2="250" y2="170" />
    <line x1="210" y1="120" x2="220" y2="120" />
    <line x1="280" y1="120" x2="290" y2="120" />
    <line x1="222" y1="92" x2="215" y2="85" />
    <line x1="278" y1="92" x2="285" y2="85" />
    <line x1="222" y1="148" x2="215" y2="155" />
    <line x1="278" y1="148" x2="285" y2="155" />
  </g>

  <!-- Voltmeter Connection -->
  <line x1="250" y1="70" x2="340" y2="70" stroke="black" stroke-width="2" />
  <line x1="250" y1="170" x2="340" y2="170" stroke="black" stroke-width="2" />
  <line x1="340" y1="70" x2="340" y2="95" stroke="black" stroke-width="2" />
  <line x1="340" y1="145" x2="340" y2="170" stroke="black" stroke-width="2" />

  <!-- Voltmeter Symbol -->
  <circle cx="340" cy="120" r="25" fill="white" stroke="black" stroke-width="2" />
  <text x="340" y="135" font-family="Arial, sans-serif" font-size="35" text-anchor="middle">V</text>
</svg>