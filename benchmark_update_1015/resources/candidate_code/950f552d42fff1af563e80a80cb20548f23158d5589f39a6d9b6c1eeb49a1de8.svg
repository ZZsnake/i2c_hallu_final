<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360">
  <defs>
    <!-- Arrowheads -->
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f4e79"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#207245"/>
    </marker>
  </defs>

  <!-- COMPUTER BOX -->
  <!-- Main body -->
  <rect x="130" y="10" width="160" height="150" rx="6" ry="6"
        fill="#e6f2ff" stroke="#1f4e79" stroke-width="1.5"/>
  <!-- Dashed top border overlay -->
  <line x1="130" y1="10" x2="290" y2="10"
        stroke="#1f4e79" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Computer icon circle -->
  <circle cx="160" cy="25" r="12" fill="#1f4e79" stroke="#13324d" stroke-width="1"/>
  <text x="160" y="29" text-anchor="middle" font-family="Segoe UI, sans-serif"
        font-size="12" fill="#ffffff">C</text>

  <!-- Computer title -->
  <text x="180" y="29" font-family="Segoe UI, sans-serif"
        font-size="13" fill="#1f4e79">Computer</text>

  <!-- Computer attributes bullets and labels -->
  <!-- ProcessorType -->
  <circle cx="145" cy="55" r="3.2" fill="#1f4e79"/>
  <text x="155" y="58" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">ProcessorType</text>

  <!-- RAM -->
  <circle cx="145" cy="73" r="3.2" fill="#1f4e79"/>
  <text x="155" y="76" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">RAM</text>

  <!-- StorageType -->
  <circle cx="145" cy="91" r="3.2" fill="#1f4e79"/>
  <text x="155" y="94" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">StorageType</text>

  <!-- OSVersion -->
  <circle cx="145" cy="109" r="3.2" fill="#1f4e79"/>
  <text x="155" y="112" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">OSVersion</text>

  <!-- NetworkAdapter -->
  <circle cx="145" cy="127" r="3.2" fill="#1f4e79"/>
  <text x="155" y="130" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">NetworkAdapter</text>

  <!-- ConnectedUser -->
  <circle cx="145" cy="145" r="3.2" fill="#1f4e79"/>
  <text x="155" y="148" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">ConnectedUser</text>

  <!-- USER BOX -->
  <rect x="30" y="170" width="150" height="130" rx="6" ry="6"
        fill="#ffe6ec" stroke="#b22222" stroke-width="1.5"/>
  <line x1="30" y1="170" x2="180" y2="170"
        stroke="#b22222" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- User icon -->
  <circle cx="60" cy="185" r="12" fill="#b22222" stroke="#7a1515" stroke-width="1"/>
  <text x="60" y="189" text-anchor="middle" font-family="Segoe UI, sans-serif"
        font-size="12" fill="#ffffff">C</text>

  <!-- User title -->
  <text x="80" y="189" font-family="Segoe UI, sans-serif"
        font-size="13" fill="#b22222">User</text>

  <!-- User attributes -->
  <circle cx="45" cy="211" r="3.2" fill="#b22222"/>
  <text x="55" y="214" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">UserName</text>

  <circle cx="45" cy="229" r="3.2" fill="#b22222"/>
  <text x="55" y="232" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">Role</text>

  <circle cx="45" cy="247" r="3.2" fill="#b22222"/>
  <text x="55" y="250" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">LoginTime</text>

  <circle cx="45" cy="265" r="3.2" fill="#b22222"/>
  <text x="55" y="268" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">Status</text>

  <circle cx="45" cy="283" r="3.2" fill="#b22222"/>
  <text x="55" y="286" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">Email</text>

  <!-- NETWORK BOX -->
  <rect x="210" y="200" width="170" height="120" rx="6" ry="6"
        fill="#e7f8ec" stroke="#207245" stroke-width="1.5"/>
  <line x1="210" y1="200" x2="380" y2="200"
        stroke="#207245" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Network icon -->
  <circle cx="240" cy="215" r="12" fill="#207245" stroke="#134529" stroke-width="1"/>
  <text x="240" y="219" text-anchor="middle" font-family="Segoe UI, sans-serif"
        font-size="12" fill="#ffffff">C</text>

  <!-- Network title -->
  <text x="260" y="219" font-family="Segoe UI, sans-serif"
        font-size="13" fill="#207245">Network</text>

  <!-- Network attributes -->
  <circle cx="225" cy="241" r="3.2" fill="#207245"/>
  <text x="235" y="244" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">IPAddress</text>

  <circle cx="225" cy="259" r="3.2" fill="#207245"/>
  <text x="235" y="262" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">Port</text>

  <circle cx="225" cy="277" r="3.2" fill="#207245"/>
  <text x="235" y="280" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">Protocol</text>

  <circle cx="225" cy="295" r="3.2" fill="#207245"/>
  <text x="235" y="298" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">Subnet</text>

  <circle cx="225" cy="313" r="3.2" fill="#207245"/>
  <text x="235" y="316" font-family="Segoe UI, sans-serif"
        font-size="11" fill="#000000">Gateway</text>

  <!-- CONNECTOR: Computer to User (solid blue curve) -->
  <path d="M140,120 C110,145 95,160 85,180"
        fill="none" stroke="#1f4e79" stroke-width="2"
        marker-end="url(#arrow-blue)"/>

  <!-- CONNECTOR: Computer to Network (dashed green curve) -->
  <path d="M290,120 C320,150 330,185 320,210"
        fill="none" stroke="#207245" stroke-width="2"
        stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>

</svg>