<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quadratic Function Visualization</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #fff;
    }
    .chart-container {
      width: 100%;
      height: 400px;
      margin-bottom: 40px;
    }
    .chart-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .chart-title.top {
      color: #1a1a33;
    }
    .chart-title.bottom {
      color: #8b0000;
    }
  </style>
</head>
<body>
  <div class="chart-container" id="chart1"></div>
  <div class="chart-container" id="chart2"></div>

  <script>
    // Generate data for f(x) = x² - 2x + 3 from x=1 to x=24
    const xValues = Array.from({ length: 24 }, (_, i) => i + 1);
    const yValues = xValues.map(x => x * x - 2 * x + 3);

    // Chart 1: Quadratic Function
    const chart1 = echarts.init(document.getElementById('chart1'));
    const option1 = {
      title: {
        text: 'Quadratic Function: f(x) = x² - 2x + 3',
        left: 'center',
        textStyle: {
          color: '#1a1a33',
          fontSize: 16
        }
      },
      tooltip: { show: true },
      xAxis: {
        type: 'category',
        data: xValues.map(x => `x=${x}`),
        axisLabel: { rotate: 45, interval: 0 },
        axisLine: { show: false },
        axisTick: { show: false }
      },
      yAxis: {
        type: 'value',
        name: 'f(x) Value',
        nameLocation: 'middle',
        nameGap: 30,
        min: 0,
        max: 600,
        splitLine: { lineStyle: { color: '#ddd' } }
      },
      series: [{
        data: yValues,
        type: 'line',
        smooth: true,
        symbol: 'rect',
        symbolSize: 8,
        itemStyle: {
          color: '#ffeb3b'
        },
        lineStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: '#4a148c' },
            { offset: 1, color: '#d32f2f' }
          ])
        },
        areaStyle: {}
      }],
      grid: { left: '10%', right: '10%', top: '15%', bottom: '15%' }
    };
    chart1.setOption(option1);

    // Chart 2: Function Value Progression (Second View)
    const chart2 = echarts.init(document.getElementById('chart2'));
    const option2 = {
      title: {
        text: 'Function Value Progression (Second View)',
        left: 'center',
        textStyle: {
          color: '#8b0000',
          fontSize: 16
        }
      },
      tooltip: { show: true },
      xAxis: {
        type: 'category',
        data: xValues.map(x => `x=${x}`),
        axisLabel: { rotate: 45, interval: 0 },
        axisLine: { show: false },
        axisTick: { show: false }
      },
      yAxis: {
        type: 'value',
        name: 'f(x) Value',
        nameLocation: 'middle',
        nameGap: 30,
        min: 0,
        max: 600,
        splitLine: { lineStyle: { color: '#ddd' } }
      },
      series: [{
        data: yValues,
        type: 'line',
        smooth: true,
        symbol: 'rect',
        symbolSize: 8,
        itemStyle: {
          color: '#d32f2f'
        },
        lineStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: '#5d4037' },
            { offset: 1, color: '#388e3c' }
          ])
        },
        areaStyle: {}
      }],
      grid: { left: '10%', right: '10%', top: '15%', bottom: '15%' }
    };
    chart2.setOption(option2);

    // Responsive resize
    window.addEventListener('resize', () => {
      chart1.resize();
      chart2.resize();
    });
  </script>
</body>
</html>
