<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Quadratic Function Plot</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fff;
        }
        #chart-container {
            width: 100%;
            height: 100%;
            margin: 0 auto;
        }
        .chart-title {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="chart-container">
        <div id="main" style="width: 100%; height: 100vh;"></div>
    </div>
    <script type="text/javascript">
        const chartDom = document.getElementById('main');
        const myChart = echarts.init(chartDom);
        
        const data = [
            [-4, 9], [-3, 4], [-2, 1], [-1, 0], [0, 1],
            [1, 4], [2, 9], [3, 16], [4, 25], [5, 36],
            [6, 49], [7, 64]
        ];

        const option = {
            title: {
                text: 'Quadratic Function: y = x² + 2x + 1',
                left: 'center',
                top: 22,
                textStyle: {
                    fontSize: 20,
                    fontWeight: 'bold',
                    color: '#222'
                }
            },
            grid: {
                left: 60,
                right: 40,
                top: 70,
                bottom: 60,
                containLabel: false
            },
            xAxis: {
                type: 'value',
                min: -4,
                max: 8,
                interval: 2,
                name: 'x',
                nameLocation: 'middle',
                nameGap: 18,
                nameTextStyle: {
                    color: '#000',
                    fontSize: 14,
                    fontWeight: 'bold'
                },
                axisLabel: { show: true, color: '#222', fontSize: 14 },
                axisLine: { show: true, lineStyle: { color: '#222', width: 1.5 } },
                axisTick: { show: true, lineStyle: { color: '#222' } },
                splitLine: { show: false }
            },
            yAxis: {
                type: 'value',
                min: 0,
                max: 70,
                interval: 10,
                axisLabel: { show: true, color: '#222', fontSize: 14 },
                axisLine: { show: true, lineStyle: { color: '#222', width: 1.5 } },
                axisTick: { show: true, lineStyle: { color: '#222' } },
                splitLine: { show: false }
            },
            graphic: [{
                type: 'text',
                left: 10,
                top: 'middle',
                rotation: Math.PI / 2,
                style: {
                    text: 'y',
                    fill: '#000',
                    font: 'bold 14px sans-serif'
                }
            }],
            series: [{
                type: 'scatter',
                data: data,
                symbolSize: 18,
                itemStyle: { color: '#d9534f', borderColor: '#333', borderWidth: 2 }
            }],
            tooltip: {
                trigger: 'item',
                formatter: function(params) {
                    return `x: ${params.value[0]}<br/>y: ${params.value[1]}`;
                }
            }
        };
        
        myChart.setOption(option);
    </script>
</body>
</html>
