<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect x="0" y="0" width="600" height="300" fill="none" stroke="black" stroke-dasharray="5,5"/>

  <rect x="50" y="50" width="120" height="60" fill="#ADD8E6" stroke="black">
    <text x="60" y="80" font-family="sans-serif" font-size="12">CPU Core</text>
    <text x="60" y="95" font-family="sans-serif" font-size="10">Execution</text>
  </rect>

  <rect x="200" y="50" width="150" height="60" fill="#90EE90" stroke="black">
    <text x="75" y="80" font-family="sans-serif" font-size="12">RAM Module</text>
    <text x="75" y="95" font-family="sans-serif" font-size="10">Cache Unit</text>
  </rect>

  <rect x="380" y="50" width="80" height="60" fill="#F08080" stroke="black">
    <text x="40" y="80" font-family="sans-serif" font-size="12">Memory</text>
  </rect>

  <rect x="480" y="50" width="100" height="60" fill="#FFA500" stroke="black">
    <text x="50" y="80" font-family="sans-serif" font-size="12">Network</text>
    <text x="50" y="95" font-family="sans-serif" font-size="10">Adapter</text>
  </rect>

  <line x1="20" y1="80" x2="170" y2="80" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="10" y="70" font-family="sans-serif" font-size="10">Request</text>

  <line x1="170" y1="80" x2="200" y2="80" stroke="black" stroke-width="2"/>
  <text x="175" y="70" font-family="sans-serif" font-size="10">Process</text>

  <line x1="350" y1="80" x2="380" y2="80" stroke="black" stroke-width="2"/>
  <text x="355" y="70" font-family="sans-serif" font-size="10">Memo</text>

  <line x1="460" y1="80" x2="530" y2="80" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="70" font-family="sans-serif" font-size="10">Response</text>

  <line x1="170" y1="110" x2="200" y2="110" stroke="black" stroke-width="2"/>

  <line x1="460" y1="110" x2="170" y2="110" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="black"/>
    </marker>
  </defs>
</svg>