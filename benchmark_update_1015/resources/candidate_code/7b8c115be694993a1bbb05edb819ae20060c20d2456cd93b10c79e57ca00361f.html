<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unemployment Rate vs GDP Growth</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
        }
        #chart-container {
            width: 800px;
            height: 600px;
        }
        .chart-title {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="chart-title">Unemployment Rate vs GDP Growth (Economics)</div>
    <div id="chart-container"></div>
    <script>
        var chartDom = document.getElementById('chart-container');
        var myChart = echarts.init(chartDom);

        var option = {
            title: {
                text: 'Unemployment Rate vs GDP Growth (Economics)',
                left: 'center'
            },
            legend: {
                data: ['2018', '2020'],
                right: '10%'
            },
            tooltip: {
                trigger: 'axis'
            },
            xAxis: {
                type: 'value',
                name: 'GDP Growth (%)',
                min: -12,
                max: 9,
                axisLabel: {
                    formatter: '{value}%'
                }
            },
            yAxis: {
                type: 'value',
                name: 'Unemployment Rate (%)',
                min: 2,
                max: 16,
                axisLabel: {
                    formatter: '{value}%'
                }
            },
            series: [
                {
                    name: '2018',
                    type: 'scatter',
                    data: [
                        [6.5, 4.5], [3.5, 5.5], [2.5, 6.5], [1.5, 7.5], [0.5, 8.5], [3.5, 9.5], [6.5, 10.5]
                    ],
                    itemStyle: {
                        color: 'blue'
                    }
                },
                {
                    name: '2020',
                    type: 'scatter',
                    data: [
                        [-7.5, 14.5], [-5.5, 13.5], [-4.5, 9.5], [-3.5, 8.5], [-2.5, 7.5], [-1.5, 6.5], [-0.5, 5.5]
                    ],
                    itemStyle: {
                        color: 'red'
                    }
                }
            ]
        };

        myChart.setOption(option);
    </script>
</body>
</html>
