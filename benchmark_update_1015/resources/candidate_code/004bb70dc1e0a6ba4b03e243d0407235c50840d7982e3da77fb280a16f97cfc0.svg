<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Grid lines -->
  <path d="M0 50 V550" stroke="#ccc" stroke-dasharray="2,2"/>
  <path d="M175 50 V550" stroke="#ccc" stroke-dasharray="2,2"/>
  <path d="M350 50 V550" stroke="#ccc" stroke-dasharray="2,2"/>
  <path d="M525 50 V550" stroke="#ccc" stroke-dasharray="2,2"/>
  <path d="M700 50 V550" stroke="#ccc" stroke-dasharray="2,2"/>
  
  <!-- Bars -->
  <rect x="0" y="50" width="656" height="30" fill="#1f77b4"/>
  <rect x="0" y="90" width="586" height="30" fill="#1f77b4"/>
  <rect x="0" y="130" width="481" height="30" fill="#1f77b4"/>
  <rect x="0" y="170" width="394" height="30" fill="#1f77b4"/>
  <rect x="0" y="210" width="350" height="30" fill="#1f77b4"/>
  <rect x="0" y="250" width="306" height="30" fill="#1f77b4"/>
  <rect x="0" y="290" width="219" height="30" fill="#1f77b4"/>
  <rect x="0" y="330" width="193" height="30" fill="#1f77b4"/>
  <rect x="0" y="370" width="158" height="30" fill="#1f77b4"/>
  <rect x="0" y="410" width="131" height="30" fill="#1f77b4"/>
  <rect x="0" y="450" width="105" height="30" fill="#1f77b4"/>
  
  <!-- Sector labels -->
  <text x="-10" y="70" text-anchor="end" font-size="12">Technology</text>
  <text x="-10" y="110" text-anchor="end" font-size="12">Healthcare</text>
  <text x="-10" y="150" text-anchor="end" font-size="12">Finance</text>
  <text x="-10" y="190" text-anchor="end" font-size="12">Manufacturing</text>
  <text x="-10" y="230" text-anchor="end" font-size="12">Agriculture</text>
  <text x="-10" y="270" text-anchor="end" font-size="12">Retail</text>
  <text x="-10" y="310" text-anchor="end" font-size="12">Construction</text>
  <text x="-10" y="350" text-anchor="end" font-size="12">Energy</text>
  <text x="-10" y="390" text-anchor="end" font-size="12">Transportation</text>
  <text x="-10" y="430" text-anchor="end" font-size="12">Education</text>
  <text x="-10" y="470" text-anchor="end" font-size="12">Tourism</text>
  
  <!-- X-axis percentage labels -->
  <text x="0" y="560" text-anchor="middle" font-size="10">0%</text>
  <text x="175" y="560" text-anchor="middle" font-size="10">2%</text>
  <text x="350" y="560" text-anchor="middle" font-size="10">4%</text>
  <text x="525" y="560" text-anchor="middle" font-size="10">6%</text>
  <text x="700" y="560" text-anchor="middle" font-size="10">8%</text>
  
  <!-- Title -->
  <text x="400" y="300" text-anchor="middle" font-size="16" fill="#1f77b4">
    <tspan x="400" dy="0">Regional GDP Growth by Economic Sector</tspan>
    <tspan x="400" dy="20">Annual Percentage Change</tspan>
    <tspan x="400" dy="20">(2020-2023)</tspan>
  </text>
  
  <!-- X-axis label -->
  <text x="400" y="580" text-anchor="middle" font-size="14" fill="#d62728">Percentage (%)</text>
</svg>