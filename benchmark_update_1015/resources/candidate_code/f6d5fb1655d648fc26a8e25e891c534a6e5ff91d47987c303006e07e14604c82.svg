<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Background -->
  <rect width="600" height="300" fill="white" />

  <!-- Box 1: Force -->
  <rect x="60" y="80" width="140" height="100" rx="15" fill="#e0f7fa" stroke="#006064" stroke-width="2" stroke-dasharray="4,2" />
  <text x="130" y="115" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle">Force (F)</text>
  <!-- Formula F = m * a -->
  <g transform="translate(95, 135)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="18" fill="#333">F = m · a</text>
    <!-- Arrow over F -->
    <path d="M2,2 L18,2 M14,-2 L18,2 L14,6" fill="none" stroke="#0d47a1" stroke-width="1.5" />
  </g>

  <!-- Arrow 1 -->
  <path d="M210,130 L260,130" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowhead)" />

  <!-- Box 2: Energy -->
  <rect x="265" y="80" width="140" height="100" rx="15" fill="#fff9c4" stroke="#ef6c00" stroke-width="2" stroke-dasharray="4,2" />
  <text x="335" y="115" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#bf360c" text-anchor="middle">Energy (E)</text>
  <text x="335" y="150" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="middle">E = F · d</text>

  <!-- Arrow 2 -->
  <path d="M415,130 L465,130" fill="none" stroke="#1a237e" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowhead-blue)" />

  <!-- Box 3: Power -->
  <rect x="470" y="80" width="140" height="100" rx="15" fill="#dcedc8" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,2" />
  <text x="540" y="115" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1b5e20" text-anchor="middle">Power (P)</text>
  <!-- Formula P = E / t -->
  <g transform="translate(505, 135)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="18" fill="#333">P = E / t</text>
    <!-- Zigzag over P -->
    <path d="M5,5 L15,-5 L10,10 L20,0" fill="none" stroke="#1b5e20" stroke-width="1.5" />
  </g>

  <!-- Bottom Banner -->
  <rect x="30" y="220" width="540" height="35" rx="5" fill="#fff9c4" stroke="#bf360c" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="300" y="245" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#bf360c" text-anchor="middle">Physics Flow: Force → Energy → Power</text>

  <!-- Marker Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a237e" />
    </marker>
  </defs>
</svg>