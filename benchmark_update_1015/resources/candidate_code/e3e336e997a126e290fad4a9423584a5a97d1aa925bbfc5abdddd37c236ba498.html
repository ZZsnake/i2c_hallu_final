<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplication Table Heatmap</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        #heatmap {
            width: 600px;
            height: 600px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div id="heatmap"></div>
    <script>
        const chart = echarts.init(document.getElementById('heatmap'));
        const rows = [6, 5, 4, 3, 2, 1];
        const cols = [1, 2, 3, 4, 5, 6];
        const data = [];
        for (let y = 0; y < 6; y++) {
            for (let x = 0; x < 6; x++) {
                data.push([x, y, rows[y] * cols[x]]);
            }
        }
        const option = {
            title: {
                text: 'Multiplication Table Heatmap (1-6)',
                left: 'center'
            },
            tooltip: {
                formatter: function (params) {
                    return `Row ${rows[params.value[1]]} × Column ${cols[params.value[0]]} = ${params.value[2]}`;
                }
            },
            xAxis: {
                type: 'category',
                data: cols,
                name: 'Column',
                nameLocation: 'center',
                nameGap: 30
            },
            yAxis: {
                type: 'category',
                data: rows,
                name: 'Row',
                nameLocation: 'center',
                nameGap: 30
            },
            visualMap: {
                min: 1,
                max: 36,
                type: 'continuous',
                orient: 'horizontal',
                left: 'center',
                bottom: 10,
                inRange: {
                    color: ['#0066CC', '#00FF00', '#FFFF00', '#FFA500', '#FF0000']
                },
                calculable: true,
                precision: 0,
                text: ['36', '1'],
                inverse: true
            },
            series: [{
                name: 'Product',
                type: 'heatmap',
                data: data,
                label: {
                    show: true,
                    formatter: function(params) {
                        return params.value[2];
                    },
                    color: '#fff',
                    fontWeight: 'bold'
                },
                itemStyle: {
                    borderColor: '#fff',
                    borderWidth: 1
                }
            }]
        };
        chart.setOption(option);
    </script>
</body>
</html>
