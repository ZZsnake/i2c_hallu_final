<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <!-- Define gradients for the magnet -->
  <defs>
    <linearGradient id="magnetGradientS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a9d8f" />
      <stop offset="100%" style="stop-color:#264653" />
    </linearGradient>
    <linearGradient id="magnetGradientN" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e76f51" />
      <stop offset="100%" style="stop-color:#f4a261" />
    </linearGradient>
  </defs>

  <!-- Top Diagram -->
  <g transform="translate(50, 30)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="350" height="250" fill="none" stroke="black" stroke-width="2"/>

    <!-- Magnet body -->
    <rect x="50" y="100" width="125" height="50" fill="url(#magnetGradientS)" />
    <rect x="175" y="100" width="125" height="50" fill="url(#magnetGradientN)" />

    <!-- Pole labels -->
    <text x="65" y="135" font-family="Arial, sans-serif" font-size="24" fill="#264653" font-weight="bold">S</text>
    <text x="275" y="135" font-family="Arial, sans-serif" font-size="24" fill="#e76f51" font-weight="bold">N</text>

    <!-- Magnetic field lines (solid blue/black) -->
    <!-- Lines entering S pole -->
    <path d="M40 100 C 20 110, 20 140, 40 150" fill="none" stroke="#264653" stroke-width="1.5" marker-end="url(#arrowheadSolid)"/>
    <path d="M50 80 C 30 90, 30 160, 50 170" fill="none" stroke="#264653" stroke-width="1.5" marker-end="url(#arrowheadSolid)"/>
    <path d="M60 70 C 40 80, 40 170, 60 180" fill="none" stroke="#264653" stroke-width="1.5" marker-end="url(#arrowheadSolid)"/>
    <path d="M70 60 C 50 70, 50 180, 70 190" fill="none" stroke="#264653" stroke-width="1.5" marker-end="url(#arrowheadSolid)"/>
    <path d="M80 50 C 60 60, 60 190, 80 200" fill="none" stroke="#264653" stroke-width="1.5" marker-end="url(#arrowheadSolid)"/>

    <!-- Lines exiting N pole -->
    <path d="M310 100 C 330 110, 330 140, 310 150" fill="none" stroke="#264653" stroke-width="1.5" marker-start="url(#arrowheadSolid)"/>
    <path d="M300 80 C 320 90, 320 160, 300 170" fill="none" stroke="#264653" stroke-width="1.5" marker-start="url(#arrowheadSolid)"/>
    <path d="M290 70 C 310 80, 310 170, 290 180" fill="none" stroke="#264653" stroke-width="1.5" marker-start="url(#arrowheadSolid)"/>
    <path d="M280 60 C 300 70, 300 180, 280 190" fill="none" stroke="#264653" stroke-width="1.5" marker-start="url(#arrowheadSolid)"/>
    <path d="M270 50 C 290 60, 290 190, 270 200" fill="none" stroke="#264653" stroke-width="1.5" marker-start="url(#arrowheadSolid)"/>

    <!-- Curved lines -->
    <path d="M270 125 C 270 20, 100 20, 80 125" fill="none" stroke="#264653" stroke-width="1.5" marker-mid="url(#arrowheadSolidMid)"/>
    <path d="M270 125 C 270 230, 100 230, 80 125" fill="none" stroke="#264653" stroke-width="1.5" marker-mid="url(#arrowheadSolidMidDown)"/>

    <!-- Symbol B_s -->
    <text x="380" y="135" font-family="Arial, sans-serif" font-size="48" fill="#333">B</text>
    <text x="410" y="150" font-family="Arial, sans-serif" font-size="24" fill="#333">s</text>
  </g>

  <!-- Bottom Diagram -->
  <g transform="translate(50, 320)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="350" height="250" fill="none" stroke="black" stroke-width="2"/>

    <!-- Magnet body -->
    <rect x="50" y="100" width="125" height="50" fill="url(#magnetGradientS)" />
    <rect x="175" y="100" width="125" height="50" fill="url(#magnetGradientN)" />

    <!-- Pole labels -->
    <text x="65" y="135" font-family="Arial, sans-serif" font-size="24" fill="#264653" font-weight="bold">S</text>
    <text x="275" y="135" font-family="Arial, sans-serif" font-size="24" fill="#e76f51" font-weight="bold">N</text>

    <!-- Magnetic field lines (dashed red) -->
    <!-- Lines entering S pole -->
    <path d="M40 100 C 20 110, 20 140, 40 150" fill="none" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowheadDashed)"/>
    <path d="M50 80 C 30 90, 30 160, 50 170" fill="none" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowheadDashed)"/>
    <path d="M60 70 C 40 80, 40 170, 60 180" fill="none" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowheadDashed)"/>
    <path d="M70 60 C 50 70, 50 180, 70 190" fill="none" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowheadDashed)"/>
    <path d="M80 50 C 60 60, 60 190, 80 200" fill="none" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowheadDashed)"/>

    <!-- Lines exiting N pole -->
    <path d="M310 100 C 330 110, 330 140, 310 150" fill="none" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="5 3" marker-start="url(#arrowheadDashed)"/>
    <path d="M300 80 C 320 90, 320 160, 300 170" fill="none" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="5 3" marker-start="url(#arrowheadDashed)"/>
    <path d="M290 70 C 310 80, 310 170, 290 180" fill="none" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="5 3" marker-start="url(#arrowheadDashed)"/>
    <path d="M280 60 C 300 70, 300 180, 280 190" fill="none" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="5 3" marker-start="url(#arrowheadDashed)"/>
    <path d="M270 50 C 290 60, 290 190, 270 200" fill="none" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="5 3" marker-start="url(#arrowheadDashed)"/>

    <!-- Curved lines -->
    <path d="M270 125 C 270 20, 100 20, 80 125" fill="none" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="5 3" marker-mid="url(#arrowheadDashedMid)"/>
    <path d="M270 125 C 270 230, 100 230, 80 125" fill="none" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="5 3" marker-mid="url(#arrowheadDashedMidDown)"/>

    <!-- Symbol H -->
    <text x="380" y="135" font-family="Arial, sans-serif" font-size="48" fill="#333">H</text>
  </g>

  <!-- Marker definitions for arrowheads -->
  <defs>
    <!-- Solid arrowheads -->
    <marker id="arrowheadSolid" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#264653" />
    </marker>
    <marker id="arrowheadSolidMid" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#264653" />
    </marker>
    <marker id="arrowheadSolidMidDown" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#264653" />
    </marker>

    <!-- Dashed arrowheads -->
    <marker id="arrowheadDashed" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e76f51" />
    </marker>
    <marker id="arrowheadDashedMid" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e76f51" />
    </marker>
    <marker id="arrowheadDashedMidDown" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e76f51" />
    </marker>
  </defs>
</svg>