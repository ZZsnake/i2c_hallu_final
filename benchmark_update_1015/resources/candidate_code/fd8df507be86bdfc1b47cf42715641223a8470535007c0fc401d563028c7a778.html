<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDP Growth Rate (2013-2022)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            background-color: white;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 600px;
        }
        .echarts {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GDP Growth Rate (2013-2022)</h1>
        <div class="chart-container" id="gdpChart"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        const chart = echarts.init(document.getElementById('gdpChart'));

        const option = {
            title: {
                text: 'GDP Growth Rate (2013-2022)',
                left: 'center'
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'line'
                }
            },
            legend: {
                data: ['Country A', 'Country B', 'Country C'],
                top: 'bottom'
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: ['2013', '2014', '2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022']
            },
            yAxis: {
                type: 'value',
                min: -3,
                max: 5
            },
            series: [
                {
                    name: 'Country A',
                    type: 'line',
                    data: [2.2, 2.5, 2.3, 2.4, 2.8, 3.2, 3.5, -1.2, 2.1, 2.9],
                    lineStyle: {
                        color: '#1f77b4'
                    }
                },
                {
                    name: 'Country B',
                    type: 'line',
                    data: [1.8, 2.0, 2.2, 2.0, 2.3, 2.5, 2.4, -1.5, 1.9, 2.1],
                    lineStyle: {
                        color: '#ff7f0e'
                    }
                },
                {
                    name: 'Country C',
                    type: 'line',
                    data: [3.0, 3.2, 2.9, 3.1, 3.5, 3.8, 3.3, -2.0, 2.8, 3.0],
                    lineStyle: {
                        color: '#2ca02c'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
