<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Background grid -->
  <rect width="100%" height="100%" fill="#fff9e6"/>
  <g stroke="#d2d2d2">
    <!-- Horizontal grid lines -->
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <!-- Vertical grid lines -->
    <line x1="0" y1="0" x2="0" y2="600"/>
    <line x1="120" y1="0" x2="120" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="360" y1="0" x2="360" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>
  <!-- Axes -->
  <line x1="0" y1="500" x2="600" y2="500" stroke="black" stroke-width="2"/>
  <line x1="0" y1="500" x2="0" y2="0" stroke="black" stroke-width="2"/>
  <!-- Diagonal line -->
  <line x1="0" y1="500" x2="600" y2="0" stroke="black" stroke-width="2"/>
  <!-- Lorenz curve -->
  <path d="M0,500 Q120,400 240,300 Q360,200 600,0" stroke="red" stroke-width="2" fill="none"/>
  <!-- Title -->
  <text x="300" y="30" font-size="20" text-anchor="middle" font-family="Arial" fill="black">Curva de Lorenz</text>
</svg>