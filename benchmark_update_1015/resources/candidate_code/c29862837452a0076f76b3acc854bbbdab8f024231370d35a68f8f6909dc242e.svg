<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- Continents -->
  <ellipse cx="300" cy="100" rx="100" ry="50" fill="lightgreen" />
  <text x="300" y="110" font-size="16" text-anchor="middle">Continents</text>
  
  <!-- Countries -->
  <ellipse cx="300" cy="250" rx="100" ry="50" fill="lightsalmon" />
  <text x="300" y="260" font-size="16" text-anchor="middle">Countries</text>
  <text x="300" y="240" font-size="12" text-anchor="middle">includes</text>
  
  <!-- Regions -->
  <ellipse cx="300" cy="400" rx="100" ry="50" fill="lavender" />
  <text x="300" y="410" font-size="16" text-anchor="middle">Regions</text>
  <text x="300" y="390" font-size="12" text-anchor="middle">contains</text>
  
  <!-- Cities -->
  <ellipse cx="300" cy="550" rx="100" ry="50" fill="khaki" />
  <text x="300" y="560" font-size="16" text-anchor="middle">Cities</text>
  <text x="300" y="540" font-size="12" text-anchor="middle">grouped by</text>
  
  <!-- Coastal Zone -->
  <ellipse cx="100" cy="650" rx="100" ry="50" fill="lightskyblue" />
  <text x="100" y="660" font-size="16" text-anchor="middle">Coastal Zone</text>
  <text x="200" y="660" font-size="12" text-anchor="middle">adjacent to</text>
  
  <!-- Mountain Zone -->
  <ellipse cx="500" cy="650" rx="100" ry="50" fill="pink" />
  <text x="500" y="660" font-size="16" text-anchor="middle">Mountain Zone</text>
  <text x="400" y="660" font-size="12" text-anchor="middle">adjacent to</text>
  
  <!-- Title -->
  <text x="300" y="750" font-size="18" text-anchor="middle">Geographic Hierarchy</text>
</svg>