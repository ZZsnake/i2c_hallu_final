<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Test Scores by Topic</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: white;
        }
        #chart-container {
            width: 800px;
            height: 600px;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        var chartDom = document.getElementById('chart-container');
        var myChart = echarts.init(chartDom);
        var option;

        option = {
            title: {
                text: 'Math Test Scores by Topic',
                subtext: 'Sample Dataset',
                left: 'center'
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'shadow'
                }
            },
            legend: {
                data: ['Average Score'],
                right: '10%'
            },
            xAxis: {
                type: 'category',
                data: ['Algebra', 'Geometry', 'Calculus', 'Statistics', 'Trigonometry']
            },
            yAxis: {
                type: 'value',
                name: 'Score (%)',
                min: 0,
                max: 100
            },
            series: [
                {
                    name: 'Average Score',
                    type: 'bar',
                    data: [85, 75, 60, 90, 70],
                    itemStyle: {
                        color: 'blue'
                    }
                }
            ]
        };

        option && myChart.setOption(option);
    </script>
</body>
</html>
