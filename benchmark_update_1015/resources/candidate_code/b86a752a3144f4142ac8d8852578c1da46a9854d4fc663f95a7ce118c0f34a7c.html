<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Problem Types Solved</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chart-container {
            width: 60%;
            height: 400px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="mainChart" class="chart-container"></div>
    </div>
    <h1>Number of Geometry Problem Types Solved</h1>

    <script>
        var myChart = echarts.init(document.getElementById('mainChart'));
        var option = {
            title: {
                text: 'Number of Geometry Problem Types Solved',
                left: 'center'
            },
            tooltip: {
                trigger: 'item'
            },
            xAxis: {
                type: 'category',
                data: ['Problem Solved', 'Problems Solved']
            },
            yAxis: {
                type: 'value'
            },
            series: [
                {
                    name: 'Types',
                    type: 'bar',
                    data: [34, 27, 19, 41, 23],
                    itemStyle: {
                        color: '#1e90ff'
                    }
                }
            ]
        };
        myChart.setOption(option);
    </script>
</body>
</html>
