<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Household Expenditure Breakdown - ECharts</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      color: #222222;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .page {
      width: 100%;
      max-width: 1365px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 24px;
    }

    .chart-title {
      text-align: center;
      margin-bottom: 8px;
    }

    .chart-title h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .chart-title h2 {
      font-size: 11px;
      font-weight: 400;
      color: #777777;
    }

    .chart-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 40px 40px;
    }

    #donutChart {
      width: 900px;
      height: 520px;
    }

    @media (max-width: 1024px) {
      .chart-wrapper {
        padding: 8px 10px 20px;
      }
      #donutChart {
        width: 100%;
        height: 480px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="chart-title">
      <h1>Household Expenditure Breakdown</h1>
      <h2>Sample Data - Economics</h2>
    </div>
    <div class="chart-wrapper">
      <div id="donutChart"></div>
    </div>
  </div>

  <script>
    $(function () {
      var chartDom = document.getElementById('donutChart');
      var myChart = echarts.init(chartDom);

      var option = {
        title: {
          // Titles handled via HTML, keep ECharts title off
          show: false
        },
        tooltip: {
          trigger: 'item',
          formatter: '{b}: {d}%'
        },
        legend: {
          orient: 'vertical',
          right: '6%',
          top: 'center',
          itemWidth: 18,
          itemHeight: 12,
          textStyle: {
            fontSize: 11
          }
        },
        series: [
          {
            name: 'Household Expenditure',
            type: 'pie',
            radius: ['45%', '70%'],
            center: ['50%', '54%'],
            avoidLabelOverlap: true,
            startAngle: 90,
            label: {
              show: true,
              position: 'outside',
              formatter: '{b}: {d}%',
              fontSize: 11,
              color: '#222222'
            },
            labelLine: {
              show: true,
              length: 18,
              length2: 12,
              smooth: 0.3
            },
            itemStyle: {
              borderColor: '#ffffff',
              borderWidth: 2
            },
            data: [
              { value: 29.79, name: 'Housing', itemStyle: { color: '#3374ff' } },
              { value: 20.21, name: 'Food', itemStyle: { color: '#2ecc71' } },
              { value: 14.89, name: 'Transportation', itemStyle: { color: '#ff6d2d' } },
              { value: 11.7, name: 'Healthcare', itemStyle: { color: '#a335ff' } },
              { value: 9.58, name: 'Education', itemStyle: { color: '#f1c40f' } },
              { value: 7.45, name: 'Entertainment', itemStyle: { color: '#008b8b' } },
              { value: 6.38, name: 'Other', itemStyle: { color: '#e41f35' } }
            ]
          }
        ]
      };

      myChart.setOption(option);

      window.addEventListener('resize', function () {
        myChart.resize();
      });
    });
  </script>
</body>
</html>
