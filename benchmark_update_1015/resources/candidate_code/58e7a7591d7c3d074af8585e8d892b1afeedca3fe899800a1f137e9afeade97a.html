<!DOCTYPE html>
<html lang="en" style="height: 100%">
<head>
    <meta charset="UTF-8">
    <title>Population Growth Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        html {
            height: 100%;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
        }
        .chart-container {
            width: 100%;
            height: 100%;
            margin: 0;
        }
        .title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <div id="populationChart" style="width: 100%; height: 100%;"></div>
    </div>

    <script>
        $(document).ready(function() {
            var chartDom = document.getElementById('populationChart');
            var myChart = echarts.init(chartDom);
            
            var option = {
                title: {
                    text: 'Population Growth in Major Cities (2020)',
                    left: 'center',
                    top: 10,
                    textStyle: {
                        color: '#1f4e79',
                        fontSize: 20,
                        fontWeight: 'bold'
                    }
                },
                legend: {
                    data: ['Population (Millions)'],
                    textStyle: {
                        color: '#212A3E',
                        fontSize: 15,
                        fontWeight: 'bold'
                    }
                },
                tooltip: {
                    trigger: 'axis'
                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom: '7%',
                    containLabel: true
                },
                xAxis: {
                    type: 'value',
                    axisLine: {
                        lineStyle: {
                            color: '#1F4E79',
                            width: 3
                        }
                    },
                    splitLine: {
                        show: true,
                        lineStyle: {
                            color: '#D6DBE9'
                        }
                    },
                    axisLabel: {
                        formatter: '{value} M',
                        color: '#1f2d3d',
                        fontWeight: 'bold',
                        fontSize: 14
                    }
                },
                yAxis: {
                    type: 'category',
                    data: ['New York', 'London', 'Tokyo', 'Delhi', 'Paris', 'Sydney', 'Cairo', 'Rio', 'Toronto'],
                    axisLine: {
                        lineStyle: {
                            color: '#1F4E79',
                            width: 3
                        }
                    },
                    axisLabel: {
                        color: '#2c3e50',
                        fontWeight: 'bold',
                        fontSize: 14
                    },
                    boundaryGap: false
                },
                series: [{
                    name: 'Population (Millions)',
                    type: 'line',
                    smooth: true,
                    symbol: 'rect',
                    symbolSize: 12,
                    itemStyle: {
                        color: '#5b8fa7',
                        borderColor: '#1f2d3d',
                        borderWidth: 2
                    },
                    lineStyle: {
                        color: '#ef3346',
                        width: 5,
                        shadowColor: 'rgba(0, 0, 0, 0.18)',
                        shadowBlur: 8,
                        shadowOffsetX: 3,
                        shadowOffsetY: 4
                    },
                    data: [8.6, 9.0, 13.9, 18.6, 2.1, 5.3, 9.5, 6.7, 2.8]
                }]
            };
            
            myChart.setOption(option);
            window.addEventListener('resize', function() {
                myChart.resize();
            });
        });
    </script>
</body>
</html>
