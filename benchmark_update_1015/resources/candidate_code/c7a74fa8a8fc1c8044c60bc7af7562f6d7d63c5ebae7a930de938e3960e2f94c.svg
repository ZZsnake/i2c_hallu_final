<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <!-- Blue background with dashed stroke -->
  <path d="M 50,30 Q 100,10 150,30 Q 150,140 100,150 Q 50,140 50,30 Z" 
        fill="#87CEEB" stroke="#000" stroke-dasharray="5,5" stroke-width="1"/>
  
  <!-- Esophagus (red rectangle) -->
  <rect x="95" y="40" width="10" height="60" fill="red"/>
  
  <!-- Trachea (green rectangle) -->
  <rect x="98" y="40" width="4" height="40" fill="green"/>
  
  <!-- Left Lung -->
  <ellipse cx="70" cy="80" rx="20" ry="30" fill="red"/>
  
  <!-- Right Lung -->
  <ellipse cx="130" cy="80" rx="20" ry="30" fill="red"/>
  
  <!-- Heart -->
  <circle cx="100" cy="120" r="10" fill="orange"/>
  
  <!-- Text labels -->
  <text x="100" y="35" font-family="Arial" font-size="12" fill="blue" text-anchor="middle">咽部</text>
  <text x="70" y="80" font-family="Arial" font-size="12" fill="red" text-anchor="middle">左肺</text>
  <text x="130" y="80" font-family="Arial" font-size="12" fill="red" text-anchor="middle">右肺</text>
  <text x="100" y="75" font-family="Arial" font-size="12" fill="blue" text-anchor="middle">食管</text>
  <text x="100" y="125" font-family="Arial" font-size="12" fill="orange" text-anchor="middle">心脏</text>
</svg>