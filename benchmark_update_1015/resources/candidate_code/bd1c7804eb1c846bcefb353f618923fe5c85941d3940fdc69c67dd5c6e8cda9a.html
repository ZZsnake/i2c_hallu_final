<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Problem Distribution by Day</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #chart {
            width: 100%;
            height: 80vh;
        }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            var chart = echarts.init(document.getElementById('chart'));
            var option = {
                title: {
                    text: 'Distribution of Math Problem Types by Day',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis'
                },
                xAxis: {
                    type: 'category',
                    data: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']
                },
                yAxis: {
                    type: 'value'
                },
                series: [{
                    name: 'Algebra',
                    type: 'bar',
                    data: [30, 32, 28, 30, 34, 31, 32]
                }, {
                    name: 'Geometry',
                    type: 'bar',
                    data: [25, 25, 25, 22, 20, 23, 20]
                }, {
                    name: 'Probability',
                    type: 'bar',
                    data: [17, 13, 19, 17, 16, 17, 15]
                }, {
                    name: 'Calculus',
                    type: 'bar',
                    data: [8, 12, 11, 9, 12, 11, 12]
                }, {
                    name: 'Logic',
                    type: 'bar',
                    data: [20, 19, 18, 22, 18, 19, 21]
                }]
            };
            chart.setOption(option);
        });
    </script>
</body>
</html>
