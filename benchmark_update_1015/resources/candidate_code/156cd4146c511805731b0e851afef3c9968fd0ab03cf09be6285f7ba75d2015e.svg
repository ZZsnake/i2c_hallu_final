<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Axes -->
  <line x1="50" y1="550" x2="50" y2="50" stroke="black" stroke-width="2"/>
  <line x1="50" y1="550" x2="750" y2="550" stroke="black" stroke-width="2"/>
  
  <!-- Demand Curve -->
  <path d="M50,550 Q200,100 400,50" stroke="cyan" stroke-width="2"/>
  
  <!-- Supply Curves -->
  <path d="M50,300 Q150,200 400,550" stroke="yellow" stroke-width="2"/>
  <path d="M50,350 Q150,250 400,550" stroke="yellow" stroke-width="2"/>
  <path d="M50,400 Q150,300 400,550" stroke="yellow" stroke-width="2"/>
  
  <!-- Ceiling and Floor Lines -->
  <line x1="50" y1="150" x2="750" y2="150" stroke="black" stroke-dasharray="5,5" stroke-width="2"/>
  <line x1="50" y1="450" x2="750" y2="450" stroke="black" stroke-dasharray="5,5" stroke-width="2"/>
  
  <!-- Equilibrium Points -->
  <line x1="250" y1="550" x2="250" y2="50" stroke="black" stroke-dasharray="5,5" stroke-width="1"/>
  <line x1="50" y1="300" x2="750" y2="300" stroke="black" stroke-dasharray="5,5" stroke-width="1"/>
  <line x1="350" y1="550" x2="350" y2="50" stroke="black" stroke-dasharray="5,5" stroke-width="1"/>
  <line x1="50" y1="350" x2="750" y2="350" stroke="black" stroke-dasharray="5,5" stroke-width="1"/>
  
  <!-- Labels -->
  <text x="30" y="570" font-family="Arial" font-size="12" text-anchor="middle">Q</text>
  <text x="20" y="560" font-family="Arial" font-size="12" text-anchor="end" transform="rotate(-90 20,560)">P</text>
  <text x="250" y="320" font-family="Arial" font-size="12" text-anchor="middle">Sell</text>
  <text x="350" y="370" font-family="Arial" font-size="12" text-anchor="middle">Buy</text>
  <text x="650" y="160" font-family="Arial" font-size="12" text-anchor="middle">Ceiling</text>
  <text x="650" y="460" font-family="Arial" font-size="12" text-anchor="middle">Floor</text>
</svg>