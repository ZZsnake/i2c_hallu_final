<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <!-- Horizontal axis line -->
    <line x1="0" x2="800" y1="300" y2="300" stroke="gray" stroke-width="1"/>
    
    <!-- Objective lens -->
    <ellipse cx="200" cy="200" rx="20" ry="60" fill="skyblue" stroke="blue" stroke-width="1"/>
    <text x="210" y="170" fill="blue" font-size="12">objective</text>
    <text x="220" y="150" fill="blue" font-size="10">f_objective</text>
    
    <!-- Eyepiece lens -->
    <ellipse cx="500" cy="250" rx="15" ry="50" fill="lightgreen" stroke="green" stroke-width="1"/>
    <text x="510" y="220" fill="green" font-size="12">eyepiece</text>
    <text x="520" y="200" fill="green" font-size="10">f_eyepiece</text>
    
    <!-- Eye representation -->
    <path d="M650 350 A50 80 0 0 0 750 350 A50 80 0 0 0 650 350" fill="maroon"/>
    <path d="M670 330 A30 60 0 0 0 730 330 A30 60 0 0 0 670 330" fill="limegreen"/>
    <rect x="650" y="370" width="10" height="10" fill="maroon"/>
    <text x="665" y="365" fill="maroon" font-size="12">eye</text>
    
    <!-- Object arrow -->
    <line x1="100" x2="100" y1="250" y2="300" stroke="black" stroke-width="2"/>
    <polygon points="95,250 100,240 105,250" fill="black"/>
    <text x="90" y="245" fill="blue" font-size="12">object</text>
    <text x="105" y="260" fill="blue" font-size="10">h</text>
    <text x="50" y="320" fill="blue" font-size="12">Object magnified by compound microscope</text>
    
    <!-- Eyepiece image arrow -->
    <line x1="550" x2="550" y1="300" y2="350" stroke="maroon" stroke-width="2"/>
    <polygon points="545,350 550,360 555,350" fill="maroon"/>
    <text x="530" y="345" fill="maroon" font-size="12">eyepiece image</text>
    
    <!-- Objective image line -->
    <line x1="300" x2="300" y1="250" y2="300" stroke="maroon" stroke-width="2"/>
    <text x="290" y="245" fill="black" font-size="12">objective image</text>
    
    <!-- Light paths -->
    <line x1="100" x2="300" y1="250" y2="250" stroke="lightblue" stroke-dasharray="5,5"/>
    <line x1="300" x2="550" y1="250" y2="300" stroke="lightgreen"/>
    <line x1="550" x2="650" y1="300" y2="370" stroke="lightgreen"/>
    
    <!-- Unmodified object -->
    <line x1="100" x2="100" y1="500" y2="550" stroke="black" stroke-width="2"/>
    <polygon points="95,500 100,490 105,500" fill="black"/>
    <text x="90" y="495" fill="black" font-size="12">object</text>
    <text x="105" y="510" fill="black" font-size="10">h</text>
    <text x="50" y="570" fill="gray" font-size="12">Unmagnified object at eye's near point</text>
    
    <!-- Distance labels -->
    <line x1="300" x2="500" y1="280" y2="280" stroke="black" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="400" y="270" text-anchor="middle" font-size="12">S</text>
    <line x1="100" x2="650" y1="560" y2="560" stroke="black" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="375" y="550" text-anchor="middle" font-size="12">d</text>
    
    <!-- Angle theta -->
    <path d="M650 370 A30 30 0 0 0 680 340" fill="none" stroke="green"/>
    <text x="675" y="345" fill="green" font-size="12">θ</text>
    
    <!-- Definitions for arrows (not fully implemented here) -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="black"/>
        </marker>
    </defs>
</svg>