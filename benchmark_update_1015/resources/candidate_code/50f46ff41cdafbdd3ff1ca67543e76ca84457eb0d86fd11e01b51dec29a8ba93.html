<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Plot Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #ffffff;
        }
        .container {
            width: 100%;
            height: 100vh;
            background-color: white;
        }
        h1 {
            text-align: center;
            color: #222;
            font-size: 22px;
            line-height: 28px;
            margin: 0;
            font-weight: 700;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 28px);
        }
        .echarts {
            width: 100%;
            height: 100%;
        }
        .note-box {
            position: absolute;
            left: 10%;
            bottom: 48px;
            border: 2px solid #333;
            padding: 5px 4px;
            font-size: 14px;
            color: #222;
            background: #fff;
            box-sizing: border-box;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Distribution of Math Exam Scores</h1>
        <div id="boxPlot" class="chart-container">
            <div class="note-box">Boxplot: Q3 + 1.5×IQR (upper), Q1 - 1.5×IQR (lower)</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        const chart = echarts.init(document.getElementById('boxPlot'));

        const option = {
            backgroundColor: '#ffffff',
            grid: {
                left: '10%',
                right: '10%',
                top: 32,
                bottom: 134
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                formatter: function (params) {
                    return params[0].name + ': ' + params[0].value.join(', ');
                }
            },
            xAxis: {
                data: ['Class 0', 'Class 1', 'Class 2', 'Class 3', 'Class 4'],
                axisLabel: {
                    interval: 0,
                    rotate: 0,
                    fontWeight: 700,
                    color: '#222'
                },
                axisLine: { show: true, lineStyle: { color: '#0b6eea', width: 3 } },
                axisTick: { show: true, lineStyle: { color: '#0b6eea' } }
            },
            yAxis: {
                type: 'value',
                min: 0,
                max: 100,
                interval: 20,
                name: 'Score (out of 100)',
                nameLocation: 'end',
                nameGap: 12,
                nameTextStyle: {
                    color: '#222',
                    fontWeight: 700,
                    fontSize: 14,
                    align: 'left',
                    padding: [0, 0, 0, -62]
                },
                axisLabel: {
                    color: '#222',
                    fontWeight: 700
                },
                axisLine: { show: false },
                axisTick: { show: false },
                splitLine: { show: true, lineStyle: { color: '#dce3ef', width: 1 } },
                splitArea: {
                    show: true,
                    areaStyle: {
                        color: ['#ffffff', '#f5f7fb']
                    }
                }
            },
            series: [{
                type: 'boxplot',
                data: [
                    [74, 84.5, 88.5, 92.3, 98],
                    [72, 78, 81.5, 84.2, 90],
                    [90, 93, 94.5, 97, 99],
                    [68, 72, 74, 76, 79],
                    [82, 86, 87.5, 89, 91]
                ],
                itemStyle: {
                    color: '#08a9e6',
                    borderColor: '#1a237e',
                    borderWidth: 2
                },
                label: {
                    show: false
                }
            }]
        };

        chart.setOption(option);
        window.addEventListener('resize', function () {
            chart.resize();
        });
    </script>
</body>
</html>
