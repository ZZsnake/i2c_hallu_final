<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribution of Math Topics</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            padding: 0;
        }
        
        .container {
            width: 100%;
            max-width: none;
            margin: 0 auto;
            background-color: #ffffff;
            position: relative;
        }
        
        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 0;
            color: #222233;
        }
        
        .content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
        }
        
        .legend {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: absolute;
            top: 30px;
            left: 7px;
            z-index: 10;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }
        
        .legend-color {
            width: 24px;
            height: 12px;
            border-radius: 2px;
        }
        
        #chart {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Distribution of Math Topics</h1>
        <div class="content">
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #3a78e8;"></div>
                    <span>Algebra</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #ec3b3b;"></div>
                    <span>Geometry</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #32bf5e;"></div>
                    <span>Calculus</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #e88e2e;"></div>
                    <span>Statistics</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #a73ae8;"></div>
                    <span>Number Theory</span>
                </div>
            </div>
            <div id="chart"></div>
        </div>
    </div>

    <script>
        var chartDom = document.getElementById('chart');
        var myChart = echarts.init(chartDom);
        
        var option = {
            tooltip: {
                trigger: 'item',
                formatter: '{b}: {c}%'
            },
            series: [
                {
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['50%', '50%'],
                    avoidLabelOverlap: true,
                    itemStyle: {
                        borderColor: '#ffffff',
                        borderWidth: 2
                    },
                    label: {
                        show: true,
                        position: 'outside',
                        formatter: '{b}: {c}%',
                        fontSize: 14,
                        color: '#191970',
                        fontFamily: 'Verdana',
                        fontWeight: 'bold'
                    },
                    labelLine: {
                        show: true,
                        length: 15,
                        length2: 15,
                        lineStyle: {
                            color: '#191970',
                            width: 3
                        }
                    },
                    data: [
                        { 
                            value: 34, 
                            name: 'Algebra',
                            itemStyle: { color: '#3a78e8' }
                        },
                        { 
                            value: 22, 
                            name: 'Geometry',
                            itemStyle: { color: '#ec3b3b' }
                        },
                        { 
                            value: 18, 
                            name: 'Calculus',
                            itemStyle: { color: '#32bf5e' }
                        },
                        { 
                            value: 14, 
                            name: 'Statistics',
                            itemStyle: { color: '#e88e2e' }
                        },
                        { 
                            value: 12, 
                            name: 'Number Theory',
                            itemStyle: { color: '#a73ae8' }
                        }
                    ],
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }
            ]
        };
        
        myChart.setOption(option);
        
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
