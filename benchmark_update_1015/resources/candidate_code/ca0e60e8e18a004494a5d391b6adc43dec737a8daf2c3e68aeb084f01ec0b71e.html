    <title>Multiplication Table Heatmap</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .heatmap {
            width: 800px;
            height: 800px;
            background-color: #fff;
            border: 2px solid #333;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 2px;
        }
        .heatmap div {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 5px;
        }
        .heatmap div:hover {
            background-color: #f0f0f0;
        }
        .heatmap div.color1 {
            background-color: #ff6b6b;
        }
        .heatmap div.color2 {
            background-color: #ffcc6b;
        }
        .heatmap div.color3 {

        .heatmap div.color4 {

        .heatmap div.color9 {
