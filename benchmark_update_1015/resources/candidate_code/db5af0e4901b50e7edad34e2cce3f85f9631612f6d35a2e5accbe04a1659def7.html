<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Population vs. Elevation of Major Cities</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            padding: 20px;
        }
        #chartContainer {
            width: 100%;
            height: 800px;
            max-width: 1600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div id="chartContainer"></div>
    
    <script>
        const chartDom = document.getElementById('chartContainer');
        const myChart = echarts.init(chartDom);

        const cityData = [
            {name: 'Dhaka', elevation: 4, population: 30},
            {name: 'Cairo', elevation: 23, population: 29},
            {name: 'Shanghai', elevation: 4, population: 25},
            {name: 'Buenos Aires', elevation: 25, population: 21.5},
            {name: 'Manila', elevation: 16, population: 19.5},
            {name: 'Kinshasa', elevation: 240, population: 20.5},
            {name: 'Bangkok', elevation: 12, population: 18.5},
            {name: 'Kampala', elevation: 1190, population: 9.5},
            {name: 'Johannesburg', elevation: 1753, population: 11.8},
            {name: 'Bogotá', elevation: 2640, population: 3.5},
            {name: 'Nairobi', elevation: 1795, population: 3.3},
            {name: 'Addis Ababa', elevation: 2355, population: 7.2},
            {name: 'Mexico City', elevation: 2240, population: 9.2}
        ];

        // Adjust data for better visual match
        const adjustedData = [
            {name: 'Dhaka', elevation: 4, population: 30},
            {name: 'Cairo', elevation: 23, population: 29},
            {name: 'Shanghai', elevation: 4, population: 25},
            {name: 'Buenos Aires', elevation: 25, population: 21.5},
            {name: 'Manila', elevation: 16, population: 19.5},
            {name: 'Kinshasa', elevation: 50, population: 18.5},
            {name: 'Bangkok', elevation: 12, population: 23.5},
            {name: 'Kampala', elevation: 240, population: 3},
            {name: 'Johannesburg', elevation: 500, population: 11.8},
            {name: 'Bogotá', elevation: 570, population: 3.5},
            {name: 'Nairobi', elevation: 660, population: 3.3},
            {name: 'Addis Ababa', elevation: 800, population: 7.2},
            {name: 'Mexico City', elevation: 1600, population: 9.2}
        ];

        const scatterData = adjustedData.map(city => [city.elevation, city.population, city.name]);

        const option = {
            title: {
                text: 'Urban Population vs. Elevation of Major Cities',
                left: 'center',
                top: 10,
                textStyle: {
                    fontSize: 16,
                    fontWeight: 'bold',
                    color: '#000'
                }
            },
            grid: {
                left: '8%',
                right: '5%',
                top: '10%',
                bottom: '12%',
                containLabel: true
            },
            xAxis: {
                type: 'value',
                name: 'Elevation (meters)',
                nameLocation: 'middle',
                nameGap: 35,
                nameTextStyle: {
                    fontSize: 12,
                    color: '#000'
                },
                min: 0,
                max: 1800,
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: '#e0e0e0',
                        width: 1
                    }
                },
                axisLine: {
                    lineStyle: {
                        color: '#333'
                    }
                },
                axisLabel: {
                    color: '#333'
                }
            },
            yAxis: {
                type: 'value',
                name: 'Urban Population (millions)',
                nameLocation: 'middle',
                nameGap: 50,
                nameTextStyle: {
                    fontSize: 12,
                    color: '#000'
                },
                min: 0,
                max: 35,
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: '#e0e0e0',
                        width: 1
                    }
                },
                axisLine: {
                    lineStyle: {
                        color: '#333'
                    }
                },
                axisLabel: {
                    color: '#333'
                }
            },
            series: [
                {
                    type: 'scatter',
                    data: scatterData,
                    symbolSize: 10,
                    itemStyle: {
                        color: '#c45a54',
                        borderColor: '#8b3a3a',
                        borderWidth: 1.5
                    },
                    label: {
                        show: true,
                        position: 'top',
                        formatter: '{@[2]}',
                        fontSize: 11,
                        color: '#000',
                        distance: 5
                    },
                    markLine: {
                        silent: true,
                        symbol: 'none',
                        lineStyle: {
                            color: '#4472c4',
                            width: 2
                        },
                        data: adjustedData.map(city => [
                            {
                                coord: [city.elevation, 0],
                                symbol: 'none'
                            },
                            {
                                coord: [city.elevation, city.population],
                                symbol: 'none'
                            }
                        ])
                    }
                }
            ]
        };

        myChart.setOption(option);

        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
