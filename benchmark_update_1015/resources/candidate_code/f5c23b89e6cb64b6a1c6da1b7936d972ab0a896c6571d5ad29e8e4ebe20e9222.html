<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Performance by Grade and Topic</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            padding: 0;
        }
        
        #chartContainer {
            width: 100%;
            height: 100vh;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div id="chartContainer"></div>
    
    <script>
        // Initialize the echarts instance
        var myChart = echarts.init(document.getElementById('chartContainer'));
        
        // Specify the configuration items and data for the chart
        var option = {
            title: {
                text: 'Math Performance by Grade and Topic',
                left: 'center',
                top: 2,
                textStyle: {
                    fontSize: 20,
                    fontWeight: 'bold',
                    color: '#222d5a'
                }
            },
            legend: {
                data: ['Algebra', 'Geometry', 'Statistics'],
                top: 4,
                left: 'center',
                itemWidth: 12,
                itemHeight: 12
            },
            grid: {
                left: '10%',
                right: '10%',
                top: '5.5%',
                bottom: '6.5%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: ['Grade 6', 'Grade 7', 'Grade 8', 'Grade 9'],
                axisLine: {
                    lineStyle: {
                        color: '#333'
                    }
                },
                axisLabel: {
                    color: '#1a1a1a',
                    fontWeight: 'bold',
                    fontSize: 13
                }
            },
            yAxis: {
                type: 'value',
                min: 0,
                max: 100,
                interval: 20,
                axisLine: {
                    show: false
                },
                axisTick: {
                    show: false
                },
                axisLabel: {
                    color: '#1a1a1a',
                    fontWeight: 'bold',
                    fontSize: 13
                },
                splitLine: {
                    lineStyle: {
                        color: '#e0e0e0',
                        type: 'solid'
                    }
                }
            },
            series: [
                {
                    name: 'Algebra',
                    type: 'bar',
                    data: [78, 82, 90, 94],
                    itemStyle: {
                        color: '#1e88e5'
                    },
                    barWidth: 20
                },
                {
                    name: 'Geometry',
                    type: 'bar',
                    data: [64, 70, 75, 80],
                    itemStyle: {
                        color: '#43a047'
                    },
                    barWidth: 20
                },
                {
                    name: 'Statistics',
                    type: 'bar',
                    data: [85, 88, 92, 96],
                    itemStyle: {
                        color: '#d81b60'
                    },
                    barWidth: 20
                }
            ]
        };
        
        // Use the configuration item and data to display the chart
        myChart.setOption(option);
        
        // Make the chart responsive
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
