<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <defs>
    <radialGradient id="massGradient" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffd94a"/>
      <stop offset="60%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </radialGradient>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Fixed support -->
  <line x1="60" y1="20" x2="140" y2="20" stroke="black" stroke-width="2"/>
  <line x1="63" y1="20" x2="73" y2="10" stroke="black" stroke-width="1"/>
  <line x1="73" y1="20" x2="83" y2="10" stroke="black" stroke-width="1"/>
  <line x1="83" y1="20" x2="93" y2="10" stroke="black" stroke-width="1"/>
  <line x1="93" y1="20" x2="103" y2="10" stroke="black" stroke-width="1"/>
  <line x1="103" y1="20" x2="113" y2="10" stroke="black" stroke-width="1"/>
  <line x1="113" y1="20" x2="123" y2="10" stroke="black" stroke-width="1"/>
  <line x1="123" y1="20" x2="133" y2="10" stroke="black" stroke-width="1"/>

  <!-- Pendulum 1 -->
  <line x1="100" y1="20" x2="115" y2="120" stroke="black" stroke-width="2"/>
  <circle cx="115" cy="120" r="10" fill="url(#massGradient)"/>
  <text x="128" y="116" font-size="12" text-anchor="middle">m<tspan baseline-shift="sub" font-size="8">1</tspan></text>
  
  <!-- Pendulum 2 -->
  <line x1="115" y1="120" x2="145" y2="200" stroke="black" stroke-width="2"/>
  <circle cx="145" cy="200" r="10" fill="url(#massGradient)"/>
  <text x="158" y="196" font-size="12" text-anchor="middle">m<tspan baseline-shift="sub" font-size="8">2</tspan></text>
  
  <!-- Vertical reference lines -->
  <line x1="100" y1="20" x2="100" y2="75" stroke="black" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="115" y1="120" x2="115" y2="175" stroke="black" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Angles -->
  <path d="M100 50 A30 30 0 0 0 104.4 49.7" stroke="black" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <text x="116" y="47" font-size="12" text-anchor="middle">θ<tspan baseline-shift="sub" font-size="8">1</tspan></text>
  
  <path d="M115 145 A25 25 0 0 0 123.8 143.4" stroke="black" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <text x="132" y="143" font-size="12" text-anchor="middle">θ<tspan baseline-shift="sub" font-size="8">2</tspan></text>
  
  <!-- Lengths -->
  <text x="100" y="72" font-size="12" text-anchor="middle">L<tspan baseline-shift="sub" font-size="8">1</tspan></text>
  <text x="123" y="163" font-size="12" text-anchor="middle">L<tspan baseline-shift="sub" font-size="8">2</tspan></text>
</svg>