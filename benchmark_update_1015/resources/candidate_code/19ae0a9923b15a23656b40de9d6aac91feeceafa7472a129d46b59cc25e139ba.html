<!DOCTYPE html>
<html>
<head>
  <title>Algebra Test Score Distribution</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
    }
    .chart-container {
      width: 600px;
      height: 400px;
      margin: 20px auto;
    }
    .legend {
      font-size: 10px;
      margin-left: 10px;
    }
    .background-shade {
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <div class="chart-container">
    <div class="background-shade"></div>
    <div id="mainChart" style="width: 100%; height: 100%;"></div>
  </div>

  <div class="legend">
    Boxplot: Q1, Q3, Median & Outliers <br>
    Upper: Q3 + 1.5 * IQR, Lower: Q1 - 1.5 * IQR
  </div>

  <script>
    $(function() {
      var chartDom = document.getElementById('mainChart');
      var myChart = echarts.init(chartDom);
      var option = {
        xAxis: {
          type: 'value',
          min: 0,
          max: 100,
          axisLabel: {
            show: false
          }
        },
        yAxis: {
          type: 'category',
          data: ['Group 1', 'Group 2', 'Group 3', 'Group 4', 'Group 5'],
          axisLabel: {
            show: true
          }
        },
        series: [
          {
            name: 'Group 1',
            type: 'boxplot',
            data: [[78, 80, 82, 85, 90]],
            itemStyle: {
              color: '#5470c6'
            }
          },
          {
            name: 'Group 2',
            type: 'boxplot',
            data: [[65, 70, 72, 78, 85]],
            itemStyle: {
              color: '#5470c6'
            }
          },
          {
            name: 'Group 3',
            type: 'boxplot',
            data: [[60, 62, 65, 68, 70]],
            itemStyle: {
              color: '#5470c6'
            }
          },
          {
            name: 'Group 4',
            type: 'boxplot',
            data: [[45, 48, 50, 55, 60]],
            itemStyle: {
              color: '#5470c6'
            }
          },
          {
            name: 'Group 5',
            type: 'boxplot',
            data: [[88, 90, 92, 95, 98]],
            itemStyle: {
              color: '#5470c6'
            }
          }
        ],
        grid: {
          left: '10%',
          right: '10%',
          bottom: '10%',
          containLabel: true
        }
      };
      myChart.setOption(option);
    });
  </script>

</body>
</html>
