<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Math Concepts Relationships</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #chart {
      width: 600px;
      height: 500px;
      border: none;
    }
    .title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      color: black;
    }
  </style>
</head>
<body>
  <div class="title">Relationships Between Math Concepts</div>
  <div id="chart"></div>

  <script>
    // Initialize the chart
    const myChart = echarts.init(document.getElementById('chart'));

    // Define the graph data
    const option = {
      tooltip: {
        trigger: 'item',
        formatter: '{a} <br/>{c}: {d}%'
      },
      legend: {
        show: false
      },
      series: [
        {
          type: 'graph',
          layout: 'none', // Manual positioning
          symbolSize: 40,
          label: {
            show: true,
            position: 'center',
            color: '#000',
            fontSize: 12,
            fontWeight: 'normal'
          },
          edgeLabel: {
            show: true,
            color: '#000',
            fontSize: 10,
            fontWeight: 'normal',
            formatter: function(params) {
              return params.data.name;
            }
          },
          roam: false,
          focusNodeAdjacency: false,
          force: {
            repulsion: 2000,
            gravity: 0.2,
            edgeLength: 100
          },
          data: [
            { name: 'Algebra', x: 100, y: 250, itemStyle: { color: '#1E88E5' } },
            { name: 'Calculus', x: 300, y: 50, itemStyle: { color: '#26A69A' } },
            { name: 'Functions', x: 500, y: 250, itemStyle: { color: '#F44336' } },
            { name: 'Geometry', x: 300, y: 450, itemStyle: { color: '#FFA000' } }
          ],
          links: [
            { source: 'Algebra', target: 'Functions', name: 'defines', lineStyle: { color: '#1E88E5', type: 'solid' } },
            { source: 'Calculus', target: 'Functions', name: 'used in', lineStyle: { color: '#26A69A', type: 'solid' } },
            { source: 'Calculus', target: 'Geometry', name: 'applied to', lineStyle: { color: '#26A69A', type: 'solid' } },
            { source: 'Algebra', target: 'Geometry', name: 'supports', lineStyle: { color: '#1E88E5', type: 'solid' } },
            { source: 'Geometry', target: 'Functions', name: 'models', lineStyle: { color: '#FFA000', type: 'solid' } }
          ],
          animation: false
        }
      ]
    };

    // Set the option
    myChart.setOption(option);

    // Adjust positions manually to match the original image
    setTimeout(() => {
      const nodes = myChart.getSeriesByIndex(0).getData();
      nodes.setItemLayout(0, { x: 100, y: 250 }); // Algebra
      nodes.setItemLayout(1, { x: 300, y: 50 }); // Calculus
      nodes.setItemLayout(2, { x: 500, y: 250 }); // Functions
      nodes.setItemLayout(3, { x: 300, y: 450 }); // Geometry

      // Force update
      myChart.resize();
    }, 100);
  </script>
</body>
</html>
