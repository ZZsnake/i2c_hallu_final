<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect x="50" y="50" width="150" height="60" rx="10" ry="10" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="55" y="80" font-family="sans-serif" font-size="12">Animal</text>
  <circle cx="55" y="95" r="5" fill="green"/>
  <text x="70" y="95" font-family="sans-serif" font-size="10">Eat()</text>

  <rect x="50" y="170" width="150" height="60" rx="10" ry="10" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="55" y="200" font-family="sans-serif" font-size="12">Mammal</text>
  <circle cx="55" y="215" r="5" fill="green"/>
  <text x="70" y="215" font-family="sans-serif" font-size="10">Breathe()</text>

  <rect x="250" y="170" width="150" height="60" rx="10" ry="10" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="255" y="200" font-family="sans-serif" font-size="12">WingedAnimal</text>
  <circle cx="255" y="215" r="5" fill="green"/>
  <text x="270" y="215" font-family="sans-serif" font-size="10">Flap()</text>

  <rect x="150" y="290" width="100" height="60" rx="10" ry="10" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="155" y="320" font-family="sans-serif" font-size="12">Bat</text>

  <path d="M100,110 L100,170" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M100,110 L100,170" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M100,110 L250,170" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M220,230 L150,290" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M170,230 L150,290" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" orient="auto" markerWidth="6" markerHeight="6" xoverflow="visible">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
</svg>