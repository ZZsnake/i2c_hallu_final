<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <!-- Dendrites (left side) -->
  <g fill="#D4C5A0" stroke="#4A5D3A" stroke-width="1.5">
    <!-- Main dendrite branches -->
    <path d="M 45 80 Q 40 70 38 55 Q 36 45 35 35 L 32 28 L 38 25 L 42 30 L 40 40 L 38 50" fill="#D4C5A0"/>
    <path d="M 45 80 Q 42 65 40 50 L 38 40 L 42 35 L 48 38 L 50 45 L 48 55" fill="#D4C5A0"/>
    <path d="M 45 80 Q 50 70 52 58 L 55 45 L 52 38 L 58 35 L 62 40 L 60 50 L 58 60" fill="#D4C5A0"/>
    <path d="M 45 80 Q 48 90 50 100 L 52 110 L 48 115 L 42 112 L 44 102 L 46 92" fill="#D4C5A0"/>
    <path d="M 45 80 Q 40 88 38 98 L 35 108 L 30 110 L 28 105 L 32 98 L 36 88" fill="#D4C5A0"/>
    <path d="M 45 80 Q 35 82 28 85 L 20 88 L 18 83 L 22 78 L 30 76 L 38 78" fill="#D4C5A0"/>
    
    <!-- Additional fine branches -->
    <path d="M 35 35 L 30 30 L 28 25" stroke="#4A5D3A" fill="none"/>
    <path d="M 35 35 L 32 38 L 28 40" stroke="#4A5D3A" fill="none"/>
    <path d="M 55 45 L 58 42 L 62 38" stroke="#4A5D3A" fill="none"/>
    <path d="M 55 45 L 60 48 L 65 50" stroke="#4A5D3A" fill="none"/>
    <path d="M 52 110 L 55 115 L 58 120" stroke="#4A5D3A" fill="none"/>
    <path d="M 35 108 L 32 112 L 28 115" stroke="#4A5D3A" fill="none"/>
  </g>
  
  <!-- Cell body (soma) -->
  <ellipse cx="75" cy="105" rx="28" ry="32" fill="#D4C5A0" stroke="#4A5D3A" stroke-width="1.5"/>
  
  <!-- Nucleus -->
  <circle cx="75" cy="110" r="12" fill="#C89B9B" stroke="#8B6B6B" stroke-width="1"/>
  
  <!-- Axon hillock -->
  <path d="M 103 105 Q 110 105 115 105" fill="none" stroke="#4A5D3A" stroke-width="2"/>
  
  <!-- Myelin sheath segments (blue ovals) -->
  <ellipse cx="135" cy="105" rx="18" ry="12" fill="#6B8FD4" stroke="#4A6BA0" stroke-width="1"/>
  <ellipse cx="170" cy="105" rx="18" ry="12" fill="#6B8FD4" stroke="#4A6BA0" stroke-width="1"/>
  <ellipse cx="205" cy="105" rx="18" ry="12" fill="#6B8FD4" stroke="#4A6BA0" stroke-width="1"/>
  <ellipse cx="240" cy="105" rx="18" ry="12" fill="#6B8FD4" stroke="#4A6BA0" stroke-width="1"/>
  <ellipse cx="275" cy="105" rx="18" ry="12" fill="#6B8FD4" stroke="#4A6BA0" stroke-width="1"/>
  
  <!-- Axon segments between myelin (nodes of Ranvier) -->
  <line x1="115" y1="105" x2="117" y2="105" stroke="#4A5D3A" stroke-width="1.5"/>
  <line x1="153" y1="105" x2="152" y2="105" stroke="#4A5D3A" stroke-width="1.5"/>
  <line x1="188" y1="105" x2="187" y2="105" stroke="#4A5D3A" stroke-width="1.5"/>
  <line x1="223" y1="105" x2="222" y2="105" stroke="#4A5D3A" stroke-width="1.5"/>
  <line x1="258" y1="105" x2="257" y2="105" stroke="#4A5D3A" stroke-width="1.5"/>
  <line x1="293" y1="105" x2="300" y2="105" stroke="#4A5D3A" stroke-width="1.5"/>
  
  <!-- Axon terminal branches -->
  <g fill="none" stroke="#4A5D3A" stroke-width="1.5">
    <path d="M 300 105 Q 310 105 315 100 Q 320 95 325 90 L 330 85"/>
    <path d="M 300 105 Q 310 105 318 102 Q 325 100 332 98 L 338 96"/>
    <path d="M 300 105 Q 312 105 320 105 L 335 105"/>
    <path d="M 300 105 Q 310 105 318 108 Q 325 110 332 112 L 338 114"/>
    <path d="M 300 105 Q 310 105 315 110 Q 320 115 325 120 L 330 125"/>
    
    <!-- Terminal bulbs -->
    <circle cx="330" cy="85" r="3" fill="#4A5D3A"/>
    <circle cx="338" cy="96" r="3" fill="#4A5D3A"/>
    <circle cx="335" cy="105" r="3" fill="#4A5D3A"/>
    <circle cx="338" cy="114" r="3" fill="#4A5D3A"/>
    <circle cx="330" cy="125" r="3" fill="#4A5D3A"/>
    
    <!-- Additional fine branches -->
    <path d="M 325 90 L 328 88 L 332 85"/>
    <path d="M 325 90 L 330 88 L 335 87"/>
    <path d="M 332 98 L 335 95 L 340 92"/>
    <path d="M 332 98 L 338 100 L 343 102"/>
    <path d="M 332 112 L 335 115 L 340 118"/>
    <path d="M 325 120 L 328 123 L 332 127"/>
  </g>
  
  <!-- Axon terminal boundary line -->
  <line x1="370" y1="40" x2="370" y2="130" stroke="#000" stroke-width="1.5"/>
  
  <!-- Labels -->
  <text x="42" y="10" font-family="Arial, sans-serif" font-size="12" fill="#000">Dendrite</text>
  <text x="2" y="150" font-family="Arial, sans-serif" font-size="11" fill="#000">Nucleus</text>
  <text x="138" y="70" font-family="Arial, sans-serif" font-size="11" fill="#000">Cell body</text>
  <text x="140" y="155" font-family="Arial, sans-serif" font-size="11" fill="#000">Axon</text>
  <text x="212" y="195" font-family="Arial, sans-serif" font-size="11" fill="#000">Myelin sheath</text>
  <text x="225" y="70" font-family="Arial, sans-serif" font-size="11" fill="#000">Node of</text>
  <text x="225" y="82" font-family="Arial, sans-serif" font-size="11" fill="#000">Ranvier</text>
  <text x="308" y="175" font-family="Arial, sans-serif" font-size="11" fill="#000">Schwann cell</text>
  <text x="298" y="25" font-family="Arial, sans-serif" font-size="12" fill="#000">Axon Terminal</text>
  
  <!-- Label lines/pointers -->
  <line x1="42" y1="12" x2="45" y2="30" stroke="#000" stroke-width="0.5"/>
  <line x1="20" y1="145" x2="63" y2="110" stroke="#000" stroke-width="0.5"/>
  <line x1="138" y1="72" x2="85" y2="90" stroke="#000" stroke-width="0.5"/>
  <line x1="140" y1="157" x2="140" y2="117" stroke="#000" stroke-width="0.5"/>
  <line x1="240" y1="193" x2="240" y2="117" stroke="#000" stroke-width="0.5"/>
  <line x1="280" y1="68" x2="290" y2="85" stroke="#000" stroke-width="0.5"/>
  <line x1="308" y1="173" x2="275" y2="117" stroke="#000" stroke-width="0.5"/>
  <line x1="345" y1="27" x2="370" y2="40" stroke="#000" stroke-width="0.5"/>
</svg>