<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <!-- Arrowhead marker in navy -->
    <marker id="arrow-navy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#001a5a"/>
    </marker>
    <!-- Arrowhead marker in red -->
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b0000"/>
    </marker>
    <!-- Arrowhead marker in green -->
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006600"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="white"/>

  <!-- Common circle style -->
  <!-- Positions (approx):
       Algorithm: (400,80)
       Web: (220,170)
       Networking: (580,170)
       Programming: (320,230)
       Data Structure: (460,230)
       Cloud: (680,230)
       Operating System: (390,300)
       Security: (130,230)
       Database: (150,320)
       AI: (300,390)
       Machine Learning: (480,390)
  -->

  <!-- Edges / connections -->

  <!-- Algorithm to Web (dashed, no arrow) -->
  <line x1="400" y1="110" x2="250" y2="150"
        stroke="#001a5a" stroke-width="2.5"
        stroke-dasharray="8 6" stroke-linecap="round"/>

  <!-- Algorithm to Networking (dashed, no arrow, slightly curved by two segments) -->
  <line x1="400" y1="110" x2="550" y2="150"
        stroke="#001a5a" stroke-width="2.5"
        stroke-dasharray="8 6" stroke-linecap="round"/>

  <!-- Web to Programming -->
  <line x1="250" y1="190" x2="295" y2="220"
        stroke="#001a5a" stroke-width="2.5"
        marker-end="url(#arrow-navy)"/>

  <!-- Programming to Operating System -->
  <line x1="345" y1="250" x2="370" y2="280"
        stroke="#001a5a" stroke-width="2.5"
        marker-end="url(#arrow-navy)"/>

  <!-- Operating System to AI -->
  <line x1="360" y1="320" x2="320" y2="365"
        stroke="#001a5a" stroke-width="2.5"
        marker-end="url(#arrow-navy)"/>

  <!-- Operating System to Machine Learning -->
  <line x1="420" y1="320" x2="460" y2="365"
        stroke="#001a5a" stroke-width="2.5"
        marker-end="url(#arrow-navy)"/>

  <!-- Networking to Data Structure -->
  <line x1="555" y1="190" x2="485" y2="220"
        stroke="#001a5a" stroke-width="2.5"
        marker-end="url(#arrow-navy)"/>

  <!-- Networking to Cloud -->
  <line x1="605" y1="190" x2="655" y2="220"
        stroke="#001a5a" stroke-width="2.5"
        marker-end="url(#arrow-navy)"/>

  <!-- Data Structure to Operating System -->
  <line x1="435" y1="250" x2="410" y2="280"
        stroke="#001a5a" stroke-width="2.5"
        marker-end="url(#arrow-navy)"/>

  <!-- Web to Security -->
  <line x1="210" y1="190" x2="155" y2="215"
        stroke="#8b0000" stroke-width="2.5"
        marker-end="url(#arrow-red)"/>

  <!-- Security to Database -->
  <line x1="140" y1="250" x2="145" y2="295"
        stroke="#8b0000" stroke-width="2.5"
        marker-end="url(#arrow-red)"/>

  <!-- Web to Database (light green-ish / faint connection, dotted) -->
  <line x1="215" y1="195" x2="175" y2="300"
        stroke="#006600" stroke-width="2"
        stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- Nodes -->

  <!-- Algorithm -->
  <circle cx="400" cy="80" r="45" fill="white" stroke="#001a5a" stroke-width="3"/>
  <text x="400" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="18" fill="#000000">Algorithm</text>

  <!-- Web (highlighted with light-blue fill) -->
  <circle cx="220" cy="170" r="45" fill="#dbe9ff" fill-opacity="0.8" stroke="#001a5a" stroke-width="3"/>
  <text x="220" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="18" fill="#000000">Web</text>

  <!-- Networking -->
  <circle cx="580" cy="170" r="45" fill="white" stroke="#001a5a" stroke-width="3"/>
  <text x="580" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#000000">Networking</text>

  <!-- Programming -->
  <circle cx="320" cy="230" r="45" fill="white" stroke="#001a5a" stroke-width="3"/>
  <text x="320" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#000000">Programming</text>

  <!-- Data Structure -->
  <circle cx="460" cy="230" r="45" fill="white" stroke="#001a5a" stroke-width="3"/>
  <text x="460" y="224" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="14" fill="#000000">Data</text>
  <text x="460" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="14" fill="#000000">Structure</text>

  <!-- Cloud -->
  <circle cx="680" cy="230" r="45" fill="white" stroke="#001a5a" stroke-width="3"/>
  <text x="680" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#000000">Cloud</text>

  <!-- Operating System -->
  <circle cx="390" cy="300" r="45" fill="white" stroke="#001a5a" stroke-width="3"/>
  <text x="390" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="14" fill="#000000">Operating</text>
  <text x="390" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="14" fill="#000000">System</text>

  <!-- Security (red) -->
  <circle cx="130" cy="230" r="45" fill="white" stroke="#8b0000" stroke-width="3"/>
  <text x="130" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#000000">Security</text>

  <!-- Database (green) -->
  <circle cx="150" cy="320" r="45" fill="white" stroke="#006600" stroke-width="3"/>
  <text x="150" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#000000">Database</text>

  <!-- AI -->
  <circle cx="300" cy="390" r="45" fill="white" stroke="#001a5a" stroke-width="3"/>
  <text x="300" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="18" fill="#000000">AI</text>

  <!-- Machine Learning -->
  <circle cx="480" cy="390" r="45" fill="white" stroke="#001a5a" stroke-width="3"/>
  <text x="480" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="13" fill="#000000">Machine</text>
  <text x="480" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="13" fill="#000000">Learning</text>
</svg>