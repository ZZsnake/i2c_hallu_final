<!DOCTYPE html>
<html style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <title>Weekly Device Usage Trends</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            background-color: white;
            height: 100%;
        }
        #main {
            width: 100%;
            height: 100%;
            min-height: 600px;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="main"></div>
    </div>
    <script type="text/javascript">
        $(function() {
            var myChart = echarts.init(document.getElementById('main'));
            var option = {
                title: {
                    text: 'Weekly Device Usage Trends',
                    left: 'center',
                    textStyle: {
                        fontSize: 16
                    }
                },
                legend: {
                    data: ['Smartphone', 'Tablet', 'Laptop', 'Desktop', 'Other Devices'],
                    top: 20,
                    textStyle: {
                        fontSize: 12
                    }
                },
                xAxis: {
                    type: 'category',
                    data: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'],
                    axisLabel: {
                        fontSize: 12
                    }
                },
                yAxis: {
                    type: 'value',
                    min: 0,
                    max: 1000,
                    axisLabel: {
                        fontSize: 12
                    }
                },
                series: [
                    {
                        name: 'Smartphone',
                        type: 'line',
                        symbol: 'circle',
                        data: [210, 185, 225, 260, 220, 300, 250],
                        itemStyle: { color: '#2196F3' }
                    },
                    {
                        name: 'Tablet',
                        type: 'line',
                        symbol: 'circle',
                        data: [300, 280, 320, 380, 330, 430, 375],
                        itemStyle: { color: '#4CAF50' }
                    },
                    {
                        name: 'Laptop',
                        type: 'line',
                        symbol: 'circle',
                        data: [480, 450, 480, 580, 520, 640, 580],
                        itemStyle: { color: '#F44336' }
                    },
                    {
                        name: 'Desktop',
                        type: 'line',
                        symbol: 'circle',
                        data: [560, 530, 550, 670, 600, 740, 675],
                        itemStyle: { color: '#795548' }
                    },
                    {
                        name: 'Other Devices',
                        type: 'line',
                        symbol: 'circle',
                        data: [600, 580, 610, 730, 650, 820, 750],
                        itemStyle: { color: '#9C27B0' }
                    }
                ],
                grid: {
                    left: 60,
                    right: 60,
                    bottom: 60,
                    top: 80
                }
            };
            myChart.setOption(option);
            window.onresize = function() {
                myChart.resize();
            };
        });
    </script>
</body>
</html>
