<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180">
  <!-- Application program container -->
  <rect x="10" y="10" width="600" height="75" fill="#D3D3D3" stroke="none"/>
  <text x="11" y="28" font-family="Times New Roman, Times, serif" font-size="14" fill="#000">Application program</text>
  
  <!-- Main program node -->
  <rect x="20" y="40" width="98" height="38" fill="#FFFFFF" stroke="none"/>
  <text x="23" y="58" font-family="Times New Roman, Times, serif" font-size="13" fill="#000">Main program</text>
  
  <!-- Callback function node -->
  <ellipse cx="525" cy="58" rx="74" ry="20" fill="#FFFFFF" stroke="none"/>
  <text x="468" y="58" font-family="Times New Roman, Times, serif" font-size="13" fill="#000">Callback function</text>
  
  <!-- Software library container -->
  <rect x="250" y="90" width="150" height="75" fill="#D3D3D3" stroke="none"/>
  <text x="251" y="158" font-family="Times New Roman, Times, serif" font-size="13" fill="#000">Software library</text>
  
  <!-- Library function highlight box -->
  <ellipse cx="325" cy="115" rx="70" ry="15" fill="#FFFFFF" stroke="#FFFF00" stroke-width="1"/>
  <text x="265" y="120" font-family="Times New Roman, Times, serif" font-size="13" fill="#FFFF00">Library function</text>
  
  <!-- "specifies" arrow from Main program to Callback function -->
  <line x1="115" y1="52" x2="445" y2="52" stroke="#000" stroke-width="1"/>
  <text x="294" y="48" font-family="Times New Roman, Times, serif" font-size="11" fill="#000">specifies</text>
  <polygon points="445,52 435,48 435,56" fill="#000"/>
  
  <!-- "call" arrow from Main program to Library function -->
  <line x1="115" y1="65" x2="250" y2="100" stroke="#000" stroke-width="1"/>
  <text x="175" y="78" font-family="Times New Roman, Times, serif" font-size="11" fill="#000">call</text>
  <polygon points="250,100 242,95 245,103" fill="#000"/>
  
  <!-- "call" arrow from Library function to Callback function -->
  <line x1="395" y1="100" x2="468" y2="65" stroke="#000" stroke-width="1"/>
  <text x="410" y="78" font-family="Times New Roman, Times, serif" font-size="11" fill="#000">call</text>
  <polygon points="468,65 460,68 463,60" fill="#000"/>
</svg>