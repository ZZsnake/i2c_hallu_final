<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Math Quiz Topic Frequency - ECharts Replica</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "DejaVu Sans", "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: none;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .chart-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #mainChart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="chart-container">
      <div id="mainChart"></div>
    </div>
  </div>

  <script>
    $(function () {
      var chartDom = document.getElementById('mainChart');
      var myChart = echarts.init(chartDom);

      var option = {
        backgroundColor: '#ffffff',
        title: {
          text: 'Math Quiz Topic Frequency',
          left: 'center',
          top: 0,
          textStyle: {
            color: '#000000',
            fontWeight: 'bold',
            fontSize: 20
          }
        },
        toolbox: {
          show: true,
          right: 0,
          top: 5,
          feature: {
            dataView: {
              show: true,
              readOnly: true
            },
            saveAsImage: {
              show: true
            }
          }
        },
        grid: {
          top: 80,
          left: 60,
          right: 40,
          bottom: 80
        },
        xAxis: {
          type: 'category',
          data: [
            'Algebra',
            'Geometry',
            'Calculus',
            'Statistics',
            'Number Theory',
            'Combinatorics',
            'Logic'
          ],
          axisLine: {
            lineStyle: {
              color: '#3D5A80'
            }
          },
          axisTick: {
            alignWithLabel: false
          },
          axisLabel: {
            color: '#000000',
            fontFamily: 'Roboto Mono, monospace',
            fontSize: 14
          }
        },
        yAxis: {
          type: 'value',
          min: 0,
          max: 25,
          interval: 5,
          name: 'Number of Questions',
          nameLocation: 'end',
          nameRotate: 0,
          nameGap: 15,
          nameTextStyle: {
            color: '#000000',
            fontFamily: 'Roboto Mono, monospace',
            fontSize: 15,
            fontWeight: 'bold'
          },
          axisLine: {
            lineStyle: {
              color: '#000000'
            }
          },
          axisTick: {
            show: false
          },
          splitLine: {
            show: true,
            lineStyle: {
              type: 'dashed',
              color: '#e91e63'
            }
          }
        },
        tooltip: {
          show: false
        },
        legend: {
          show: false
        },
        series: [
          {
            type: 'bar',
            data: [15, 24, 9, 17, 12, 5, 13],
            barWidth: '45%',
            itemStyle: {
              borderColor: '#000000',
              borderWidth: 2,
              color: function (params) {
                var colors = [
                  '#006D77', // Algebra - teal
                  '#FF595E', // Geometry - coral/red-pink
                  '#1982C4', // Calculus - blue
                  '#6A4C93', // Statistics - purple
                  '#FFCA3A', // Number Theory - yellow/gold
                  '#8AC926', // Combinatorics - green
                  '#FF7F11'  // Logic - orange
                ];
                return colors[params.dataIndex];
              }
            },
            label: {
              show: true,
              position: 'top',
              color: '#000000',
              fontFamily: 'Montserrat, Arial, sans-serif',
              fontWeight: 'bold',
              fontSize: 14,
              formatter: '{c}'
            }
          }
        ]
      };

      myChart.setOption(option);

      window.addEventListener('resize', function () {
        myChart.resize();
      });
    });
  </script>
</body>
</html>
