<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <style>
    .block {
      fill: none;
      stroke: #005689;
      stroke-width: 2;
    }
    .line {
      stroke: #005689;
      stroke-width: 1.5;
      fill: none;
    }
    .bus {
      stroke: #005689;
      stroke-width: 4;
      fill: none;
    }
    .dashed-line {
      stroke: #005689;
      stroke-width: 1.5;
      stroke-dasharray: 5 3;
      fill: none;
    }
    .arrow {
      fill: #005689;
      stroke: #005689;
      stroke-width: 1.5;
    }
    .text {
      font-family: sans-serif;
      font-size: 16px;
      fill: #333;
      text-anchor: middle;
    }
    .text-left {
      text-anchor: start;
    }
    .text-right {
      text-anchor: end;
    }
  </style>

  <!-- Central Vertical Bus -->
  <line x1="400" y1="100" x2="400" y2="550" class="bus"/>

  <!-- Data Bus Buffer Module -->
  <rect x="150" y="100" width="200" height="80" class="block"/>
  <text x="250" y="130" class="text">Data Bus</text>
  <text x="250" y="150" class="text">Buffer</text>
  <text x="250" y="170" class="text">Module</text>
  <line x1="150" y1="140" x2="100" y2="140" class="line"/>
  <polygon points="100,137 95,140 100,143" class="arrow"/>
  <polygon points="100,143 95,140 100,137" class="arrow" transform="rotate(180 97.5 140)"/>
  <text x="90" y="130" class="text text-right">D0 - ADDR7</text>
  <line x1="350" y1="140" x2="400" y2="140" class="line"/>
  <polygon points="397,137 400,140 397,143" class="arrow"/>
  <polygon points="397,143 400,140 397,137" class="arrow" transform="rotate(180 398.5 140)"/>

  <!-- Control Read/Write Logic -->
  <rect x="150" y="250" width="200" height="120" class="block"/>
  <text x="250" y="290" class="text">Control</text>
  <text x="250" y="310" class="text">Read/</text>
  <text x="250" y="330" class="text">Write Logic</text>
  <line x1="150" y1="270" x2="100" y2="270" class="line"/>
  <polygon points="100,270 95,267 95,273" class="arrow"/>
  <text x="90" y="265" class="text text-right">/RD</text>
  <line x1="150" y1="290" x2="100" y2="290" class="line"/>
  <polygon points="100,290 95,287 95,293" class="arrow"/>
  <text x="90" y="285" class="text text-right">/WR</text>
  <line x1="150" y1="310" x2="100" y2="310" class="line"/>
  <polygon points="100,310 95,307 95,313" class="arrow"/>
  <text x="90" y="305" class="text text-right">/CS</text>
  <line x1="150" y1="330" x2="100" y2="330" class="line"/>
  <polygon points="100,330 95,327 95,333" class="arrow"/>
  <text x="90" y="325" class="text text-right">A1</text>
  <line x1="150" y1="350" x2="100" y2="350" class="line"/>
  <polygon points="100,350 95,347 95,353" class="arrow"/>
  <text x="90" y="345" class="text text-right">A0</text>

  <!-- Instruction Register Controller -->
  <rect x="150" y="420" width="200" height="80" class="block"/>
  <text x="250" y="450" class="text">Instruction</text>
  <text x="250" y="470" class="text">Register</text>
  <text x="250" y="490" class="text">Controller</text>
  <line x1="250" y1="370" x2="250" y2="420" class="line"/>
  <polygon points="250,420 247,415 253,415" class="arrow"/>
  <line x1="350" y1="460" x2="400" y2="460" class="line"/>
  <polygon points="397,457 400,460 397,463" class="arrow"/>
  <polygon points="397,463 400,460 397,457" class="arrow" transform="rotate(180 398.5 460)"/>
  <line x1="250" y1="500" x2="250" y2="520" class="line"/>
  <line x1="250" y1="520" x2="500" y2="520" class="line"/>
  <circle cx="250" cy="520" r="3" fill="#005689" stroke="none"/>

  <!-- Register 0 -->
  <rect x="500" y="100" width="200" height="80" class="block"/>
  <text x="600" y="145" class="text">Register 0</text>
  <line x1="400" y1="140" x2="500" y2="140" class="line"/>
  <polygon points="403,137 400,140 403,143" class="arrow"/>
  <polygon points="403,143 400,140 403,137" class="arrow" transform="rotate(180 401.5 140)"/>
  <line x1="700" y1="120" x2="750" y2="120" class="dashed-line"/>
  <polygon points="750,120 745,117 745,123" class="arrow"/>
  <text x="760" y="125" class="text text-left">Input 0</text>
  <line x1="700" y1="140" x2="750" y2="140" class="dashed-line"/>
  <polygon points="750,140 745,137 745,143" class="arrow"/>
  <text x="760" y="145" class="text text-left">Enable 0</text>
  <line x1="700" y1="160" x2="750" y2="160" class="dashed-line"/>
  <polygon points="750,160 745,163 745,157" class="arrow"/>
  <text x="760" y="165" class="text text-left">Output 0</text>
  <line x1="500" y1="520" x2="550" y2="520" class="line"/>
  <line x1="550" y1="520" x2="550" y2="140" class="line"/>
  <polygon points="550,140 547,145 553,145" class="arrow"/>

  <!-- Register 1 -->
  <rect x="500" y="280" width="200" height="80" class="block"/>
  <text x="600" y="325" class="text">Register 1</text>
  <line x1="400" y1="320" x2="500" y2="320" class="line"/>
  <polygon points="403,317 400,320 403,323" class="arrow"/>
  <polygon points="403,323 400,320 403,317" class="arrow" transform="rotate(180 401.5 320)"/>
  <line x1="700" y1="300" x2="750" y2="300" class="dashed-line"/>
  <polygon points="750,300 745,297 745,303" class="arrow"/>
  <text x="760" y="305" class="text text-left">Input 1</text>
  <line x1="700" y1="320" x2="750" y2="320" class="dashed-line"/>
  <polygon points="750,320 745,317 745,323" class="arrow"/>
  <text x="760" y="325" class="text text-left">Enable 1</text>
  <line x1="700" y1="340" x2="750" y2="340" class="dashed-line"/>
  <polygon points="750,340 745,343 745,337" class="arrow"/>
  <text x="760" y="345" class="text text-left">Output 1</text>
  <line x1="500" y1="520" x2="600" y2="520" class="line"/>
  <line x1="600" y1="520" x2="600" y2="320" class="line"/>
  <polygon points="600,320 597,325 603,325" class="arrow"/>
  <circle cx="600" cy="520" r="3" fill="#005689" stroke="none"/>

  <!-- Register 2 -->
  <rect x="500" y="460" width="200" height="80" class="block"/>
  <text x="600" y="505" class="text">Register 2</text>
  <line x1="400" y1="500" x2="500" y2="500" class="line"/>
  <polygon points="403,497 400,500 403,503" class="arrow"/>
  <polygon points="403,503 400,500 403,497" class="arrow" transform="rotate(180 401.5 500)"/>
  <line x1="700" y1="480" x2="750" y2="480" class="dashed-line"/>
  <polygon points="750,480 745,477 745,483" class="arrow"/>
  <text x="760" y="485" class="text text-left">Input 2</text>
  <line x1="700" y1="500" x2="750" y2="500" class="dashed-line"/>
  <polygon points="750,500 745,497 745,503" class="arrow"/>
  <text x="760" y="505" class="text text-left">Enable 2</text>
  <line x1="700" y1="520" x2="750" y2="520" class="dashed-line"/>
  <polygon points="750,520 745,523 745,517" class="arrow"/>
  <text x="760" y="525" class="text text-left">Output 2</text>
  <line x1="500" y1="520" x2="650" y2="520" class="line"/>
  <line x1="650" y1="520" x2="650" y2="500" class="line"/>
  <polygon points="650,500 647,505 653,505" class="arrow"/>
  <circle cx="650" cy="520" r="3" fill="#005689" stroke="none"/>

</svg>