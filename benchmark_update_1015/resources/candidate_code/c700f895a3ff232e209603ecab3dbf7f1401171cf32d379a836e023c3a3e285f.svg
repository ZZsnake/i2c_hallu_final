<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="white" />

  <!-- Axes -->
  <line x1="80" y1="20" x2="80" y2="430" stroke="black" stroke-width="3" />
  <line x1="80" y1="430" x2="780" y2="430" stroke="black" stroke-width="3" />

  <!-- Y-axis Ticks and Labels -->
  <g font-family="sans-serif" font-size="20" fill="#2c3e50" text-anchor="end">
    <line x1="70" y1="25" x2="80" y2="25" stroke="black" stroke-width="2" />
    <text x="65" y="32">1</text>
    
    <line x1="70" y1="126.25" x2="80" y2="126.25" stroke="black" stroke-width="2" />
    <text x="65" y="133.25">0.5</text>
    
    <line x1="70" y1="227.5" x2="80" y2="227.5" stroke="black" stroke-width="2" />
    <text x="65" y="234.5">0</text>
    
    <line x1="70" y1="328.75" x2="80" y2="328.75" stroke="black" stroke-width="2" />
    <text x="65" y="335.75">-0.5</text>
    
    <line x1="70" y1="430" x2="80" y2="430" stroke="black" stroke-width="2" />
    <text x="65" y="437">-1</text>
  </g>

  <!-- Y-axis Title -->
  <text x="30" y="227.5" font-family="sans-serif" font-size="28" fill="#1e8449" transform="rotate(-90, 30, 227.5)" text-anchor="middle">f(x)</text>

  <!-- X-axis Labels -->
  <g font-family="sans-serif" font-size="20" fill="#2c3e50" text-anchor="middle">
    <text x="80" y="245">0</text>
    <text x="177" y="245">5</text>
    <text x="274" y="245">10</text>
    <text x="371" y="245">15</text>
    <text x="468" y="245">20</text>
    <text x="565" y="245">25</text>
    <text x="662" y="245">30</text>
    <text x="759" y="245">35</text>
  </g>
  
  <!-- X-axis Title -->
  <text x="780" y="210" font-family="sans-serif" font-size="24" fill="#1e8449" font-style="italic">x</text>

  <!-- Data Plot (Dashed Red Curve) -->
  <!-- Approximating the growing sine wave: y = 227.5 - (20 + 2.5*x_val) * sin(0.7 * x_val) -->
  <path d="M 80 227.5 
           C 100 190, 120 190, 140 227.5
           C 160 260, 180 260, 200 227.5
           C 225 180, 255 180, 285 227.5
           C 315 270, 345 270, 375 227.5
           C 410 160, 450 160, 490 227.5
           C 530 290, 570 290, 610 227.5
           C 655 150, 705 150, 755 227.5" 
        fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="10,6" stroke-linecap="round" />
</svg>