<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unemployment Rate vs GDP Growth</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chart-container {
            width: 1000px;
            height: 600px;
            background: #f0f0f0;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .chart-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #333;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <div class="chart-title">Unemployment Rate vs GDP Growth (Economics)</div>
        <div id="chart" style="width: 100%; height: 100%;"></div>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: #4472C4;"></div>
                <span>2018</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #C00000;"></div>
                <span>2020</span>
            </div>
        </div>
    </div>

    <script>
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom);

        // Sample data mimicking the visual (actual data not provided)
        const data2018 = [
            [6.5, 3.8, 150], [2.5, 5.2, 80], [3.0, 4.7, 70], [2.0, 7.0, 60],
            [2.8, 8.5, 50], [1.5, 7.2, 40], [3.2, 10.1, 30], [6.0, 4.5, 90],
            [2.2, 5.8, 65], [1.8, 6.5, 55]
        ];
        const data2020 = [
            [-7.0, 7.8, 180], [-6.5, 14.8, 40], [-5.0, 9.5, 30], [-3.5, 5.8, 50],
            [-2.0, 4.2, 35], [-1.0, 4.0, 25], [-8.0, 6.5, 30], [-4.5, 13.5, 60],
            [-6.0, 4.2, 20], [-3.0, 5.7, 45]
        ];

        const option = {
            tooltip: {
                trigger: 'item',
                formatter: function (params) {
                    return `GDP Growth: ${params.value[0]}%<br/>Unemployment Rate: ${params.value[1]}%`;
                }
            },
            grid: {
                left: '10%',
                right: '10%',
                top: '15%',
                bottom: '10%'
            },
            xAxis: {
                type: 'value',
                name: 'GDP Growth (%)',
                nameLocation: 'middle',
                nameGap: 30,
                min: -12,
                max: 9,
                splitLine: {
                    lineStyle: {
                        type: 'dashed',
                        color: '#ccc'
                    }
                },
                axisLine: {
                    lineStyle: {
                        color: '#000'
                    }
                }
            },
            yAxis: {
                type: 'value',
                name: 'Unemployment Rate (%)',
                nameLocation: 'middle',
                nameGap: 30,
                min: 2,
                max: 16,
                splitLine: {
                    lineStyle: {
                        type: 'dashed',
                        color: '#ccc'
                    }
                },
                axisLine: {
                    lineStyle: {
                        color: '#000'
                    }
                }
            },
            series: [
                {
                    name: '2018',
                    type: 'scatter',
                    symbolSize: function (data) {
                        return data[2] / 5; // Scale size for visualization
                    },
                    itemStyle: {
                        color: '#4472C4',
                        shadowBlur: 10,
                        shadowColor: 'rgba(0, 0, 0, 0.3)'
                    },
                    data: data2018
                },
                {
                    name: '2020',
                    type: 'scatter',
                    symbolSize: function (data) {
                        return data[2] / 5; // Scale size for visualization
                    },
                    itemStyle: {
                        color: '#C00000',
                        shadowBlur: 10,
                        shadowColor: 'rgba(0, 0, 0, 0.3)'
                    },
                    data: data2020
                }
            ]
        };

        myChart.setOption(option);

        window.addEventListener('resize', function () {
            myChart.resize();
        });
    </script>
</body>
</html>
