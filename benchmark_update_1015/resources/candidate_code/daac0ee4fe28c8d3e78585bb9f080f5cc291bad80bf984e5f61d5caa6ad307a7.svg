<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Axes -->
  <line x1="50" y1="550" x2="550" y2="550" stroke="black" stroke-width="2"/>
  <line x1="50" y1="550" x2="50" y2="50" stroke="black" stroke-width="2"/>
  
  <!-- Grid -->
  <line x1="50" y1="550" x2="550" y2="550" stroke="gray" stroke-dasharray="5,5"/>
  <line x1="50" y1="550" x2="50" y2="50" stroke="gray" stroke-dasharray="5,5"/>
  <line x1="150" y1="550" x2="150" y2="50" stroke="gray" stroke-dasharray="5,5"/>
  <line x1="250" y1="550" x2="250" y2="50" stroke="gray" stroke-dasharray="5,5"/>
  <line x1="350" y1="550" x2="350" y2="50" stroke="gray" stroke-dasharray="5,5"/>
  <line x1="450" y1="550" x2="450" y2="50" stroke="gray" stroke-dasharray="5,5"/>
  <line x1="50" y1="550" x2="550" y2="550" stroke="gray" stroke-dasharray="5,5"/>
  <line x1="50" y1="450" x2="550" y2="450" stroke="gray" stroke-dasharray="5,5"/>
  <line x1="50" y1="350" x2="550" y2="350" stroke="gray" stroke-dasharray="5,5"/>
  <line x1="50" y1="250" x2="550" y2="250" stroke="gray" stroke-dasharray="5,5"/>
  <line x1="50" y1="150" x2="550" y2="150" stroke="gray" stroke-dasharray="5,5"/>
  
  <!-- Curve -->
  <path d="M50,550 Q150,300 250,100 Q350,50 450,200 Q550,350 550,550" stroke="green" stroke-width="2" fill="none"/>
  
  <!-- Point P -->
  <circle cx="250" cy="100" r="5" fill="red"/>
  <text x="260" y="90" font-family="Arial" font-size="12" fill="red">P</text>
  
  <!-- Horizontal Line -->
  <line x1="50" y1="250" x2="550" y2="250" stroke="red" stroke-dasharray="5,5" stroke-width="2"/>
  <text x="560" y="260" font-family="Arial" font-size="12" fill="red">y=4</text>
  
  <!-- Labels -->
  <text x="560" y="560" font-family="Arial" font-size="12">x</text>
  <text x="20" y="540" font-family="Arial" font-size="12" transform="rotate(-90 20,540)">f(x)</text>
</svg>