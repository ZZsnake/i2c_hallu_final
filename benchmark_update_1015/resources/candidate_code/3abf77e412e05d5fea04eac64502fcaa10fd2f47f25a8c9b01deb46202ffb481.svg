<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Triangle -->
    <polygon points="0,70 40,70 20,30" fill="none" stroke="black" stroke-width="2"/>
    
    <!-- Dashed Height Line -->
    <line x1="20" y1="30" x2="20" y2="70" stroke="red" stroke-dasharray="5,5" stroke-width="1"/>
    
    <!-- Base Label -->
    <text x="20" y="80" font-family="Arial" font-size="12" fill="black">Base (b)</text>
    
    <!-- Height Label -->
    <text x="20" y="60" font-family="Arial" font-size="12" fill="black">Height (h)</text>
    
    <!-- Area Formula -->
    <text x="50" y="10" font-family="Arial" font-size="14" fill="red">Area = ½ × b × h</text>
</svg>