<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Approximation Gauge</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
        }
        #chart-container {
            width: 800px;
            height: 600px;
        }
    </style>
</head>
<body>

<div id="chart-container"></div>

<script>
    $(document).ready(function() {
        var chartDom = document.getElementById('chart-container');
        var myChart = echarts.init(chartDom);
        var option;

        option = {
            series: [
                {
                    type: 'gauge',
                    startAngle: 225,
                    endAngle: -45,
                    min: 0,
                    max: 4,
                    splitNumber: 10,
                    radius: '85%',
                    axisLine: {
                        lineStyle: {
                            width: 15,
                            color: [
                                [0.33, '#2c7bb6'],
                                [0.66, '#1a9641'],
                                [1, '#d7191c']
                            ]
                        }
                    },
                    pointer: {
                        icon: 'path://M12.8,0.7l12,40.1H0.7L12.8,0.7z',
                        length: '70%',
                        width: 12,
                        offsetCenter: [0, '5%'],
                        itemStyle: {
                            color: '#2c2e3a'
                        }
                    },
                    axisTick: {
                        distance: -25,
                        length: 8,
                        lineStyle: {
                            color: '#000',
                            width: 1
                        }
                    },
                    splitLine: {
                        distance: -30,
                        length: 15,
                        lineStyle: {
                            color: '#000',
                            width: 2
                        },
                        show: false // Hiding split lines to match the clean look of the image
                    },
                    axisLabel: {
                        color: '#000',
                        distance: -45,
                        fontSize: 14,
                        fontFamily: 'serif',
                        fontStyle: 'italic',
                        fontWeight: 'bold',
                        formatter: function (value) {
                            // Custom formatting to match the image labels
                            if (value === 0) return '0';
                            if (value === 2) return '2';
                            if (value === 4) return '4';
                            return value.toFixed(1);
                        }
                    },
                    detail: {
                        valueAnimation: true,
                        formatter: function (value) {
                            return '{value|' + value.toFixed(2) + '}\n{label|π Approx.}';
                        },
                        rich: {
                            value: {
                                fontSize: 32,
                                fontWeight: 'bold',
                                color: '#222',
                                fontFamily: 'serif',
                                padding: [10, 0, 10, 0]
                            },
                            label: {
                                fontSize: 18,
                                color: '#222',
                                fontFamily: 'serif'
                            }
                        },
                        offsetCenter: [0, '40%']
                    },
                    data: [
                        {
                            value: 3.14
                        }
                    ]
                }
            ]
        };

        myChart.setOption(option);

        window.addEventListener('resize', function() {
            myChart.resize();
        });
    });
</script>

</body>
</html>
