<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <!-- Top Panel -->
  <g id="top-panel">
    <!-- Border -->
    <rect x="30" y="30" width="400" height="300" fill="white" stroke="#2a2a2a" stroke-width="3"/>
    
    <!-- Gradient Bar -->
    <defs>
      <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#4a7c9e;stop-opacity:1" />
        <stop offset="35%" style="stop-color:#5a9a8a;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#6a9a7a;stop-opacity:1" />
        <stop offset="65%" style="stop-color:#c85a4a;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#d84a3a;stop-opacity:1" />
      </linearGradient>
    </defs>
    
    <rect x="105" y="110" width="250" height="130" fill="url(#grad1)" stroke="#2a4a6a" stroke-width="2"/>
    
    <!-- Field Lines - Solid Blue -->
    <!-- Left side curves -->
    <path d="M 105 140 Q 60 100 75 50" fill="none" stroke="#1a3a5a" stroke-width="2.5"/>
    <path d="M 105 170 Q 50 170 55 280" fill="none" stroke="#1a3a5a" stroke-width="2.5"/>
    <path d="M 105 210 Q 60 250 75 300" fill="none" stroke="#1a3a5a" stroke-width="2.5"/>
    <path d="M 90 110 Q 70 80 85 40" fill="none" stroke="#1a3a5a" stroke-width="2"/>
    <path d="M 90 240 Q 70 270 85 310" fill="none" stroke="#1a3a5a" stroke-width="2"/>
    
    <!-- Right side curves -->
    <path d="M 355 140 Q 400 100 385 50" fill="none" stroke="#1a3a5a" stroke-width="2.5"/>
    <path d="M 355 170 Q 410 170 405 280" fill="none" stroke="#1a3a5a" stroke-width="2.5"/>
    <path d="M 355 210 Q 400 250 385 300" fill="none" stroke="#1a3a5a" stroke-width="2.5"/>
    <path d="M 370 110 Q 390 80 375 40" fill="none" stroke="#1a3a5a" stroke-width="2"/>
    <path d="M 370 240 Q 390 270 375 310" fill="none" stroke="#1a3a5a" stroke-width="2"/>
    
    <!-- Pole markers -->
    <circle cx="110" cy="175" r="5" fill="#1a3a5a"/>
    <text x="120" y="180" font-family="Arial" font-size="18" fill="#1a3a5a" font-weight="bold">S</text>
    <circle cx="350" cy="175" r="5" fill="#1a3a5a"/>
    <text x="360" y="180" font-family="Arial" font-size="18" fill="#1a3a5a" font-weight="bold">N</text>
    
    <!-- Battery Symbol -->
    <g transform="translate(490, 160)">
      <rect x="0" y="0" width="45" height="25" rx="3" fill="#2a2a2a"/>
      <rect x="45" y="8" width="8" height="9" fill="#2a2a2a"/>
    </g>
  </g>
  
  <!-- Bottom Panel -->
  <g id="bottom-panel">
    <!-- Border -->
    <rect x="30" y="390" width="400" height="300" fill="white" stroke="#2a2a2a" stroke-width="3"/>
    
    <!-- Gradient Bar -->
    <rect x="105" y="470" width="250" height="130" fill="url(#grad1)" stroke="#2a4a6a" stroke-width="2"/>
    
    <!-- Field Lines - Dashed Red -->
    <!-- Left side curves -->
    <path d="M 105 500 Q 50 450 65 410" fill="none" stroke="#a83a3a" stroke-width="2.5" stroke-dasharray="5,5"/>
    <path d="M 105 530 Q 40 530 45 640" fill="none" stroke="#a83a3a" stroke-width="2.5" stroke-dasharray="5,5"/>
    <path d="M 105 570 Q 50 610 65 660" fill="none" stroke="#a83a3a" stroke-width="2.5" stroke-dasharray="5,5"/>
    <path d="M 90 470 Q 60 440 75 400" fill="none" stroke="#a83a3a" stroke-width="2" stroke-dasharray="5,5"/>
    <path d="M 90 600 Q 60 630 75 670" fill="none" stroke="#a83a3a" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Right side curves -->
    <path d="M 355 500 Q 410 450 395 410" fill="none" stroke="#a83a3a" stroke-width="2.5" stroke-dasharray="5,5"/>
    <path d="M 355 530 Q 420 530 415 640" fill="none" stroke="#a83a3a" stroke-width="2.5" stroke-dasharray="5,5"/>
    <path d="M 355 570 Q 410 610 395 660" fill="none" stroke="#a83a3a" stroke-width="2.5" stroke-dasharray="5,5"/>
    <path d="M 370 470 Q 400 440 385 400" fill="none" stroke="#a83a3a" stroke-width="2" stroke-dasharray="5,5"/>
    <path d="M 370 600 Q 400 630 385 670" fill="none" stroke="#a83a3a" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Pole markers -->
    <circle cx="110" cy="535" r="5" fill="#a83a3a"/>
    <text x="120" y="540" font-family="Arial" font-size="18" fill="#a83a3a" font-weight="bold">S</text>
    <circle cx="350" cy="535" r="5" fill="#a83a3a"/>
    <text x="360" y="540" font-family="Arial" font-size="18" fill="#a83a3a" font-weight="bold">N</text>
    
    <!-- Electromagnet Symbol -->
    <g transform="translate(490, 520)">
      <rect x="0" y="0" width="8" height="25" fill="#2a2a2a"/>
      <rect x="37" y="0" width="8" height="25" fill="#2a2a2a"/>
      <rect x="8" y="8" width="29" height="9" fill="none" stroke="#2a2a2a" stroke-width="2"/>
      <text x="52" y="18" font-family="Arial" font-size="20" fill="#2a2a2a" font-weight="bold">H</text>
    </g>
  </g>
</svg>