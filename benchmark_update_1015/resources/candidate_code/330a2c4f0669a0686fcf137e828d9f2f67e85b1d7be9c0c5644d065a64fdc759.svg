<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect x="0" y="0" width="800" height="600" fill="#f0f0f0" />
  <line x1="50" y1="550" x2="50" y2="50" stroke="black" stroke-width="2" />
  <line x1="50" y1="550" x2="750" y2="550" stroke="black" stroke-width="2" />
  <text x="20" y="30" font-family="serif" font-size="18">Price</text>
  <text x="770" y="570" font-family="serif" font-size="18">Quantity</text>
  <line x1="50" y1="250" x2="750" y2="250" stroke="black" stroke-dasharray="5" stroke-width="1" />
  <line x1="50" y1="350" x2="750" y2="350" stroke="black" stroke-dasharray="5" stroke-width="1" />
  <line x1="350" y1="550" x2="350" y2="50" stroke="black" stroke-dasharray="5" stroke-width="1" />
  <line x1="450" y1="550" x2="450" y2="50" stroke="black" stroke-dasharray="5" stroke-width="1" />
  <text x="20" y="245" font-family="serif" font-size="18">P<sub>S</sub></text>
  <text x="20" y="345" font-family="serif" font-size="18">P<sub>P</sub></text>
  <text x="340" y="570" font-family="serif" font-size="18">Q<sub>S</sub></text>
  <text x="440" y="570" font-family="serif" font-size="18">Q<sub>P</sub></text>
  <path d="M50,550 L750,50" stroke="cyan" stroke-width="2" />
  <path d="M50,50 L750,550" stroke="yellow" stroke-width="2" />
  <path d="M50,100 L750,600" stroke="yellow" stroke-width="2" />
  <text x="700" y="100" font-family="serif" font-size="18" fill="cyan">Supply</text>
  <text x="700" y="450" font-family="serif" font-size="18" fill="yellow">Social Demand</text>
  <text x="700" y="550" font-family="serif" font-size="18" fill="yellow">Private Demand</text>
  <circle cx="400" cy="250" r="5" fill="black" />
  <circle cx="500" cy="350" r="5" fill="black" />
  <text x="380" y="230" font-family="serif" font-size="18">Ideal equilibrium</text>
  <text x="480" y="330" font-family="serif" font-size="18">Actual equilibrium</text>
</svg>