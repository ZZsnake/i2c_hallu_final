<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f8f8"/>
  
  <!-- Title -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">
    GDP Growth Rate of Exampleland
  </text>
  
  <!-- Subtitle -->
  <text x="85" y="55" font-family="Arial, sans-serif" font-size="11" fill="#555">
    (Source: Exampleland Statistics Bureau)
  </text>
  <text x="85" y="72" font-family="Arial, sans-serif" font-size="11" fill="#555">
    2023 data is provisional
  </text>
  
  <!-- Y-axis label -->
  <text x="12" y="30" font-family="Arial, sans-serif" font-size="14" fill="#333">%</text>
  
  <!-- Y-axis -->
  <line x1="65" y1="90" x2="65" y2="320" stroke="#333" stroke-width="1.5"/>
  
  <!-- Y-axis ticks and gridlines -->
  <line x1="65" y1="320" x2="700" y2="320" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="45" y="325" font-family="Arial, sans-serif" font-size="12" fill="#333">0</text>
  
  <line x1="65" y1="297" x2="700" y2="297" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="45" y="302" font-family="Arial, sans-serif" font-size="12" fill="#333">2</text>
  
  <line x1="65" y1="274" x2="700" y2="274" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="45" y="279" font-family="Arial, sans-serif" font-size="12" fill="#333">4</text>
  
  <line x1="65" y1="251" x2="700" y2="251" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="45" y="256" font-family="Arial, sans-serif" font-size="12" fill="#333">6</text>
  
  <line x1="65" y1="228" x2="700" y2="228" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="45" y="233" font-family="Arial, sans-serif" font-size="12" fill="#333">8</text>
  
  <line x1="65" y1="205" x2="700" y2="205" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="38" y="210" font-family="Arial, sans-serif" font-size="12" fill="#333">10</text>
  
  <!-- X-axis -->
  <line x1="65" y1="320" x2="700" y2="320" stroke="#333" stroke-width="1.5"/>
  
  <!-- Bars (24 bars from 2000-2023, width ~24px, spacing ~2px) -->
  <rect x="70" y="305" width="22" height="15" fill="#1e3a5f"/>
  <rect x="94" y="297" width="22" height="23" fill="#1e3a5f"/>
  <rect x="118" y="289" width="22" height="31" fill="#1e3a5f"/>
  <rect x="142" y="282" width="22" height="38" fill="#1e3a5f"/>
  <rect x="166" y="274" width="22" height="46" fill="#1e3a5f"/>
  <rect x="190" y="266" width="22" height="54" fill="#1e3a5f"/>
  <rect x="214" y="251" width="22" height="69" fill="#1e3a5f"/>
  <rect x="238" y="259" width="22" height="61" fill="#1e3a5f"/>
  <rect x="262" y="274" width="22" height="46" fill="#1e3a5f"/>
  <rect x="286" y="289" width="22" height="31" fill="#1e3a5f"/>
  <rect x="310" y="312" width="22" height="8" fill="#1e3a5f"/>
  <rect x="334" y="316" width="22" height="4" fill="#1e3a5f"/>
  <rect x="358" y="305" width="22" height="15" fill="#1e3a5f"/>
  <rect x="382" y="316" width="22" height="4" fill="#1e3a5f"/>
  <rect x="406" y="318" width="22" height="2" fill="#1e3a5f"/>
  <rect x="430" y="316" width="22" height="4" fill="#1e3a5f"/>
  <rect x="454" y="318" width="22" height="2" fill="#1e3a5f"/>
  <rect x="478" y="318" width="22" height="2" fill="#1e3a5f"/>
  <rect x="502" y="318" width="22" height="2" fill="#1e3a5f"/>
  <rect x="526" y="318" width="22" height="2" fill="#1e3a5f"/>
  <rect x="550" y="305" width="22" height="15" fill="#1e3a5f"/>
  <rect x="574" y="318" width="22" height="2" fill="#1e3a5f"/>
  <rect x="598" y="318" width="22" height="2" fill="#1e3a5f"/>
  <rect x="622" y="318" width="22" height="2" fill="#1e3a5f"/>
  
  <!-- X-axis labels -->
  <text x="63" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">2000</text>
  <text x="111" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">05</text>
  <text x="159" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">10</text>
  <text x="207" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">15</text>
  <text x="255" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">20</text>
  <text x="303" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">25</text>
  <text x="351" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">30</text>
  <text x="399" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">35</text>
  <text x="447" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">40</text>
  <text x="495" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">45</text>
  <text x="543" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">50</text>
  <text x="591" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">55</text>
  <text x="639" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">2023</text>
  
  <!-- X-axis title -->
  <text x="360" y="370" font-family="Arial, sans-serif" font-size="16" fill="#333">Year</text>
  
  <!-- Annotation: Policy Change -->
  <line x1="200" y1="180" x2="225" y2="245" stroke="#333" stroke-width="1"/>
  <text x="152" y="183" font-family="Arial, sans-serif" font-size="11" fill="#333">Policy Change</text>
  
  <!-- Annotation: Global Recession -->
  <line x1="290" y1="110" x2="273" y2="255" stroke="#333" stroke-width="1"/>
  <text x="220" y="120" font-family="Arial, sans-serif" font-size="11" fill="#333">Global Recession</text>
</svg>