<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <title>Computer Science Data Flow Diagram</title>

  <!-- Background and Sections -->
  <rect width="1200" height="900" fill="white"/>

  <!-- Input Sources -->
  <text x="50" y="50" font-size="24" font-family="sans-serif" font-weight="bold">Input Sources</text>
  <rect x="20" y="20" width="300" height="100" fill="none" stroke="black" stroke-width="1"/>
  <rect x="330" y="20" width="200" height="100" fill="none" stroke="black" stroke-width="1"/>
  <rect x="540" y="20" width="200" height="100" fill="none" stroke="black" stroke-width="1"/>
  <text x="150" y="70" font-size="16" font-family="sans-serif">Database</text>
  <text x="400" y="70" font-size="16" font-family="sans-serif">User Interface</text>
  <text x="610" y="70" font-size="16" font-family="sans-serif">API Gateway</text>

  <!-- Data Processing -->
  <rect x="20" y="150" width="750" height="80" fill="#ADD8E6" stroke="black" stroke-width="1"/>
  <text x="375" y="200" font-size="16" font-family="sans-serif">Data Processing</text>
  <text x="375" y="220" font-size="12" font-family="sans-serif">Parsing, Validation, Filtering, Transformation, Aggregation…</text>

  <!-- Central Processing Unit -->
  <rect x="20" y="250" width="750" height="300" fill="#F0F8FF" stroke="black" stroke-width="1"/>
  <text x="375" y="375" font-size="24" font-family="sans-serif" font-weight="bold">Central Processing Unit</text>

  <!-- Auxiliary Modules -->
  <text x="800" y="250" font-size="24" font-family="sans-serif" font-weight="bold">Auxiliary Modules</text>
  <rect x="780" y="270" width="180" height="80" fill="#90EE90" stroke="black" stroke-width="1"/>
  <rect x="780" y="360" width="180" height="80" fill="#D8BFD8" stroke="black" stroke-width="1"/>
  <rect x="780" y="450" width="180" height="80" fill="#FFB6C1" stroke="black" stroke-width="1"/>
  <text x="850" y="310" font-size="16" font-family="sans-serif">Encryption\nHashing\nCompression</text>
  <text x="850" y="400" font-size="16" font-family="sans-serif">Authentication\nSession Control</text>
  <text x="850" y="490" font-size="16" font-family="sans-serif">Cache Update\nResult Storage</text>

  <!-- System Services -->
  <text x="800" y="550" font-size="24" font-family="sans-serif" font-weight="bold">System Services</text>
  <rect x="780" y="570" width="180" height="80" fill="#FFA07A" stroke="black" stroke-width="1"/>
  <rect x="780" y="660" width="180" height="80" fill="#F0E68C" stroke="black" stroke-width="1"/>
  <rect x="780" y="750" width="180" height="80" fill="#B0E2FF" stroke="black" stroke-width="1"/>
  <text x="850" y="610" font-size="16" font-family="sans-serif">Scheduler\nTask Queue, Priority</text>
  <text x="850" y="700" font-size="16" font-family="sans-serif">Backup, Redundancy\nFailover, Synchronization…</text>
  <text x="850" y="790" font-size="16" font-family="sans-serif">Resource Manager\nQuota Enforcement</text>

  <!-- Output Result Channels -->
  <text x="50" y="650" font-size="24" font-family="sans-serif" font-weight="bold">Output Result Channels</text>
  <rect x="20" y="670" width="200" height="80" fill="#E6E6FA" stroke="black" stroke-width="1"/>
  <rect x="230" y="670" width="200" height="80" fill="#98FB98" stroke="black" stroke-width="1"/>
  <rect x="440" y="670" width="200" height="80" fill="#DDA0DD" stroke="black" stroke-width="1"/>
  <text x="110" y="710" font-size="16" font-family="sans-serif">Event Log\nMonitoring</text>
  <text x="320" y="710" font-size="16" font-family="sans-serif">User Notification\nMessaging Queue</text>
  <text x="530" y="710" font-size="16" font-family="sans-serif">Audit Trail\nSystem Log</text>

  <!-- Arrows -->
  <path d="M150,100 L220,160" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M450,100 L375,160" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M650,100 L575,160" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M375,230 L220,280" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M375,230 L575,280" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M850,330 L750,310" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M850,430 L750,400" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M850,530 L750,490" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M850,610 L750,570" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M850,700 L750,660" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M850,790 L750,750" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M110,710 L20,750" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M320,710 L20,750" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M530,710 L20,750" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead Definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
</svg>