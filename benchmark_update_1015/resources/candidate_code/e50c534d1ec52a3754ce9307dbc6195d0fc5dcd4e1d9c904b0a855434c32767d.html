<!DOCTYPE html>
<html>
<head>
  <title>Annual Rainfall Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
    }
    #chartContainer {
      width: 800px;
      height: 600px;
      margin: 20px auto;
    }
  </style>
</head>
<body>

  <div id="chartContainer"></div>

  <script>
    $(function() {
      var chartDom = document.getElementById('chartContainer');
      var myChart = echarts.init(chartDom);
      var option = {
        title: {
          text: 'Annual Rainfall in Major Cities (2016-2022)'
        },
        tooltip: {
          trigger: 'axis'
        },
        legend: {
          data: ['London', 'Cairo']
        },
        grid: {
          left: '3%',
          right: '4%',
          bottom: '3%',
          containLabel: true
        },
        xAxis: {
          type: 'category',
          boundaryGap: false,
          data: ['2016', '2017', '2018', '2019', '2020', '2021', '2022']
        },
        yAxis: {
          type: 'value'
        },
        series: [
          {
            name: 'London',
            type: 'line',
            stack: 'Total',
            data: [680, 760, 780, 720, 800, 850, 820],
            lineStyle: {
              color: '#3498db'
            }
          },
          {
            name: 'Cairo',
            type: 'line',
            stack: 'Total',
            data: [10, 15, 5, 10, 12, 8, 10],
            lineStyle: {
              color: '#e74c3c'
            }
          }
        ]
      };
      myChart.setOption(option);
    });
  </script>

</body>
</html>
