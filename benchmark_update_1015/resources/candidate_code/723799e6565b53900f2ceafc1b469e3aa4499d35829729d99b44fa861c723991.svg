<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <!-- Background -->
  <rect width="200" height="120" fill="white" />

  <!-- Spindle Fibers (Microtubules) -->
  <g stroke="#8B5A2B" stroke-width="0.5" fill="none">
    <!-- Left Pole Fibers -->
    <line x1="20" y1="60" x2="90" y2="25" />
    <line x1="20" y1="60" x2="90" y2="45" />
    <line x1="20" y1="60" x2="90" y2="75" />
    <line x1="20" y1="60" x2="90" y2="95" />
    <path d="M20,60 Q60,40 110,40" />
    <path d="M20,60 Q60,80 110,80" />
    <line x1="20" y1="60" x2="110" y2="60" />
    <line x1="20" y1="60" x2="60" y2="25" />
    <line x1="20" y1="60" x2="60" y2="95" />

    <!-- Right Pole Fibers -->
    <line x1="180" y1="60" x2="110" y2="25" />
    <line x1="180" y1="60" x2="110" y2="45" />
    <line x1="180" y1="60" x2="110" y2="75" />
    <line x1="180" y1="60" x2="110" y2="95" />
    <path d="M180,60 Q140,40 90,40" />
    <path d="M180,60 Q140,80 90,80" />
    <line x1="180" y1="60" x2="90" y2="60" />
    <line x1="180" y1="60" x2="140" y2="25" />
    <line x1="180" y1="60" x2="140" y2="95" />
  </g>

  <!-- Chromatids (Blue Blocks) -->
  <g fill="#2E5A88">
    <!-- Left Column -->
    <rect x="88" y="20" width="8" height="8" rx="1" />
    <rect x="88" y="40" width="8" height="8" rx="1" />
    <rect x="88" y="70" width="8" height="8" rx="1" />
    <rect x="88" y="90" width="8" height="8" rx="1" />
    <!-- Right Column -->
    <rect x="104" y="20" width="8" height="8" rx="1" />
    <rect x="104" y="40" width="8" height="8" rx="1" />
    <rect x="104" y="70" width="8" height="8" rx="1" />
    <rect x="104" y="90" width="8" height="8" rx="1" />
  </g>
  
  <!-- Kinetochores (Light Blue Dots) -->
  <g fill="#87CEEB">
    <circle cx="92" cy="20" r="1.5" />
    <circle cx="92" cy="40" r="1.5" />
    <circle cx="92" cy="70" r="1.5" />
    <circle cx="92" cy="90" r="1.5" />
    <circle cx="108" cy="20" r="1.5" />
    <circle cx="108" cy="40" r="1.5" />
    <circle cx="108" cy="70" r="1.5" />
    <circle cx="108" cy="90" r="1.5" />
  </g>

  <!-- Centrosomes (Purple Circles with Asters) -->
  <g stroke="#A020F0" stroke-width="1">
    <!-- Left Centrosome -->
    <circle cx="20" cy="60" r="6" fill="#D87093" />
    <g stroke-width="0.8">
      <line x1="20" y1="50" x2="20" y2="45" /><line x1="20" y1="70" x2="20" y2="75" />
      <line x1="10" y1="60" x2="5" y2="60" /><line x1="30" y1="60" x2="35" y2="60" />
      <line x1="13" y1="53" x2="10" y2="50" /><line x1="27" y1="67" x2="30" y2="70" />
      <line x1="13" y1="67" x2="10" y2="70" /><line x1="27" y1="53" x2="30" y2="50" />
    </g>
    <!-- Right Centrosome -->
    <circle cx="180" cy="60" r="6" fill="#D87093" />
    <g stroke-width="0.8">
      <line x1="180" y1="50" x2="180" y2="45" /><line x1="180" y1="70" x2="180" y2="75" />
      <line x1="170" y1="60" x2="165" y2="60" /><line x1="190" y1="60" x2="195" y2="60" />
      <line x1="173" y1="53" x2="170" y2="50" /><line x1="187" y1="67" x2="190" y2="70" />
      <line x1="173" y1="67" x2="170" y2="70" /><line x1="187" y1="53" x2="190" y2="50" />
    </g>
  </g>

  <!-- Nuclear Envelope Fragments (Purple Curves) -->
  <g stroke="#938BB5" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M15,25 Q30,10 50,15" />
    <path d="M65,15 Q80,10 95,15" />
    <path d="M110,10 Q130,5 150,15" />
    <path d="M165,20 Q180,25 190,35" />
    <path d="M15,95 Q30,110 50,105" />
    <path d="M65,105 Q80,115 95,110" />
    <path d="M150,110 Q170,115 190,85" />
  </g>
</svg>