<svg width="800" height="800" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Rectangles -->
  <rect x="50" y="50" width="250" height="250" fill="#cccccc" />
  <path d="M 160 50 L 300 190 L 300 50 Z" fill="#4d4d4d" />
  
  <!-- Decision Boundary -->
  <line x1="160" y1="50" x2="300" y2="190" stroke="#1f77b4" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Axes -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>
  <line x1="20" y1="175" x2="330" y2="175" stroke="black" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="175" y1="330" x2="175" y2="20" stroke="black" stroke-width="3" marker-end="url(#arrowhead)" />

  <!-- Axis Labels -->
  <text x="305" y="165" font-family="Arial, sans-serif" font-weight="bold" font-size="32">X<tspan baseline-shift="sub" font-size="20">1</tspan></text>
  <text x="185" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="32">X<tspan baseline-shift="sub" font-size="20">2</tspan></text>

  <!-- Grid Lines connecting points -->
  <rect x="175" y="95" width="80" height="80" fill="none" stroke="black" stroke-width="2" />

  <!-- Data Points -->
  <!-- (0,0) -->
  <circle cx="175" cy="175" r="15" fill="#ff6600" stroke="black" stroke-width="3" />
  <!-- (1,0) -->
  <circle cx="255" cy="175" r="15" fill="#ff6600" stroke="black" stroke-width="3" />
  <!-- (0,1) -->
  <circle cx="175" cy="95" r="15" fill="#ff6600" stroke="black" stroke-width="3" />
  <!-- (1,1) -->
  <circle cx="255" cy="95" r="15" fill="#66ff66" stroke="black" stroke-width="3" />

  <!-- Coordinate Labels -->
  <text x="125" y="105" font-family="Arial, sans-serif" font-weight="bold" font-size="28">0</text>
  <text x="125" y="225" font-family="Arial, sans-serif" font-weight="bold" font-size="28">1</text>
  <text x="240" y="225" font-family="Arial, sans-serif" font-weight="bold" font-size="28">1</text>

  <!-- Bottom Label -->
  <text x="200" y="370" font-family="Arial, sans-serif" font-weight="bold" font-size="32" text-anchor="middle">AND (X<tspan baseline-shift="sub" font-size="20">1</tspan>∩X<tspan baseline-shift="sub" font-size="20">2</tspan>)</text>
</svg>