<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <!-- Definitions -->
  <style>
    .wire { fill:none; stroke:#000; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .block { stroke:#000; stroke-width:4; fill:#c6fbff; }
    .amp { stroke:#000; stroke-width:4; fill:#ffb9df; }
    .audio { stroke:#000; stroke-width:4; fill:#f7ffb3; }
    .text { font-family:Arial,Helvetica,sans-serif; fill:#000; }
  </style>

  <!-- Main signal baseline -->
  <!-- Antenna -->
  <g transform="translate(40,140)">
    <line class="wire" x1="20" y1="-60" x2="20" y2="0"/>
    <line class="wire" x1="20" y1="-60" x2="0" y2="-20"/>
    <line class="wire" x1="20" y1="-60" x2="40" y2="-20"/>
    <line class="wire" x1="20" y1="0" x2="80" y2="0"/>
  </g>

  <!-- Summing junction circle with plus -->
  <g transform="translate(140,140)">
    <circle cx="0" cy="0" r="22" fill="#fff" stroke="#000" stroke-width="4"/>
    <line class="wire" x1="-40" y1="0" x2="-22" y2="0"/>
    <line class="wire" x1="22" y1="0" x2="70" y2="0"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#000" stroke-width="4"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#000" stroke-width="4"/>
  </g>

  <!-- Bandpass filter block -->
  <g transform="translate(210,105)">
    <rect class="block" x="0" y="0" width="150" height="70"/>
    <!-- internal squiggles -->
    <path d="M25,50 C35,35 45,35 55,20 C65,5 75,5 85,20" fill="none" stroke="#000" stroke-width="3"/>
    <path d="M55,50 C65,35 75,35 85,20 C95,5 105,5 115,20" fill="none" stroke="#000" stroke-width="3"/>
    <path d="M35,50 C45,35 55,35 65,20 C75,5 85,5 95,20" fill="none" stroke="#000" stroke-width="3"/>
    <!-- input and output wires -->
    <line class="wire" x1="-50" y1="35" x2="0" y2="35"/>
    <line class="wire" x1="150" y1="35" x2="190" y2="35"/>
  </g>

  <!-- RF Amplifier & Detector triangle -->
  <g transform="translate(390,105)">
    <polygon class="amp" points="0,0 0,70 110,35"/>
    <!-- label A -->
    <text class="text" x="35" y="48" font-size="32">A</text>
    <!-- input wire already from filter; output wire to node -->
    <line class="wire" x1="-30" y1="35" x2="0" y2="35"/>
    <line class="wire" x1="110" y1="35" x2="140" y2="35"/>
  </g>

  <!-- Junction node -->
  <circle cx="640" cy="140" r="7" fill="#000"/>

  <!-- Wire from RF amp to node -->
  <line class="wire" x1="500" y1="140" x2="640" y2="140"/>

  <!-- Audio amplifier triangle -->
  <g transform="translate(640,105)">
    <polygon class="audio" points="0,0 0,70 120,35"/>
    <line class="wire" x1="0" y1="35" x2="-5" y2="35"/>
    <line class="wire" x1="120" y1="35" x2="160" y2="35"/>
  </g>

  <!-- Speaker -->
  <g transform="translate(800,105)">
    <rect class="audio" x="0" y="20" width="20" height="30"/>
    <polygon class="audio" points="20,10 20,60 55,40 55,30"/>
  </g>

  <!-- Feedback network block -->
  <g transform="translate(330,210)">
    <rect class="block" x="0" y="0" width="130" height="70"/>
    <text class="text" x="55" y="48" font-size="40">β</text>
  </g>

  <!-- Feedback wiring -->
  <!-- Down from junction node to top of beta block -->
  <path class="wire" d="M640,140 L640,245 L460,245"/>
  <!-- From left of beta block back to adder -->
  <path class="wire" d="M330,245 L140,245 L140,162"/>

  <!-- Text labels -->
  <!-- Bandpass Filter label -->
  <text class="text" x="285" y="80" font-size="24" text-anchor="middle">Bandpass</text>
  <text class="text" x="285" y="100" font-size="24" text-anchor="middle">Filter</text>

  <!-- RF Amplifier & Detector -->
  <text class="text" x="445" y="55" font-size="24" text-anchor="middle">RF Amplifier</text>
  <text class="text" x="445" y="75" font-size="24" text-anchor="middle">&amp; Detector</text>

  <!-- Audio Amplifier -->
  <text class="text" x="700" y="55" font-size="24" text-anchor="middle">Audio Amplifier</text>

  <!-- Feedback Network -->
  <text class="text" x="395" y="305" font-size="24" text-anchor="middle">Feedback</text>
  <text class="text" x="395" y="325" font-size="24" text-anchor="middle">Network</text>
</svg>