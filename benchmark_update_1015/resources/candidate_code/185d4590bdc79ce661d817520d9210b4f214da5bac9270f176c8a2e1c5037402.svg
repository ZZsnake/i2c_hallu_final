<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <marker id="arrowheadYellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFD700" />
    </marker>
    <marker id="arrowheadBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00BFFF" />
    </marker>
  </defs>

  <!-- Nucleus -->
  <circle cx="150" cy="150" r="5" fill="black" />
  <text x="158" y="164" font-family="Times New Roman, serif" font-size="20" font-style="italic" fill="black">+Ze</text>

  <!-- Electron Shells -->
  <circle cx="150" cy="150" r="12" stroke="gray" stroke-width="1" fill="none" />
  <text x="128" y="132" font-family="Times New Roman, serif" font-size="20" font-style="italic" fill="#FFD700">n = 1</text>

  <circle cx="150" cy="150" r="52" stroke="gray" stroke-width="1" fill="none" />
  <text x="128" y="92" font-family="Times New Roman, serif" font-size="20" font-style="italic" fill="#FFD700">n = 2</text>

  <path d="M265.56 160.11 A116 116 0 1 1 250.46 92 A116 116 0 0 1 265.56 160.11" stroke="gray" stroke-width="1" fill="none" />
  <text x="128" y="26" font-family="Times New Roman, serif" font-size="20" font-style="italic" fill="#FFD700">n = 3</text>

  <!-- Electron transition -->
  <!-- Starting electron position (n=3) -->
  <circle cx="250" cy="92" r="4" fill="#800080" />
  <!-- Ending electron position (n=2) -->
  <circle cx="194" cy="122" r="4" fill="#800080" />

  <!-- Transition arrow -->
  <line x1="246" y1="95" x2="198" y2="120" stroke="#FFD700" stroke-width="2" marker-end="url(#arrowheadYellow)" />

  <!-- Emitted photon -->
  <path d="M205 120
           c 5 -12, 10 -12, 15 0
           c 5 12, 10 12, 15 0
           c 5 -12, 10 -12, 15 0
           c 5 12, 10 12, 15 0
           c 5 -12, 10 -12, 15 0
           c 5 12, 10 12, 15 0" 
        fill="none" stroke="#00BFFF" stroke-width="2" marker-end="url(#arrowheadBlue)" />
  <text x="206" y="154" font-family="Times New Roman, serif" font-size="20" font-style="italic" fill="#00BFFF">ΔE = hν</text>

</svg>