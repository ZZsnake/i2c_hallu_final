<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
    <marker id="redArrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="red" />
    </marker>
    <marker id="greenArrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="green" />
    </marker>
  </defs>

  <!-- Coordinates (approximate, based on visual estimation) -->
  <!-- q: (150, 300) -->
  <!-- q1: (500, 300) -->
  <!-- q2: (350, 50) -->
  <!-- P: (350, 220) -->
  <!-- Fel,1 end: (50, 250) -->
  <!-- Fel,2 end: (100, 350) -->
  <!-- Fel,g end: (0, 300) -->

  <!-- Main triangle lines -->
  <line x1="150" y1="300" x2="500" y2="300" stroke="black" stroke-width="3"/>
  <line x1="500" y1="300" x2="350" y2="50" stroke="black" stroke-width="3"/>
  <line x1="350" y1="50" x2="150" y2="300" stroke="black" stroke-width="3"/>

  <!-- Dashed lines for P -->
  <line x1="350" y1="50" x2="350" y2="220" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="500" y1="300" x2="350" y2="220" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="150" y1="300" x2="350" y2="220" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Forces -->
  <!-- Fg,z -->
  <line x1="150" y1="300" x2="350" y2="220" stroke="red" stroke-width="2"/>
  <text x="250" y="250" font-family="sans-serif" font-size="18" fill="black">F<tspan baseline-shift="sub">g,z</tspan></text>

  <!-- Fel,1 -->
  <line x1="150" y1="300" x2="50" y2="250" stroke="green" stroke-width="2"/>
  <text x="40" y="240" font-family="sans-serif" font-size="18" fill="black">F<tspan baseline-shift="sub">el,1</tspan></text>

  <!-- Fel,2 -->
  <line x1="150" y1="300" x2="100" y2="350" stroke="green" stroke-width="2"/>
  <text x="100" y="365" font-family="sans-serif" font-size="18" fill="black">F<tspan baseline-shift="sub">el,2</tspan></text>

  <!-- Fel,g (resultant) -->
  <line x1="150" y1="300" x2="0" y2="300" stroke="red" stroke-width="2"/>
  <text x="0" y="315" font-family="sans-serif" font-size="18" fill="black">F<tspan baseline-shift="sub">el,g</tspan></text>

  <!-- Parallelogram for Fel,g -->
  <line x1="50" y1="250" x2="0" y2="300" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="350" x2="0" y2="300" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Charges (circles) -->
  <circle cx="150" cy="300" r="8" stroke="black" stroke-width="1" fill="white"/>
  <text x="160" y="305" font-family="sans-serif" font-size="20" fill="black">q</text>

  <circle cx="500" cy="300" r="8" stroke="black" stroke-width="1" fill="white"/>
  <text x="510" y="305" font-family="sans-serif" font-size="20" fill="black">q<tspan baseline-shift="sub">1</tspan></text>

  <circle cx="350" cy="50" r="8" stroke="black" stroke-width="1" fill="white"/>
  <text x="360" y="55" font-family="sans-serif" font-size="20" fill="black">q<tspan baseline-shift="sub">2</tspan></text>

  <!-- Point P (cross) -->
  <line x1="345" y1="215" x2="355" y2="225" stroke="black" stroke-width="2"/>
  <line x1="345" y1="225" x2="355" y2="215" stroke="black" stroke-width="2"/>
  <text x="360" y="225" font-family="sans-serif" font-size="20" fill="black">P</text>

  <!-- Labels for distances -->
  <text x="420" y="280" font-family="sans-serif" font-size="20" fill="black">a</text>
  <text x="340" y="130" font-family="sans-serif" font-size="20" fill="black">d</text>

</svg>