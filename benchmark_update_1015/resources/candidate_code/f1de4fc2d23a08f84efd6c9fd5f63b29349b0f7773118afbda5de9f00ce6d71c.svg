<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="800" fill="#fdfdfd" />
  
  <!-- Title -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" fill="#000">Foreign aid given, per capita</text>
  
  <!-- Chart Area Background -->
  <rect x="60" y="100" width="700" height="640" fill="none" stroke="#ccc" stroke-width="1" />
  
  <!-- Grid Lines (every $100, assuming $1000 is at x=660) -->
  <!-- Scale: $100 = 60 units. $0 at x=60, $1000 at x=660 -->
  <line x1="120" y1="100" x2="120" y2="740" stroke="#ccc" stroke-width="1" />
  <line x1="180" y1="100" x2="180" y2="740" stroke="#ccc" stroke-width="1" />
  <line x1="240" y1="100" x2="240" y2="740" stroke="#ccc" stroke-width="1" />
  <line x1="300" y1="100" x2="300" y2="740" stroke="#ccc" stroke-width="1" />
  <line x1="360" y1="100" x2="360" y2="740" stroke="#ccc" stroke-width="1" />
  <line x1="420" y1="100" x2="420" y2="740" stroke="#ccc" stroke-width="1" />
  <line x1="480" y1="100" x2="480" y2="740" stroke="#ccc" stroke-width="1" />
  <line x1="540" y1="100" x2="540" y2="740" stroke="#ccc" stroke-width="1" />
  <line x1="600" y1="100" x2="600" y2="740" stroke="#ccc" stroke-width="1" />
  <line x1="660" y1="100" x2="660" y2="740" stroke="#ccc" stroke-width="1" />
  <line x1="720" y1="100" x2="720" y2="740" stroke="#ccc" stroke-width="1" />

  <!-- Bars and Labels -->
  <g font-family="Arial, sans-serif" font-size="32">
    <!-- Norway (~$1120) -->
    <rect x="60" y="105" width="672" height="50" fill="#801a60" />
    <text x="610" y="142" fill="#fff" text-anchor="middle">Norway</text>
    
    <!-- Switzerland (~$510) -->
    <rect x="60" y="158" width="310" height="50" fill="#801a60" />
    <text x="380" y="195" fill="#000">Switzerland</text>
    
    <!-- Sweden (~$480) -->
    <rect x="60" y="211" width="298" height="50" fill="#801a60" />
    <text x="368" y="248" fill="#000">Sweden</text>
    
    <!-- Germany (~$380) -->
    <rect x="60" y="264" width="220" height="50" fill="#801a60" />
    <text x="290" y="301" fill="#000">Germany</text>
    
    <!-- Netherlands (~$370) -->
    <rect x="60" y="317" width="214" height="50" fill="#801a60" />
    <text x="284" y="354" fill="#000">Netherlands</text>
    
    <!-- UK (~$270) -->
    <rect x="60" y="370" width="148" height="50" fill="#801a60" />
    <text x="218" y="407" fill="#000">UK</text>
    
    <!-- Canada (~$250) -->
    <rect x="60" y="423" width="135" height="50" fill="#801a60" />
    <text x="205" y="460" fill="#000">Canada</text>
    
    <!-- Belgium (~$245) -->
    <rect x="60" y="476" width="133" height="50" fill="#801a60" />
    <text x="203" y="513" fill="#000">Belgium</text>
    
    <!-- France (~$240) -->
    <rect x="60" y="529" width="130" height="50" fill="#801a60" />
    <text x="200" y="566" fill="#000">France</text>
    
    <!-- US (~$110) -->
    <rect x="60" y="582" width="110" height="50" fill="#801a60" />
    <text x="180" y="619" fill="#000">US</text>
    
    <!-- Japan (~$90) -->
    <rect x="60" y="635" width="90" height="50" fill="#801a60" />
    <text x="160" y="672" fill="#000">Japan</text>
    
    <!-- Australia (~$70) -->
    <rect x="60" y="688" width="70" height="50" fill="#801a60" />
    <text x="140" y="725" fill="#000">Australia</text>
  </g>

  <!-- X-Axis Labels -->
  <g font-family="Arial, sans-serif" font-size="32" fill="#000">
    <text x="60" y="785" text-anchor="middle">0</text>
    <text x="360" y="785" text-anchor="middle">$500</text>
    <text x="660" y="785" text-anchor="middle">$1000</text>
  </g>
</svg>