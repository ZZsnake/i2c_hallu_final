<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Event Attendance</title>
    <style>
        html {
            height: 100%;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: block;
            justify-content: center;
            align-items: center;
            height: 100%;
            background-color: #f0f0f0;
        }
        .chart-container {
            width: 100%;
            height: 100%;
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .chart-container .chart {
            width: 100%;
            height: 100%;
        }
        .chart-container .chart .echarts {
            width: 100%;
            height: 100%;
        }
        .chart-container .chart .echarts .echarts-legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .chart-container .chart .echarts .echarts-legend .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .chart-container .chart .echarts .echarts-legend .legend-item .legend-item-label {
            margin-left: 10px;
        }
        .chart-container .chart .echarts .echarts-legend .legend-item .legend-item-label .legend-item-label-text {
            font-size: 14px;
            color: #333;
        }
        .chart-container .chart .echarts .echarts-legend .legend-item .legend-item-label .legend-item-label-color {
            width: 10px;
            height: 10px;
            margin-right: 10px;
            border-radius: 50%;
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <div id="chart" class="chart"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            var chart = echarts.init(document.getElementById('chart'));
            var option = {
                title: {
                    text: 'Monthly Event Attendance',
                    left: 'center',
                    textStyle: {
                        fontSize: 22
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                grid: {
                    top: 60,
                    left: 50,
                    right: 30,
                    bottom: 60
                },
                xAxis: {
                    type: 'category',
                    data: ['Conference', 'Expo', 'Webinar', 'Hackathon', 'Meetup', 'Panel', 'Workshop', 'Networking', 'Seminar'],
                    axisLabel: {
                        interval: 0,
                        rotate: 25,
                        color: '#222',
                        fontWeight: 'bold'
                    },
                    axisLine: {
                        lineStyle: {
                            color: '#444',
                            width: 2
                        }
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        formatter: '{value} ',
                        color: '#222',
                        fontWeight: 'bold'
                    },
                    axisLine: {
                        lineStyle: {
                            color: '#444',
                            width: 2
                        }
                    splitLine: {
                        lineStyle: {
                            color: '#ddd'
                        }
                    },
                    }
                },
                series: [{
                    name: 'Attendance',
                    type: 'bar',
                    barCategoryGap: '45%',
                    data: [230, 210, 195, 175, 150, 140, 120, 110, 85],
                    itemStyle: {
                        color: '#3867c8',
                        borderColor: '#1f3f7a',
                        borderWidth: 1
                    }
                }]
            };
            chart.setOption(option);
        });
    </script>
</body>
</html>
