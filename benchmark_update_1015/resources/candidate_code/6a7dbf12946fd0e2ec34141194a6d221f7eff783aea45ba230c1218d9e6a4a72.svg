<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <text x="20" y="380" font-size="16">Qu</text>
  <text x="360" y="20" font-size="16">Price</text>

  <!-- Axes -->
  <line x1="20" y1="20" x2="380" y2="20" stroke="black" stroke-width="1"/>
  <line x1="20" y1="20" x2="20" y2="380" stroke="black" stroke-width="1"/>

  <!-- Demand Curve (Red) -->
  <path d="M20 350 C 80 250, 250 100, 380 50" stroke="red" stroke-width="2" fill="none"/>

  <!-- Supply Curve (Green) -->
  <path d="M20 100 C 80 150, 250 250, 380 350" stroke="green" stroke-width="2" fill="none"/>

  <!-- Equilibrium Point -->
  <circle cx="200" cy="200" r="5" fill="black"/>

  <!-- Equilibrium Price and Quantity Lines -->
  <line x1="200" y1="200" x2="200" y2="20" stroke="gray" stroke-dasharray="5,5"/>
  <line x1="200" y1="200" x2="20" y2="200" stroke="gray" stroke-dasharray="5,5"/>

  <!-- Labels -->
  <text x="180" y="180" font-size="16">Q</text>
  <text x="220" y="30" font-size="16">P</text>
  <text x="340" y="180" font-size="16">Supply</text>
  <text x="30" y="180" font-size="16">Demand</text>
</svg>