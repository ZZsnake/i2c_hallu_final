<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gauge Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        #gaugeContainer {
            width: 600px;
            height: 500px;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div id="gaugeContainer"></div>
    
    <script>
        var chartDom = document.getElementById('gaugeContainer');
        var myChart = echarts.init(chartDom);
        
        var option = {
            series: [
                {
                    type: 'gauge',
                    startAngle: 200,
                    endAngle: -20,
                    min: 0,
                    max: 120,
                    center: ['50%', '60%'],
                    radius: '80%',
                    splitNumber: 8,
                    axisLine: {
                        lineStyle: {
                            width: 18,
                            color: [
                                [0.5, '#3B5FCC'],
                                [0.625, '#4A90E2'],
                                [1, '#2ECC71']
                            ]
                        }
                    },
                    pointer: {
                        icon: 'rect',
                        itemStyle: {
                            color: '#1a2942',
                            shadowColor: 'rgba(0, 0, 0, 0.3)',
                            shadowBlur: 5,
                            shadowOffsetY: 2
                        },
                        width: 10,
                        length: '65%'
                    },
                    axisTick: {
                        distance: -20,
                        length: 8,
                        lineStyle: {
                            color: '#1a2942',
                            width: 2
                        }
                    },
                    splitLine: {
                        distance: -22,
                        length: 12,
                        lineStyle: {
                            color: '#1a2942',
                            width: 3
                        }
                    },
                    axisLabel: {
                        distance: 20,
                        color: '#1a2942',
                        fontSize: 14,
                        formatter: function(value) {
                            if (value === 0 || value === 15 || value === 30 || value === 45 || 
                                value === 60 || value === 75 || value === 90 || value === 105 || value === 120) {
                                return value;
                            }
                            return '';
                        }
                    },
                    detail: {
                        valueAnimation: true,
                        formatter: function(value) {
                            return '{value|' + value.toFixed(1) + '} {unit|mT}';
                        },
                        offsetCenter: [0, '45%'],
                        backgroundColor: '#fff',
                        borderColor: '#1a2942',
                        borderWidth: 2,
                        borderRadius: 5,
                        padding: [8, 15],
                        width: 100,
                        rich: {
                            value: {
                                color: '#1a2942',
                                fontSize: 34,
                                fontWeight: 'bold'
                            },
                            unit: {
                                color: '#244bd6',
                                fontSize: 16,
                                fontWeight: 'normal',
                                verticalAlign: 'bottom'
                            }
                        }
                    },
                    data: [
                        {
                            value: 73.5
                        }
                    ]
                }
            ]
        };
        
        myChart.setOption(option);
        
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
