<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Containers -->
  <rect x="10" y="10" width="580" height="90" fill="#D3D3D3" />
  <text x="10" y="25" font-family="Arial, sans-serif" font-size="14" fill="black">Application program</text>
  
  <rect x="240" y="110" width="140" height="75" fill="#D3D3D3" />
  <text x="242" y="178" font-family="Arial, sans-serif" font-size="14" fill="black">Software library</text>

  <!-- Nodes -->
  <!-- Main Program -->
  <rect x="20" y="45" width="100" height="40" fill="white" stroke="none" />
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="14" fill="black" text-anchor="middle">Main program</text>

  <!-- Callback Function -->
  <ellipse cx="510" cy="65" rx="70" ry="20" fill="white" stroke="none" />
  <text x="510" y="70" font-family="Arial, sans-serif" font-size="14" fill="black" text-anchor="middle">Callback function</text>

  <!-- Library Function -->
  <ellipse cx="310" cy="135" rx="65" ry="20" fill="white" stroke="#FFFF80" stroke-width="2" />
  <text x="310" y="140" font-family="Arial, sans-serif" font-size="14" fill="#FFFF80" font-weight="bold" text-anchor="middle">Library function</text>

  <!-- Arrows and Labels -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <!-- Main program -> Library function (call) -->
  <line x1="115" y1="75" x2="255" y2="118" stroke="black" stroke-width="1" marker-end="url(#arrowhead)" />
  <text x="180" y="85" font-family="Arial, sans-serif" font-size="12" fill="black">call</text>

  <!-- Main program -> Callback function (specifies) -->
  <line x1="120" y1="65" x2="430" y2="65" stroke="black" stroke-width="0.5" marker-end="url(#arrowhead)" />
  <text x="285" y="60" font-family="Arial, sans-serif" font-size="12" fill="black">specifies</text>

  <!-- Library function -> Callback function (call) -->
  <line x1="355" y1="118" x2="465" y2="78" stroke="black" stroke-width="1" marker-end="url(#arrowhead)" />
  <text x="405" y="95" font-family="Arial, sans-serif" font-size="12" fill="black">call</text>
</svg>