<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Response Methods</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chart-container {
            width: 400px;
            height: 400px;
            margin: 20px;
        }
        .chart-container .chart {
            width: 100%;
            height: 100%;
        }
        .legend {
            list-style-type: none;
            padding: 0;
            margin: 10px 0;
        }
        .legend li {
            display: inline-block;
            margin-right: 10px;
        }
        .legend li span {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <div id="chart1" class="chart"></div>
        <ul class="legend">
            <li><span style="background-color: #4575b3;"></span>Email</li>
            <li><span style="background-color: #f7964a;"></span>Phone Call</li>
            <li><span style="background-color: #91c952;"></span>In-person</li>
            <li><span style="background-color: #f56c6c;"></span>Mail</li>
            <li><span style="background-color: #e6a23c;"></span>Online Form</li>
            <li><span style="background-color: #f5c23b;"></span>Social Media</li>
            <li><span style="background-color: #f59e83;"></span>Other</li>
        </ul>
    </div>
    <div class="chart-container">

            <li><span style="background-color: #f5c23b;"></span>Social Media</li>
            <li><span style="background-color: #f59e83;"></span>Other</li>
        </ul>
    </div>
    <div class="chart-container">

    </div>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            var chart1 = echarts.init(document.getElementById('chart1'));
            chart1.setOption({
                tooltip: {
                    trigger: 'item',
                    formatter: '{a} <br/>{b}: {c} ({d}%)'
                },
                series: [
                    {
                        name: 'Survey Response Methods',
                        type: 'pie',
                        radius: '55%',
                        center: ['50%', '50%'],
                        data: [
                            {value: 335, name: 'Email'},
                            {value: 310, name: 'Phone Call'},
                            {value: 234, name: 'In-person'},
                            {value: 135, name: 'Mail'},
                            {value: 1548, name: 'Online Form'},
                            {value: 2003, name: 'Social Media'},
                            {value: 2003, name: 'Other'}
                        ],
                        itemStyle: {
                            emphasis: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                            }
                        }
                    }
