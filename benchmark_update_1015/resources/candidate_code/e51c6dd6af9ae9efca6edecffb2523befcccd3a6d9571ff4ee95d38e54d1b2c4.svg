<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .math-topic-text {
        font-family: sans-serif;
        font-size: 50px;
        fill: #333;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Outer circle segments -->
  <!-- Algebra (top-left) -->
  <path d="M 400 100 A 300 300 0 0 0 100 400 L 200 400 A 200 200 0 0 1 400 200 Z" fill="#D87093" stroke="black" stroke-width="2"/>
  <!-- Geometry (top-right) -->
  <path d="M 400 100 A 300 300 0 0 1 700 400 L 600 400 A 200 200 0 0 0 400 200 Z" fill="#365B7C" stroke="black" stroke-width="2"/>
  <!-- Calculus (bottom-right) -->
  <path d="M 700 400 A 300 300 0 0 1 400 700 L 400 600 A 200 200 0 0 0 600 400 Z" fill="#F08080" stroke="black" stroke-width="2"/>
  <!-- Statistics (bottom-left) -->
  <path d="M 100 400 A 300 300 0 0 1 400 700 L 400 600 A 200 200 0 0 0 200 400 Z" fill="#6A5ACD" stroke="black" stroke-width="2" stroke-dasharray="10 10"/>

  <!-- Central white circle -->
  <circle cx="400" cy="400" r="100" fill="white" stroke="black" stroke-width="2"/>

  <!-- Text labels -->
  <text x="400" y="400" class="math-topic-text">Math Topics</text>
  <text x="250" y="250" class="math-topic-text">Algebra</text>
  <text x="550" y="250" class="math-topic-text">Geomet</text> <!-- "Geometry" is cut off in the original, reproducing that -->
  <text x="550" y="550" class="math-topic-text">Calculus</text>
  <text x="250" y="550" class="math-topic-text">tatistics</text> <!-- "Statistics" is cut off in the original, reproducing that -->
</svg>