<!DOCTYPE html>
<html>
<head>
  <title>Linear Function Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f5f5dc; /* Beige background */
    }
    #chartContainer {
      width: 600px;
      height: 400px;
      margin: 20px auto;
      background-color: white;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <div id="chartContainer"></div>

  <script>
    $(function() {
      var chartDom = document.getElementById('chartContainer');
      var myChart = echarts.init(chartDom);
      var option = {
        title: {
          text: 'Linear Function: y = 2x + 1'
        },
        tooltip: {
          trigger: 'axis',
          axisPointer: {
            type: 'cross'
          }
        },
        xAxis: {
          type: 'category',
          data: [0, 1, 2, 3, 4, 5, 6],
          axisLine: {
            lineStyle: {
              color: '#000'
            }
          },
          axisLabel: {
            color: '#000'
          }
        },
        yAxis: {
          type: 'value',
          name: 'y',
          min: 0,
          max: 15,
          axisLine: {
            lineStyle: {
              color: '#000'
            }
          },
          axisLabel: {
            color: '#000'
          },
          splitLine: {
            lineStyle: {
              color: '#ccc'
            }
          }
        },
        series: [{
          type: 'line',
          data: [1, 3, 5, 7, 9, 11, 13],
          itemStyle: {
            color: '#808080' // Medium gray
          },
          symbol: 'circle',
          symbolSize: 8,
          symbolColor: '#555555' // Dark gray
        }]
      };
      myChart.setOption(option);
    });
  </script>

</body>
</html>
