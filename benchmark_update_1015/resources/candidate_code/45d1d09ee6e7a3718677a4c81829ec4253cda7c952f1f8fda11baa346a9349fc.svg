<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0 0 L8 4 L0 8 z" fill="black"/>
</marker>
<!-- Voltage source -->
<circle cx="60" cy="100" r="8" stroke="black" fill="none"/>
<text x="50" y="95" font-size="16">+G</text>
<text x="62" y="105" font-size="16">-TOT</text>
<!-- Current arrow -->
<path d="M40 100 V 60" stroke="black" marker-end="url(#arrow)"/>
<text x="30" y="80" font-size="16">I_R</text>
<!-- TOT resistor -->
<path d="M68 100 80 90 92 100 104 90 116 100 128 90 140 100" fill="none" stroke="black"/>
<text x="100" y="85" font-size="16">TOT</text>
<!-- Upper branch -->
<!-- R3 resistor -->
<path d="M140 100 152 90 164 100 176 90 188 100" fill="none" stroke="black"/>
<text x="160" y="85" font-size="16">R3</text>
<!-- R4 resistor -->
<path d="M188 100 180 112 188 124 180 136 188 148" fill="none" stroke="black"/>
<text x="190" y="125" font-size="16" transform="rotate(90 190,125)">R4</text>
<!-- Lower branch -->
<!-- A2 resistor -->
<path d="M140 100 132 112 140 124 132 136 140 148" fill="none" stroke="black"/>
<text x="142" y="125" font-size="16" transform="rotate(90 142,125)">A2</text>
<!-- R_R resistor -->
<path d="M140 148 152 138 164 148 176 138 188 148" fill="none" stroke="black"/>
<text x="160" y="155" font-size="16">R_R</text>
<!-- Connecting lines -->
<line x1="188" y1="148" x2="140" y2="148" stroke="black"/>
<line x1="188" y1="148" x2="188" y2="180" stroke="black"/>
<line x1="140" y1="148" x2="140" y2="180" stroke="black"/>
<line x1="140" y1="180" x2="60" y2="180" stroke="black"/>
<line x1="60" y1="180" x2="60" y2="108" stroke="black"/>
<!-- Nodes -->
<text x="140" y="95" font-size="16">5</text>
<text x="135" y="155" font-size="16">C</text>
<text x="185" y="155" font-size="16">B</text>
</svg>