<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallel Coordinates - River Data</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #chart-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fff;
        }
        #main {
            width: 95%;
            height: 85%;
        }
        .custom-legend {
            display: flex;
            gap: 20px;
            margin-top: -20px;
            z-index: 10;
        }
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #333;
        }
        .legend-color {
            width: 30px;
            height: 12px;
            border-radius: 6px;
            margin-right: 8px;
        }
    </style>
</head>
<body>

<div id="chart-container">
    <div id="main"></div>
    <div class="custom-legend">
        <div class="legend-item"><div class="legend-color" style="background-color: #2f75b5;"></div>Amazon</div>
        <div class="legend-item"><div class="legend-color" style="background-color: #c55a11;"></div>Nile</div>
        <div class="legend-item"><div class="legend-color" style="background-color: #548235;"></div>Yangtze</div>
    </div>
</div>

<script>
    const chartDom = document.getElementById('main');
    const myChart = echarts.init(chartDom);

    // Generate synthetic data based on visual analysis
    const years = Array.from({length: 13}, (_, i) => 2010 + i);
    
    const generateData = (riverType) => {
        return years.map(year => {
            let length, width, depth, status;
            if (riverType === 'Amazon') {
                length = 6400 + Math.random() * 200;
                width = 2500 + Math.random() * 400;
                depth = 100 + Math.random() * 150;
                status = year > 2018 ? 0 : (year > 2014 ? 1 : 2); // Excellent, Good, Fair
            } else if (riverType === 'Nile') {
                length = 6600 + Math.random() * 300;
                width = 1500 + Math.random() * 1000;
                depth = 200 + Math.random() * 80;
                status = year > 2018 ? 2 : (year > 2014 ? 3 : 4); // Fair, Moderate, Poor
            } else { // Yangtze
                length = 6300 + Math.random() * 100;
                width = 2800 + Math.random() * 200;
                depth = 150 + Math.random() * 100;
                status = year > 2016 ? 0 : 1; // Excellent, Good
            }
            return [year, length, width, depth, status];
        });
    };

    const dataAmazon = generateData('Amazon');
    const dataNile = generateData('Nile');
    const dataYangtze = generateData('Yangtze');

    const schema = [
        { name: 'Year', index: 0, text: 'Year' },
        { name: 'Length', index: 1, text: 'Length (km)' },
        { name: 'Avg Width', index: 2, text: 'Avg Width (m)' },
        { name: 'Avg Depth', index: 3, text: 'Avg Depth (m)' },
        { name: 'Status', index: 4, text: 'Status' }
    ];

    const lineStyle = {
        width: 2,
        opacity: 0.6
    };

    const option = {
        parallelAxis: [
            { 
                dim: 0, 
                name: schema[0].text, 
                min: 2010, 
                max: 2022, 
                interval: 2,
                nameLocation: 'start',
                nameTextStyle: { padding: [0, 0, 20, 0] }
            },
            { 
                dim: 1, 
                name: schema[1].text, 
                min: 0, 
                max: 7000,
                nameLocation: 'start',
                nameTextStyle: { padding: [0, 0, 20, 0] }
            },
            { 
                dim: 2, 
                name: schema[2].text, 
                min: 0, 
                max: 3000,
                nameLocation: 'start',
                nameTextStyle: { padding: [0, 0, 20, 0] }
            },
            { 
                dim: 3, 
                name: schema[3].text, 
                min: 0, 
                max: 300,
                nameLocation: 'start',
                nameTextStyle: { padding: [0, 0, 20, 0] }
            },
            {
                dim: 4,
                name: schema[4].text,
                type: 'category',
                data: ['Excellent', 'Good', 'Fair', 'Moderate', 'Poor'],
                inverse: true,
                nameLocation: 'start',
                nameTextStyle: { padding: [0, 0, 20, 0] }
            }
        ],
        visualMap: {
            show: true,
            min: 2010,
            max: 2022,
            dimension: 0,
            left: 20,
            bottom: 40,
            text: ['2,022', '2,010'],
            calculable: true,
            inRange: {
                color: ['#7030a0', '#c55a11', '#ffc000', '#92d050', '#00b050', '#00b0f0']
            },
            textStyle: {
                fontSize: 10
            }
        },
        parallel: {
            left: '10%',
            right: '10%',
            bottom: '15%',
            top: '15%',
            parallelAxisDefault: {
                type: 'value',
                nameLocation: 'end',
                nameGap: 20,
                nameTextStyle: {
                    fontSize: 12,
                    fontWeight: 'bold'
                },
                axisLine: {
                    lineStyle: {
                        color: '#333'
                    }
                },
                axisTick: {
                    lineStyle: {
                        color: '#333'
                    }
                },
                splitLine: {
                    show: false
                },
                axisLabel: {
                    color: '#333',
                    fontSize: 10
                }
            }
        },
        series: [
            {
                name: 'Amazon',
                type: 'parallel',
                lineStyle: lineStyle,
                data: dataAmazon
            },
            {
                name: 'Nile',
                type: 'parallel',
                lineStyle: lineStyle,
                data: dataNile
            },
            {
                name: 'Yangtze',
                type: 'parallel',
                lineStyle: lineStyle,
                data: dataYangtze
            }
        ]
    };

    myChart.setOption(option);

    window.addEventListener('resize', function() {
        myChart.resize();
    });
</script>

</body>
</html>
