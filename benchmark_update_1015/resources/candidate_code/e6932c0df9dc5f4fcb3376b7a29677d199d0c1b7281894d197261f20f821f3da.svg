<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <text x="10" y="20" font-size="14" font-family="Arial">40 : Zirconium</text>
  <text x="120" y="20" font-size="14" font-family="Arial">2,8,18,10,2</text>
  
  <!-- Nucleus -->
  <circle cx="100" cy="100" r="15" fill="#add8e6" stroke="black" stroke-width="2"/>
  <text x="95" y="110" font-size="12" font-family="Arial" text-anchor="middle">Zr</text>
  
  <!-- Electron Shells -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="blue" stroke-dasharray="2,2" stroke-width="1"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="blue" stroke-dasharray="2,2" stroke-width="1"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="blue" stroke-dasharray="2,2" stroke-width="1"/>
  <circle cx="100" cy="100" r="120" fill="none" stroke="blue" stroke-dasharray="2,2" stroke-width="1"/>
  <circle cx="100" cy="100" r="150" fill="none" stroke="blue" stroke-dasharray="2,2" stroke-width="1"/>
  
  <!-- Electrons -->
  <!-- First shell -->
  <circle cx="100" cy="70" r="2" fill="blue"/>
  <circle cx="100" cy="130" r="2" fill="blue"/>
  
  <!-- Second shell -->
  <circle cx="70" cy="100" r="2" fill="blue"/>
  <circle cx="130" cy="100" r="2" fill="blue"/>
  <circle cx="85" cy="85" r="2" fill="blue"/>
  <circle cx="115" cy="85" r="2" fill="blue"/>
  <circle cx="85" cy="115" r="2" fill="blue"/>
  <circle cx="115" cy="115" r="2" fill="blue"/>
  
  <!-- Third shell -->
  <circle cx="50" cy="100" r="2" fill="blue"/>
  <circle cx="150" cy="100" r="2" fill="blue"/>
  <circle cx="65" cy="80" r="2" fill="blue"/>
  <circle cx="135" cy="80" r="2" fill="blue"/>
  <circle cx="65" cy="120" r="2" fill="blue"/>
  <circle cx="135" cy="120" r="2" fill="blue"/>
  <circle cx="75" cy="70" r="2" fill="blue"/>
  <circle cx="125" cy="70" r="2" fill="blue"/>
  <circle cx="75" cy="130" r="2" fill="blue"/>
  <circle cx="125" cy="130" r="2" fill="blue"/>
  
  <!-- Fourth shell -->
  <circle cx="40" cy="100" r="2" fill="blue"/>
  <circle cx="160" cy="100" r="2" fill="blue"/>
  <circle cx="55" cy="85" r="2" fill="blue"/>
  <circle cx="145" cy="85" r="2" fill="blue"/>
  <circle cx="55" cy="115" r="2" fill="blue"/>
  <circle cx="145" cy="115" r="2" fill="blue"/>
  <circle cx="65" cy="75" r="2" fill="blue"/>
  <circle cx="135" cy="75" r="2" fill="blue"/>
  <circle cx="65" cy="125" r="2" fill="blue"/>
  <circle cx="135" cy="125" r="2" fill="blue"/>
  <circle cx="75" cy="65" r="2" fill="blue"/>
  <circle cx="125" cy="65" r="2" fill="blue"/>
  <circle cx="75" cy="135" r="2" fill="blue"/>
  <circle cx="125" cy="135" r="2" fill="blue"/>
  
  <!-- Fifth shell -->
  <circle cx="30" cy="100" r="2" fill="blue"/>
  <circle cx="170" cy="100" r="2" fill="blue"/>
  <circle cx="45" cy="90" r="2" fill="blue"/>
  <circle cx="155" cy="90" r="2" fill="blue"/>
  <circle cx="45" cy="110" r="2" fill="blue"/>
  <circle cx="155" cy="110" r="2" fill="blue"/>
  <circle cx="55" cy="80" r="2" fill="blue"/>
  <circle cx="145" cy="80" r="2" fill="blue"/>
  <circle cx="55" cy="120" r="2" fill="blue"/>
  <circle cx="145" cy="120" r="2" fill="blue"/>
  <circle cx="65" cy="70" r="2" fill="blue"/>
  <circle cx="135" cy="70" r="2" fill="blue"/>
  <circle cx="65" cy="130" r="2" fill="blue"/>
  <circle cx="135" cy="130" r="2" fill="blue"/>
  <circle cx="75" cy="60" r="2" fill="blue"/>
  <circle cx="125" cy="60" r="2" fill="blue"/>
  <circle cx="75" cy="140" r="2" fill="blue"/>
  <circle cx="125" cy="140" r="2" fill="blue"/>
</svg>