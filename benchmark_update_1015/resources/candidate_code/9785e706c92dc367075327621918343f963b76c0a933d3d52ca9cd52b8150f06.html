<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polar Plot: r = 1 + 2·cos(θ)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: white;
        }
        #chart-container {
            width: 800px;
            height: 800px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Polar Plot: r = 1 + 2·cos(θ)</h1>
    <div id="chart-container"></div>

    <script>
        // Initialize the chart
        const chart = echarts.init(document.getElementById('chart-container'));
        
        // Define the data for the limaçon curve
        const theta = [];
        const r = [];
        for (let i = 0; i <= 1000; i++) {
            const angle = (i / 1000) * 2 * Math.PI;
            theta.push(angle);
            r.push(1 + 2 * Math.cos(angle));
        }
        
        // Configure the chart
        const option = {
            title: {
                text: 'Polar Plot: r = 1 + 2·cos(θ)',
                left: 'center',
                textStyle: {
                    fontSize: 16
                }
            },
            tooltip: {
                trigger: 'axis'
            },
            legend: {
                data: ['Limacon Curve'],
                top: 20
            },
            polar: {
                center: ['50%', '50%'],
                radius: '75%',
                startAngle: 90,
                itemStyle: {
                    color: 'transparent'
                }
            },
            angleAxis: {
                type: 'value',
                startAngle: 90,
                min: 0,
                max: 2 * Math.PI,
                splitNumber: 12,
                axisLabel: {
                    formatter: function (value) {
                        return value * 180 / Math.PI;
                    }
                }
            },
            radiusAxis: {
                type: 'value',
                min: -1,
                max: 3,
                splitNumber: 7,
                axisLabel: {
                    show: true
                }
            },
            series: [{
                name: 'Limacon Curve',
                type: 'line',
                coordinateSystem: 'polar',
                data: theta.map((angle, index) => ({
                    value: [angle, r[index]],
                    itemStyle: {
                        color: '#00008B'
                    }
                })),
                lineStyle: {
                    color: '#00008B'
                },
                symbol: 'circle',
                symbolSize: 4
            }]
        };
        
        // Set the option
        chart.setOption(option);
    </script>
</body>
</html>
