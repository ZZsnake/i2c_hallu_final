<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 425">
  <!-- Background -->
  <rect x="0" y="0" width="850" height="425" fill="white"/>

  <!-- Lithosphere band -->
  <rect x="0" y="320" width="850" height="105" fill="#f4a024"/>
  <text x="425" y="380" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#c66a00">
    Lithosphere
  </text>

  <!-- Coastal Area band (blue gradient) -->
  <defs>
    <linearGradient id="coastalGrad" x1="0" y1="215" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4caad6"/>
      <stop offset="1" stop-color="#004f8b"/>
    </linearGradient>
    <linearGradient id="forestGrad" x1="0" y1="90" x2="0" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30aa4e"/>
      <stop offset="1" stop-color="#1f7c33"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e57a21"/>
      <stop offset="1" stop-color="#f9b15a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="215" width="850" height="105" fill="url(#coastalGrad)"/>
  <text x="150" y="260" font-family="sans-serif" font-size="22" fill="#b5f2ff">
    Coastal Area
  </text>

  <!-- Forest band -->
  <rect x="0" y="90" width="850" height="125" fill="url(#forestGrad)"/>
  <text x="70" y="120" font-family="sans-serif" font-size="22" fill="#ffffff">
    Forest
  </text>

  <!-- River Delta dashed curve -->
  <path d="M180 120 C260 95, 420 90, 600 110"
        fill="none" stroke="#1f6bb6" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="320" y="110" font-family="sans-serif" font-size="20" fill="#1f6bb6">
    River Delta
  </text>

  <!-- Mountain Range oval -->
  <ellipse cx="620" cy="130" rx="150" ry="60" fill="url(#mountainGrad)" stroke="#c65a00" stroke-width="2"/>
  <text x="620" y="135" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#8b3b00">
    Mountain Range
  </text>

  <!-- Vertical dashed depth markers -->
  <line x1="80" y1="215" x2="80" y2="320" stroke="#c42626" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="780" y1="215" x2="780" y2="320" stroke="#c42626" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Cities and Town routes -->
  <!-- Curved path from City A to Town C -->
  <path d="M160 240 C250 220, 300 210, 360 205"
        fill="none" stroke="#000000" stroke-width="2"/>
  <!-- Curved path from Town C to City B -->
  <path d="M360 205 C480 190, 620 200, 700 230"
        fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Left City A circle -->
  <circle cx="150" cy="230" r="35" fill="#2459d1" stroke="#12308a" stroke-width="3"/>
  <text x="140" y="235" font-family="sans-serif" font-size="18" fill="#ffffff">
    Ci t y
  </text>
  <text x="150" y="255" font-family="sans-serif" font-size="18" fill="#000000">
    A
  </text>

  <!-- Town C circle -->
  <circle cx="360" cy="200" r="25" fill="#39b35d" stroke="#1f7c33" stroke-width="3"/>
  <text x="347" y="203" font-family="sans-serif" font-size="14" fill="#000000">
    T o w n
  </text>
  <text x="363" y="219" font-family="sans-serif" font-size="16" fill="#000000">
    C
  </text>

  <!-- Right City B circle -->
  <circle cx="700" cy="230" r="35" fill="#f39a20" stroke="#c66a00" stroke-width="3"/>
  <text x="688" y="235" font-family="sans-serif" font-size="18" fill="#000000">
    C i t y
  </text>
  <text x="722" y="235" font-family="sans-serif" font-size="18" fill="#000000">
    B
  </text>

  <!-- Lake Azure -->
  <ellipse cx="300" cy="260" rx="70" ry="25" fill="#7be2df" stroke="#1e9e9a" stroke-width="3"/>
  <text x="300" y="265" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#006666">
    Lake Azure
  </text>

  <!-- Legend box -->
  <rect x="580" y="20" width="220" height="110" fill="#d8ecff" stroke="#000000" stroke-width="2"/>
  <text x="615" y="40" font-family="sans-serif" font-size="20" fill="#000000">
    Legend
  </text>

  <!-- Legend City -->
  <circle cx="610" cy="65" r="8" fill="#2459d1" stroke="#12308a" stroke-width="2"/>
  <text x="630" y="69" font-family="sans-serif" font-size="14" fill="#000000">
    City
  </text>

  <!-- Legend Lake -->
  <ellipse cx="610" cy="90" rx="12" ry="7" fill="#7be2df" stroke="#1e9e9a" stroke-width="2"/>
  <text x="630" y="94" font-family="sans-serif" font-size="14" fill="#000000">
    Lake
  </text>

  <!-- Legend Landmass -->
  <rect x="600" y="108" width="20" height="8" fill="#30aa4e" stroke="#1f7c33" stroke-width="2"/>
  <text x="630" y="116" font-family="sans-serif" font-size="14" fill="#000000">
    Landmass
  </text>
</svg>