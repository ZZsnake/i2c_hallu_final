<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number of Math Problems Solved by Grade</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            overflow: hidden;
        }
        #chart-container {
            width: 100vw;
            height: 100vh;
            background-color: #fff;
            padding: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #main-chart {
            width: 100%;
            flex: 1;
            min-height: 0;
        }
        .chart-title {
            font-size: 21px;
            line-height: 26px;
            font-weight: 700;
            color: #202944;
            margin: 2px 0 13px;
            text-align: center;
        }
        .chart-legend {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0;
            font-size: 16px;
            font-weight: 700;
            color: #202944;
            line-height: 19px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 0 5px;
        }
        .legend-color-box {
            width: 25px;
            height: 14px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
        }
        .legend-color-box.algebra {
            background-color: #0b63bf;
        }
        .legend-color-box.geometry {
            background-color: #ef3333;
        }
    </style>
</head>
<body>
    <div id="chart-container">
        <div class="chart-title">Number of Math Problems Solved by Grade</div>
        <div class="chart-legend">
            <div class="legend-item">
                <div class="legend-color-box algebra"></div>
                <span>Algebra</span>
            </div>
            <div class="legend-item">
                <div class="legend-color-box geometry"></div>
                <span>Geometry</span>
            </div>
        </div>
        <div id="main-chart"></div>
    </div>

    <script type="text/javascript">
        $(document).ready(function() {
            var myChart = echarts.init(document.getElementById('main-chart'));

            var labelStyle = {
                color: '#202944',
                fontFamily: 'Times New Roman, Times, serif',
                fontWeight: 700,
                fontSize: 14
            };

            var option = {
                animation: false,
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                legend: {
                    show: false
                },
                grid: {
                    left: '16.25%',
                    right: '10%',
                    top: 0,
                    bottom: '6.7%',
                    containLabel: false
                },
                xAxis: {
                    type: 'value',
                    min: 0,
                    max: 500,
                    interval: 100,
                    boundaryGap: [0, 0],
                    axisLabel: labelStyle,
                    axisTick: {
                        show: false
                    },
                    axisLine: {
                        show: false
                    },
                    splitLine: {
                        show: true,
                        lineStyle: {
                            color: '#dbe3f0',
                            width: 1
                        }
                    }
                },
                yAxis: {
                    type: 'category',
                    data: ['Grade 6', 'Grade 7', 'Grade 8', 'Grade 9', 'Grade 10'],
                    axisLabel: {
                        interval: 0,
                        margin: 8,
                        color: '#202944',
                        fontFamily: 'Times New Roman, Times, serif',
                        fontWeight: 700,
                        fontSize: 14
                    },
                    axisTick: {
                        show: true,
                        alignWithLabel: false,
                        length: 5,
                        lineStyle: {
                            color: '#202944',
                            width: 1
                        }
                    },
                    axisLine: {
                        show: true,
                        lineStyle: {
                            color: '#202944',
                            width: 2
                        }
                    },
                    splitLine: {
                        show: false
                    }
                },
                series: [
                    {
                        name: 'Algebra',
                        type: 'bar',
                        data: [120, 200, 250, 300, 400],
                        barWidth: 25,
                        barGap: '20%',
                        itemStyle: {
                            color: '#0b63bf'
                        }
                    },
                    {
                        name: 'Geometry',
                        type: 'bar',
                        data: [80, 160, 220, 280, 350],
                        barWidth: 25,
                        itemStyle: {
                            color: '#ef3333'
                        }
                    }
                ]
            };

            myChart.setOption(option);

            $(window).on('resize', function() {
                myChart.resize();
            });
        });
    </script>
</body>
</html>
