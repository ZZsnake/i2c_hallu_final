<!DOCTYPE html>
<html>
<head>
    <title>Prime Numbers in Intervals</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #fff;
        }
        #main {
            width: 100vw;
            height: 100vh;
            background: #fff;
        }
    </style>
</head>
<body>
    <div id="main"></div>
    <script>
        $(function() {
            var myChart = echarts.init(document.getElementById('main'));
            var option = {
                title: {
                    text: 'Prime Numbers in Intervals (1-50)',
                    left: 'center',
                    textStyle: {
                        fontSize: 22,
                        fontWeight: 'bold',
                        color: '#1f2e55'
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                grid: {
                    left: '8%',
                    right: '8%',
                    bottom: '5%',

                },
                xAxis: {
                    type: 'category',
                    data: ['1-10', '11-20', '21-30', '31-40', '41-50'],
                    axisLabel: {
                        margin: 10,
                        color: '#2b1b1b',
                        fontSize: 16,
                        fontWeight: 'bold'
                    }
                },
                yAxis: {
                    type: 'value',
                    name: 'Prime Count',
                    min: 0,
                    max: 4,
                    interval: 1,
                    nameTextStyle: {
                        color: '#29466a',
                        fontSize: 16,
                        fontWeight: 'bold'
                    },
                    axisLabel: {
                        color: '#333',
                        fontSize: 14
                    }
                },
                series: [{
                    data: [
                        {value:4, itemStyle:{color:'#177D57'}},
                        {value:4, itemStyle:{color:'#275AAF'}},
                        {value:2, itemStyle:{color:'#E43320'}},
                        {value:2, itemStyle:{color:'#B87F1B'}},
                        {value:3, itemStyle:{color:'#682D5C'}}
                    ],
                    type: 'bar',
                    barWidth: '45%',
                    label: {
                        show: true,
                        position: 'top',
                        color: '#252525',
                        fontWeight: 'bold',
                        fontSize: 15
                    }
                }]
            };
            myChart.setOption(option);
            window.addEventListener('resize', function() {
                myChart.resize();
            });
        });
    </script>
</body>
</html>
