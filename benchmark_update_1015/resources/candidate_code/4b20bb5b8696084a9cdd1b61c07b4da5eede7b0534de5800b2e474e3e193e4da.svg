<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150">
  <!-- Porte ET (AND) -->
  <path d="M10 10 h10 v10 M10 20 h10 v10" stroke="black" fill="none"/>
  <text x="60" y="15" font-family="Arial" font-size="8">Porte ET (AND)</text>
  
  <!-- Porte NON ET (NAND) -->
  <path d="M10 40 h10 v10 M10 50 h10 v10" stroke="black" fill="none"/>
  <text x="60" y="45" font-family="Arial" font-size="8">Porte NON ET (NAND)</text>
  
  <!-- Porte OU (OR) -->
  <path d="M10 70 h10 v10 M10 80 h10 v10" stroke="black" fill="none"/>
  <text x="60" y="75" font-family="Arial" font-size="8">Porte OU (OR)</text>
  
  <!-- Porte NON OU (NOR) -->
  <path d="M10 100 h10 v10 M10 110 h10 v10" stroke="black" fill="none"/>
  <text x="60" y="105" font-family="Arial" font-size="8">Porte NON OU (NOR)</text>
  
  <!-- Porte OU Exclusif (XOR) -->
  <path d="M10 130 h10 v10 M10 140 h10 v10" stroke="black" fill="none"/>
  <text x="60" y="135" font-family="Arial" font-size="8">Porte OU Exclusif (XOR)</text>
  
  <!-- Porte NON (NOT) -->
  <path d="M10 160 h10 v10" stroke="black" fill="none"/>
  <text x="60" y="165" font-family="Arial" font-size="8">Porte NON (NOT)</text>
</svg>