
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplication Table Heatmap</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        #heatmap {
            width: 100%;
            height: 100vh;
            background-color: white;
            padding: 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div id="heatmap"></div>
    <script>
        const chart = echarts.init(document.getElementById('heatmap'));
        const rows = [1, 2, 3, 4, 5, 6];
        const cols = [1, 2, 3, 4, 5, 6];
        const data = [];
        for (let y = 0; y < 6; y++) {
            for (let x = 0; x < 6; x++) {
                data.push([x, y, rows[y] * cols[x]]);
            }
        }
        const option = {
            title: {
                text: 'Multiplication Table Heatmap (1-6)',
                left: 'center',
                top: 20,
                textStyle: {
                    fontWeight: 'bold',
                    fontSize: 22,
                    color: '#222'
                }
            },
            tooltip: {
                formatter: function (params) {
                    return `Row ${rows[params.value[1]]} × Column ${cols[params.value[0]]} = ${params.value[2]}`;
                }
            },
            grid: {
                left: '15%',
                right: '15%',
                top: 80,
                bottom: 50
            },
            xAxis: {
                type: 'category',
                data: cols,
                axisLabel: {
                    color: '#222',
                    fontWeight: 'bold',
                    fontSize: 16
                },
            },
            yAxis: {
                type: 'category',
                data: rows,
                axisLabel: {
                    color: '#222',
                    fontWeight: 'bold',
                    fontSize: 16
                },
            },
            visualMap: {
                min: 1,
                max: 36,
                type: 'continuous',
                orient: 'horizontal',
                left: 'center',
                bottom: 10,
                inRange: {
                    color: ['#1a75ff', '#00c853', '#ffd600', '#d50000']
                },
                calculable: true,
                precision: 0,
    
                inverse: false
            },
            series: [{
                name: 'Product',
                type: 'heatmap',
                data: data,
                label: {
                    show: true,
                    formatter: function(params) {
                        return params.value[2];
                    },
                    color: '#000',
                    fontWeight: 'bold'
                },
                itemStyle: {
                    borderWidth: 0
                }
            }]
        };
        chart.setOption(option);
    </script>
</body>
</html>
