<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polar Plot: r = 1 + 2·cos(θ)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }
        #chart-container {
            width: 90vw;
            height: 90vh;
        }
    </style>
</head>
<body>

<div id="chart-container"></div>

<script>
    $(document).ready(function() {
        var chartDom = document.getElementById('chart-container');
        var myChart = echarts.init(chartDom);
        var option;

        // Generate data for the Limacon curve: r = 1 + 2 * cos(theta)
        var data = [];
        for (var i = 0; i <= 360; i++) {
            var theta = i;
            var thetaRad = (i * Math.PI) / 180;
            var r = 1 + 2 * Math.cos(thetaRad);
            data.push([r, theta]);
        }

        option = {
            title: {
                text: 'Polar Plot: r = 1 + 2·cos(θ)',
                left: 'center',
                top: '20px',
                textStyle: {
                    fontSize: 20,
                    fontWeight: 'bold'
                }
            },
            legend: {
                data: ['Limacon Curve'],
                top: '60px',
                left: 'center',
                icon: 'circle',
                itemWidth: 10,
                itemHeight: 10
            },
            polar: {
                center: ['50%', '55%'],
                radius: '75%'
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'cross'
                }
            },
            angleAxis: {
                type: 'value',
                startAngle: 0,
                min: 0,
                max: 360,
                interval: 30,
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: '#e0e0e0',
                        type: 'solid'
                    }
                },
                axisLabel: {
                    formatter: '{value}',
                    fontSize: 12,
                    color: '#333'
                }
            },
            radiusAxis: {
                type: 'value',
                min: 0,
                max: 3,
                interval: 0.5,
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: '#e0e0e0'
                    }
                },
                axisLabel: {
                    fontSize: 12,
                    color: '#333',
                    margin: 2
                },
                axisLine: {
                    show: true,
                    lineStyle: {
                        color: '#8b4513' // Brownish color for the horizontal axis line as seen in image
                    }
                },
                z: 10
            },
            series: [{
                name: 'Limacon Curve',
                coordinateSystem: 'polar',
                type: 'line',
                data: data,
                showSymbol: false,
                lineStyle: {
                    width: 2.5,
                    color: '#2f4554'
                },
                itemStyle: {
                    color: '#2f4554'
                }
            }]
        };

        myChart.setOption(option);

        window.addEventListener('resize', function() {
            myChart.resize();
        });
    });
</script>

</body>
</html>
