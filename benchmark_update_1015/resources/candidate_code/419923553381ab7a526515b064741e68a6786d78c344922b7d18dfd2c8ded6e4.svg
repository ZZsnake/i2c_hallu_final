<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <line x1="50" y1="100" x2="450" y2="100" stroke="black" stroke-width="2"/>
  <circle cx="50" cy="100" r="5" fill="black"/>
  <circle cx="450" cy="100" r="5" fill="black"/>
  <line x1="50" y1="50" x2="50" y2="150" stroke="black" stroke-width="2"/>
  <line x1="450" y1="50" x2="450" y2="150" stroke="black" stroke-width="2"/>
  <text x="40" y="40" font-size="16" fill="black">1</text>
  <text x="40" y="160" font-size="16" fill="black">0</text>
  <text x="250" y="180" font-size="16" fill="black">(n+1) switch and diode configuration</text>
  
  <!-- Switches -->
  <line x1="100" y1="80" x2="120" y2="80" stroke="black" stroke-width="2"/>
  <line x1="110" y1="70" x2="110" y2="90" stroke="black" stroke-width="2"/>
  <line x1="200" y1="80" x2="220" y2="80" stroke="black" stroke-width="2"/>
  <line x1="210" y1="70" x2="210" y2="90" stroke="black" stroke-width="2"/>
  <line x1="300" y1="80" x2="320" y2="80" stroke="black" stroke-width="2"/>
  <line x1="310" y1="70" x2="310" y2="90" stroke="black" stroke-width="2"/>
  
  <!-- Diodes -->
  <polygon points="130,70 150,80 130,90" fill="black"/>
  <polygon points="230,70 250,80 230,90" fill="black"/>
  <polygon points="330,70 350,80 330,90" fill="black"/>
  
  <!-- Resistors -->
  <path d="M160,80 l10,10 l10,-10 l10,10 l10,-10 l10,10 l10,-10" stroke="black" stroke-width="2" fill="none"/>
  <path d="M260,80 l10,10 l10,-10 l10,10 l10,-10 l10,10 l10,-10" stroke="black" stroke-width="2" fill="none"/>
  <path d="M360,80 l10,10 l10,-10 l10,10 l10,-10 l10,10 l10,-10" stroke="black" stroke-width="2" fill="none"/>
  
  <!-- Nodes -->
  <circle cx="100" cy="100" r="5" fill="black"/>
  <circle cx="200" cy="100" r="5" fill="black"/>
  <circle cx="300" cy="100" r="5" fill="black"/>
  <circle cx="150" cy="100" r="5" fill="black"/>
  <circle cx="250" cy="100" r="5" fill="black"/>
  <circle cx="350" cy="100" r="5" fill="black"/>
  
  <!-- Labels -->
  <text x="170" y="120" font-size="16" fill="black">3</text>
  <text x="270" y="120" font-size="16" fill="black">2</text>
  <text x="370" y="120" font-size="16" fill="black">V</text>
</svg>