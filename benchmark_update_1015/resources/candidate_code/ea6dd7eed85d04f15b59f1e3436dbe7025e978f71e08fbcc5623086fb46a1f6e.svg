<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Define the circles -->
  <circle cx="100" cy="50" r="50" fill="green" />
  <circle cx="50" cy="150" r="50" fill="red" />
  <circle cx="150" cy="150" r="50" fill="blue" />
  <circle cx="100" cy="150" r="50" fill="yellow" />
  
  <!-- Define the text labels -->
  <text x="100" y="30" text-anchor="middle" fill="black" font-size="12">Bearable</text>
  <text x="50" y="170" text-anchor="middle" fill="black" font-size="12">Social</text>
  <text x="150" y="170" text-anchor="middle" fill="black" font-size="12">Équitable</text>
  <text x="100" y="170" text-anchor="middle" fill="black" font-size="12">Durable</text>
  
  <!-- Define the intersection labels -->
  <text x="75" y="100" text-anchor="middle" fill="black" font-size="12">Vivable</text>
  <text x="125" y="100" text-anchor="middle" fill="black" font-size="12">Viable</text>
  <text x="100" y="125" text-anchor="middle" fill="black" font-size="12">Social</text>
</svg>