<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribution of Math Exam Scores</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #chart-container {
            width: 95vw;
            height: 90vh;
            position: relative;
        }
        #main-chart {
            width: 100%;
            height: 100%;
        }
        .custom-legend {
            position: absolute;
            bottom: 20px;
            left: 50px;
            border: 1px solid #333;
            padding: 4px 8px;
            font-size: 12px;
            background-color: white;
            z-index: 10;
        }
        .y-axis-label {
            position: absolute;
            top: 10px;
            left: 40px;
            font-size: 13px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div id="chart-container">
    <div class="y-axis-label">Score (out of 100)</div>
    <div id="main-chart"></div>
    <div class="custom-legend">
        Boxplot: Q3 + 1.5×IQR (upper), Q1 - 1.5×IQR (lower)
    </div>
</div>

<script>
    $(document).ready(function() {
        var chartDom = document.getElementById('main-chart');
        var myChart = echarts.init(chartDom);
        
        // Data format: [min, Q1, median, Q3, max]
        // Estimated from visual inspection of the image
        const boxData = [
            [74, 84, 88, 92, 98], // Class 0
            [72, 78, 82, 85, 91], // Class 1
            [90, 92, 95, 98, 100], // Class 2
            [68, 72, 74, 76, 79], // Class 3
            [82, 86, 88, 90, 93]  // Class 4
        ];

        var option = {
            title: {
                text: 'Distribution of Math Exam Scores',
                left: 'center',
                top: 0,
                textStyle: {
                    fontSize: 18,
                    fontWeight: 'normal',
                    color: '#000'
                }
            },
            grid: {
                left: '50px',
                right: '50px',
                bottom: '80px',
                top: '60px',
                containLabel: false
            },
            xAxis: {
                type: 'category',
                data: ['Class 0', 'Class 1', 'Class 2', 'Class 3', 'Class 4'],
                boundaryGap: true,
                nameGap: 30,
                splitLine: {
                    show: false
                },
                axisLine: {
                    lineStyle: {
                        color: '#333',
                        width: 2
                    }
                },
                axisTick: {
                    show: true,
                    alignWithLabel: true
                },
                axisLabel: {
                    margin: 15,
                    fontWeight: 'bold'
                }
            },
            yAxis: {
                type: 'value',
                min: 0,
                max: 100,
                interval: 20,
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: '#eee'
                    }
                },
                axisLine: {
                    show: false
                },
                axisTick: {
                    show: false
                },
                axisLabel: {
                    fontWeight: 'bold',
                    formatter: function(value) {
                        return value === 0 ? '0' : value;
                    }
                }
            },
            series: [
                {
                    name: 'boxplot',
                    type: 'boxplot',
                    data: boxData,
                    itemStyle: {
                        color: '#0091ea',
                        borderColor: '#005b9f',
                        borderWidth: 1.5
                    },
                    emphasis: {
                        disabled: true
                    },
                    boxWidth: [20, 40] // Adjust width of the boxes
                }
            ]
        };

        myChart.setOption(option);

        window.addEventListener('resize', function() {
            myChart.resize();
        });
    });
</script>

</body>
</html>
