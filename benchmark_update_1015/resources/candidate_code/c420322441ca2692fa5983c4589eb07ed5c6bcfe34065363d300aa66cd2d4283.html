<!DOCTYPE html>
<html>
<head>
    <title>Office Supplies Distribution</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            min-height: 100vh;
        }
        
        #chart-container {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
        }
        
        .legend {
            position: absolute;
            left: 4px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
        }
        
        .legend-item {
            color: #1A237E;
            display: flex;
            align-items: center;
            margin: 8px 0;
        }
        
        .legend-color {
            width: 25px;
            height: 14px;
            margin-right: 6px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background-color: #1565C0;"></div>
            <span>Notebooks</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #43A047;"></div>
            <span>Pens</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #F4511E;"></div>
            <span>Folders</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #8E24AA;"></div>
            <span>Staplers</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #FDD835;"></div>
            <span>Markers</span>
        </div>
    </div>

    <script>
        $(function() {
            var chart = echarts.init(document.getElementById('chart-container'));
            
            var option = {
                title: {
                    text: 'Distribution of Office Supplies Usage',
                    subtext: 'Sample Data',
                    left: 'center',
                    textStyle: {
                        fontSize: 24,
                        fontWeight: 'bold'
                    }
                },
                tooltip: {
                    trigger: 'item'
                },
                series: [
                    {
                        type: 'pie',
                        radius: ['40%', '60%'],
                        avoidLabelOverlap: true,
                        label: {
                            show: true,
                            position: 'outside',
                            formatter: '{b}',
                            fontWeight: 'bold',
                            color: '#2b2b2b'
                        },
                        labelLine: {
                            show: true,
                            length: 15,
                            length2: 15,
                            lineStyle: {
                                color: '#1a237e',
                                width: 3
                            }
                        },
                        data: [
                            {value: 450, name: 'Notebooks', itemStyle: {color: '#1565C0'}},
                            {value: 320, name: 'Pens', itemStyle: {color: '#43A047'}},
                            {value: 210, name: 'Folders', itemStyle: {color: '#F4511E'}},
                            {value: 175, name: 'Staplers', itemStyle: {color: '#8E24AA'}},
                            {value: 95, name: 'Markers', itemStyle: {color: '#FDD835'}}
                        ],
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                            }
                        }
                    }
                ]
            };
            
            chart.setOption(option);
        });
    </script>
</body>
</html>
