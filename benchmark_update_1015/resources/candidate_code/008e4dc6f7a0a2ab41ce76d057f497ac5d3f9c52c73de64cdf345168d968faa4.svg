<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380">
  <!-- Background -->
  <rect x="0" y="0" width="1100" height="380" fill="white"/>

  <!-- Title and subtitles -->
  <text x="80" y="45" font-family="sans-serif" font-size="26" font-weight="700" fill="#16365D">
    GDP Growth Rate of Exampleland
  </text>
  <text x="86" y="68" font-family="sans-serif" font-size="13" fill="#16365D">
    (Source: Exampleland Statistics Bureau)
  </text>
  <text x="86" y="86" font-family="sans-serif" font-size="13" fill="#16365D">
    2023 data is provisional
  </text>

  <!-- Y axis dashed extension with arrow -->
  <line x1="75" y1="100" x2="75" y2="275" stroke="#16365D" stroke-width="1.8"
        stroke-dasharray="5 5"/>
  <!-- Arrowhead at top of dashed line -->
  <path d="M75 88 L69 100 L81 100 Z" fill="#16365D"/>

  <!-- Y axis broken solid segments (left of dashed line) -->
  <line x1="60" y1="230" x2="60" y2="260" stroke="#16365D" stroke-width="1.5"/>
  <line x1="60" y1="200" x2="60" y2="210" stroke="#16365D" stroke-width="1.5"/>
  <line x1="60" y1="170" x2="60" y2="180" stroke="#16365D" stroke-width="1.5"/>
  <line x1="60" y1="140" x2="60" y2="150" stroke="#16365D" stroke-width="1.5"/>
  <line x1="60" y1="110" x2="60" y2="120" stroke="#16365D" stroke-width="1.5"/>

  <!-- Percent sign label -->
  <text x="40" y="40" font-family="sans-serif" font-size="20" fill="#16365D">%</text>

  <!-- Y-axis ticks and labels (values 0 to 10) -->
  <!-- Baseline 0 -->
  <line x1="60" y1="260" x2="70" y2="260" stroke="#16365D" stroke-width="1.2"/>
  <text x="40" y="264" font-family="sans-serif" font-size="12" fill="#16365D">0</text>

  <!-- 2 -->
  <line x1="60" y1="235" x2="70" y2="235" stroke="#16365D" stroke-width="1.2"/>
  <text x="40" y="239" font-family="sans-serif" font-size="12" fill="#16365D">2</text>

  <!-- 4 -->
  <line x1="60" y1="210" x2="70" y2="210" stroke="#16365D" stroke-width="1.2"/>
  <text x="40" y="214" font-family="sans-serif" font-size="12" fill="#16365D">4</text>

  <!-- 6 -->
  <line x1="60" y1="185" x2="70" y2="185" stroke="#16365D" stroke-width="1.2"/>
  <text x="40" y="189" font-family="sans-serif" font-size="12" fill="#16365D">6</text>

  <!-- 8 -->
  <line x1="60" y1="160" x2="70" y2="160" stroke="#16365D" stroke-width="1.2"/>
  <text x="40" y="164" font-family="sans-serif" font-size="12" fill="#16365D">8</text>

  <!-- 10 -->
  <line x1="60" y1="135" x2="70" y2="135" stroke="#16365D" stroke-width="1.2"/>
  <text x="32" y="139" font-family="sans-serif" font-size="12" fill="#16365D">10</text>

  <!-- X-axis baseline (subtle) -->
  <line x1="70" y1="260" x2="470" y2="260" stroke="#999999" stroke-width="0.8"/>

  <!-- Bar data - GDP growth for 2012-2023 -->
  <!-- Common settings -->
  <!-- Baseline at y=260; 1% ≈ 10 units of height -->

  <!-- 2012: 1% -->
  <rect x="95" y="250" width="18" height="10" fill="#0B3C68"/>
  <!-- 2013: 2% -->
  <rect x="125" y="240" width="18" height="20" fill="#0B3C68"/>
  <!-- 2014: 3% -->
  <rect x="155" y="230" width="18" height="30" fill="#0B3C68"/>
  <!-- 2015: 4% -->
  <rect x="185" y="220" width="18" height="40" fill="#0B3C68"/>
  <!-- 2016: 6% peak -->
  <rect x="215" y="200" width="18" height="60" fill="#0B3C68"/>
  <!-- 2017: 5% -->
  <rect x="245" y="210" width="18" height="50" fill="#0B3C68"/>
  <!-- 2018: 3.5% -->
  <rect x="275" y="225" width="18" height="35" fill="#0B3C68"/>
  <!-- 2019: 2% -->
  <rect x="305" y="240" width="18" height="20" fill="#0B3C68"/>
  <!-- 2020: 0.7% -->
  <rect x="335" y="253" width="18" height="7" fill="#0B3C68"/>
  <!-- 2021: 0.3% -->
  <rect x="365" y="257" width="18" height="3" fill="#0B3C68"/>
  <!-- 2022: 1.2% -->
  <rect x="395" y="248" width="18" height="12" fill="#0B3C68"/>
  <!-- 2023: 0.2% -->
  <rect x="425" y="258" width="18" height="2" fill="#0B3C68"/>

  <!-- X-axis year labels -->
  <g font-family="sans-serif" font-size="10" fill="#16365D">
    <text x="90"  y="278">2012</text>
    <text x="120" y="278">2013</text>
    <text x="150" y="278">2014</text>
    <text x="180" y="278">2015</text>
    <text x="210" y="278">2016</text>
    <text x="240" y="278">2017</text>
    <text x="270" y="278">2018</text>
    <text x="300" y="278">2019</text>
    <text x="330" y="278">2020</text>
    <text x="360" y="278">2021</text>
    <text x="390" y="278">2022</text>
    <text x="420" y="278">2023</text>
  </g>

  <!-- X-axis label "Year" -->
  <text x="270" y="305" font-family="sans-serif" font-size="18" fill="#16365D">
    Year
  </text>

  <!-- Annotation: Policy Change above 2016 bar -->
  <!-- Connector line -->
  <line x1="224" y1="200" x2="224" y2="185" stroke="#2F8F2F" stroke-width="1.2"/>
  <!-- Diamond marker -->
  <path d="M224 175 L218 180 L224 185 L230 180 Z" fill="#2F8F2F"/>
  <!-- Text label -->
  <text x="232" y="182" font-family="sans-serif" font-size="12" fill="#16365D">
    Policy Change
  </text>

  <!-- Annotation: Global Recession above around 2018/2019 -->
  <!-- Connector with arrow -->
  <line x1="292" y1="225" x2="292" y2="155" stroke="#000000" stroke-width="1"/>
  <path d="M292 145 L287 155 L297 155 Z" fill="#000000"/>
  <!-- Text label -->
  <text x="230" y="136" font-family="sans-serif" font-size="12" fill="#16365D">
    Global Recession
  </text>
</svg>