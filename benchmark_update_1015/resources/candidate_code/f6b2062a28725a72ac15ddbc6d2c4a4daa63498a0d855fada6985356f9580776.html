<!DOCTYPE html>
<html>
<head>
  <title>Math Test Scores</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #fff;
    }

    .chart-container {
      width: 600px;
      height: 400px;
      margin: 20px auto;
      border: 1px solid #ccc;
      position: relative;
    }

    .chart-title {
      text-align: center;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .chart-subtitle {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="chart-container">
    <div class="chart-title">Math Test Scores by Topic</div>
    <div class="chart-subtitle">Sample Dataset</div>
    <div id="mainChart" style="width: 100%; height: 100%;"></div>
  </div>

  <script>
    $(function() {
      var chartDom = document.getElementById('mainChart');
      var myChart = echarts.init(chartDom);
      var option = {
        title: {
          text: '' // Title is already in HTML
        },
        tooltip: {
          trigger: 'axis',
          axisPointer: {
            type: 'shadow'
          }
        },
        legend: {
          data: ['Average Score'],
          textStyle: {
            color: '#5470c6'
          }
        },
        grid: {
          left: '3%',
          right: '4%',
          bottom: '3%',
          containLabel: true
        },
        xAxis: {
          type: 'category',
          data: ['Algebra', 'Geometry', 'Calculus', 'Statistics', 'Trigonometry'],
          axisLabel: {
            color: '#333'
          }
        },
        yAxis: {
          type: 'value',
          name: 'Score (%)',
          axisLabel: {
            color: '#333'
          }
        },
        series: [
          {
            name: 'Average Score',
            type: 'bar',
            data: [88, 74, 40, 94, 69],
            itemStyle: {
              color: '#5470c6'
            }
          }
        ]
      };
      myChart.setOption(option);
    });
  </script>

</body>
</html>
