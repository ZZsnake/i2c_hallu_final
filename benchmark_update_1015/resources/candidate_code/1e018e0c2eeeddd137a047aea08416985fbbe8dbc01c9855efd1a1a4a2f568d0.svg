<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <style>
    .box { fill:#ffffff; stroke:#000000; stroke-width:1; }
    .line { stroke:#000000; stroke-width:1; fill:none; }
    .txt { font-family:Arial,Helvetica,sans-serif; font-size:11px; text-anchor:middle; dominant-baseline:middle; }
  </style>

  <!-- Root: Diagram -->
  <rect class="box" x="410" y="20" width="80" height="30"/>
  <text class="txt" x="450" y="35">Diagram</text>

  <!-- Behaviour Diagram box -->
  <rect class="box" x="200" y="100" width="130" height="40"/>
  <text class="txt" x="265" y="115">Behaviour</text>
  <text class="txt" x="265" y="129">Diagram</text>

  <!-- Structure Diagram box -->
  <rect class="box" x="570" y="100" width="130" height="40"/>
  <text class="txt" x="635" y="115">Structure</text>
  <text class="txt" x="635" y="129">Diagram</text>

  <!-- Connection from Diagram to Behaviour and Structure -->
  <!-- Down from root -->
  <line class="line" x1="450" y1="50" x2="450" y2="80"/>
  <!-- Horizontal split -->
  <line class="line" x1="250" y1="80" x2="650" y2="80"/>
  <!-- Down to Behaviour -->
  <line class="line" x1="265" y1="80" x2="265" y2="100"/>
  <!-- Down to Structure -->
  <line class="line" x1="635" y1="80" x2="635" y2="100"/>

  <!-- Behaviour children row: Activity, State Machine, Use Case -->
  <!-- Activity Diagram -->
  <rect class="box" x="80" y="190" width="120" height="40"/>
  <text class="txt" x="140" y="205">Activity</text>
  <text class="txt" x="140" y="219">Diagram</text>

  <!-- State Machine Diagram -->
  <rect class="box" x="220" y="190" width="130" height="40"/>
  <text class="txt" x="285" y="205">State Machine</text>
  <text class="txt" x="285" y="219">Diagram</text>

  <!-- Use Case Diagram -->
  <rect class="box" x="370" y="190" width="130" height="40"/>
  <text class="txt" x="435" y="205">Use Case</text>
  <text class="txt" x="435" y="219">Diagram</text>

  <!-- Interaction Diagram (middle under Behaviour children) -->
  <rect class="box" x="220" y="260" width="130" height="40"/>
  <text class="txt" x="285" y="275">Interaction</text>
  <text class="txt" x="285" y="289">Diagram</text>

  <!-- Connections from Behaviour Diagram to its children -->
  <!-- Down from Behaviour -->
  <line class="line" x1="265" y1="140" x2="265" y2="165"/>
  <!-- Horizontal split for three upper children and Interaction below center -->
  <line class="line" x1="140" y1="165" x2="435" y2="165"/>
  <!-- Vertical to Activity -->
  <line class="line" x1="140" y1="165" x2="140" y2="190"/>
  <!-- Vertical to State Machine -->
  <line class="line" x1="285" y1="165" x2="285" y2="190"/>
  <!-- Vertical to Use Case -->
  <line class="line" x1="435" y1="165" x2="435" y2="190"/>
  <!-- Vertical to Interaction (from center) -->
  <line class="line" x1="285" y1="165" x2="285" y2="260"/>

  <!-- Interaction Diagram children row -->
  <!-- Communication Diagram -->
  <rect class="box" x="20" y="350" width="150" height="40"/>
  <text class="txt" x="95" y="365">Communication</text>
  <text class="txt" x="95" y="379">Diagram</text>

  <!-- Interaction Overview Diagram -->
  <rect class="box" x="190" y="350" width="170" height="40"/>
  <text class="txt" x="275" y="365">Interaction</text>
  <text class="txt" x="275" y="379">Overview Diagram</text>

  <!-- Sequence Diagram -->
  <rect class="box" x="380" y="350" width="150" height="40"/>
  <text class="txt" x="455" y="365">Sequence</text>
  <text class="txt" x="455" y="379">Diagram</text>

  <!-- Timing Diagram -->
  <rect class="box" x="550" y="350" width="130" height="40"/>
  <text class="txt" x="615" y="365">Timing</text>
  <text class="txt" x="615" y="379">Diagram</text>

  <!-- Connections from Interaction Diagram to its children -->
  <!-- Down from Interaction -->
  <line class="line" x1="285" y1="300" x2="285" y2="325"/>
  <!-- Horizontal split -->
  <line class="line" x1="95" y1="325" x2="615" y2="325"/>
  <!-- Down to Communication -->
  <line class="line" x1="95" y1="325" x2="95" y2="350"/>
  <!-- Down to Interaction Overview -->
  <line class="line" x1="275" y1="325" x2="275" y2="350"/>
  <!-- Down to Sequence -->
  <line class="line" x1="455" y1="325" x2="455" y2="350"/>
  <!-- Down to Timing -->
  <line class="line" x1="615" y1="325" x2="615" y2="350"/>

  <!-- Structure children rows -->
  <!-- First row: Class, Component, Object -->
  <!-- Class Diagram -->
  <rect class="box" x="520" y="190" width="120" height="40"/>
  <text class="txt" x="580" y="205">Class</text>
  <text class="txt" x="580" y="219">Diagram</text>

  <!-- Component Diagram -->
  <rect class="box" x="660" y="190" width="140" height="40"/>
  <text class="txt" x="730" y="205">Component</text>
  <text class="txt" x="730" y="219">Diagram</text>

  <!-- Object Diagram -->
  <rect class="box" x="810" y="190" width="120" height="40"/>
  <text class="txt" x="870" y="205">Object</text>
  <text class="txt" x="870" y="219">Diagram</text>

  <!-- Second row under Structure: Composite Structure, Deployment, Package, Profile -->
  <!-- Composite Structure Diagram -->
  <rect class="box" x="520" y="260" width="170" height="40"/>
  <text class="txt" x="605" y="275">Composite</text>
  <text class="txt" x="605" y="289">Structure Diagram</text>

  <!-- Deployment Diagram -->
  <rect class="box" x="710" y="260" width="150" height="40"/>
  <text class="txt" x="785" y="275">Deployment</text>
  <text class="txt" x="785" y="289">Diagram</text>

  <!-- Package Diagram -->
  <rect class="box" x="520" y="320" width="140" height="40"/>
  <text class="txt" x="590" y="335">Package</text>
  <text class="txt" x="590" y="349">Diagram</text>

  <!-- Profile Diagram -->
  <rect class="box" x="680" y="320" width="120" height="40"/>
  <text class="txt" x="740" y="335">Profile</text>
  <text class="txt" x="740" y="349">Diagram</text>

  <!-- Connections from Structure Diagram to its children -->
  <!-- Down from Structure -->
  <line class="line" x1="635" y1="140" x2="635" y2="165"/>
  <!-- Horizontal split for first row of three -->
  <line class="line" x1="580" y1="165" x2="870" y2="165"/>
  <!-- Vertical to Class -->
  <line class="line" x1="580" y1="165" x2="580" y2="190"/>
  <!-- Vertical to Component -->
  <line class="line" x1="730" y1="165" x2="730" y2="190"/>
  <!-- Vertical to Object -->
  <line class="line" x1="870" y1="165" x2="870" y2="190"/>

  <!-- Split from center down to second row Composite/Deployment -->
  <line class="line" x1="730" y1="165" x2="730" y2="260"/>
  <!-- Horizontal for Composite/Deployment -->
  <line class="line" x1="605" y1="230" x2="785" y2="230"/>
  <!-- Vertical connections from this horizontal (use same y as midway between 190 and 260) -->
  <line class="line" x1="605" y1="230" x2="605" y2="260"/>
  <line class="line" x1="785" y1="230" x2="785" y2="260"/>

  <!-- From Composite/Deployment down to Package/Profile -->
  <line class="line" x1="605" y1="300" x2="605" y2="320"/>
  <line class="line" x1="785" y1="300" x2="785" y2="320"/>
  <!-- Horizontal between Package and Profile connection points -->
  <line class="line" x1="590" y1="300" x2="740" y2="300"/>
  <line class="line" x1="590" y1="300" x2="590" y2="320"/>
  <line class="line" x1="740" y1="300" x2="740" y2="320"/>

  <!-- Legend: Notation UML -->
  <g>
    <!-- Base rectangle -->
    <rect class="box" x="720" y="410" width="140" height="40"/>
    <!-- Folded corner: draw diagonal line making a small triangle on top-right -->
    <path class="line" d="M860 410 L845 410 L860 425 Z"/>
    <text class="txt" x="785" y="435">Notation: UML</text>
  </g>
</svg>