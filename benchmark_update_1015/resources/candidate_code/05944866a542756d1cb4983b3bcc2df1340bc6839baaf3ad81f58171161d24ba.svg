<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" font-family="monospace" font-size="12px">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="550" fill="white"/>

  <!-- Grid Lines -->
  <g stroke="#D3D3D3" stroke-dasharray="4 2" stroke-width="1">
    <!-- Horizontal Grid Lines -->
    <line x1="80" y1="50" x2="480" y2="50"/>
    <line x1="80" y1="100" x2="480" y2="100"/>
    <line x1="80" y1="150" x2="480" y2="150"/>
    <line x1="80" y1="200" x2="480" y2="200"/>
    <line x1="80" y1="250" x2="480" y2="250"/>
    <line x1="80" y1="300" x2="480" y2="300"/>
    <line x1="80" y1="350" x2="480" y2="350"/>
    <line x1="80" y1="400" x2="480" y2="400"/>
    <line x1="80" y1="450" x2="480" y2="450"/>
    <!-- Vertical Grid Lines -->
    <line x1="130" y1="50" x2="130" y2="450"/>
    <line x1="180" y1="50" x2="180" y2="450"/>
    <line x1="230" y1="50" x2="230" y2="450"/>
    <line x1="280" y1="50" x2="280" y2="450"/>
    <line x1="330" y1="50" x2="330" y2="450"/>
    <line x1="380" y1="50" x2="380" y2="450"/>
    <line x1="430" y1="50" x2="430" y2="450"/>
    <line x1="480" y1="50" x2="480" y2="450"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="450" x2="480" y2="450" stroke="black" stroke-width="1"/>
  <line x1="80" y1="50" x2="80" y2="450" stroke="black" stroke-width="1"/>

  <!-- X-axis labels and ticks -->
  <text x="80" y="470" text-anchor="middle">0</text>
  <text x="130" y="470" text-anchor="middle">100</text>
  <text x="180" y="470" text-anchor="middle">200</text>
  <text x="230" y="470" text-anchor="middle">300</text>
  <text x="280" y="470" text-anchor="middle">400</text>
  <text x="330" y="470" text-anchor="middle">500</text> <!-- This tick is not on the grid, but implied by the pattern -->
  <text x="280" y="490" text-anchor="middle" font-size="14px">Market Supply (units)</text>

  <!-- Y-axis labels and ticks -->
  <text x="70" y="450" text-anchor="end" alignment-baseline="middle">0</text>
  <text x="70" y="400" text-anchor="end" alignment-baseline="middle">100</text>
  <text x="70" y="350" text-anchor="end" alignment-baseline="middle">200</text>
  <text x="70" y="300" text-anchor="end" alignment-baseline="middle">300</text>
  <text x="70" y="250" text-anchor="end" alignment-baseline="middle">400</text>
  <text x="70" y="200" text-anchor="end" alignment-baseline="middle">500</text> <!-- This tick is not on the grid, but implied by the pattern -->
  <text x="30" y="250" text-anchor="middle" transform="rotate(-90 30 250)" font-size="14px">Market Demand (units)</text>

  <!-- Data Points and Line (approximated coordinates based on image) -->
  <!-- Scale: 100 units = 50 pixels -->
  <!-- X-axis: 0 at 80px, 100 at 130px, etc. (x = 80 + supply * 0.5) -->
  <!-- Y-axis: 0 at 450px, 100 at 400px, etc. (y = 450 - demand * 0.5) -->

  <g stroke="red" stroke-width="2">
    <path fill="none" stroke="red" stroke-width="2" d="
      M 105 425
      L 120 400
      L 140 380
      L 160 350
      L 190 320
      L 220 300
      L 250 280
      L 280 260
      L 310 240
      L 340 220
      L 370 200
      L 400 180
      L 430 160
      L 460 140
      L 490 120
      L 520 100
      L 550 80
      L 580 60
      L 610 40
      L 640 20
      L 670 0
    "/>
  </g>

  <g>
    <!-- Retail (Supply ~50, Demand ~50) -->
    <circle cx="105" cy="425" r="6" fill="#800080"/>
    <text x="115" y="425" alignment-baseline="middle">Retail</text>

    <!-- Manufacturing (Supply ~80, Demand ~100) -->
    <circle cx="120" cy="400" r="7" fill="#ADD8E6"/>
    <text x="130" y="400" alignment-baseline="middle">Manufacturing</text>

    <!-- Agriculture (Supply ~120, Demand ~140) -->
    <circle cx="140" cy="380" r="8" fill="#008000"/>
    <text x="150" y="380" alignment-baseline="middle">Agriculture</text>

    <!-- Transport (Supply ~160, Demand ~200) -->
    <circle cx="160" cy="350" r="9" fill="#FFA500"/>
    <text x="170" y="350" alignment-baseline="middle">Transport</text>

    <!-- Healthcare (Supply ~220, Demand ~260) -->
    <circle cx="190" cy="320" r="10" fill="#FF0000"/>
    <text x="200" y="320" alignment-baseline="middle">Healthcare</text>

    <!-- Technology (Supply ~280, Demand ~300) -->
    <circle cx="220" cy="300" r="11" fill="#00008B"/>
    <text x="230" y="300" alignment-baseline="middle">Technology</text>

    <!-- Finance (Supply ~340, Demand ~360) -->
    <circle cx="250" cy="280" r="12" fill="#008080"/>
    <text x="260" y="280" alignment-baseline="middle">Finance</text>

    <!-- Energy (Supply ~400, Demand ~430) -->
    <circle cx="280" cy="260" r="13" fill="#D2691E"/>
    <text x="290" y="260" alignment-baseline="middle">Energy</text>

    <!-- Real Estate Industry (Supply ~460, Demand ~490) -->
    <circle cx="310" cy="240" r="14" fill="#C71585"/>
    <text x="320" y="240" alignment-baseline="middle">Real Estate Industry</text>
  </g>

  <!-- Legend -->
  <g transform="translate(480, 50)" font-size="10px">
    <rect x="0" y="0" width="100" height="180" fill="none" stroke="none"/>
    <rect x="0" y="0" width="8" height="8" fill="#800080"/>
    <text x="15" y="7" alignment-baseline="middle">Retail</text>

    <rect x="0" y="20" width="8" height="8" fill="#ADD8E6"/>
    <text x="15" y="27" alignment-baseline="middle">Manufacturing</text>

    <rect x="0" y="40" width="8" height="8" fill="#008000"/>
    <text x="15" y="47" alignment-baseline="middle">Agriculture</text>

    <rect x="0" y="60" width="8" height="8" fill="#FFA500"/>
    <text x="15" y="67" alignment-baseline="middle">Transport</text>

    <rect x="0" y="80" width="8" height="8" fill="#FF0000"/>
    <text x="15" y="87" alignment-baseline="middle">Healthcare</text>

    <rect x="0" y="100" width="8" height="8" fill="#00008B"/>
    <text x="15" y="107" alignment-baseline="middle">Technology</text>

    <rect x="0" y="120" width="8" height="8" fill="#008080"/>
    <text x="15" y="127" alignment-baseline="middle">Finance</text>

    <rect x="0" y="140" width="8" height="8" fill="#D2691E"/>
    <text x="15" y="147" alignment-baseline="middle">Energy</text>

    <rect x="0" y="160" width="8" height="8" fill="#C71585"/>
    <text x="15" y="167" alignment-baseline="middle">Real Estate</text>
  </g>

  <!-- Source Information -->
  <text x="80" y="520" font-size="10px">Source: Hypothetical Economics Dataset, Market Sectors</text>
  <text x="550" y="520" font-size="10px">CC BY</text>
</svg>