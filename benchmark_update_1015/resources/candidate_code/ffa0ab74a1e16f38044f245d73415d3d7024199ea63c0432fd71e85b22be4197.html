<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Math Competency Radar</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 20px;
    }
    .container {
      display: flex;
      justify-content: center;
      gap: 40px;
      align-items: flex-start;
    }
    .chart-container {
      width: 400px;
      height: 400px;
    }
    .title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .legend-color {
      width: 15px;
      height: 15px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="title">Student Math Competency Radar</div>
  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background-color: #1f77b4;"></div>Alice</div>
    <div class="legend-item"><div class="legend-color" style="background-color: #ff6666;"></div>Bob</div>
    <div class="legend-item"><div class="legend-color" style="background-color: #66b3ff;"></div>Class Average</div>
    <div class="legend-item"><div class="legend-color" style="background-color: #ff6600;"></div>Practice Target</div>
  </div>
  <div class="container">
    <div id="basic-radar" class="chart-container"></div>
    <div id="advanced-radar" class="chart-container"></div>
  </div>

  <script>
    // Basic Math Domains Radar Chart
    const basicRadarChart = echarts.init(document.getElementById('basic-radar'));
    const basicOption = {
      tooltip: {},
      radar: {
        indicator: [
          { name: 'Algebra', max: 100 },
          { name: 'Logic', max: 100 },
          { name: 'Statistics', max: 100 },
          { name: 'Calculus', max: 100 },
          { name: 'Geometry', max: 100 }
        ],
        center: ['50%', '50%'],
        radius: '70%',
        splitNumber: 5,
        axisLine: {
          lineStyle: {
            color: '#333'
          }
        },
        splitLine: {
          lineStyle: {
            color: ['#ccc']
          }
        },
        splitArea: {
          areaStyle: {
            color: ['rgba(255,255,255,0.1)']
          }
        }
      },
      series: [{
        name: 'Student Competency',
        type: 'radar',
        data: [
          {
            value: [85, 78, 82, 75, 80],
            name: 'Alice',
            areaStyle: {
              color: 'rgba(31, 119, 180, 0.2)'
            },
            lineStyle: {
              color: '#1f77b4'
            },
            itemStyle: {
              color: '#1f77b4'
            }
          },
          {
            value: [70, 75, 72, 68, 73],
            name: 'Bob',
            areaStyle: {
              color: 'rgba(255, 102, 102, 0.2)'
            },
            lineStyle: {
              color: '#ff6666'
            },
            itemStyle: {
              color: '#ff6666'
            }
          },
          {
            value: [78, 76, 79, 74, 77],
            name: 'Class Average',
            areaStyle: {
              color: 'rgba(102, 179, 255, 0.3)'
            },
            lineStyle: {
              color: '#66b3ff'
            },
            itemStyle: {
              color: '#66b3ff'
            }
          },
          {
            value: [90, 85, 88, 82, 86],
            name: 'Practice Target',
            areaStyle: {
              color: 'rgba(255, 102, 0, 0.3)'
            },
            lineStyle: {
              color: '#ff6600'
            },
            itemStyle: {
              color: '#ff6600'
            }
          }
        ]
      }]
    };
    basicRadarChart.setOption(basicOption);

    // Advanced Math Domains Radar Chart
    const advancedRadarChart = echarts.init(document.getElementById('advanced-radar'));
    const advancedOption = {
      tooltip: {},
      radar: {
        indicator: [
          { name: 'Arithmetic', max: 100 },
          { name: 'Set Theory', max: 90 },
          { name: 'Number Theory', max: 70 },
          { name: 'Probability', max: 110 },
          { name: 'Discrete Math', max: 85 },
          { name: 'Trigonometry', max: 75 }
        ],
        center: ['50%', '50%'],
        radius: '70%',
        splitNumber: 5,
        axisLine: {
          lineStyle: {
            color: '#333'
          }
        },
        splitLine: {
          lineStyle: {
            color: ['#ccc']
          }
        },
        splitArea: {
          areaStyle: {
            color: ['rgba(255,255,255,0.1)']
          }
        }
      },
      series: [{
        name: 'Advanced Math Competency',
        type: 'radar',
        data: [
          {
            value: [100, 90, 70, 110, 85, 75],
            name: 'Practice Target',
            areaStyle: {
              color: 'rgba(255, 102, 0, 0.5)'
            },
            lineStyle: {
              color: '#ff6600',
              width: 2
            },
            itemStyle: {
              color: '#ff6600'
            }
          },
          {
            value: [85, 75, 60, 95, 70, 65],
            name: 'Class Average',
            lineStyle: {
              color: '#55a868',
              type: 'dashed',
              width: 2
            },
            itemStyle: {
              color: '#55a868'
            },
            symbol: 'circle',
            symbolSize: 6
          }
        ]
      }]
    };
    advancedRadarChart.setOption(advancedOption);

    // Responsive
    window.addEventListener('resize', function() {
      basicRadarChart.resize();
      advancedRadarChart.resize();
    });
  </script>
</body>
</html>
