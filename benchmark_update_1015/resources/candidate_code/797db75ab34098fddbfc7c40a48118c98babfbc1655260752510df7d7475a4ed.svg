<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- CPU -->
  <rect x="350" y="50" width="100" height="50" fill="#add8e6" stroke="black" stroke-width="2"/>
  <text x="395" y="80" font-family="Arial" font-size="14" text-anchor="middle">CPU</text>

  <!-- RAM -->
  <rect x="100" y="150" width="100" height="50" fill="#ff9999" stroke="black" stroke-width="2"/>
  <text x="150" y="180" font-family="Arial" font-size="14" text-anchor="middle">RAM</text>
  <line x1="200" y1="175" x2="300" y2="100" stroke="black" stroke-dasharray="5,5" stroke-width="2"/>
  <text x="250" y="130" font-family="Arial" font-size="12" text-anchor="middle">Control Bus</text>

  <!-- ROM -->
  <rect x="550" y="150" width="100" height="50" fill="#90EE90" stroke="black" stroke-width="2"/>
  <text x="600" y="180" font-family="Arial" font-size="14" text-anchor="middle">ROM</text>
  <line x1="600" y1="175" x2="450" y2="100" stroke="black" stroke-dasharray="5,5" stroke-width="2"/>
  <text x="525" y="130" font-family="Arial" font-size="12" text-anchor="middle">Address Bus</text>
  <line x1="600" y1="175" x2="450" y2="175" stroke="black" stroke-dasharray="5,5" stroke-width="2"/>
  <text x="525" y="195" font-family="Arial" font-size="12" text-anchor="middle">Data Bus</text>

  <!-- I/O Controller -->
  <rect x="350" y="250" width="100" height="50" fill="#e6e6fa" stroke="black" stroke-width="2"/>
  <text x="400" y="280" font-family="Arial" font-size="14" text-anchor="middle">I/O Controller</text>
  <line x1="400" y1="275" x2="400" y2="200" stroke="black" stroke-width="2"/>
  <text x="400" y="230" font-family="Arial" font-size="12" text-anchor="middle">Interrupt</text>
  <line x1="400" y1="275" x2="250" y2="275" stroke="black" stroke-dasharray="5,5" stroke-width="2"/>
  <text x="325" y="295" font-family="Arial" font-size="12" text-anchor="middle">Buffer</text>
  <line x1="400" y1="275" x2="550" y2="275" stroke="black" stroke-dasharray="5,5" stroke-width="2"/>
  <text x="475" y="295" font-family="Arial" font-size="12" text-anchor="middle">Firmware</text>

  <!-- Keyboard -->
  <rect x="50" y="350" width="100" height="50" fill="#add8e6" stroke="black" stroke-width="2"/>
  <text x="100" y="380" font-family="Arial" font-size="14" text-anchor="middle">Keyboard</text>
  <line x1="100" y1="375" x2="200" y2="300" stroke="black" stroke-dasharray="5,5" stroke-width="2"/>
  <text x="150" y="330" font-family="Arial" font-size="12" text-anchor="middle">Input Bus</text>

  <!-- Display -->
  <rect x="650" y="350" width="100" height="50" fill="#ffff99" stroke="black" stroke-width="2"/>
  <text x="700" y="380" font-family="Arial" font-size="14" text-anchor="middle">Display</text>
  <line x1="700" y1="375" x2="600" y2="300" stroke="black" stroke-dasharray="5,5" stroke-width="2"/>
  <text x="650" y="330" font-family="Arial" font-size="12" text-anchor="middle">Output Bus</text>

  <!-- External Storage -->
  <rect x="300" y="450" width="200" height="50" fill="#add8e6" stroke="black" stroke-width="2"/>
  <text x="400" y="480" font-family="Arial" font-size="14" text-anchor="middle">External Storage</text>
  <line x1="400" y1="475" x2="400" y2="300" stroke="black" stroke-dasharray="5,5" stroke-width="2"/>
  <text x="400" y="360" font-family="Arial" font-size="12" text-anchor="middle">Data Transfer</text>
</svg>