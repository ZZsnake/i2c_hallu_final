<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <style>
      .centrosome-body { fill: #800080; }
      .centrosome-spike { stroke: #FFC0CB; stroke-width: 2; stroke-linecap: round; }
      .microtubule { stroke: #A52A2A; stroke-width: 1.5; stroke-linecap: round; }
      .chromosome { fill: #2196F3; rx: 4; ry: 4; }
      .peripheral-arc { fill: none; stroke: #A0A0C0; stroke-width: 10; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Peripheral arcs -->
  <path class="peripheral-arc" d="M 50 50 Q 100 0 150 50" />
  <path class="peripheral-arc" d="M 50 250 Q 100 300 150 250" />
  <path class="peripheral-arc" d="M 550 50 Q 500 0 450 50" />
  <path class="peripheral-arc" d="M 550 250 Q 500 300 450 250" />
  <path class="peripheral-arc" d="M 200 20 Q 250 -30 300 20" />
  <path class="peripheral-arc" d="M 300 20 Q 350 -30 400 20" />
  <path class="peripheral-arc" d="M 200 280 Q 250 330 300 280" />
  <path class="peripheral-arc" d="M 300 280 Q 350 330 400 280" />

  <!-- Left Centrosome -->
  <circle cx="100" cy="150" r="20" class="centrosome-body" />
  <line x1="100" y1="150" x2="120" y2="150" class="centrosome-spike" />
  <line x1="100" y1="150" x2="115" y2="165" class="centrosome-spike" />
  <line x1="100" y1="150" x2="100" y2="170" class="centrosome-spike" />
  <line x1="100" y1="150" x2="85" y2="165" class="centrosome-spike" />
  <line x1="100" y1="150" x2="80" y2="150" class="centrosome-spike" />
  <line x1="100" y1="150" x2="85" y2="135" class="centrosome-spike" />
  <line x1="100" y1="150" x2="100" y2="130" class="centrosome-spike" />
  <line x1="100" y1="150" x2="115" y2="135" class="centrosome-spike" />

  <!-- Right Centrosome -->
  <circle cx="500" cy="150" r="20" class="centrosome-body" />
  <line x1="500" y1="150" x2="520" y2="150" class="centrosome-spike" />
  <line x1="500" y1="150" x2="515" y2="165" class="centrosome-spike" />
  <line x1="500" y1="150" x2="500" y2="170" class="centrosome-spike" />
  <line x1="500" y1="150" x2="485" y2="165" class="centrosome-spike" />
  <line x1="500" y1="150" x2="480" y2="150" class="centrosome-spike" />
  <line x1="500" y1="150" x2="485" y2="135" class="centrosome-spike" />
  <line x1="500" y1="150" x2="500" y2="130" class="centrosome-spike" />
  <line x1="500" y1="150" x2="515" y2="135" class="centrosome-spike" />

  <!-- Chromosomes (blue squares) -->
  <rect x="220" y="100" width="20" height="20" class="chromosome" />
  <rect x="250" y="100" width="20" height="20" class="chromosome" />
  <rect x="280" y="100" width="20" height="20" class="chromosome" />
  <rect x="310" y="100" width="20" height="20" class="chromosome" />
  <rect x="340" y="100" width="20" height="20" class="chromosome" />
  <rect x="370" y="100" width="20" height="20" class="chromosome" />

  <rect x="220" y="180" width="20" height="20" class="chromosome" />
  <rect x="250" y="180" width="20" height="20" class="chromosome" />
  <rect x="280" y="180" width="20" height="20" class="chromosome" />
  <rect x="310" y="180" width="20" height="20" class="chromosome" />
  <rect x="340" y="180" width="20" height="20" class="chromosome" />
  <rect x="370" y="180" width="20" height="20" class="chromosome" />

  <!-- Microtubules -->
  <!-- Interpolar microtubules -->
  <line x1="100" y1="150" x2="500" y2="150" class="microtubule" />
  <line x1="100" y1="150" x2="500" y2="160" class="microtubule" />
  <line x1="100" y1="150" x2="500" y2="140" class="microtubule" />

  <!-- Kinetochore microtubules (left pole to chromosomes) -->
  <line x1="100" y1="150" x2="220" y2="110" class="microtubule" />
  <line x1="100" y1="150" x2="250" y2="110" class="microtubule" />
  <line x1="100" y1="150" x2="280" y2="110" class="microtubule" />
  <line x1="100" y1="150" x2="310" y2="110" class="microtubule" />
  <line x1="100" y1="150" x2="340" y2="110" class="microtubule" />
  <line x1="100" y1="150" x2="370" y2="110" class="microtubule" />

  <line x1="100" y1="150" x2="220" y2="190" class="microtubule" />
  <line x1="100" y1="150" x2="250" y2="190" class="microtubule" />
  <line x1="100" y1="150" x2="280" y2="190" class="microtubule" />
  <line x1="100" y1="150" x2="310" y2="190" class="microtubule" />
  <line x1="100" y1="150" x2="340" y2="190" class="microtubule" />
  <line x1="100" y1="150" x2="370" y2="190" class="microtubule" />

  <!-- Kinetochore microtubules (right pole to chromosomes) -->
  <line x1="500" y1="150" x2="240" y2="110" class="microtubule" />
  <line x1="500" y1="150" x2="270" y2="110" class="microtubule" />
  <line x1="500" y1="150" x2="300" y2="110" class="microtubule" />
  <line x1="500" y1="150" x2="330" y2="110" class="microtubule" />
  <line x1="500" y1="150" x2="360" y2="110" class="microtubule" />
  <line x1="500" y1="150" x2="390" y2="110" class="microtubule" />

  <line x1="500" y1="150" x2="240" y2="190" class="microtubule" />
  <line x1="500" y1="150" x2="270" y2="190" class="microtubule" />
  <line x1="500" y1="150" x2="300" y2="190" class="microtubule" />
  <line x1="500" y1="150" x2="330" y2="190" class="microtubule" />
  <line x1="500" y1="150" x2="360" y2="190" class="microtubule" />
  <line x1="500" y1="150" x2="390" y2="190" class="microtubule" />

  <!-- Astral microtubules (from left pole) -->
  <line x1="100" y1="150" x2="150" y2="80" class="microtubule" />
  <line x1="100" y1="150" x2="150" y2="220" class="microtubule" />
  <line x1="100" y1="150" x2="50" y2="100" class="microtubule" />
  <line x1="100" y1="150" x2="50" y2="200" class="microtubule" />

  <!-- Astral microtubules (from right pole) -->
  <line x1="500" y1="150" x2="450" y2="80" class="microtubule" />
  <line x1="500" y1="150" x2="450" y2="220" class="microtubule" />
  <line x1="500" y1="150" x2="550" y2="100" class="microtubule" />
  <line x1="500" y1="150" x2="550" y2="200" class="microtubule" />

</svg>