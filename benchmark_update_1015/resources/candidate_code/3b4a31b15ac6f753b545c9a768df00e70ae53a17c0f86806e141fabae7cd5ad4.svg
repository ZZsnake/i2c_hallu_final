<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <rect x="0" y="0" width="600" height="80" fill="#00FFFF"/>
  <text x="300" y="40" text-anchor="middle" font-family="Arial" font-size="16">User Interface</text>
  <text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="12">ReactJS</text>

  <rect x="0" y="80" width="600" height="80" fill="#008000"/>
  <text x="300" y="120" text-anchor="middle" font-family="Arial" font-size="16">Web Application</text>
  <text x="500" y="120" text-anchor="middle" font-family="Arial" font-size="12">Node.js</text>

  <rect x="0" y="160" width="600" height="80" fill="#FFFF00"/>
  <text x="300" y="200" text-anchor="middle" font-family="Arial" font-size="16">REST API</text>
  <text x="500" y="200" text-anchor="middle" font-family="Arial" font-size="12">Express</text>

  <rect x="0" y="240" width="600" height="80" fill="#FF0000"/>
  <text x="300" y="280" text-anchor="middle" font-family="Arial" font-size="16">Business Logic</text>
  <text x="500" y="280" text-anchor="middle" font-family="Arial" font-size="12">Authentication</text>

  <rect x="0" y="320" width="600" height="80" fill="#0000FF"/>
  <text x="300" y="360" text-anchor="middle" font-family="Arial" font-size="16">Database</text>
  <text x="500" y="360" text-anchor="middle" font-family="Arial" font-size="12">PostgreSQL</text>

  <rect x="0" y="400" width="600" height="80" fill="#008080"/>
  <text x="300" y="440" text-anchor="middle" font-family="Arial" font-size="16">Server Hardware</text>
  <text x="500" y="440" text-anchor="middle" font-family="Arial" font-size="12">SSD</text>

  <!-- Arrows -->
  <path d="M300,80 L300,0" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  <path d="M300,160 L300,80" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  <path d="M300,240 L300,160" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  <path d="M300,320 L300,240" stroke="black" stroke-width="1"/>
  <path d="M300,400 L300,320" stroke="black" stroke-width="1"/>
  <path d="M300,480 L300,400" stroke="black" stroke-width="1"/>
</svg>