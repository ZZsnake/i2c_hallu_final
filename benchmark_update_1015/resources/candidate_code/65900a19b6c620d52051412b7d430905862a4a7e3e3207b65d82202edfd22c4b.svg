<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <style>
    .text { font-family: sans-serif; font-size: 30px; }
    .electron { fill: blue; }
    .shell { stroke: black; stroke-dasharray: 5; stroke-width: 2; fill: none; }
    .center { fill: lightblue; }
  </style>
  <text x="50" y="50" class="text">40 : Zirconium</text>
  <text x="650" y="50" class="text">2,8,18,10,2</text>
  <circle cx="400" cy="400" r="100" class="center">
    <text x="385" y="420" class="text">Zr</text>
  </circle>
  <circle cx="400" cy="400" r="150" class="shell"/>
  <circle cx="400" cy="400" r="200" class="shell"/>
  <circle cx="400" cy="400" r="250" class="shell"/>
  <circle cx="400" cy="400" r="300" class="shell"/>
  <circle cx="400" cy="400" r="350" class="shell"/>
  <circle cx="400" cy="300" r="10" class="electron"/>
  <circle cx="400" cy="500" r="10" class="electron"/>
  <!-- Additional electrons distributed across shells -->
