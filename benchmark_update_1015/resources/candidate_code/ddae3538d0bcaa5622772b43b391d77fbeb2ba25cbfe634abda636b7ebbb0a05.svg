<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="white"/>
  <!-- Title -->
  <text x="400" y="30" font-size="16" text-anchor="middle" font-family="sans-serif">Supply vs. Price per Unit (USD), 2023</text>
  <!-- Subtitle -->
  <text x="400" y="45" font-size="10" text-anchor="middle" font-family="sans-serif">
    Vertical axis: Market Supply (thousands of units). Horizontal axis: Price per unit, inflation adjusted (USD).
  </text>
  <!-- Axes -->
  <line x1="50" y1="500" x2="750" y2="500" stroke="black"/>
  <line x1="50" y1="500" x2="50" y2="50" stroke="black"/>
  <!-- Grid lines -->
  <!-- Horizontal grid lines -->
  <line x1="50" x2="750" y1="500" y2="500" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="50" x2="750" y1="450" y2="450" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="50" x2="750" y1="400" y2="400" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="50" x2="750" y1="350" y2="350" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="50" x2="750" y1="300" y2="300" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="50" x2="750" y1="250" y2="250" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="50" x2="750" y1="200" y2="200" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="50" x2="750" y1="150" y2="150" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="50" x2="750" y1="100" y2="100" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="50" x2="750" y1="50" y2="50" stroke="#ccc" stroke-dasharray="5,5"/>
  <!-- Vertical grid lines -->
  <line x1="50" x2="50" y1="500" y2="50" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="150" x2="150" y1="500" y2="50" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="300" x2="300" y1="500" y2="50" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="500" x2="500" y1="500" y2="50" stroke="#ccc" stroke-dasharray="5,5"/>
  <line x1="750" x2="750" y1="500" y2="50" stroke="#ccc" stroke-dasharray="5,5"/>
  <!-- Axis labels -->
  <text x="400" y="540" text-anchor="middle" font-size="12" font-family="sans-serif">Price per Unit (USD)</text>
  <text x="20" y="270" text-anchor="middle" font-size="12" font-family="sans-serif" transform="rotate(-90 20,270)">Market Supply (thousands)</text>
  <!-- X-axis ticks -->
  <text x="50" y="520" text-anchor="middle" font-size="10" font-family="sans-serif">$2</text>
  <text x="150" y="520" text-anchor="middle" font-size="10" font-family="sans-serif">$5</text>
  <text x="300" y="520" text-anchor="middle" font-size="10" font-family="sans-serif">$20</text>
  <text x="500" y="520" text-anchor="middle" font-size="10" font-family="sans-serif">$50</text>
  <text x="750" y="520" text-anchor="middle" font-size="10" font-family="sans-serif">$100</text>
  <!-- Y-axis ticks -->
  <text x="40" y="500" text-anchor="end" font-size="10" font-family="sans-serif">0</text>
  <text x="40" y="450" text-anchor="end" font-size="10" font-family="sans-serif">10</text>
  <text x="40" y="400" text-anchor="end" font-size="10" font-family="sans-serif">20</text>
  <text x="40" y="350" text-anchor="end" font-size="10" font-family="sans-serif">30</text>
  <text x="40" y="300" text-anchor="end" font-size="10" font-family="sans-serif">40</text>
  <text x="40" y="250" text-anchor="end" font-size="10" font-family="sans-serif">50</text>
  <text x="40" y="200" text-anchor="end" font-size="10" font-family="sans-serif">60</text>
  <text x="40" y="150" text-anchor="end" font-size="10" font-family="sans-serif">70</text>
  <text x="40" y="100" text-anchor="end" font-size="10" font-family="sans-serif">80</text>
  <!-- Data points -->
  <!-- Agriculture -->
  <circle cx="100" cy="350" r="5" fill="#1f77b4"/>
  <text x="100" y="345" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">AgroFoods</text>
  <!-- Energy -->
  <circle cx="120" cy="420" r="5" fill="#d62728"/>
  <text x="120" y="415" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">EnerGen</text>
  <circle cx="200" cy="300" r="5" fill="#d62728"/>
  <text x="200" y="295" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">UrbanBuild</text>
  <!-- Technology -->
  <circle cx="250" cy="250" r="5" fill="#ff7f0e"/>
  <text x="250" y="245" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">FinanceTrust</text>
  <circle cx="600" cy="200" r="5" fill="#ff7f0e"/>
  <text x="600" y="195" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">TechNova</text>
  <!-- Healthcare -->
  <circle cx="180" cy="380" r="5" fill="#2ca02c"/>
  <text x="180" y="375" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">AgriCo</text>
  <circle cx="350" cy="280" r="5" fill="#2ca02c"/>
  <text x="350" y="275" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">HealthPlus</text>
  <circle cx="400" cy="220" r="5" fill="#2ca02c"/>
  <text x="400" y="215" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">Logistix</text>
  <!-- Automotive -->
  <circle cx="700" cy="150" r="5" fill="#1f77b4"/>
  <text x="700" y="145" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">AutoMax</text>
  <!-- Other points -->
  <circle cx="80" cy="450" r="5" fill="#7f7f7f"/>
  <text x="80" y="445" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">SmartFoods</text>
  <circle cx="150" cy="320" r="5" fill="#ffbb78"/>
  <text x="150" y="315" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">RetailX</text>
  <circle cx="220" cy="220" r="5" fill="#9467bd"/>
  <text x="220" y="215" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">EcoTex</text>
  <circle cx="300" cy="180" r="5" fill="#17becf"/>
  <text x="300" y="175" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">TravelNet</text>
  <circle cx="450" cy="200" r="5" fill="#8c510a"/>
  <text x="450" y="195" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">PharmaOne</text>
  <circle cx="550" cy="180" r="5" fill="#333"/>
  <text x="550" y="175" font-size="10" text-anchor="middle" dy="-5" font-family="sans-serif">GlobalMedia</text>
  <!-- Legend -->
  <rect x="720" y="100" width="10" height="10" fill="#1f77b4"/>
  <text x="735" y="108" font-size="10" font-family="sans-serif">Agriculture</text>
  <rect x="720" y="120" width="10" height="10" fill="#d62728"/>
  <text x="735" y="128" font-size="10" font-family="sans-serif">Energy</text>
  <rect x="720" y="140" width="10" height="10" fill="#ff7f0e"/>
  <text x="735" y="148" font-size="10" font-family="sans-serif">Technology</text>
  <rect x="720" y="160" width="10" height="10" fill="#2ca02c"/>
  <text x="735" y="168" font-size="10" font-family="sans-serif">Healthcare</text>
  <rect x="720" y="180" width="10" height="10" fill="#1f77b4"/>
  <text x="735" y="188" font-size="10" font-family="sans-serif">Automotive</text>
  <!-- Source -->
  <text x="50" y="580" font-size="10" font-family="sans-serif">Source: National Statistics Bureau, Market Research 2023</text>
  <text x="750" y="580" font-size="10" font-family="sans-serif" text-anchor="end">CC BY</text>
</svg>